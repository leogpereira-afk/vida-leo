function editorLista(chave,render){
  const c=el('<div class="corpo"></div>');
  const chips=el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"></div>');
  const lista=CFG(chave);
  lista.forEach((item,i)=>{
    const ch=el(`<span class="chip" style="background:var(--bg);color:var(--tinta);border:1px solid var(--linha);
      display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;font-weight:500;font-size:13px">
      <span class="tx"></span><button class="lixo" style="opacity:.5;padding:1px 4px">✕</button></span>`);
    ch.querySelector('.tx').textContent=item;
    ch.querySelector('.lixo').onclick=()=>{
      const usos=contarUso(chave,item);
      if(usos&&!confirm(`"${item}" está em uso em ${usos} registro(s). Apagar mesmo assim? Os registros continuam com o texto atual.`))return;
      E.config[chave].splice(i,1);salvar();render();
    };
    chips.appendChild(ch);
  });
  if(!lista.length) chips.appendChild(el('<span style="color:var(--suave);font-size:13px">Lista vazia.</span>'));
  c.appendChild(chips);
  const f=el(`<form style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="text" placeholder="adicionar…" style="flex:1;min-width:170px;border:1px solid var(--linha);
      background:var(--bg);color:inherit;font:inherit;padding:8px 11px;border-radius:9px">
    <button class="btn mini" type="submit">+ Adicionar</button></form>`);
  f.onsubmit=ev=>{ev.preventDefault();
    const v=f.querySelector('input').value.trim();
    if(!v)return;
    if(CFG(chave).some(x=>x.toLowerCase()===v.toLowerCase())){alert('Esse item já existe.');return}
    E.config[chave].push(v);salvar();render();
  };
  c.appendChild(f);
  return c;
}
// quantos registros usam determinado valor (evita apagar algo em uso sem avisar)
function contarUso(chave,valor){
  const conta=(lista,campo)=>lista.filter(x=>x[campo]===valor).length;
  switch(chave){
    case 'empresas': return conta(E.rendimentos,'empresa');
    case 'catGasto': return conta(E.gastos,'classe')+conta(E.gastos,'categoria');
    case 'catCasa': return conta(E.casa||[],'item');
    case 'catCusto': return E.viagens.reduce((s,v)=>s+conta(v.custos||[],'categoria'),0);
    case 'formasPagto': return E.assinaturas.filter(x=>x.pago===valor).length
      + (E.seguros||[]).filter(x=>x.pago===valor).length
      + E.viagens.reduce((s,v)=>s+conta(v.custos||[],'pago'),0);
    case 'tiposSeguro': return conta(E.seguros||[],'tipo');
    case 'transportes': return conta(E.viagens,'transporte');
    case 'statusViagem': return conta(E.viagens,'status');
    case 'tiposViagem': return conta(E.viagens,'tipo');
    case 'areasDemanda': return conta(E.demandas,'area');
    case 'tiposCompromisso': return conta(E.agenda,'tipo');
    case 'tiposDoc': return conta(E.documentos,'nome');
    case 'areasMeta': return conta(E.metas,'area');
    case 'tiposParaEles': return conta(E.paraEles,'tipo');
    case 'relacoes': return conta(E.pessoas,'relacao');
    default: return 0;
  }
}
async function vConfig(m){
  const r=rr('config');
  m.appendChild(cab('Configurações','Tudo que aparece como opção nos formulários — cada lista com seu título.'));
  const t=await arqTotal();
  m.appendChild(el(`<div class="grade">
    ${kpi('Listas',GRUPOS_CFG.length,'configuráveis')}
    ${kpi('Opções',GRUPOS_CFG.reduce((s,g)=>s+CFG(g.k).length,0),'no total')}
    ${kpi('Arquivos guardados',t.n,t.fila?tamanho(t.b)+' · '+t.fila+' só neste aparelho':tamanho(t.b)+' no servidor','a')}
    ${kpi('Registros',['viagens','rendimentos','gastos','agenda','demandas','peso','exames','tratamentos','assinaturas','seguros','planos','casa','documentos','metas','pessoas','paraEles'].reduce((s,k)=>s+(E[k]||[]).length,0),'no painel')}</div>`));
  // perfil: a data de nascimento alimenta os rastreios de saúde
  const pf=el('<div class="corpo"></div>');
  pf.appendChild(campos(E.perfil,[{k:'nascimento',t:'Minha data de nascimento',tipo:'date'}],()=>r()));
  pf.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin-top:9px">
    É com ela que eu sei quais exames a sua idade pede${idadeLeo()?` — hoje você tem <b>${idadeLeo()} anos</b>`:''}.</p>`));
  m.appendChild(bloco('cf-perfil','👤 Meu perfil','usado nos rastreios de saúde',pf));

  m.appendChild(el(`<div class="aviso">✏️ Editar aqui muda as opções dos formulários em todo o painel.
    Se você apagar algo que já está em uso, eu aviso antes — os registros antigos continuam com o texto que têm.</div>`));

  GRUPOS_CFG.forEach(g=>m.appendChild(bloco('cf-'+g.k,g.ic+' '+g.t,g.d,editorLista(g.k,r))));

  /* O nome da empresa é a chave em toda parte: lançamentos, histórico da
     planilha, marca (cor/logo), lista de opções e cadastro de PJ. Trocar em um
     só lugar deixaria lançamento órfão — então as duas funções abaixo mexem em
     todos de uma vez. */
  function renomeiaEmpresa(de,para){
    de=String(de);para=String(para||'').trim();
    if(!para||para===de) return false;
    if(!E.config)E.config={};
    E.config.empresas=[...new Set((CFG('empresas')||[]).map(x=>x===de?para:x))];
    (E.rendimentos||[]).forEach(x=>{if(x.empresa===de)x.empresa=para});
    (E.empresasPJ||[]).forEach(x=>{if(x.nome===de)x.nome=para});
    if(E.marcas&&E.marcas[de]){E.marcas[para]={...(E.marcas[para]||{}),...E.marcas[de]};delete E.marcas[de]}
    const R=E.rendHist||{};
    if(R.empresas&&R.empresas[de]){
      const antigo=R.empresas[de],destino=R.empresas[para];
      R.empresas[para]=destino?destino.map((v,i)=>(+v||0)+(+antigo[i]||0)):antigo;
      delete R.empresas[de];
    }
    Object.keys(R.detalhe||{}).forEach(a=>{const d=R.detalhe[a];
      if(d&&d[de]){d[para]=[...(d[para]||[]),...d[de]];delete d[de]}});
    salvar();return true;
  }
  function apagaEmpresa(nm){
    const lans=(E.rendimentos||[]).filter(x=>x.empresa===nm);
    const soma=lans.reduce((a,x)=>a+(+x.valor||0),0);
    const aviso=lans.length
      ? 'Apagar "'+nm+'" também APAGA '+lans.length+' lançamento(s), somando '+brl(soma)+
        ', e o histórico dela na planilha.\n\nIsso não tem volta. Continuar?'
      : 'Apagar "'+nm+'" da lista de empresas? (ela não tem nenhum lançamento)';
    if(!confirm(aviso))return false;
    if(lans.length&&!confirm('Confirma mesmo? '+lans.length+' lançamento(s) de "'+nm+'" serão apagados.'))return false;
    E.rendimentos=(E.rendimentos||[]).filter(x=>x.empresa!==nm);
    E.empresasPJ=(E.empresasPJ||[]).filter(x=>x.nome!==nm);
    E.config.empresas=(CFG('empresas')||[]).filter(x=>x!==nm);
    if(E.marcas)delete E.marcas[nm];
    const R=E.rendHist||{};
    if(R.empresas&&R.empresas[nm]){
      // tira a fatia dela do total de cada ano, senão a planilha para de fechar
      const linha=R.empresas[nm];
      if(Array.isArray(R.totalAno)) R.totalAno=R.totalAno.map((v,i)=>+(((+v||0)-(+linha[i]||0)).toFixed(2)));
      delete R.empresas[nm];
      R.totalGeral=(R.totalAno||[]).reduce((a,v)=>a+(+v||0),0);
    }
    Object.keys(R.detalhe||{}).forEach(a=>{if(R.detalhe[a])delete R.detalhe[a][nm]});
    salvar();return true;
  }

  /* ---- as bolinhas: cor fixa e logo por empresa ---- */
  const mcx=el('<div class="corpo"></div>');
  const nomesM=[...new Set([...Object.keys((E.rendHist&&E.rendHist.empresas)||{}),
    ...(E.rendimentos||[]).map(x=>x.empresa),...(E.empresasPJ||[]).map(x=>x.nome)])]
    .filter(Boolean).sort((a,b)=>a.localeCompare(b));
  if(!nomesM.length) mcx.appendChild(el('<div class="vazio">Cadastre empresas em Rendimentos para configurar as marcas.</div>'));
  nomesM.forEach(nm=>{
    // as duas acoes ficam SEMPRE visiveis; apagar so habilita quando ha logo
    const nLan=(E.rendimentos||[]).filter(x=>x.empresa===nm).length;
    const linha=el(`<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap">
      <span class="prevAv">${avatar(nm,32)}</span>
      <input class="bNome" value="${esc(nm)}" title="clique para corrigir o nome — muda em todos os lançamentos"
        style="flex:1;min-width:130px;font-weight:700;font-size:14px;border:1px solid transparent;background:none;padding:5px 7px;border-radius:8px;color:inherit">
      <span style="font-size:11.5px;color:var(--suave);white-space:nowrap">${nLan} lanç.</span>
      <input type="color" value="${marcaDe(nm).cor}" title="cor da bolinha" style="width:36px;height:30px;border:1px solid var(--linha);border-radius:8px;background:none;padding:2px;cursor:pointer">
      <button class="btn ghost mini bLogo"></button>
      <button class="btn ghost mini bDel" style="color:var(--vermelho)">✕ apagar logo</button>
      <button class="btn ghost mini bDelEmp" style="color:var(--vermelho)" title="apagar a empresa inteira">🗑 empresa</button>
      <div class="linhaFim" style="flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:4px"></div>
    </div>`);
    const bLogo=linha.querySelector('.bLogo'), bDel=linha.querySelector('.bDel');
    const iNome=linha.querySelector('.bNome');
    iNome.onfocus=()=>{iNome.style.borderColor='var(--linha)';iNome.style.background='var(--card)'};
    iNome.onblur=()=>{iNome.style.borderColor='transparent';iNome.style.background='none'};
    iNome.onkeydown=ev=>{if(ev.key==='Enter')iNome.blur();if(ev.key==='Escape'){iNome.value=nm;iNome.blur()}};
    iNome.onchange=()=>{
      const novo=iNome.value.trim();
      if(!novo||novo===nm){iNome.value=nm;return}
      const jaTem=nomesM.some(o=>o!==nm&&normaliza(o)===normaliza(novo));
      if(jaTem&&!confirm('Já existe "'+novo+'". Juntar "'+nm+'" com ela? Os lançamentos dos dois passam a ser da mesma empresa.')){
        iNome.value=nm;return}
      if(renomeiaEmpresa(nm,novo))r();
    };
    linha.querySelector('.bDelEmp').onclick=()=>{if(apagaEmpresa(nm))r()};

    /* ---- encerrar: o caminho certo para empresa vendida ou fechada ---- */
    const fim=linha.querySelector('.linhaFim');
    const pintaFim=()=>{
      const e=encerrada(nm);
      fim.innerHTML=e
        ? `<span style="font-size:12px;color:var(--suave)">🏁 <b>${esc(rotuloEncerrada(nm))}</b> — o histórico dela continua inteiro; ela só não aparece mais para lançar dinheiro novo.</span>`
        : `<span style="font-size:12px;color:var(--suave)">Ativa — aparece na lista de onde entra dinheiro.</span>`;
      const b=el(`<button class="btn ghost mini">${e?'↩ Reativar':'🏁 Encerrar'}</button>`);
      b.onclick=()=>{
        if(e){

/* ---------------- backup ---------------- */
function baixar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportar(){baixar(new Blob([JSON.stringify(E,null,1)],{type:'application/json'}),'central-leo-'+hoje()+'.json')}
function pedirArquivo(cb,accept){const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;
  i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
/* RESTAURAR TEM DE CHEGAR NA NUVEM.
   Isto gravava só no localStorage e dizia "Backup restaurado". O arquivo trazia
   o _mt antigo, então uma de duas coisas acontecia, e nenhuma era o esperado:
   ou o próximo carregamento via a nuvem mais nova e DESFAZIA a restauração em
   silêncio, ou a primeira edição empurrava os dados velhos por cima da nuvem.
   Agora grava pelo caminho normal (salvar + envio com a trava de concorrência),
   e o estado de antes fica em "Versão descartada". */
async function restaurarBackup(f){
  try{
    const j=JSON.parse(await f.text());
    if(!j.viagens)throw new Error('não parece um backup daqui');
    if(!confirm('Trazer este arquivo?\n\nEle substitui o que está no painel AGORA, em todos os '+
      'aparelhos. O estado atual fica guardado em Configurações → Versão descartada.'))return;
    guardaDescartado();
    localStorage.setItem(CHAVE,JSON.stringify(j));
    E=carregar();salvar();
    await enviarNuvem();
    tela();
    alert('Backup restaurado — e enviado para a nuvem.');
  }
  catch(e){alert('Não consegui ler: '+e.message)}
}

// Backend: Edge Function do Supabase (antes era a Netlify Function em
// /api/sync). O contrato e o MESMO -- POST para entrar, GET para ler, PUT para
// gravar. O nome leva prefixo porque o projeto e compartilhado com os sistemas
// da empresa: uma function chamada "sync" seria a do RH.
const API_SYNC='https://heveemylixartyijxewh.supabase.co/functions/v1/leo-sync';
// A entrada única da casa: mesmo usuário e mesma senha dos outros seis.
// Sem chave nenhuma no bundle: a function responde sem apikey (verify_jwt=false,
// e quem autoriza é ela mesma).
const API_BASE_ACESSO='https://heveemylixartyijxewh.supabase.co/functions/v1/acesso-entrar';

async function apiSync(metodo,corpo){
  const r=await fetch(API_SYNC,{method:metodo,
    headers:{'content-type':'application/json',authorization:'Bearer '+pegaToken()},
    body:corpo?JSON.stringify(corpo):undefined});
  if(r.status===401){localStorage.removeItem(T_CHAVE);sessionStorage.removeItem(T_CHAVE);location.reload();throw new Error('sessão expirou')}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
let syncTimer=null;
function pintaSync(t){const x=document.getElementById('stSync');if(x)x.textContent='☁ '+t}
function agendaPush(){if(DEV||!pegaToken())return;clearTimeout(syncTimer);syncTimer=setTimeout(enviarNuvem,2500)}
// ---- sincronização com gravação condicional (CAS) -------------------------
// Cada ABA guarda, em memória, a versão do servidor que viu por último
// (_tabBase). O PUT leva essa base junto; o servidor só grava se ela ainda for
// a atual — senão devolve 409 e NADA é sobrescrito. Aba esquecida aberta,
// aparelho desatualizado ou dois salvamentos quase juntos: quem perde a corrida
// adota a versão do servidor, guarda a sua de lado e avisa.
let _tabBase=0;                       // em memória de propósito: cada aba corre sozinha
const marcaBase=mt=>{if(mt)_tabBase=+mt};
function guardaDescartado(){
  try{localStorage.setItem('cl_descartado',JSON.stringify({em:Date.now(),dados:JSON.parse(localStorage.getItem(CHAVE))}))}catch(_){}
}
function adotaNuvem(r,avisar){
  guardaDescartado();
  // modal aberto sobre o estado antigo viraria órfão e comeria o que fosse digitado
  const mo=document.getElementById('modais'); if(mo) mo.innerHTML='';
  localStorage.setItem(CHAVE,JSON.stringify(r.dados));marcaBase(r.mt);E=carregar();tela();
  pintaSync('atualizado de outro acesso');
  if(avisar) alert('Outro acesso gravou primeiro. Este aparelho adotou a versão do servidor para não apagar nada de lá.\n\nSe você estava digitando algo, confira e refaça — a versão daqui ficou guardada em ⚙️ Configurações → Versão descartada.');
}
async function apiPut(){
  const r=await fetch(API_SYNC,{method:'PUT',
    headers:{'content-type':'application/json',authorization:'Bearer '+pegaToken()},
    body:JSON.stringify({dados:E,base:_tabBase})});
  if(r.status===401){localStorage.removeItem(T_CHAVE);sessionStorage.removeItem(T_CHAVE);location.reload();throw new Error('sessão expirou')}
  const j=await r.json().catch(()=>({}));
  return {status:r.status,j};
}
async function enviarNuvem(){if(DEV&&!window.__testeSync)return;
  try{
    if(!_tabBase){
      // esta aba ainda não viu o servidor (abriu offline, resposta perdida):
      // olha antes de gravar — se o CONTEÚDO remoto é mais novo, adota; se o
      // daqui é mais novo (edição offline), segue para o PUT protegido
      pintaSync('conferindo…');
      const r=await apiSync('GET');
      if(r&&r.dados&&(r.dados._mt||0)>(E._mt||0)){adotaNuvem(r,true);return}
      marcaBase(r&&r.mt||0);
    }
    pintaSync('enviando…');
    const p=await apiPut();
    if(p.status===409){const r=await apiSync('GET');adotaNuvem(r,true);return}
    if(p.status===428){pintaSync('recarregue a página');return}
    if(p.status<200||p.status>=300)throw new Error('HTTP '+p.status);
    marcaBase(p.j&&p.j.mt);pintaSync('sincronizado');
  }catch(e){pintaSync('erro ao enviar')}}
async function puxarNuvem(){if(DEV&&!window.__testeSync){pintaSync('modo local');return}
  try{pintaSync('baixando…');
    const r=await apiSync('GET');
    marcaBase(r&&r.mt);
    const remoto=r&&r.dados;
    if(remoto&&(remoto._mt||0)>(E._mt||0)){
      guardaDescartado();              // até o caminho normal deixa rastro do que saiu
      localStorage.setItem(CHAVE,JSON.stringify(remoto));E=carregar();
      pintaSync('sincronizado');
    } else if((E._mt||0)>((remoto&&remoto._mt)||0)){await enviarNuvem();return}
    else pintaSync('sincronizado');
  }catch(e){pintaSync('sem conexão')}}
async function sincronizarAgora(){await puxarNuvem();tela()}
function salvarPDF(){
  document.querySelectorAll('.bloco.fechado').forEach(b=>b.classList.remove('fechado'));
  window.print();
}
function telaLogin(){
  document.querySelector('.app').style.display='none';
  const f=el(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <form class="bloco" style="max-width:360px;width:100%;padding:30px 26px;text-align:center">
      <svg viewBox="0 0 64 64" width="52" height="52" style="margin-bottom:10px"><g fill="#3B45E5">
        <rect x="4" y="4" width="13" height="56"/><rect x="23" y="4" width="37" height="13"/>
        <rect x="23" y="26" width="37" height="12"/><rect x="47" y="26" width="13" height="34"/>
        <rect x="30" y="47" width="17" height="13"/></g></svg>
      <h2 style="font-size:19px">LEONARDO</h2>
      <div style="letter-spacing:.22em;font-size:12px;color:var(--suave);margin-bottom:18px">GONÇALVES</div>
      <input type="text" class="usr" placeholder="Usuário" autocomplete="username" value="leonardo" style="width:100%;border:1px solid var(--linha);background:var(--bg);color:inherit;font:inherit;padding:11px 13px;border-radius:10px;text-align:center;margin-bottom:9px">
      <input type="password" placeholder="Senha" autocomplete="current-password" style="width:100%;border:1px solid var(--linha);background:var(--bg);color:inherit;font:inherit;padding:11px 13px;border-radius:10px;text-align:center">
      <label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--suave);margin:13px 0">
        <input type="checkbox" checked style="accent-color:var(--verde)"> Manter conectado neste aparelho</label>
      <button class="btn" style="width:100%">Entrar</button>
      <div class="erro" style="color:var(--vermelho);font-size:12.5px;margin-top:10px;min-height:16px"></div>
    </form></div>`);
  const usr=f.querySelector('.usr'),senha=f.querySelector('input[type=password]'),manter=f.querySelector('input[type=checkbox]'),erroEl=f.querySelector('.erro');
  f.querySelector('form').onsubmit=async ev=>{
    ev.preventDefault();erroEl.textContent='';
    try{
      /* ENTRADA PADRÃO PRIMEIRO: usuário + senha, a mesma dos outros sistemas.
         A Central era o único app com senha própria e sem usuário — ser
         diferente era o problema. A porta antiga (só senha) fica como segunda
         via enquanto a virada assenta. */
      let token=null;
      try{
        const e=await fetch(API_BASE_ACESSO,{method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({action:'entrar',usuario:usr.value.trim(),senha:senha.value})});
        if(e.ok){const d=await e.json();token=d?.crachas?.central?.token||null;}
      }catch(_){/* rede: cai na porta antiga */}

      // Sem segunda porta: a Central entra pela entrada única, como os outros
      // sete. A senha própria deste app foi removida do servidor -- manter o
      // caminho aqui só produziria um erro confuso.
      if(!token){erroEl.textContent='Usuário ou senha incorretos.';return}
      (manter.checked?localStorage:sessionStorage).setItem(T_CHAVE,token);
      f.remove();document.querySelector('.app').style.display='';
      menu();tela();puxarNuvem().then(()=>{tela();arqSubirPendentes().then(r=>{if(r.subiu)tela()})});
    }catch(e){erroEl.textContent='Não consegui falar com o servidor. Tente de novo.'}
  };
  document.body.appendChild(f);
  senha.focus();
}
/* "/" abre a busca, como em toda ferramenta que se usa o dia inteiro — menos
   quando você já está escrevendo em algum campo. */
document.addEventListener('keydown',ev=>{
  if(ev.key!=='/'||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(document.querySelector('.fundo'))return;      // já há modal aberto
  if(!temSessao())return;
  ev.preventDefault();abrirBusca();
});

if(temSessao()){menu();tela();puxarNuvem().then(()=>{tela();arqSubirPendentes().then(r=>{if(r.subiu)tela()})});}
else telaLogin();
</script>
