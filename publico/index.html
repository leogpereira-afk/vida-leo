<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Central do Léo</title>
<link rel="icon" href="./icone.svg">
<link rel="apple-touch-icon" href="./icone.svg">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Central">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3; --card:#fff; --linha:#e8e5df; --tinta:#20211f; --suave:#6f7269;
  --verde:#1f6f5c; --verde-cl:#e7f2ee; --areia:#c98a4b; --areia-cl:#fbf0e5;
  --vermelho:#b4443a; --vermelho-cl:#fbeae8; --azul:#3d5a80; --azul-cl:#e9eef5;
  --roxo:#6d5a8c; --r:14px; --sombra:0 1px 2px rgba(30,32,28,.05),0 6px 20px -8px rgba(30,32,28,.12);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16171a; --card:#1e2024; --linha:#2c2f35; --tinta:#eceae5; --suave:#9a9d96;
  --verde:#4bbf9c; --verde-cl:#16302a; --areia:#e0a468; --areia-cl:#33261a;
  --vermelho:#e08379; --vermelho-cl:#33211f; --azul:#8fb0d8; --azul-cl:#1d2733;
  --roxo:#a894c4; --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px -8px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}

.side{width:232px;flex:0 0 232px;padding:22px 14px;border-right:1px solid var(--linha);
  position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card)}
.marca{display:flex;align-items:center;gap:9px;padding:0 8px 18px}
.marca .em{font-size:22px} .marca b{font-family:Fraunces,serif;font-size:17px}
.marca small{display:block;color:var(--suave);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:10px;
  background:none;color:var(--suave);font:500 14px Inter;cursor:pointer;text-align:left;transition:.15s}
.nav button:hover{background:var(--bg);color:var(--tinta)}
.nav button.on{background:var(--verde-cl);color:var(--verde);font-weight:600}
.nav .ic{width:20px;text-align:center;font-size:15px}
.nav .sep{margin:12px 10px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);opacity:.75}
.rodape{margin-top:18px;padding:12px 10px 0;border-top:1px solid var(--linha);display:flex;gap:8px;flex-wrap:wrap}
.rodape button{border:1px solid var(--linha);background:var(--card);color:var(--suave);
  border-radius:8px;padding:5px 9px;font:500 11.5px Inter;cursor:pointer}
.rodape button:hover{color:var(--tinta);border-color:var(--suave)}

.main{flex:1;padding:30px 34px 70px;max-width:1180px}
.topo{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.topo h1{font-size:26px} .topo p{color:var(--suave);font-size:13.5px;margin-top:3px}
.cresce{flex:1}
.btn{border:0;background:var(--verde);color:#fff;border-radius:10px;padding:9px 15px;font:600 13.5px Inter;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--suave);border:1px solid var(--linha)}
.btn.ghost:hover{color:var(--tinta)}
.btn.mini{padding:6px 11px;font-size:12.5px}

/* painel de configuração — sempre no topo de cada seção */
.painel{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--linha);
  border-radius:var(--r);padding:10px 13px;margin-bottom:16px;box-shadow:var(--sombra)}
.painel .rot{font:600 10.5px Inter;color:var(--suave);text-transform:uppercase;letter-spacing:.07em}
.painel select,.painel input{border:1px solid var(--linha);background:var(--bg);color:inherit;
  font:inherit;font-size:13px;padding:6px 9px;border-radius:8px}
.painel select:focus,.painel input:focus{outline:0;border-color:var(--verde)}
.painel .div{width:1px;height:20px;background:var(--linha)}

.grade{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sombra)}
.kpi .rot{font-size:11.5px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-family:Fraunces,serif;font-size:23px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--suave);margin-top:2px}
.kpi.v .val{color:var(--verde)} .kpi.r .val{color:var(--vermelho)} .kpi.a .val{color:var(--areia)}

.bloco{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra);margin-bottom:18px;overflow:hidden}
.bloco>header{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--linha);
  flex-wrap:wrap;cursor:pointer;user-select:none}
.bloco>header:hover{background:var(--bg)}
.bloco>header h2{font-size:15.5px} .bloco>header .dica{color:var(--suave);font-size:12px}
.bloco>header .seta{margin-left:auto;color:var(--suave);font-size:12px;transition:transform .18s}
.bloco.fechado>header{border-bottom:0}
.bloco.fechado>header .seta{transform:rotate(-90deg)}
.bloco.fechado .conteudo{display:none}
.corpo{padding:16px 17px}
.rolagem{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:600 11px Inter;letter-spacing:.05em;text-transform:uppercase;color:var(--suave);
  padding:9px 10px;border-bottom:1px solid var(--linha);white-space:nowrap;background:var(--card)}
td{padding:3px 6px;border-bottom:1px solid var(--linha)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:none;color:inherit;
  font:inherit;padding:6px 5px;border-radius:7px;font-variant-numeric:tabular-nums}
td input:hover,td select:hover{border-color:var(--linha)}
td input:focus,td select:focus{outline:0;border-color:var(--verde);background:var(--bg)}
td input[type=text]{min-width:120px} td input[type=date]{min-width:140px}
td input[type=month],td input[type=time]{min-width:118px} td input[type=number]{min-width:88px}
td select{min-width:124px}
td.num input{text-align:right}
.tfim td{font-weight:600;background:var(--bg);font-variant-numeric:tabular-nums;padding:10px}
.lixo{border:0;background:none;color:var(--suave);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px;opacity:.45}
tr:hover .lixo{opacity:1}
.lixo:hover{color:var(--vermelho);background:var(--vermelho-cl)}
.mais{margin:11px 0 2px;border:1px dashed var(--linha);background:none;color:var(--suave);
  border-radius:9px;padding:8px 14px;font:500 13px Inter;cursor:pointer}
.mais:hover{border-color:var(--verde);color:var(--verde)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font:600 11.5px Inter}
.vazio{padding:26px;text-align:center;color:var(--suave);font-size:13.5px}
.aviso{background:var(--areia-cl);border:1px solid color-mix(in srgb,var(--areia) 30%,transparent);
  border-radius:var(--r);padding:13px 16px;font-size:13.5px;margin-bottom:18px}

/* cartões clicáveis */
.cartoes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.cartao{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--sombra);cursor:pointer;transition:.15s;text-align:left}
.cartao:hover{border-color:var(--verde);transform:translateY(-2px)}
.cartao .tit{font-family:Fraunces,serif;font-size:16px;font-weight:600}
.cartao .sub{color:var(--suave);font-size:12.5px;margin-top:2px}
.cartao .pe{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cartao .vl{font-family:Fraunces,serif;font-size:16px;margin-left:auto;font-variant-numeric:tabular-nums}

/* modal */
.fundo{position:fixed;inset:0;background:rgba(20,22,20,.45);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:60;overflow-y:auto}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px -12px rgba(0,0,0,.35)}
.modal>header{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--linha)}
.modal>header h3{font-size:18px} .modal>header p{color:var(--suave);font-size:12.5px;margin-top:2px}
.fechar{margin-left:auto;border:0;background:none;font-size:19px;color:var(--suave);cursor:pointer;line-height:1;padding:2px 6px;border-radius:7px}
.fechar:hover{background:var(--bg);color:var(--tinta)}
.modal .secao{padding:16px 20px;border-bottom:1px solid var(--linha)}
.modal .secao:last-child{border-bottom:0}
.modal .secao h4{font:600 11.5px Inter;letter-spacing:.05em;text-transform:uppercase;color:var(--suave);margin-bottom:10px}
.campos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.campo label{display:block;font-size:11.5px;color:var(--suave);margin-bottom:3px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--linha);background:var(--bg);
  color:inherit;font:inherit;padding:8px 10px;border-radius:9px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:0;border-color:var(--verde)}
.campo textarea{min-height:66px;resize:vertical}

/* arquivos */
.arqs{display:flex;flex-direction:column;gap:7px}
.arq{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--bg);border:1px solid var(--linha);border-radius:10px;font-size:13px}
.arq .nome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arq .tam{color:var(--suave);font-size:11.5px}
.arq a{color:var(--verde);text-decoration:none;font-weight:600;font-size:12px}
.solta{border:1.5px dashed var(--linha);border-radius:11px;padding:16px;text-align:center;color:var(--suave);
  font-size:13px;cursor:pointer;transition:.15s}
.solta:hover,.solta.sobre{border-color:var(--verde);color:var(--verde);background:var(--verde-cl)}

/* checklist */
.passos{display:flex;flex-direction:column;gap:6px}
.passo{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--bg);border-radius:9px;font-size:13.5px}
.passo input[type=checkbox]{width:16px;height:16px;accent-color:var(--verde);flex:0 0 auto}
.passo .tx{flex:1} .passo.ok .tx{text-decoration:line-through;color:var(--suave)}
.passo input[type=text]{border:0;background:none;color:inherit;font:inherit;width:100%}
.passo input[type=text]:focus{outline:0}

.grafico{padding:14px 17px}
.legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--suave)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.lista-sug{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
.sug{background:var(--bg);border:1px solid var(--linha);border-radius:11px;padding:13px 15px}
.sug b{display:block;font-size:13.5px;margin-bottom:3px}
.sug p{font-size:12.5px;color:var(--suave);line-height:1.45}
.barra{height:7px;border-radius:20px;background:var(--linha);overflow:hidden;margin-top:7px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:20px}

@media print{
  .side,.mais,.lixo,.btn,.painel,.solta,.fundo{display:none!important}
  body{background:#fff;color:#111}
  .app{display:block}
  .main{padding:0;max-width:none}
  .bloco{box-shadow:none;break-inside:avoid;border-color:#ddd}
  .bloco.fechado .conteudo{display:block}
  .kpi{box-shadow:none;border-color:#ddd}
  .cartao:hover{transform:none}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--linha);padding:14px}
  .nav{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:8px 12px;font-size:13px}
  .nav .sep{display:none} .nav .ic{font-size:15px}
  .main{padding:20px 15px 60px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca"><svg viewBox="0 0 64 64" width="30" height="30" style="flex:0 0 auto"><g fill="#3B45E5">
      <rect x="4" y="4" width="13" height="56"/><rect x="23" y="4" width="37" height="13"/>
      <rect x="23" y="26" width="37" height="12"/><rect x="47" y="26" width="13" height="34"/>
      <rect x="30" y="47" width="17" height="13"/></g></svg><div><b>LEONARDO</b><small style="letter-spacing:.18em">GONÇALVES</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rodape">
      <button onclick="sincronizarAgora()">☁ Sincronizar</button>
      <button onclick="salvarPDF()">🖨 PDF</button>
      <button onclick="exportar()">⬇ Backup</button>
      <button onclick="pedirArquivo(restaurarBackup,'.json')">⬆ Restaurar</button>
      <button onclick="exportarArquivos()">⬇ Arquivos</button>
      <button onclick="pedirArquivo(importarArquivos,'.zip')">⬆ Restaurar arquivos</button>
      <button onclick="sairApp()" style="color:var(--vermelho)">⏻ Sair</button>
      <div id="stSync" style="width:100%;font-size:11px;color:var(--suave);padding:4px 2px 0">☁ —</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modais"></div>

<script>
/* ============================================================
   Central do Léo — painel pessoal, um arquivo só.
   Dados: localStorage. Arquivos (PDF/foto): IndexedDB.
   ============================================================ */

// dinheiro SEMPRE com centavos, no sistema inteiro. brl2 é o mesmo — mantido só
// porque está espalhado pelo código.
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const brl2=brl;
const hoje=()=>new Date().toISOString().slice(0,10);
const anoHoje=new Date().getFullYear();
const mesAtual=()=>hoje().slice(0,7);
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtData=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'—';
// validade de documento SEM o ano engana — aqui o ano vai junto
const fmtDataAno=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
const fmtDataLonga=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const diasEntre=(a,b)=>(a&&b)?Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)+1):'';
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// tira acento/caixa/espaço extra — usado pra casar nome de pessoa e de exame
const normaliza=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const mesmaPessoa=(a,b)=>normaliza(a)===normaliza(b);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const moedaNum=t=>{
  if(typeof t==='number')return t;
  const x=String(t||'').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  const n=parseFloat(x); return isNaN(n)?0:n;
};
const tamanho=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';

/* ---------------- arquivos (IndexedDB) ---------------- */
let _dbp;
function db(){return _dbp||(_dbp=new Promise((ok,err)=>{
  const r=indexedDB.open('centralLeoArquivos',1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('arq')){
    const s=d.createObjectStore('arq',{keyPath:'id'});s.createIndex('ref','ref');}};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error);}))}
async function arqPor(ref){const d=await db();return new Promise((ok,err)=>{
  const t=d.transaction('arq');const req=t.objectStore('arq').index('ref').getAll(ref);
  req.onsuccess=()=>ok(req.result||[]);req.onerror=()=>err(req.error)})}
async function arqAdd(ref,file){const d=await db();const reg={id:uid(),ref,nome:file.name,tipo:file.type,tam:file.size,blob:file,em:hoje()};
  return new Promise((ok,err)=>{const t=d.transaction('arq','readwrite');t.objectStore('arq').put(reg);
    t.oncomplete=()=>ok(reg);t.onerror=()=>err(t.error)})}
async function arqDel(id){const d=await db();return new Promise((ok,err)=>{
  const t=d.transaction('arq','readwrite');t.objectStore('arq').delete(id);t.oncomplete=()=>ok();t.onerror=()=>err(t.error)})}
async function arqTotal(){const d=await db();return new Promise(ok=>{let n=0,b=0;
  const t=d.transaction('arq');const c=t.objectStore('arq').openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){n++;b+=cur.value.tam||0;cur.continue()}else ok({n,b})}})}

/* ============================================================
   Levar os anexos de um endereço para outro.
   Os arquivos vivem no IndexedDB, que é preso ao domínio: o que foi
   anexado no site antigo não enxerga o site novo. Estas duas funções
   fazem a ponte — exporta tudo num .zip lá, importa aqui.
   ============================================================ */
async function todosArquivos() {
  const d = await db();
  return new Promise(ok => {
    const out = [], t = d.transaction('arq'), c = t.objectStore('arq').openCursor();
    c.onsuccess = e => { const cur = e.target.result; if (cur) { out.push(cur.value); cur.continue() } else ok(out) };
  });
}

async function exportarArquivos() {
  const regs = await todosArquivos();
  if (!regs.length) { alert('Não há anexo guardado neste endereço.'); return }
  const usados = {};                       // nome de arquivo repetido vira nome-2, nome-3…
  const entradas = [];
  const indice = [];
  for (const r of regs) {
    let nome = (r.nome || 'arquivo').replace(/[\/\\:*?"<>|]/g, '_');
    usados[nome] = (usados[nome] || 0) + 1;
    if (usados[nome] > 1) {
      const p = nome.lastIndexOf('.');
      nome = p > 0 ? nome.slice(0, p) + '-' + usados[nome] + nome.slice(p) : nome + '-' + usados[nome];
    }
    const buf = new Uint8Array(await r.blob.arrayBuffer());
    entradas.push({ nome: 'arquivos/' + nome, bytes: buf });
    indice.push({ id: r.id, ref: r.ref, nome: r.nome, tipo: r.tipo, tam: r.tam, em: r.em, arquivo: 'arquivos/' + nome });
  }
  entradas.unshift({ nome: 'indice.json', texto: JSON.stringify(indice, null, 1) });
  const total = indice.reduce((s, x) => s + (x.tam || 0), 0);
  baixar(zipStore(entradas), 'central-leo-arquivos-' + hoje() + '.zip');
  alert(regs.length + ' arquivo(s) — ' + tamanho(total) + ' — baixados.\n\n'
    + 'Abra o site novo e use "⬆ Restaurar arquivos" para trazer tudo.');
}

/* leitor de ZIP: só o necessário para ler o que a gente mesmo escreveu (sem compressão) */
function lerZip(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  // acha o fim do diretório central, varrendo de trás para frente
  let fim = -1;
  for (let i = u8.length - 22; i >= 0 && i > u8.length - 65558; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break }
  }
  if (fim < 0) throw new Error('não parece um .zip');
  const qtd = dv.getUint16(fim + 10, true);
  let p = dv.getUint32(fim + 16, true);
  const dec = new TextDecoder();
  const saida = {};
  for (let k = 0; k < qtd; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('diretório do zip corrompido');
    const metodo = dv.getUint16(p + 10, true);
    const tamComp = dv.getUint32(p + 20, true);
    const nLen = dv.getUint16(p + 28, true), eLen = dv.getUint16(p + 30, true), cLen = dv.getUint16(p + 32, true);
    const desloc = dv.getUint32(p + 42, true);
    const nome = dec.decode(u8.subarray(p + 46, p + 46 + nLen));
    if (metodo !== 0) throw new Error('este zip está comprimido — use o arquivo gerado pelo próprio app');
    // cabeçalho local: o tamanho dos campos variáveis pode diferir do central
    const nL2 = dv.getUint16(desloc + 26, true), eL2 = dv.getUint16(desloc + 28, true);
    const ini = desloc + 30 + nL2 + eL2;
    saida[nome] = u8.subarray(ini, ini + tamComp);
    p += 46 + nLen + eLen + cLen;
  }
  return saida;
}

async function importarArquivos(f) {
  try {
    const u8 = new Uint8Array(await f.arrayBuffer());
    const zip = lerZip(u8);
    if (!zip['indice.json']) throw new Error('falta o indice.json — este zip não veio daqui');
    const indice = JSON.parse(new TextDecoder().decode(zip['indice.json']));
    const jaTem = new Set((await todosArquivos()).map(x => x.id));
    let novos = 0, repetidos = 0, faltando = 0;
    const d = await db();
    for (const it of indice) {
      if (jaTem.has(it.id)) { repetidos++; continue }
      const bytes = zip[it.arquivo];
      if (!bytes) { faltando++; continue }
      const reg = { id: it.id, ref: it.ref, nome: it.nome, tipo: it.tipo, tam: it.tam, em: it.em,
        blob: new Blob([bytes], { type: it.tipo || 'application/octet-stream' }) };
      await new Promise((ok, err) => {
        const t = d.transaction('arq', 'readwrite'); t.objectStore('arq').put(reg);
        t.oncomplete = ok; t.onerror = () => err(t.error);
      });
      novos++;
    }
    tela();
    alert('Arquivos restaurados: ' + novos + '.'
      + (repetidos ? '\n' + repetidos + ' já estavam aqui (não dupliquei).' : '')
      + (faltando ? '\n⚠️ ' + faltando + ' constavam no índice mas não vieram no zip.' : ''));
  } catch (e) { alert('Não consegui ler: ' + e.message) }
}

const CHAVE='centralLeo.v1';
let E=carregar();
function carregar(){
  let s=null; try{s=JSON.parse(localStorage.getItem(CHAVE))}catch(e){}
  const base=structuredClone(SEED);
  const d=(s&&s.viagens)?{...base,...s}:base;
  // migração: todo registro precisa de id estável (arquivos são ligados por ele)
  for(const k of ['viagens','rendimentos','gastos','agenda','demandas','peso','exames','tratamentos','assinaturas','seguros','planos','casa','documentos','metas','pessoas','paraEles','vitais','vacinas','histFamiliar','rastreios','rituais','instrucoes','protecao','planoAno','pdi','livros','bancos','empresasPJ','patrimonio'])
    (d[k]||[]).forEach(x=>{if(!x.id)x.id=uid()});
  d.viagens.forEach(v=>{if(!Array.isArray(v.custos))v.custos=[];
    if(!Array.isArray(v.viajantes))v.viajantes=[];
    if(!Array.isArray(v.roteiro))v.roteiro=[];
    if(!Array.isArray(v.lugares))v.lugares=[];
    if(!v.carro||typeof v.carro!=='object')v.carro={};});
  // internacional: deixa indefinido de propósito — a cidade decide sozinha (ehInternacional)
  d.metas.forEach(m=>{if(!Array.isArray(m.passos))m.passos=[]});
  // gasto antigo tinha 'categoria' e usava 'obs' como descrição — vira 'classe' + 'oque'
  d.gastos.forEach(g=>{
    if(g.classe==null&&g.categoria!=null)g.classe=g.categoria;
    if(g.oque==null&&g.obs!=null)g.oque=g.obs;
    delete g.categoria;delete g.obs;
  });
  if(!d.colapso)d.colapso={};
  // objetos únicos: garante que existam mesmo em backup antigo
  for(const k of ['sos','norte','roda','perfil','comportamento']) d[k]={...structuredClone(SEED[k]),...(d[k]||{})};
  for(const k of ['vitais','vacinas','histFamiliar','rastreios','rituais','instrucoes','seguros','planos','casa','protecao','planoAno','pdi','livros','bancos','empresasPJ','patrimonio']) if(!Array.isArray(d[k])) d[k]=[];
  if(!d.rendHist) d.rendHist=structuredClone(SEED.rendHist);
  // configurações: garante que toda lista exista mesmo em backup antigo
  d.config={...structuredClone(SEED.config),...(d.config||{})};
  for(const k in SEED.config) if(!Array.isArray(d.config[k])||!d.config[k].length) d.config[k]=[...SEED.config[k]];
  return d;
}

/* ---------- gráficos SVG (sem biblioteca) ---------- */
function gBarras(dados,{alt=150,fmt=brl,cor=null,clicavel=false,sel=-1}={}){
  if(!dados.length||dados.every(d=>!d.v)) return `<div class="vazio">Sem dados ainda.</div>`;
  const max=Math.max(...dados.map(d=>Math.abs(d.v)))||1, n=dados.length;
  // a margem acompanha o rótulo: com centavos, 'R$ 1.438.816,18' não cabia em 44
  const L=Math.max(44,String(fmt(max)).length*5.5+10);
  const larg=Math.max(300,n*Math.min(86,720/n)+L),passo=(larg-L-8)/n;
  return `<svg viewBox="0 0 ${larg} ${alt+34}" style="width:100%;height:${alt+34}px;overflow:visible">
    ${[0,.5,1].map(f=>`<line x1="${L}" y1="${alt-alt*f}" x2="${larg-4}" y2="${alt-alt*f}" stroke="var(--linha)" stroke-dasharray="3 3"/>
      <text x="${L-6}" y="${alt-alt*f+4}" text-anchor="end" font-size="9.5" fill="var(--suave)">${fmt(max*f)}</text>`).join('')}
    ${dados.map((d,i)=>{const h=Math.max(2,Math.abs(d.v)/max*alt),x=L+i*passo+passo*.18,w=passo*.64;
      const at=i===sel;
      return `<g${clicavel?` data-bar="${i}" style="cursor:pointer"`:''}>
        ${clicavel?`<rect x="${L+i*passo}" y="0" width="${passo}" height="${alt+22}" fill="${at?'var(--verde-cl)':'transparent'}" rx="6"/>`:''}
        <rect x="${x}" y="${alt-h}" width="${w}" height="${h}" rx="4" fill="${cor||PALETA[i%PALETA.length]}" opacity="${at?1:.9}"><title>${esc(d.r)}: ${fmt(d.v)}</title></rect>
        <text x="${x+w/2}" y="${alt+14}" text-anchor="middle" font-size="10" fill="${at?'var(--verde)':'var(--suave)'}" font-weight="${at?600:400}">${esc(d.r)}</text>
        ${d.v?`<text x="${x+w/2}" y="${alt-h-5}" text-anchor="middle" font-size="9.5" fill="var(--suave)">${fmt(d.v)}</text>`:''}</g>`}).join('')}
  </svg>${clicavel?`<div style="font-size:11.5px;color:var(--suave);margin-top:4px">Clique num ano para ver as empresas.</div>`:''}`;
}
function gLinha(dados,{alt=150,fmt=v=>v}={}){
  if(dados.length<2) return `<div class="vazio">Precisa de pelo menos 2 registros.</div>`;
  const vs=dados.map(d=>d.v),mx=Math.max(...vs),mn=Math.min(...vs),amp=(mx-mn)||1;
  const L=Math.max(44,String(fmt(mx)).length*5.5+10);
  const larg=720,passo=(larg-L-12)/(dados.length-1);
  const pt=i=>[L+i*passo,alt-((dados[i].v-mn)/amp)*(alt-18)-9];
  const d=dados.map((_,i)=>(i?'L':'M')+pt(i).join(' ')).join(' ');
  return `<svg viewBox="0 0 ${larg} ${alt+30}" style="width:100%;height:${alt+30}px;overflow:visible">
    ${[0,.5,1].map(f=>`<line x1="${L}" y1="${alt-(alt-18)*f-9}" x2="${larg-6}" y2="${alt-(alt-18)*f-9}" stroke="var(--linha)" stroke-dasharray="3 3"/>
      <text x="${L-6}" y="${alt-(alt-18)*f-5}" text-anchor="end" font-size="9.5" fill="var(--suave)">${fmt(mn+amp*f)}</text>`).join('')}
    <path d="${d}" fill="none" stroke="var(--verde)" stroke-width="2.2" stroke-linejoin="round"/>
    ${dados.map((p,i)=>{const [x,y]=pt(i);return `<circle cx="${x}" cy="${y}" r="3.4" fill="var(--verde)"><title>${esc(p.r)}: ${fmt(p.v)}</title></circle>
      <text x="${x}" y="${alt+20}" text-anchor="middle" font-size="9.5" fill="var(--suave)">${esc(p.r)}</text>`}).join('')}
  </svg>`;
}
function gRosca(dados,{fmt=brl}={}){
  const val=dados.filter(d=>d.v>0); if(!val.length) return `<div class="vazio">Sem dados ainda.</div>`;
  const tot=val.reduce((s,d)=>s+d.v,0);let ang=-Math.PI/2;
  const R=64,r=40,C=80;
  const arcos=val.map((d,i)=>{const a=d.v/tot*Math.PI*2,f=ang+a;
    const p=(rr,t)=>[C+rr*Math.cos(t),C+rr*Math.sin(t)].join(' ');
    const g=a>Math.PI?1:0;
    const path=`M${p(R,ang)} A${R} ${R} 0 ${g} 1 ${p(R,f)} L${p(r,f)} A${r} ${r} 0 ${g} 0 ${p(r,ang)} Z`;
    ang=f;return `<path d="${path}" fill="${PALETA[i%PALETA.length]}" opacity=".92"><title>${esc(d.r)}: ${fmt(d.v)}</title></path>`}).join('');
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 160 160" style="width:160px;height:160px;flex:0 0 auto">${arcos}
      <text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--suave)">total</text>
      <text x="80" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="var(--tinta)">${fmt(tot)}</text></svg>
    <div class="legenda" style="flex-direction:column;gap:6px;flex:1;min-width:150px">
      ${val.map((d,i)=>`<span><i style="background:${PALETA[i%PALETA.length]}"></i>${esc(d.r)} · <b style="color:var(--tinta)">${fmt(d.v)}</b>
        <span style="opacity:.7">(${(d.v/tot*100).toFixed(0)}%)</span></span>`).join('')}</div></div>`;
}

function tabela(lista,colunas,aoMudar,rodape,alvo,abrir){
  const t=document.createElement('table');
  t.innerHTML='<thead><tr>'+colunas.map(c=>`<th${c.w?` style="width:${c.w}px"`:''}>${c.t}</th>`).join('')
    +(abrir?'<th style="width:64px"></th>':'')+'<th style="width:34px"></th></tr></thead>';
  const tb=document.createElement('tbody');
  lista.forEach((it,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=colunas.map(c=>{
      const v=it[c.k]??'';
      if(c.tipo==='select') return `<td><select data-i="${i}" data-k="${c.k}">`+c.opcoes.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')+`</select></td>`;
      if(c.tipo==='calc') return `<td style="padding:8px 10px;${c.dir==='r'?'text-align:right;':''}color:var(--suave);font-variant-numeric:tabular-nums">${c.calc(it)}</td>`;
      if(c.tipo==='moeda') return `<td class="num"><input type="text" inputmode="decimal" class="moeda" data-i="${i}" data-k="${c.k}" value="${v?brl2(v):''}" placeholder="R$ 0,00"></td>`;
      const tipo=c.tipo||'text';
      return `<td class="${c.num?'num':''}"><input type="${tipo}" data-i="${i}" data-k="${c.k}" value="${esc(v)}"${c.ph?` placeholder="${c.ph}"`:''}></td>`;
    }).join('')+(abrir?`<td><button class="btn ghost mini" data-abrir="${i}">abrir</button></td>`:'')
      +`<td><button class="lixo" data-del="${i}" title="Apagar">✕</button></td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  if(rodape){const tf=document.createElement('tfoot');tf.innerHTML=`<tr class="tfim">${rodape}</tr>`;t.appendChild(tf)}
  if(abrir) t.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-abrir]'); if(!b)return;
    abrir(lista[+b.dataset.abrir]);
  });
  t.addEventListener('focusin',ev=>{const a=ev.target;
    if(!a.classList||!a.classList.contains('moeda'))return;
    const n=moedaNum(a.value); a.value=n?String(n).replace('.',','):''; a.select&&a.select();});
  t.addEventListener('change',ev=>{const a=ev.target;if(a.dataset.i===undefined)return;
    const it=lista[+a.dataset.i];
    if(a.classList&&a.classList.contains('moeda')){
      const n=moedaNum(a.value); it[a.dataset.k]=n; a.value=n?brl2(n):'';
    } else it[a.dataset.k]=a.type==='number'?(a.value===''?0:+a.value):a.value;
    salvar();aoMudar&&aoMudar(true)});
  t.addEventListener('click',ev=>{const b=ev.target.closest('[data-del]');if(!b)return;
    const it=lista[+b.dataset.del], base=alvo||lista, i=base.indexOf(it);
    if(i>=0)base.splice(i,1); else base.splice(+b.dataset.del,1);
    salvar();aoMudar&&aoMudar()});
  return t;
}

function campos(obj,defs,aoMudar){
  const c=el('<div class="campos"></div>');
  defs.forEach(d=>{
    const w=el(`<div class="campo"><label>${d.t}</label></div>`);
    let inp;
    if(d.tipo==='select'){inp=el(`<select>${d.opcoes.map(o=>`<option${o===(obj[d.k]??'')?' selected':''}>${esc(o)}</option>`).join('')}</select>`)}
    else if(d.tipo==='textarea'){inp=el(`<textarea placeholder="${d.ph||''}"></textarea>`);inp.value=obj[d.k]??''}
    // moeda: mostra R$ formatado, guarda número. Sem isso o campo virava texto
    // e "R$ 1.200,00" era salvo como string, quebrando as somas.
    else if(d.tipo==='moeda'){
      inp=el(`<input type="text" inputmode="decimal" class="moeda" placeholder="R$ 0,00">`);
      inp.value=(+obj[d.k])?brl2(+obj[d.k]):'';
      inp.addEventListener('focusin',()=>{const v2=moedaNum(inp.value);inp.value=v2?String(v2).replace('.',','):'';inp.select&&inp.select()});
    }
    else{inp=el(`<input type="${d.tipo||'text'}" placeholder="${d.ph||''}">`);inp.value=obj[d.k]??''}
    if(d.full)w.style.gridColumn='1/-1';
    inp.addEventListener('change',()=>{
      if(d.tipo==='moeda'){const v2=moedaNum(inp.value);obj[d.k]=v2;inp.value=v2?brl2(v2):''}
      else obj[d.k]=inp.type==='number'?(inp.value===''?0:+inp.value):inp.value;
      salvar();aoMudar&&aoMudar()});
    w.appendChild(inp);c.appendChild(w);
  });
  return c;
}
/* área de arquivos de um registro */
function areaArquivos(ref,dica){
  const c=el(`<div><div class="arqs" style="margin-bottom:9px"></div>
    <div class="solta">📎 ${dica||'Clique ou arraste arquivos aqui'}</div>
    <input type="file" multiple hidden></div>`);
  const lista=c.querySelector('.arqs'),solta=c.querySelector('.solta'),inp=c.querySelector('input');
  const pintar=async()=>{
    const as=await arqPor(ref);
    lista.innerHTML=as.length?'':'<div style="color:var(--suave);font-size:12.5px">Nenhum arquivo ainda.</div>';
    as.forEach(a=>{
      const url=URL.createObjectURL(a.blob);
      const it=el(`<div class="arq"><span>${/pdf/.test(a.tipo)?'📄':/image/.test(a.tipo)?'🖼️':'📎'}</span>
        <span class="nome">${esc(a.nome)}</span><span class="tam">${tamanho(a.tam)}</span>
        <a href="${url}" target="_blank" rel="noopener">abrir</a>
        <a href="${url}" download="${esc(a.nome)}">baixar</a>
        <button class="lixo">✕</button></div>`);
      it.querySelector('.lixo').onclick=async()=>{await arqDel(a.id);pintar()};
      lista.appendChild(it);
    });
  };
  const receber=async fs=>{for(const f of fs) await arqAdd(ref,f); pintar()};
  solta.onclick=()=>inp.click();
  inp.onchange=()=>{receber([...inp.files]);inp.value=''};
  solta.addEventListener('dragover',e=>{e.preventDefault();solta.classList.add('sobre')});
  solta.addEventListener('dragleave',()=>solta.classList.remove('sobre'));
  solta.addEventListener('drop',e=>{e.preventDefault();solta.classList.remove('sobre');receber([...e.dataTransfer.files])});
  pintar();
  return c;
}

const INTERNACIONAL=/guangzhou|cant[ãa]o|china|xangai|shangai|hong kong|los angeles|miami|orlando|new york|nova york|eua|estados unidos|lisboa|portugal|paris|fran[çc]a|madri|espanha|roma|it[áa]lia|londres|inglaterra|dubai|santiago|buenos aires|argentina|chile|cancun|m[ée]xico|canad[áa]|jap[ãa]o|t[óo]quio/i;

const ehInternacional=v=>v.internacional===true||(v.internacional==null&&INTERNACIONAL.test((v.cidade||'')+' '+(v.pais||'')));
// a maioria dos países exige passaporte válido por 6 meses ALÉM da volta
const folga6m=d=>{const x=new Date(d+'T12:00');x.setMonth(x.getMonth()+6);return x.toISOString().slice(0,10)};
function docsViagem(v){
  if(!ehInternacional(v))return{intl:false,ok:true,itens:[]};
  const nomes=(v.viajantes&&v.viajantes.length)?v.viajantes:['Léo'];
  const volta=v.volta||v.ida||hoje(), limite=folga6m(volta);
  const itens=[];let ok=true;
  const marca=o=>{if(o.ruim)ok=false;itens.push(o)};
  nomes.forEach(nome=>{
    const meus=E.documentos.filter(d=>mesmaPessoa(d.dono||'Léo',nome));
    const pass=meus.find(d=>/passaporte/i.test(d.nome||''));
    if(!pass)marca({nome,doc:'Passaporte',sit:'não cadastrado',ruim:true});
    else if(!pass.validade)marca({nome,doc:'Passaporte',sit:'sem data de validade',ruim:true});
    else if(pass.validade<volta)marca({nome,doc:'Passaporte',sit:'VENCE ANTES DA VOLTA — '+fmtDataAno(pass.validade),ruim:true});
    else if(pass.validade<limite)marca({nome,doc:'Passaporte',sit:'vence '+fmtDataAno(pass.validade)+' — sem a folga de 6 meses',aviso:true});
    else marca({nome,doc:'Passaporte',sit:'ok até '+fmtDataAno(pass.validade)});
    const vistos=meus.filter(d=>/visto/i.test(d.nome||''));
    if(!vistos.length)marca({nome,doc:'Visto',sit:'nenhum cadastrado — confira se o destino exige',aviso:true});
    vistos.forEach(d=>{
      if(!d.validade)marca({nome,doc:d.nome,sit:'sem validade',aviso:true});
      else if(d.validade<volta)marca({nome,doc:d.nome,sit:'VENCE '+fmtDataAno(d.validade),ruim:true});
      else marca({nome,doc:d.nome,sit:'ok até '+fmtDataAno(d.validade)});
    });
  });
  (E.vacinas||[]).filter(x=>x.viagem==='Sim'&&x.proxima&&x.proxima<(v.ida||volta))
    .forEach(x=>marca({nome:'Léo',doc:x.vacina||'Vacina',sit:'reforço vencido antes da ida',ruim:true}));
  return {intl:true,ok,itens};
}

/* radar: varre TODAS as seções e junta o que precisa de atenção */
function radar(){
  const h=hoje(), out=[];
  const dias=d=>d?Math.round((new Date(d+'T12:00')-new Date(h+'T12:00'))/864e5):null;
  const add=(g,ic,txt,quando,secao)=>out.push({g,ic,txt,quando,secao});
  // documentos vencendo
  E.documentos.forEach(d=>{const n=dias(d.validade);
    if(n!=null&&n<180) add(n<0?0:1,'🪪',`${d.nome||'Documento'}${d.dono&&d.dono!=='Léo'?' de '+d.dono:''} ${n<0?'venceu':'vence'} ${fmtDataAno(d.validade)}`,n,'documentos')});
  // seguros renovando (cotar antes da renovação automática)
  (E.seguros||[]).filter(s=>s.status!=='Cancelado').forEach(s=>{const n=dias(s.renova);
    if(n!=null&&n<60) add(n<0?0:1,'🛡️',`Seguro ${s.item||s.tipo||''} ${n<0?'venceu':'renova'} ${fmtDataAno(s.renova)}`,n,'gastos')});
  // seguro de vida sem beneficiário: a seguradora paga quem está no papel
  (E.seguros||[]).filter(s=>s.status!=='Cancelado'&&/vida/i.test(s.tipo||'')&&!String(s.beneficiarios||'').trim())
    .forEach(s=>add(0,'🛡️',`Seguro de vida${s.seguradora?' ('+s.seguradora+')':''} sem beneficiário anotado`,null,'gastos'));
  // proteção da família ainda no papel
  {const falta=(E.protecao||[]).filter(x=>x.status==='Não tenho').length;
   if(falta) add(1,'🛡️',`Proteção da família: ${falta} item(ns) sem resolver (tutor, testamento, procuração…)`,null,'guia');}
  // exames a repetir
  E.exames.forEach(x=>{const n=dias(x.proximo);
    if(n!=null&&n<60) add(n<0?0:1,'🩺',`Repetir ${x.exame||'exame'} ${n<0?'(atrasado desde '+fmtData(x.proximo)+')':fmtData(x.proximo)}`,n,'saude')});
  // rastreios por idade
  (typeof rastreiosPendentes==='function'?rastreiosPendentes():[]).forEach(p=>
    add(p.situacao==='Atrasado'?0:1,'🩺',`${p.nome} — ${p.situacao==='Nunca feito'?'nunca feito':p.situacao.toLowerCase()}`,p.venceEm,'saude'));
  // vacinas
  E.vacinas.forEach(v=>{const n=dias(v.proxima);
    if(n!=null&&n<90) add(n<0?0:1,'💉',`Reforço de ${v.vacina||'vacina'} ${n<0?'atrasado':fmtData(v.proxima)}`,n,'saude')});
  // demandas
  E.demandas.filter(d=>d.status!=='Concluída').forEach(d=>{const n=dias(d.prazo);
    if(n!=null&&n<15) add(n<0?0:1,'✅',`${d.titulo||'Demanda'} ${n<0?'atrasada':'vence '+fmtData(d.prazo)}`,n,'demandas')});
  // compromissos dos próximos 7 dias
  E.agenda.forEach(a=>{const n=dias(a.data);
    if(n!=null&&n>=0&&n<=7) add(2,'📅',`${a.titulo||'Compromisso'}${a.hora?' às '+a.hora:''} — ${n===0?'hoje':n===1?'amanhã':'em '+n+' dias'}`,n,'agenda')});
  // viagem chegando e sem hotel
  E.viagens.filter(v=>v.status!=='Cancelado').forEach(v=>{const n=dias(v.ida);
    if(n!=null&&n>=0&&n<=45){
      add(2,'✈️',`${v.evento||'Viagem'} para ${v.cidade||''} em ${n} dia(s)`,n,'viagens');
      if(!String(v.hotel||'').trim()) add(1,'🏨',`${v.evento||'Viagem'}: hotel ainda não definido`,n,'viagens');
    }});
  // rituais atrasados
  const DF={'Semanal':7,'Quinzenal':15,'Mensal':30,'Trimestral':90,'Semestral':180,'Anual':365};
  E.rituais.forEach(x=>{if(!x.ultima)return;
    const at=Math.round((new Date(h+'T12:00')-new Date(x.ultima+'T12:00'))/864e5)-(DF[x.frequencia]||30);
    if(at>0) add(1,'🔁',`${x.ritual||'Ritual'} está ${at} dia(s) atrasado`,-at,'guia')});
  // aniversários da família (próximos 30 dias)
  E.pessoas.forEach(p=>{if(!p.nascimento)return;
    const d=new Date(p.nascimento+'T12:00'), hj=new Date(h+'T12:00');
    const prox=new Date(hj.getFullYear(),d.getMonth(),d.getDate());
    if(prox<hj) prox.setFullYear(prox.getFullYear()+1);
    const n=Math.round((prox-hj)/864e5);
    if(n<=30) add(n<=7?1:2,'🎂',`Aniversário de ${p.nome||'alguém'} ${n===0?'é hoje':'em '+n+' dias'}`,n,'guia')});
  return out.sort((a,b)=>a.g-b.g||((a.quando??999)-(b.quando??999)));
}

  if (filtro.viagensAno == null) filtro.viagensAno = String(anoHoje);
  const anoV = filtro.viagensAno;
  const doAnoV = x => (+(x.ida || '').slice(0, 4) >= ANO_MIN) && (anoV === 'todos' || (x.ida || '').startsWith(anoV));
  const noAno = E.viagens.filter(doAnoV);
  const cont = st => noAno.filter(v => v.status === st).length;
  m.appendChild(painel('Ano',
    seletor(anoV, [...anosV.map(a => [a, a + ' (' + E.viagens.filter(v => (v.ida || '').startsWith(a)).length + ')']),
      ['todos', 'Todos os anos (' + E.viagens.filter(v => +(v.ida || '').slice(0, 4) >= ANO_MIN).length + ')']], v => { filtro.viagensAno = v; r() }),
    seletor(filtro.viagens, [['Todas', 'Todas (' + noAno.length + ')'],
      ...CFG('statusViagem').map(st => [st, st + ' (' + cont(st) + ')'])], v => { filtro.viagens = v; r() }),
    acao('+ Nova viagem', novaViagem), '|'));

  if (comProblema.length) m.appendChild(el(`<div class="aviso">🛂 <b>${comProblema.length} viagem(ns) internacional(is) com pendência de documento:</b>
    ${comProblema.map(v => esc(v.evento || v.cidade)).join(', ')}. Abra a viagem para ver o que falta.</div>`));
  if (semHotel) m.appendChild(el(`<div class="aviso">🏨 <b>${semHotel} viagem(ns) futura(s) sem hotel definido.</b> Reserve cedo — preço sobe perto da data.</div>`));

  /* ---- lista em linhas ---- */
  const cx = el('<div></div>');
  const rol = el('<div class="rolagem"></div>');
  const lista = [...noAno].filter(v => filtro.viagens === 'Todas' || v.status === filtro.viagens)
    .sort((a, b) => (a.ida || '').localeCompare(b.ida || ''));
  const tv = document.createElement('table');
  tv.innerHTML = `<thead><tr><th>Ida</th><th>Volta</th><th>Evento</th><th>Cidade</th><th>Quem vai</th><th>Hotel</th>
    <th>Transporte</th><th style="text-align:right">Dias</th><th style="text-align:right">Gastos</th>
    <th>O que falta</th><th>Status</th></tr></thead>`;
  const tb = document.createElement('tbody');
  lista.forEach(v => {
    const custo = custoViagem(v), dc = docsViagem(v), pronta = viagemOk(v);
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    // o que ainda falta nesta viagem
    const falta = [];
    if (!String(v.hotel || '').trim()) falta.push('hotel');
    if (!String(v.transporte || '').trim()) falta.push('transporte');
    if (dc.intl && !dc.ok) falta.push('documento');
    if (!['Confirmado', 'Realizado'].includes(v.status)) falta.push('confirmação');
    if (v.status === 'Cancelado') { tr.style.opacity = '.5' }
    else if (pronta) { tr.style.background = 'var(--verde-cl)'; tr.style.boxShadow = 'inset 3px 0 0 var(--verde)' }
    else { tr.style.background = 'var(--vermelho-cl)'; tr.style.boxShadow = 'inset 3px 0 0 var(--vermelho)' }
    const quem = (v.viajantes || []).length ? v.viajantes.join(', ') : '—';
    tr.innerHTML = `<td style="padding:9px 10px;white-space:nowrap;font-variant-numeric:tabular-nums">${fmtData(v.ida)}</td>
      <td style="padding:9px 10px;white-space:nowrap;font-variant-numeric:tabular-nums">${fmtData(v.volta)}</td>
      <td style="padding:9px 10px"><b>${esc(v.evento || '(sem nome)')}</b>${pronta ? ' <span style="color:var(--verde)">✓</span>' : ''}
        ${v.tipo && v.tipo !== 'Trabalho' ? `<span style="font-size:10.5px;color:var(--suave)"> · ${esc(v.tipo)}</span>` : ''}
        ${(v.roteiro || []).filter(x => String(x.oque || '').trim()).length ? `<span style="font-size:10.5px;color:var(--azul)"> · 🗓️ roteiro</span>` : ''}
        ${(v.custos || []).length ? `<span style="font-size:10.5px;color:var(--verde)"> · ${v.custos.length} custo(s)</span>` : ''}</td>
      <td style="padding:9px 10px">${esc(v.cidade || '—')}${dc.intl ? ' <span title="internacional">🌎</span>' : ''}</td>
      <td style="padding:9px 10px;font-size:12.5px;color:var(--suave);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(quem)}</td>
      <td style="padding:9px 10px;color:${String(v.hotel || '').trim() ? 'inherit' : 'var(--areia)'}">${esc(v.hotel || '—')}</td>
      <td style="padding:9px 10px">${esc(v.transporte || '—')}</td>
      <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums">${diasEntre(v.ida, v.volta) || '—'}</td>
      <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${custo ? brl(custo) : '—'}</td>
      <td style="padding:9px 10px;font-size:12px">${v.status === 'Cancelado' ? '<span style="color:var(--suave)">cancelada</span>'
        : !falta.length ? '<span class="chip" style="background:var(--verde-cl);color:var(--verde)">pronta</span>'
        : '<span style="color:var(--vermelho)">falta ' + esc(falta.join(', ')) + '</span>'}</td>
      <td style="padding:9px 10px">${chip(v.status)}</td>`;
    tr.onclick = () => modalViagem(v);
    tb.appendChild(tr);
  });
  tv.appendChild(tb);
  if (!lista.length) rol.innerHTML = '<div class="vazio">Nenhuma viagem com esse status.</div>';
  else {
    const tfv = document.createElement('tfoot');
    tfv.innerHTML = `<tr class="tfim"><td colspan="7" style="padding:10px">Total (sem canceladas)</td>
      <td style="text-align:right">${dias}</td><td style="text-align:right">${brl(tot)}</td><td colspan="2"></td></tr>`;
    tv.appendChild(tfv); rol.appendChild(tv);
  }
  cx.appendChild(rol);
  const pe = el('<div style="padding:0 17px 15px"></div>');
  const bt = el('<button class="mais">+ Nova viagem</button>'); bt.onclick = novaViagem;
  pe.appendChild(bt); cx.appendChild(pe);
  m.appendChild(bloco('vg-lista', 'Todas as viagens', 'em ordem de data — verde = pronta para embarcar', cx));

  m.appendChild(el(`<div class="grade">
    ${kpi('Gasto total', brl(tot), ativos.length + ' viagens', 'r')}
    ${kpi('Dias viajando', dias, 'fora de casa')}
    ${kpi('Custo médio/dia', dias ? brl(tot / dias) : '—', 'por dia')}
    ${kpi('Próximas', E.viagens.filter(v => v.ida >= hoje() && v.status !== 'Cancelado').length, semHotel ? semHotel + ' sem hotel' : 'hotéis ok', 'a')}
    ${kpi('Internacionais à frente', futIntl.length, comProblema.length ? comProblema.length + ' com pendência' : 'documentos ok', comProblema.length ? 'r' : 'v')}
    ${kpi('Prontas', E.viagens.filter(viagemOk).length, 'tudo conferido', 'v')}</div>`));

  const porCat = {}; ativos.forEach(v => (v.custos || []).forEach(c => porCat[c.categoria] = (porCat[c.categoria] || 0) + (+c.valor || 0)));
  const temCat = Object.values(porCat).some(v => v > 0);
  m.appendChild(bloco('vg-dash', 'Gasto por viagem', '', graficoEl(gBarras(
    ativos.filter(v => custoViagem(v) > 0).map(v => ({ r: v.evento.slice(0, 10), v: custoViagem(v) })), { fmt: brl }))));
  m.appendChild(bloco('vg-cat', 'Para onde vai o dinheiro', temCat ? 'somando os centros de custo' : 'abra uma viagem e lance os custos',
    graficoEl(temCat ? gRosca(CFG('catCusto').map(c => ({ r: c, v: porCat[c] || 0 }))) : `<div class="vazio">Ainda sem centro de custo lançado.</div>`)));
}

/* ---- Roteiro da viagem em PDF: para imprimir ou mandar para a família ---- */
function imprimirViagem(v) {
  const w = window.open('', '_blank');
  if (!w) { alert('Libere o pop-up para gerar o PDF.'); return }
  const dc = docsViagem(v);
  const custo = (v.custos || []).reduce((a, x) => a + (+x.valor || 0), 0);
  const quem = (v.viajantes || []).length ? v.viajantes.join(', ') : '—';
  const semana = d => d ? new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long' }) : '';

  const dias = (v.roteiro || []).slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''))
    .map((x, i) => `<div class="dia">
      <div class="dcab"><b>Dia ${i + 1}</b> · ${fmtDataAno(x.data)} <span class="sem">${semana(x.data)}</span></div>
      ${x.local ? `<div><span class="rot">Onde</span> ${esc(x.local)}</div>` : ''}
      ${x.oque ? `<div><span class="rot">Programa</span> ${esc(x.oque)}</div>` : ''}
      ${x.comer ? `<div><span class="rot">Comer</span> ${esc(x.comer)}</div>` : ''}
      ${x.obs ? `<div><span class="rot">Nota</span> ${esc(x.obs)}</div>` : ''}
      ${!x.local && !x.oque && !x.comer ? '<div class="livre">— dia livre —</div>' : ''}
    </div>`).join('');

  const lug = (v.lugares || []).length ? `<h2>Lugares</h2><table>
    <thead><tr><th>Lugar</th><th>O que é</th><th class="n">Quanto</th><th>Situação</th><th>Observação</th></tr></thead><tbody>
    ${v.lugares.map(x => `<tr><td><b>${esc(x.nome || '')}</b></td><td>${esc(x.tipo || '')}</td>
      <td class="n">${+x.quanto ? brl(+x.quanto) : '—'}</td><td>${esc(x.situacao || '')}</td>
      <td>${esc(x.obs || '')}</td></tr>`).join('')}</tbody></table>` : '';

  const c = v.carro || {};
  const carro = (c.locadora || c.reserva || c.modelo) ? `<h2>Carro alugado</h2>
    <div class="l"><b>Locadora</b> ${esc(c.locadora || '—')}${c.reserva ? ' · reserva ' + esc(c.reserva) : ''}</div>
    <div class="l"><b>Veículo</b> ${esc(c.modelo || '—')}${+c.valor ? ' · ' + brl(+c.valor) : ''}</div>
    <div class="l"><b>Retirada</b> ${c.retirada ? fmtDataAno(c.retirada) : '—'} ${esc(c.localRet || '')}</div>
    <div class="l"><b>Devolução</b> ${c.devolucao ? fmtDataAno(c.devolucao) : '—'} ${esc(c.localDev || '')}</div>
    ${c.obs ? `<div class="l"><b>Notas</b> ${esc(c.obs)}</div>` : ''}` : '';

  const docs = dc.intl && dc.itens.length ? `<h2>Documentos</h2><table>
    <thead><tr><th>Pessoa</th><th>Documento</th><th>Situação</th></tr></thead><tbody>
    ${dc.itens.map(i => `<tr><td>${esc(i.nome)}</td><td>${esc(i.doc)}</td>
      <td style="color:${i.ruim ? '#b3261e' : i.aviso ? '#b26a00' : '#1b7a4b'}">${esc(i.sit)}</td></tr>`).join('')}</tbody></table>` : '';

  const gastos = (v.custos || []).length ? `<h2>Custos lançados</h2><table>
    <thead><tr><th>Categoria</th><th>O quê</th><th class="n">Valor</th></tr></thead><tbody>
    ${v.custos.map(x => `<tr><td>${esc(x.categoria || '')}</td><td>${esc(x.descricao || '')}</td>
      <td class="n">${brl(+x.valor || 0)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">TOTAL</td><td class="n">${brl(custo)}</td></tr></tbody></table>` : '';

  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(v.evento || 'Viagem')} — roteiro</title>
  <style>
    body{font:12.5px/1.55 -apple-system,Helvetica,sans-serif;padding:26px;color:#1a1a1a;max-width:820px}
    h1{font-size:22px;margin:0 0 2px}
    h2{font-size:13px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:#666;border-bottom:1px solid #e8e4dc;padding-bottom:4px}
    .cab{color:#777;margin-bottom:6px;font-size:12px}
    .resumo{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 4px;font-size:12.5px}
    .resumo div{min-width:150px}.resumo b{color:#666;font-weight:600;font-size:11px;display:block;text-transform:uppercase;letter-spacing:.04em}
    .dia{border-left:3px solid #cfc6b4;padding:8px 0 8px 12px;margin-bottom:10px;page-break-inside:avoid}
    .dcab{font-size:13px;margin-bottom:3px}.sem{color:#999;font-size:11.5px}
    .rot{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:inline-block;min-width:74px}
    .livre{color:#aaa;font-style:italic}
    table{border-collapse:collapse;width:100%;margin-bottom:6px}
    th,td{padding:6px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
    th{background:#f4f1ea;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#555}
    .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .tot td{border-top:2px solid #333;font-weight:700}
    .l{padding:4px 0;border-bottom:1px solid #f0ece4}.l b{display:inline-block;min-width:96px;color:#666}
    @media print{body{padding:0}h2{page-break-after:avoid}}
  </style>
  <h1>${esc(v.evento || 'Viagem')}</h1>
  <div class="cab">${esc(v.cidade || '')} · ${fmtDataAno(v.ida)} a ${fmtDataAno(v.volta)} ·
    ${diasEntre(v.ida, v.volta) || '?'} dia(s)${v.tipo ? ' · ' + esc(v.tipo) : ''}</div>
  <div class="resumo">
    <div><b>Quem vai</b>${esc(quem)}</div>
    <div><b>Hotel</b>${esc(v.hotel || '—')}</div>
    <div><b>Transporte</b>${esc(v.transporte || '—')}</div>
    <div><b>Orçamento</b>${+v.gastos ? brl(+v.gastos) : '—'}</div>
    ${custo ? `<div><b>Já gasto</b>${brl(custo)}</div>` : ''}
  </div>
  ${dias ? '<h2>Roteiro dia a dia</h2>' + dias : ''}
  ${lug}
  ${carro}
  ${docs}
  ${gastos}
  ${v.obs ? `<h2>Observações</h2><div>${esc(v.obs)}</div>` : ''}
  <div class="cab" style="margin-top:24px">Central do Léo · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function modalViagem(v){
  abrirModal(esc(v.evento||'Nova viagem'),`${esc(v.cidade||'')} · ${fmtDataLonga(v.ida)} → ${fmtDataLonga(v.volta)}`,(c,fechar)=>{
    const s1=el('<div class="secao"><h4>Dados da viagem</h4></div>');
    s1.appendChild(campos(v,[
      {k:'evento',t:'Evento'},{k:'cidade',t:'Cidade'},
      {k:'ida',t:'Ida',tipo:'date'},{k:'volta',t:'Volta',tipo:'date'},
      {k:'hotel',t:'Hotel',ph:'nome / reserva'},
      {k:'transporte',t:'Transporte',tipo:'select',opcoes:['',...CFG('transportes')]},
      {k:'status',t:'Status',tipo:'select',opcoes:CFG('statusViagem')},
      {k:'gastos',t:'Orçamento estimado (R$)',tipo:'number'},
      {k:'obs',t:'Observações',tipo:'textarea',full:true},
    ]));
    c.appendChild(s1);

    // ---- quem vai + internacional ----
    const sq=el('<div class="secao"><h4>Quem vai</h4></div>');
    const pintaQuem=()=>{
      const velho=sq.querySelector('.quem'); if(velho)velho.remove();
      const cx2=el('<div class="quem"></div>');
      const chips=el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"></div>');
      const nomes=['Léo',...E.pessoas.map(p2=>p2.nome).filter(Boolean)];
      if(nomes.length<2) chips.appendChild(el('<span style="font-size:12.5px;color:var(--suave)">Cadastre esposa e filhos em <b>🧭 Guia de vida → Minha gente</b> para escolher aqui.</span>'));
      nomes.forEach(nome=>{
        const on=(v.viajantes||[]).includes(nome);
        const b=el(`<button type="button" class="chip" style="cursor:pointer;border:1px solid ${on?'var(--verde)':'var(--linha)'};
          background:${on?'var(--verde-cl)':'var(--bg)'};color:${on?'var(--verde)':'var(--suave)'};padding:6px 12px;font-size:13px">
          ${on?'✓ ':''}${esc(nome)}</button>`);
        b.onclick=()=>{
          v.viajantes=v.viajantes||[];
          const i=v.viajantes.indexOf(nome);
          if(i>=0)v.viajantes.splice(i,1); else v.viajantes.push(nome);
          salvar();pintaQuem();pintaDocs();
        };
        chips.appendChild(b);
      });
      cx2.appendChild(chips);
      const auto=v.internacional==null&&INTERNACIONAL.test((v.cidade||'')+' '+(v.pais||''));
      const li=el(`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer">
        <input type="checkbox" ${ehInternacional(v)?'checked':''} style="accent-color:var(--verde);width:16px;height:16px">
        🌎 Viagem internacional — conferir passaporte e visto
        ${auto?'<span style="font-size:11.5px;color:var(--suave)">(marcado pela cidade)</span>':''}</label>`);
      li.querySelector('input').onchange=e=>{v.internacional=e.target.checked;salvar();pintaQuem();pintaDocs()};
      cx2.appendChild(li);
      sq.appendChild(cx2);
    };
    pintaQuem(); c.appendChild(sq);

    // ---- documentação (só internacional) ----
    const sd=el('<div class="secao"><h4>Documentação da viagem</h4></div>');
    const pintaDocs=()=>{
      const velho=sd.querySelector('.docs'); if(velho)velho.remove();
      const cx3=el('<div class="docs"></div>');
      if(!ehInternacional(v)){
        cx3.innerHTML='<div style="font-size:12.5px;color:var(--suave)">Viagem nacional — sem exigência de passaporte/visto.</div>';
        sd.appendChild(cx3);sd.style.display='';return;
      }
      const d=docsViagem(v), atencao=d.itens.filter(i=>i.aviso).length;
      cx3.appendChild(el(`<div class="aviso" style="margin:0 0 10px;background:${d.ok?'var(--verde-cl)':'var(--vermelho-cl)'};
        border-color:${d.ok?'var(--verde)':'var(--vermelho)'}">
        ${d.ok?'✅ <b>Documentação em dia</b> até a data da volta'+(atencao?', mas há '+atencao+' ponto(s) para conferir.':' — passaporte com a folga de 6 meses.')
               :'⚠️ <b>Tem documento pendente</b> — resolva antes de fechar a viagem.'}</div>`));
      const cor=i=>i.ruim?'var(--vermelho)':i.aviso?'var(--ambar,#b26a00)':'var(--verde)';
      const tb2=el('<div class="rolagem"></div>');
      tb2.innerHTML=`<table><thead><tr><th>Pessoa</th><th>Documento</th><th>Situação</th></tr></thead><tbody>
        ${d.itens.map(i=>`<tr><td style="padding:8px 10px">${esc(i.nome)}</td>
          <td style="padding:8px 10px">${esc(i.doc)}</td>
          <td style="padding:8px 10px;color:${cor(i)};font-weight:${i.ruim?'600':'400'}">${esc(i.sit)}</td></tr>`).join('')}
      </tbody></table>`;
      cx3.appendChild(tb2);
      cx3.appendChild(el('<div style="font-size:12px;color:var(--suave);margin-top:9px">Cadastre e atualize em <b>🪪 Documentos</b> — o campo <i>De quem</i> precisa bater com o nome da pessoa.</div>'));
      sd.appendChild(cx3);
    };
    pintaDocs(); c.appendChild(sd);

    /* ================= PLANEJAMENTO (abre pelo tipo da viagem) ================= */
    const sp = el('<div class="secao"><h4>Tipo da viagem</h4></div>');
    const pintaPlano = () => {
      const velho = sp.querySelector('.plano'); if (velho) velho.remove();
      const cx4 = el('<div class="plano"></div>');

      // o seletor que decide se abre o planejamento
      const chips = el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px"></div>');
      CFG('tiposViagem').forEach(tp => {
        const on = (v.tipo || 'Trabalho') === tp;
        const b = el(`<button type="button" class="chip" style="cursor:pointer;border:1px solid ${on ? 'var(--verde)' : 'var(--linha)'};
          background:${on ? 'var(--verde-cl)' : 'var(--bg)'};color:${on ? 'var(--verde)' : 'var(--suave)'};padding:6px 12px;font-size:13px">
          ${on ? '✓ ' : ''}${esc(tp)}</button>`);
        b.onclick = () => { v.tipo = tp; if (tp !== 'Trabalho') v.planejar = true; salvar(); pintaPlano() };
        chips.appendChild(b);
      });
      cx4.appendChild(chips);

      const li = el(`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;padding:6px 0">
        <input type="checkbox" ${v.planejar ? 'checked' : ''} style="accent-color:var(--verde);width:16px;height:16px">
        🗺️ Planejar dia a dia — roteiro, lugares e carro alugado</label>`);
      li.querySelector('input').onchange = e => { v.planejar = e.target.checked; salvar(); pintaPlano() };
      cx4.appendChild(li);

      if (!v.planejar) {
        cx4.appendChild(el('<div style="font-size:12.5px;color:var(--suave)">Marque acima quando quiser montar o roteiro — é o que faz sentido em viagem de família.</div>'));
        sp.appendChild(cx4); return;
      }

      /* ---- roteiro dia a dia ---- */
      v.roteiro = v.roteiro || [];
      const nDias = +diasEntre(v.ida, v.volta) || 0;
      const rt = el('<div style="margin-top:14px"></div>');
      rt.appendChild(el('<h4 style="margin:0 0 8px">🗓️ Roteiro dia a dia</h4>'));
      if (!v.roteiro.length) {
        rt.appendChild(el(`<div style="font-size:12.5px;color:var(--suave);margin-bottom:9px">
          A viagem tem <b>${nDias} dia(s)</b>. Crie os dias e preencha o que quiser fazer em cada um.</div>`));
        const bg = el(`<button class="btn">📅 Criar os ${nDias} dias</button>`);
        bg.onclick = () => {
          const d0 = new Date(v.ida + 'T12:00');
          for (let i = 0; i < nDias; i++) {
            const d = new Date(d0); d.setDate(d.getDate() + i);

function exportarIcs(){
  const z=n=>String(n).padStart(2,'0');
  const dt=(d,h)=>d.replace(/-/g,'')+(h?'T'+h.replace(':','')+'00':'');
  const linhas=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Central do Leo//PT-BR','CALSCALE:GREGORIAN'];
  E.agenda.forEach(a=>{
    if(!a.data)return;
    linhas.push('BEGIN:VEVENT','UID:'+a.id+'@centralleo');
    if(a.hora){linhas.push('DTSTART:'+dt(a.data,a.hora));
      const [H,M]=a.hora.split(':').map(Number);linhas.push('DTEND:'+dt(a.data,z((H+1)%24)+':'+z(M)))}
    else{linhas.push('DTSTART;VALUE=DATE:'+dt(a.data));linhas.push('DTEND;VALUE=DATE:'+dt(a.data))}
    linhas.push('SUMMARY:'+(a.titulo||'Compromisso').replace(/\n/g,' '));
    if(a.local)linhas.push('LOCATION:'+a.local.replace(/\n/g,' '));
    if(a.obs)linhas.push('DESCRIPTION:'+a.obs.replace(/\n/g,'\\n'));
    linhas.push('END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  baixar(new Blob([linhas.join('\r\n')],{type:'text/calendar'}),'agenda-leo-'+hoje()+'.ics');
}
async function importarIcs(file){
  const txt=(await file.text()).replace(/\r\n[ \t]/g,'');  // desdobra linhas longas
  const evs=txt.split('BEGIN:VEVENT').slice(1);let novos=0;
  evs.forEach(b=>{
    const pega=t=>{const m=b.match(new RegExp('^'+t+'[^:]*:(.*)$','mi'));return m?m[1].trim():''};
    const ini=pega('DTSTART');if(!ini)return;
    const d=ini.slice(0,8),data=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
    const hora=ini.length>9?ini.slice(9,11)+':'+ini.slice(11,13):'';
    const uid2=pega('UID'),titulo=pega('SUMMARY')||'(sem título)';
    if(E.agenda.some(a=>a.gid&&a.gid===uid2))return;                 // já importado
    if(E.agenda.some(a=>a.data===data&&a.titulo===titulo))return;    // duplicado óbvio
    E.agenda.push({id:uid(),gid:uid2,data,hora,titulo,local:pega('LOCATION'),
      tipo:'Pessoal',obs:pega('DESCRIPTION').replace(/\\n/g,'\n')});novos++;
  });
  salvar();tela();
  alert(novos?`${novos} compromisso(s) importado(s).`:'Nada novo — tudo já estava aqui.');
}

// quanto tempo a demanda levou (ou já está levando) — o número que mostra o que empaca
function diasDemanda(d){
  if(!d.criada) return {txt:'—'};
  const fim=d.status==='Concluída'?(d.concluidoEm||hoje()):hoje();
  const n=Math.max(0,Math.round((new Date(fim+'T12:00')-new Date(d.criada+'T12:00'))/864e5));
  if(d.status==='Concluída') return {txt:n+'d',cor:'var(--verde)'};
  return {txt:n+'d',cor:n>60?'var(--vermelho)':n>30?'var(--areia)':''};
}
