// Marcadores com alvo de longevidade (não só "normal do laboratório").
// [nome, unidade, faixa do laboratório, alvo ótimo, ruimSe]
// [nome, unidade, faixa do laboratório, alvo ótimo, fora da faixa do lab, fora do alvo ótimo]
// o 6º item é o que faz o "Atenção" existir: dentro do laudo, mas ainda longe do alvo.
const MARCADORES = [
  ['ApoB', 'mg/dL', '< 100', '< 80', v => v >= 100, v => v >= 80],
  ['LDL', 'mg/dL', '< 130', '< 100', v => v >= 130, v => v >= 100],
  ['HDL', 'mg/dL', '> 40', '> 50', v => v < 40, v => v < 50],
  ['Triglicérides', 'mg/dL', '< 150', '< 100', v => v >= 150, v => v >= 100],
  ['Lp(a)', 'mg/dL', '< 50', '< 30 (1x na vida)', v => v >= 50, v => v >= 30],
  ['Glicemia jejum', 'mg/dL', '70 a 99', '< 90', v => v >= 100, v => v >= 90],
  ['HbA1c', '%', '< 5,7', '< 5,4', v => v >= 5.7, v => v >= 5.4],
  ['Insulina', 'µU/mL', '2 a 25', '< 8', v => v > 10, v => v >= 8],
  ['PCR ultrassensível', 'mg/L', '< 3', '< 1', v => v >= 3, v => v >= 1],
  ['Testosterona total', 'ng/dL', '250 a 950', '> 500', v => v < 350, v => v < 500],
  ['Vitamina D', 'ng/mL', '30 a 100', '40 a 60', v => v < 30, v => v < 40 || v > 60],
  ['TSH', 'µUI/mL', '0,4 a 4,0', '1,0 a 2,5', v => v > 4 || v < 0.4, v => v > 2.5 || v < 1],
  ['PSA', 'ng/mL', '< 4', '< 2,5', v => v >= 4, v => v >= 2.5],
  ['Creatinina', 'mg/dL', '0,7 a 1,3', 'até 1,1', v => v > 1.3, v => v > 1.1],
  ['Ácido úrico', 'mg/dL', '3,5 a 7,2', '< 6', v => v > 7.2, v => v >= 6],
  ['Ferritina', 'ng/mL', '30 a 400', '50 a 150', v => v > 400 || v < 30, v => v < 50 || v > 150],
];
// Rastreios recomendados por idade (homem). [nome, idadeInicio, cadaXMeses, porquê]
// [nome, idade que começa, a cada N meses, para quê, onde procurar se já foi feito]
// o 5º item evita o rastreio ficar "nunca feito" para sempre: 'marcadores' olha os exames
// de sangue equivalentes e 'vitais' olha a tabela de sinais vitais.
const RASTREIOS = [
  ['Check-up com clínico / sangue completo', 30, 12, 'base de tudo',
    { marcadores: ['ApoB', 'LDL', 'HDL', 'Triglicérides', 'Glicemia jejum', 'HbA1c', 'Creatinina', 'Hemograma'] }],
  ['Dentista (limpeza)', 18, 6, 'gengiva ruim aumenta risco no coração', {}],
  ['Dermatologista (pele)', 30, 12, 'câncer de pele pega cedo e cura', {}],
  ['Pressão arterial', 25, 6, 'hipertensão não dá sintoma', { vitais: 'sis' }],
  ['Oftalmologista', 30, 24, 'visão e pressão ocular', {}],
  ['Escore de cálcio coronariano', 40, 60, 'mostra placa no coração antes do infarto', {}],
  ['Teste ergométrico / esforço', 40, 24, 'como o coração responde no esforço', {}],
  ['PSA + urologista', 45, 12, 'próstata', { marcadores: ['PSA'] }],
  ['Colonoscopia', 45, 120, 'câncer de intestino é curável quando pego cedo', {}],
  ['Ultrassom de abdome', 40, 24, 'fígado, rins, vesícula', {}],
];
const idadeDe = n => {
  if (!n) return null;
  const d = new Date(n + 'T12:00'), h = new Date();
  let i = h.getFullYear() - d.getFullYear();
  if (h < new Date(h.getFullYear(), d.getMonth(), d.getDate())) i--;
  return i;
};
const idadeLeo = () => idadeDe((E.perfil || {}).nascimento);
// último exame de um marcador
const ultimoDe = (nome) => E.exames.filter(x => x.exame === nome && x.valor !== '' && x.valor != null)
  .sort((a, b) => (b.data || '').localeCompare(a.data || ''))[0];
// semáforo de um exame: 'ok' | 'atencao' | 'ruim' | ''
function semaforo(x) {
  const m = MARCADORES.find(y => y[0] === x.exame);
  const v = parseFloat(String(x.valor).replace(',', '.'));
  if (!m || isNaN(v)) return x.resultado === 'Alterado' ? 'ruim' : x.resultado === 'Atenção' ? 'atencao' : x.resultado === 'Normal' ? 'ok' : '';
  if (m[4](v)) return 'ruim';          // fora até do laudo do laboratório
  if (m[5] && m[5](v)) return 'atencao'; // o laudo diz normal, mas ainda não é o alvo
  return 'ok';
}
// "Alterado" = fora até do laudo, procurar médico. "Fora do alvo" = o laudo diz normal, mas dá para melhorar.
const CHIP_SEM = { ok: ['var(--verde-cl)', 'var(--verde)', 'No alvo'], atencao: ['var(--areia-cl)', 'var(--areia)', 'Fora do alvo'], ruim: ['var(--vermelho-cl)', 'var(--vermelho)', 'Alterado'] };

function vSaude(m) {
  const r = rr('saude');
  const ord = [...E.peso].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  const ult = ord[ord.length - 1], pri = ord[0];
  const dif = (ult && pri) ? (+ult.peso - +pri.peso) : 0;
  const imc = (ult && ult.altura) ? (+ult.peso / Math.pow(+ult.altura, 2)) : 0;
  const cintAlt = (ult && ult.altura && ult.cintura) ? (+ult.cintura / (+ult.altura * 100)) : 0;
  const emTrat = E.tratamentos.filter(t => t.status !== 'Encerrado').length;
  const vit = [...E.vitais].sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  const uv = vit[vit.length - 1];
  const idade = idadeLeo();

  m.appendChild(cab('Saúde', 'Seu painel físico — peso, sinais vitais, exames com alvo e rastreios.'));
  m.appendChild(painel(
    acao('+ Pesagem', () => { E.peso.push({ id: uid(), data: hoje(), peso: '', altura: ult?.altura || '', cintura: '', gordura: '', obs: '' }); salvar(); r() }),
    acao('+ Sinais vitais', () => { E.vitais.push({ id: uid(), data: hoje(), sis: '', dia: '', fc: '', glicemia: '', sono: '', passos: '', estresse: '', obs: '' }); salvar(); r() }, 'ghost'),
    acao('+ Exame', () => { const x = { id: uid(), data: hoje(), exame: '', valor: '', medico: '', resultado: '', proximo: '', obs: '' }; E.exames.push(x); salvar(); modalExame(x) }, 'ghost'),
    acao('+ Tratamento', () => { E.tratamentos.push({ id: uid(), oque: '', motivo: '', inicio: hoje(), fim: '', frequencia: '', medico: '', status: 'Em andamento' }); salvar(); r() }, 'ghost'),
    acao('+ Vacina', () => { E.vacinas.push({ id: uid(), vacina: '', data: hoje(), proxima: '', viagem: 'Não', obs: '' }); salvar(); r() }, 'ghost'),
    acao('🆘 Ficha de emergência', () => modalSOS(), 'ghost'), '|'));

  /* ---- alertas de rastreio ---- */
  const pend = rastreiosPendentes();
  if (pend.length) m.appendChild(el(`<div class="aviso">🩺 <b>${pend.length} exame(s) para fazer:</b>
    ${pend.slice(0, 4).map(p => esc(p.nome) + (p.venceEm != null ? ` <span style="opacity:.7">(${p.venceEm < 0 ? 'atrasado' : 'em ' + p.venceEm + ' dias'})</span>` : ' <span style="opacity:.7">(nunca feito)</span>')).join(' · ')}
    ${pend.length > 4 ? ` e mais ${pend.length - 4}` : ''}</div>`));
  if (!idade) m.appendChild(el(`<div class="aviso">📅 Informe sua <b>data de nascimento</b> em ⚙️ Configurações para eu calcular os rastreios certos para a sua idade.</div>`));

  /* ---- 1. exames: um por marcador, com a evolução dentro ---- */
  const cx = el('<div></div>');
  const rol = el('<div class="rolagem"></div>');
  // agrupa as medições por marcador; a linha mostra a última e para onde está indo
  const porMarcador = {};
  E.exames.forEach(x => {
    const k = (x.exame || '').trim(); if (!k) return;
    (porMarcador[k] = porMarcador[k] || []).push(x);
  });
  const grupos = Object.entries(porMarcador).map(([nome, itens]) => {
    itens.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    const ult = itens[itens.length - 1], ant = itens[itens.length - 2];
    const nUlt = parseFloat(String(ult.valor).replace(',', '.'));
    const nAnt = ant ? parseFloat(String(ant.valor).replace(',', '.')) : NaN;
    let tend = null;
    if (!isNaN(nUlt) && !isNaN(nAnt) && nAnt !== 0) {
      const dif = nUlt - nAnt, pct = dif / Math.abs(nAnt) * 100;
      // "melhor" depende do marcador: sair do alvo é pior, entrar é melhor
      const semU = semaforo(ult), semA = semaforo(ant);
      const ordem = { ruim: 0, atencao: 1, ok: 2, '': 1 };
      const rumo = ordem[semU] - ordem[semA];
      tend = { dif, pct, rumo, seta: Math.abs(pct) < 2 ? '→' : dif > 0 ? '↑' : '↓' };
    }
    return { nome, itens, ult, sem: semaforo(ult), tend, mk: MARCADORES.find(y => y[0] === nome) };
  }).sort((a, b) => {
    const ord = { ruim: 0, atencao: 1, ok: 2, '': 3 };
    return (ord[a.sem] ?? 3) - (ord[b.sem] ?? 3) || a.nome.localeCompare(b.nome);
  });

  if (grupos.length) {
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Marcador</th><th style="text-align:right">Último</th><th>Alvo ótimo</th>' +
      '<th>Situação</th><th>Evolução</th><th style="text-align:right">Medições</th><th>Última coleta</th></tr></thead>';
    const tb = document.createElement('tbody');
    grupos.forEach(g => {
      const c = CHIP_SEM[g.sem];
      const tr = document.createElement('tr'); tr.style.cursor = 'pointer';
      if (g.sem === 'ruim') tr.style.boxShadow = 'inset 3px 0 0 var(--vermelho)';
      else if (g.sem === 'atencao') tr.style.boxShadow = 'inset 3px 0 0 var(--areia)';
      else if (g.sem === 'ok') tr.style.boxShadow = 'inset 3px 0 0 var(--verde)';
      const td = g.tend;
      const corT = !td ? 'var(--suave)' : td.rumo > 0 ? 'var(--verde)' : td.rumo < 0 ? 'var(--vermelho)' : 'var(--suave)';
      tr.innerHTML = `<td style="padding:10px"><b style="font-size:14px">${esc(g.nome)}</b></td>
        <td style="padding:10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px">${
          g.ult.valor !== '' && g.ult.valor != null ? esc(g.ult.valor) + (g.mk ? ' <span style="font-weight:400;font-size:11.5px;color:var(--suave)">' + esc(g.mk[1]) + '</span>' : '') : '—'}</td>
        <td style="padding:10px;color:var(--suave);font-size:12.5px">${g.mk ? esc(g.mk[3]) : '—'}</td>
        <td style="padding:10px">${c ? `<span class="chip" style="background:${c[0]};color:${c[1]}">${c[2]}</span>` : '—'}</td>
        <td style="padding:10px;color:${corT};font-size:12.5px;font-variant-numeric:tabular-nums">${
          td ? td.seta + ' ' + (td.pct > 0 ? '+' : '') + td.pct.toFixed(0) + '%' : '<span style="color:var(--suave)">1ª medição</span>'}</td>
        <td style="padding:10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${g.itens.length}</td>
        <td style="padding:10px;white-space:nowrap;color:var(--suave);font-size:12.5px">${fmtDataAno(g.ult.data)}</td>`;
      tr.onclick = () => modalMarcador(g.nome);
      tb.appendChild(tr);
    });
    t.appendChild(tb); rol.appendChild(t);
  } else rol.innerHTML = '<div class="vazio">Nenhum exame ainda — clique em <b>+ Novo exame</b>.</div>';
  cx.appendChild(rol);
  const pe = el('<div style="padding:0 17px 15px"></div>');
  const bt = el('<button class="mais">+ Novo exame</button>');
  bt.onclick = () => { const x = { id: uid(), data: hoje(), exame: '', valor: '', medico: '', resultado: '', proximo: '', obs: '' }; E.exames.push(x); salvar(); modalExame(x) };
  pe.appendChild(bt); cx.appendChild(pe);
  m.appendChild(bloco('sa-ex', 'Exames e marcadores', 'um por marcador — clique para ver a evolução e anexar o laudo', cx));

  /* ---- 2. rastreios por idade ---- */
  const rc = el('<div class="rolagem"></div>');
  const listaR = rastreiosPendentes(true);
  if (idade) {
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>Rastreio</th><th>A cada</th><th>Última vez</th><th>Situação</th><th>Para quê</th></tr></thead>';
    const tb = document.createElement('tbody');
    listaR.forEach(x => {
      const tr = document.createElement('tr');
      if (x.situacao === 'Atrasado' || x.situacao === 'Nunca feito') tr.style.boxShadow = 'inset 3px 0 0 var(--vermelho)';
      else if (x.situacao === 'Em dia') tr.style.boxShadow = 'inset 3px 0 0 var(--verde)';
      tr.innerHTML = `<td style="padding:9px 10px"><b>${esc(x.nome)}</b></td>
        <td style="padding:9px 10px;color:var(--suave)">${x.cada >= 12 ? (x.cada / 12) + ' ano(s)' : x.cada + ' meses'}</td>
        <td style="padding:9px 10px;white-space:nowrap">${x.ultima ? fmtData(x.ultima) : '—'}</td>
        <td style="padding:9px 10px">${chip(x.situacao === 'Em dia' ? 'Em dia' : x.situacao === 'Nunca feito' ? 'Vencido' : x.situacao === 'Atrasado' ? 'Vencido' : 'Vencendo')}</td>
        <td style="padding:9px 10px;color:var(--suave);font-size:12.5px">${esc(x.porque)}</td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb); rc.appendChild(t);
  } else rc.innerHTML = '<div class="vazio">Informe sua data de nascimento em ⚙️ Configurações.</div>';
  m.appendChild(bloco('sa-rast', 'Rastreios para a sua idade' + (idade ? ` (${idade} anos)` : ''), 'o que um médico lembraria de pedir', rc));

  /* ---- 3. sinais vitais ---- */
  // só o que vira número em algum lugar: pressão (KPI + rastreio) e batimento de repouso (KPI).
  // glicemia fica em Exames; sono/passos/estresse saíram — pediam registro diário e não eram lidos.
  m.appendChild(tabelaBloco('sa-vit', 'Sinais vitais', 'pressão e batimento em repouso — medir sentado, depois de 5 min parado', E.vitais, [
    { k: 'data', t: 'Data', tipo: 'date' },
    { k: 'sis', t: 'Pressão alta', tipo: 'number', num: 1, w: 110 },
    { k: 'dia', t: 'Pressão baixa', tipo: 'number', num: 1, w: 115 },
    { k: 'fc', t: 'Batimentos', tipo: 'number', num: 1, w: 105 },
    { k: 'obs', t: 'Observação', ph: '—' },
  ], () => ({ data: hoje(), sis: '', dia: '', fc: '', obs: '' }), r));

  /* ---- 4. peso e medidas ---- */
  m.appendChild(tabelaBloco('sa-peso', 'Peso e medidas', 'cintura ÷ altura acima de 0,5 já é sinal de alerta', E.peso, [
    { k: 'data', t: 'Data', tipo: 'date' }, { k: 'peso', t: 'Peso (kg)', tipo: 'number', num: 1, w: 110 },
    { k: 'altura', t: 'Altura (m)', tipo: 'number', num: 1, w: 110 }, { k: 'cintura', t: 'Cintura (cm)', tipo: 'number', num: 1, w: 120 },
    { k: 'obs', t: 'Como me senti', ph: '—' },
  ], () => ({ data: hoje(), peso: '', altura: ult?.altura || '', cintura: '', obs: '' }), r));

  /* ---- 5. tratamentos ---- */
  m.appendChild(tabelaBloco('sa-trat', 'Tratamentos e remédios', 'o que está em curso', E.tratamentos, [
    { k: 'oque', t: 'Tratamento / remédio', ph: 'ex.: Fisioterapia ombro' },
    { k: 'motivo', t: 'Para quê', ph: '—' },
    { k: 'inicio', t: 'Início', tipo: 'date' }, { k: 'fim', t: 'Até', tipo: 'date' },
    { k: 'frequencia', t: 'Frequência / dose', ph: 'ex.: 2x por semana' },
    { k: 'medico', t: 'Médico', ph: '—' },
    { k: 'status', t: 'Status', tipo: 'select', opcoes: ['Em andamento', 'Contínuo', 'Encerrado'] },
  ], () => ({ oque: '', motivo: '', inicio: hoje(), fim: '', frequencia: '', medico: '', status: 'Em andamento' }), r));

  /* ---- 6. vacinas ---- */
  m.appendChild(tabelaBloco('sa-vac', 'Vacinas', 'você viaja muito — reforço vencido barra embarque', E.vacinas, [
    { k: 'vacina', t: 'Vacina', ph: 'ex.: Febre amarela' },
    { k: 'data', t: 'Última dose', tipo: 'date' },
    { k: 'proxima', t: 'Próximo reforço', tipo: 'date' },
    { k: 'viagem', t: 'Exigida em viagem?', tipo: 'select', opcoes: ['Não', 'Sim'] },
    { k: 'obs', t: 'Observação', ph: '—' },
  ], () => ({ vacina: '', data: hoje(), proxima: '', viagem: 'Não', obs: '' }), r));

  /* ---- 7. histórico familiar ---- */
  m.appendChild(tabelaBloco('sa-fam', 'Histórico familiar', 'o dado que mais muda o seu risco — e que ninguém registra', E.histFamiliar, [
    { k: 'parente', t: 'Parente', tipo: 'select', opcoes: ['Pai', 'Mãe', 'Avô paterno', 'Avó paterna', 'Avô materno', 'Avó materna', 'Irmão', 'Irmã', 'Outro'] },
    { k: 'doenca', t: 'Doença', tipo: 'select', opcoes: CFG('doencasFamilia') },
    { k: 'idade', t: 'Com que idade', tipo: 'number', num: 1, w: 130 },
    { k: 'situacao', t: 'Situação', tipo: 'select', opcoes: ['Vivo', 'Faleceu'] },
    { k: 'obs', t: 'Observação', ph: '—' },
  ], () => ({ parente: 'Pai', doenca: CFG('doencasFamilia')[0], idade: '', situacao: 'Vivo', obs: '' }), r));

  /* ---- números e gráficos ---- */
  m.appendChild(el(`<div class="grade">
    ${kpi('Peso atual', ult ? ult.peso + ' kg' : '—', ult ? fmtData(ult.data) : 'sem registro')}
    ${kpi('Variação', (dif > 0 ? '+' : '') + dif.toFixed(1) + ' kg', 'desde o 1º registro', dif > 0 ? 'r' : 'v')}
    ${kpi('IMC', imc ? imc.toFixed(1) : '—', imc ? (imc < 18.5 ? 'abaixo' : imc < 25 ? 'saudável' : imc < 30 ? 'sobrepeso' : 'obesidade') : 'informe a altura')}
    ${kpi('Cintura ÷ altura', cintAlt ? cintAlt.toFixed(2) : '—', cintAlt ? (cintAlt < 0.5 ? 'dentro do ideal' : 'acima de 0,5 — atenção') : 'informe a cintura', cintAlt && cintAlt >= 0.5 ? 'r' : 'v')}
    ${kpi('Pressão', uv && uv.sis ? uv.sis + '/' + uv.dia : '—', uv && uv.sis ? fmtData(uv.data) : 'sem registro', uv && uv.sis >= 140 ? 'r' : uv && uv.sis >= 130 ? 'a' : uv && uv.sis ? 'v' : '')}
    ${kpi('Batimento em repouso', uv && uv.fc ? uv.fc + ' bpm' : '—',
      uv && uv.fc ? (uv.fc < 60 ? 'ótimo' : uv.fc <= 70 ? 'bom' : uv.fc <= 80 ? 'dá para melhorar' : 'alto — mais aeróbico') : 'sem registro',
      uv && uv.fc ? (uv.fc <= 70 ? 'v' : uv.fc <= 80 ? 'a' : 'r') : '')}
    ${kpi('Rastreios pendentes', pend.length, pend.length ? 'precisam de agendamento' : 'tudo em dia', pend.length ? 'a' : 'v')}
    ${kpi('Tratamentos', emTrat, 'em andamento')}
    ${kpi('Marcadores alterados', grupos.filter(g => g.sem === 'ruim').length, 'fora do laudo — ver médico', grupos.filter(g => g.sem === 'ruim').length ? 'r' : 'v')}
    ${kpi('Fora do alvo ótimo', grupos.filter(g => g.sem === 'atencao').length, 'laudo normal, dá para melhorar', grupos.filter(g => g.sem === 'atencao').length ? 'a' : 'v')}
    ${kpi('Marcadores acompanhados', grupos.length, E.exames.length + ' medições no histórico')}</div>`));

  m.appendChild(bloco('sa-dash', 'Evolução do peso', '', graficoEl(gLinha(
    ord.filter(p => p.peso).map(p => ({ r: fmtData(p.data), v: +p.peso })), { fmt: v => v.toFixed(1) + 'kg' }))));
  if (vit.filter(v => v.sis).length > 1) m.appendChild(bloco('sa-pa', 'Pressão arterial (máxima)', 'acima de 140 é sinal de alerta', graficoEl(gLinha(
    vit.filter(v => v.sis).map(v => ({ r: fmtData(v.data), v: +v.sis })), { fmt: v => v.toFixed(0) }))));
}

// rastreios: cruza a idade com o histórico de exames
function rastreiosPendentes(todos) {
  const idade = idadeLeo();
  if (!idade) return [];
  const h = hoje();
  const out = [];
  RASTREIOS.forEach(([nome, idadeIni, cada, porque, fonte]) => {
    if (idade < idadeIni) return;
    const alvo = [nome, ...((fonte && fonte.marcadores) || [])].map(normaliza);
    // o exame cadastrado vale se for o próprio rastreio ou um marcador equivalente
    const datas = E.exames.filter(x => alvo.includes(normaliza(x.exame || ''))).map(x => x.data);
    // pressão arterial é medida em Sinais vitais, não em Exames
    if (fonte && fonte.vitais)
      (E.vitais || []).forEach(x => { if (String(x[fonte.vitais] ?? '').trim() !== '') datas.push(x.data) });
    const ultima = datas.filter(Boolean).sort().pop() || null;
    let situacao = 'Nunca feito', venceEm = null;
    if (ultima) {
      const prox = new Date(ultima + 'T12:00'); prox.setMonth(prox.getMonth() + cada);
      venceEm = Math.round((prox - new Date(h + 'T12:00')) / 864e5);
      situacao = venceEm < 0 ? 'Atrasado' : venceEm < 60 ? 'Chegando' : 'Em dia';
    }
    const item = { nome, cada, ultima, situacao, venceEm, porque };
    if (todos || situacao === 'Nunca feito' || situacao === 'Atrasado' || situacao === 'Chegando') out.push(item);
  });
  return todos ? out : out.sort((a, b) => (a.venceEm ?? -9999) - (b.venceEm ?? -9999));
}

// histórico de um marcador: gráfico, todas as medições e o caminho até o alvo
function modalMarcador(nome) {
  const mk = MARCADORES.find(y => y[0] === nome);
  const itens = E.exames.filter(x => (x.exame || '').trim() === nome)
    .sort((a, b) => (a.data || '').localeCompare(b.data || ''));

/* ===================== RENDIMENTOS ===================== */
function vRendimentos(m){
  const r=rr('rendimentos');const H=E.rendHist;
  if(!H.anos||!H.anos.length){
    m.appendChild(cab('Rendimentos','Quanto você ganha — por mês, por empresa e no acumulado.'));
    m.appendChild(el(`<div class="aviso">☁ Seus dados ainda não chegaram neste aparelho — clique em <b>Sincronizar</b> no menu lateral.</div>`));
    return;
  }
  const parciais=H.parciais||H.incompletos||[];
  // o ano acompanha o calendário sozinho; o seletor permite olhar outro ano ou somar todos
  if(filtro.rendAno==null) filtro.rendAno=anoHoje;
  const todos=filtro.rendAno==='todos';
  const ano=todos?anoHoje:+filtro.rendAno;
  const iAno=H.anos.indexOf(ano);
  // anos do histórico + anos com lançamento + o ano vigente, sempre
  const anosR=[...new Set([...H.anos,...E.rendimentos.map(x=>+(x.data||'').slice(0,4)).filter(Boolean),anoHoje])]
    .filter(Boolean).sort((a,b)=>a-b);
  const empresasR=[...new Set(E.rendimentos.filter(x=>(x.data||'').startsWith(ano)).map(x=>x.empresa).filter(Boolean))].sort();
  const empSel=filtro.rendEmp||'Todas';
  const doAnoTudo=E.rendimentos.filter(x=>(x.data||'').startsWith(ano));
  const doAno=empSel==='Todas'?doAnoTudo:doAnoTudo.filter(x=>x.empresa===empSel);
  const totLanc=doAno.reduce((s,x)=>s+(+x.valor||0),0);
  const porMes=MESES.map((_,i)=>doAno.filter(x=>+((x.data||'').slice(5,7))===i+1).reduce((s,x)=>s+(+x.valor||0),0));
  const mesN=new Date().getMonth();

  m.appendChild(cab('Rendimentos','De onde vem o seu dinheiro — e o que mais deu lucro.'));
  m.appendChild(painel('Ano',
    seletor(filtro.rendAno,[...anosR.map(a=>[a,String(a)]),['todos','Todos os anos']],
      v=>{filtro.rendAno=(v==='todos'?'todos':+v);filtro.rendEmp='Todas';filtro.rendAnoSel=-1;r()}),
    seletor(empSel,[['Todas','Todas as empresas ('+doAnoTudo.length+')'],
      ...empresasR.map(e=>[e,e+' ('+doAnoTudo.filter(x=>x.empresa===e).length+')'])],
      v=>{filtro.rendEmp=v;r()}),
    seletor(filtro.rendVisao,[['Anual','Visão anual'],['Mensal','Visão mensal']],
      v=>{filtro.rendVisao=v;r()}),
    acao('⬇ Excel',baixarRendimentosExcel,'ghost'),
    acao('🖨 PDF',baixarRendimentosPDF,'ghost'),'|'));

  // na visão mensal, os agregados do ano saem de cena; o mês a mês assume
  const vAnual = filtro.rendVisao !== 'Mensal';
  const mA = { appendChild: x => { if (vAnual) m.appendChild(x) } };

  /* ---- números do recorte escolhido ---- */
  const totalSel=todos?H.totalGeral:(H.totalAno[iAno]||0);
  const ehParcial=!todos&&parciais.includes(ano);
  const mesesDecorridos=ehParcial?6:(ano===anoHoje?mesN+1:12);
  // fontes: empresa (sempre) e negócio (quando há detalhe)
  const fontesEmp=Object.entries(H.empresas)
    .map(([n,v])=>({r:n,v:todos?v.reduce((a,b)=>a+b,0):(v[iAno]||0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maior=fontesEmp[0];
  const conc=maior&&totalSel?maior.v/totalSel*100:0;
  // crescimento contra o ano anterior (só faz sentido em ano específico)
  const cresc=(!todos&&iAno>0&&H.totalAno[iAno-1])?((H.totalAno[iAno]/H.totalAno[iAno-1])-1)*100:null;

  m.appendChild(el(`<div class="grade">
    ${kpi(todos?'Total 2020–2026':'Ganho em '+ano,brl(totalSel),
      todos?'tudo somado':(ehParcial?'jan–jun (parcial)':'no ano inteiro'),'v')}
    ${kpi('Média por mês',brl(totalSel/(todos?H.anos.length*12:mesesDecorridos)),
      todos?'nos 7 anos':mesesDecorridos+' meses',null)}
    ${kpi('Maior fonte',maior?maior.r:'—',maior?brl(maior.v)+' · '+conc.toFixed(0)+'% do total':'','a')}
    ${cresc==null?kpi('Média anual',brl(H.mediaAnual),'anos completos')
      :kpi('Contra '+(ano-1),(cresc>=0?'+':'')+cresc.toFixed(0)+'%',
        brl(Math.abs(H.totalAno[iAno]-H.totalAno[iAno-1]))+(cresc>=0?' a mais':' a menos'),cresc>=0?'v':'r')}</div>`));

  if(ehParcial) m.appendChild(el(`<div class="aviso">📌 <b>${ano} é ano parcial</b> — jan a jun lançados
    (${brl(totalSel)}). No ritmo atual, o ano fecharia perto de <b>${brl(totalSel/6*12)}</b>.</div>`));
  // parte do ano que ainda não sabemos de qual empresa veio
  const naoIdent=todos
    ? (H.empresas['A identificar']||[]).reduce((a,b)=>a+b,0)
    : (H.empresas['A identificar']?.[iAno]||0);
  if(naoIdent>0) m.appendChild(el(`<div class="aviso">🔍 <b>${brl(naoIdent)} ainda sem empresa definida</b>${todos?'':' em '+ano}.
    O total bate com o seu print de Lucros, mas os lançamentos que eu tenho não explicam essa parte —
    falta saber de qual empresa ela veio. Me diga e eu classifico.</div>`));

  /* ---- O QUE MAIS DEU LUCRO — agrupado por empresa ---- */
  const det=(H.detalhe||{})[ano];
  // monta: empresa -> itens (quando há detalhe do ano) ou só o total da empresa
  // quando é "Todos os anos", soma o detalhe de cada negócio ao longo dos anos
  const detFonte=(emp)=>{
    if(!todos) return (det&&det[emp])?det[emp]:null;
    const acc={};
    (H.anos||[]).forEach(a=>{const dd=(H.detalhe||{})[a]||(H.detalhe||{})[String(a)];
      if(dd&&dd[emp]) dd[emp].forEach(([nome,v,tipo])=>{
        const k=nome; if(!acc[k])acc[k]=[0,tipo]; acc[k][0]+=v;});});
    const arr=Object.entries(acc).map(([nome,[v,tipo]])=>[nome,v,tipo]);
    return arr.length?arr:null;
  };
  const grupos=fontesEmp.map(e=>{
    const raw=detFonte(e.r);
    const itens=raw?raw.map(([nome,v,tipo])=>({nome,v,tipo})).sort((x,y)=>y.v-x.v):[];
    return {empresa:e.r, total:e.v, itens};
  });
  const temDetalhe=grupos.some(g=>g.itens.length);
  const lc=el('<div></div>');
  lc.appendChild(el(`<div class="grafico">${gBarras(
    fontesEmp.map(e=>({r:e.r,v:e.v})),{fmt:brl})}</div>`));

  const tl=el('<div class="rolagem"></div>');
  const tg=document.createElement('table');
  tg.innerHTML='<thead><tr><th>#</th><th>Empresa / de onde veio</th><th>Tipo</th>'+
    '<th style="text-align:right">Valor</th><th style="text-align:right">% do total</th></tr></thead>';
  const tbg=document.createElement('tbody');
  grupos.forEach((g,i)=>{
    const cor=PALETA[i%PALETA.length];
    // linha da empresa (destacada, clicável quando tem detalhe)
    const tre=document.createElement('tr');
    tre.style.background='var(--bg)';
    tre.style.boxShadow='inset 3px 0 0 '+cor;
    if(g.itens.length) tre.style.cursor='pointer';

/* ============================================================
   Excel de verdade (.xlsx) sem biblioteca nenhuma.
   Um .xlsx é um ZIP com XMLs dentro. Como os arquivos são pequenos,
   gravamos sem compressão (método "store"), que dispensa deflate.
   ============================================================ */
const TAB_CRC = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0 }
  return t;
})();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TAB_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0 };

function zipStore(arquivos) {
  const enc = new TextEncoder();
  const partes = [], central = [];
  let desloc = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  arquivos.forEach(({ nome, texto, bytes }) => {
    const dados = bytes || enc.encode(texto), nomeB = enc.encode(nome), crc = crc32(dados);
    const cab = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nomeB.length), ...u16(0)];
    partes.push(new Uint8Array(cab), nomeB, dados);
    central.push([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nomeB.length),
      ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(desloc)], nomeB);
    desloc += cab.length + nomeB.length + dados.length;
  });
  const cd = [];
  for (let i = 0; i < central.length; i += 2) { cd.push(new Uint8Array(central[i]), central[i + 1]) }
  const tamCD = cd.reduce((s, p) => s + p.length, 0);
  const fim = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(arquivos.length), ...u16(arquivos.length), ...u32(tamCD), ...u32(desloc), ...u16(0)]);
  return new Blob([...partes, ...cd, fim], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));

/* abas = [{nome, linhas:[[cel,...],...]}]  — célula: número, string, ou {v, s} com estilo
   estilos: 1 = negrito, 2 = R$, 3 = negrito + R$, 4 = data, 5 = título */
function gerarXlsx(abas) {
  const col = i => { let s = '', n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = ((n - r) / 26) | 0 } return s };
  const folhas = abas.map((ab, iA) => {
    const linhas = ab.linhas.map((ln, iL) => {
      const cels = ln.map((c, iC) => {
        if (c == null || c === '') return '';
        const est = (typeof c === 'object' && c.s) ? ` s="${c.s}"` : '';
        const v = (typeof c === 'object') ? c.v : c;
        const ref = col(iC) + (iL + 1);
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${est}><v>${v}</v></c>`;
        return `<c r="${ref}"${est} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${iL + 1}">${cels}</row>`;
    }).join('');
    const larg = (ab.larguras || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
    return {
      nome: `xl/worksheets/sheet${iA + 1}.xml`,
      texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${larg ? `<cols>${larg}</cols>` : ''}<sheetData>${linhas}</sheetData></worksheet>`
    };
  });

  const estilos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;R$&quot;\\ #,##0.00"/></numFmts>
<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEAE0"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="164" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/>
<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  const arquivos = [
    {
      nome: '[Content_Types].xml', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${abas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`
    },
    {
      nome: '_rels/.rels', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
    },
    {
      nome: 'xl/workbook.xml', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${abas.map((a, i) => `<sheet name="${xmlEsc(a.nome).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
    },
    {
      nome: 'xl/_rels/workbook.xml.rels', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${abas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`
    },
    { nome: 'xl/styles.xml', texto: estilos },
    ...folhas,
  ];
  return zipStore(arquivos);
}

function baixarBlob(blob, nome) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove() }, 1500);
}

/* ---- Rendimentos: baixar em Excel (.xlsx) e em PDF ---- */
function dadosRendimentos() {
  const H = E.rendHist, anos = H.anos || [];
  const emp = Object.entries(H.empresas || {})
    .map(([nome, vals]) => ({ nome, vals, tot: vals.reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.tot - a.tot);
  const totalGeral = (H.totalAno || []).reduce((a, b) => a + b, 0);
  return { H, anos, emp, totalGeral };
}

function baixarRendimentosExcel() {
  const { H, anos, emp, totalGeral } = dadosRendimentos();
  const N = 1, M = 2, NM = 3;   // estilos: negrito, moeda, negrito+moeda

  /* 1. Resumo por ano */
  const a1 = [
    [{ v: 'Rendimentos — resumo por ano', s: 5 }],
    [],
    [{ v: 'Ano', s: N }, { v: 'Total do ano', s: N }, { v: 'Variação', s: N }, { v: 'Acumulado', s: N }],
  ];
  let acum = 0;
  anos.forEach((a, i) => {
    const v = H.totalAno[i] || 0, ant = i ? H.totalAno[i - 1] || 0 : 0;
    acum += v;
    a1.push([a, { v, s: M }, i && ant ? { v: (v - ant) / ant, s: 6 } : '', { v: acum, s: M }]);
  });
  a1.push([{ v: 'TOTAL', s: N }, { v: totalGeral, s: NM }, '', '']);
  a1.push([]);
  a1.push(['Média por ano', { v: anos.length ? totalGeral / anos.length : 0, s: M }]);

  /* 2. Por empresa */
  const a2 = [
    [{ v: 'Rendimentos por empresa', s: 5 }], [],
    [{ v: 'Empresa', s: N }, ...anos.map(a => ({ v: a, s: N })), { v: 'Total', s: N }, { v: '% do total', s: N }],
  ];
  emp.forEach(e => a2.push([e.nome, ...e.vals.map(v => ({ v, s: M })), { v: e.tot, s: NM },
    { v: totalGeral ? e.tot / totalGeral : 0, s: 6 }]));
  a2.push([{ v: 'TOTAL', s: N }, ...anos.map((_, i) => ({ v: H.totalAno[i] || 0, s: NM })),
    { v: totalGeral, s: NM }, { v: 1, s: 6 }]);

  /* 3. Detalhe por negócio */
  const a3 = [[{ v: 'Detalhe por negócio', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Empresa', s: N }, { v: 'De onde veio', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }]];
  Object.entries(H.detalhe || {}).sort().forEach(([ano, empresas]) => {
    Object.entries(empresas).forEach(([nomeEmp, itens]) => {
      (itens || []).forEach(([nome, val, tipo]) =>
        a3.push([+ano, nomeEmp, nome, tipo === 'p' ? 'Pontual' : 'Recorrente', { v: val, s: M }]));
    });
  });

  /* 4. Lançamentos */
  const a4 = [[{ v: 'Lançamentos', s: 5 }], [],
    [{ v: 'Data', s: N }, { v: 'Empresa', s: N }, { v: 'Instituição', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }, { v: 'Observação', s: N }]];
  [...E.rendimentos].sort((a, b) => (a.data || '').localeCompare(b.data || ''))
    .forEach(x => a4.push([fmtDataAno(x.data), x.empresa || '', x.instituicao || '', x.tipo || '', { v: +x.valor || 0, s: M }, x.obs || '']));
  if (E.rendimentos.length)
    a4.push([{ v: 'TOTAL', s: N }, '', '', '', { v: E.rendimentos.reduce((s, x) => s + (+x.valor || 0), 0), s: NM }, '']);

  /* 4b. Mês a mês — total do mês e, embaixo, os lançamentos daquele mês */
  const anosLanc = [...new Set(E.rendimentos.map(x => (x.data || '').slice(0, 4)).filter(Boolean))].sort();
  const aMes = [[{ v: 'Mês a mês', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Mês', s: N }, { v: 'Data', s: N }, { v: 'Empresa', s: N },
     { v: 'Instituição', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }]];
  anosLanc.forEach(a => {
    MESES.forEach((nomeMes, i) => {
      const doMes = E.rendimentos
        .filter(x => (x.data || '').startsWith(a) && +((x.data || '').slice(5, 7)) === i + 1)
        .sort((p, q) => (p.data || '').localeCompare(q.data || ''));
      if (!doMes.length) return;
      const tot = doMes.reduce((acc, x) => acc + (+x.valor || 0), 0);
      aMes.push([{ v: +a, s: N }, { v: nomeMes, s: N }, '', '', '', { v: 'total do mês', s: N }, { v: tot, s: NM }]);
      doMes.forEach(x => aMes.push(['', '', fmtDataAno(x.data), x.empresa || '', x.instituicao || '',
        x.tipo || '', { v: +x.valor || 0, s: M }]));
    });
  });

  /* 5. Aplicações por instituição */
  const a5 = [[{ v: 'Aplicações por instituição', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Instituição', s: N }, { v: 'Rendimento', s: N }]];
  Object.entries(H.aplicPorInst || {}).sort().forEach(([ano, insts]) =>
    Object.entries(insts).sort((a, b) => b[1] - a[1]).forEach(([i, v]) => a5.push([+ano, i, { v, s: M }])));

  const abas = [
    { nome: 'Resumo por ano', linhas: a1, larguras: [10, 16, 12, 16] },
    { nome: 'Por empresa', linhas: a2, larguras: [20, ...anos.map(() => 14), 16, 11] },
    { nome: 'Detalhe por negócio', linhas: a3, larguras: [8, 18, 34, 13, 15] },
    { nome: 'Lançamentos', linhas: a4, larguras: [12, 18, 18, 18, 14, 30] },
  ];
  if (aMes.length > 3) abas.splice(3, 0, { nome: 'Mês a mês', linhas: aMes, larguras: [8, 12, 12, 18, 18, 16, 15] });
  if (a5.length > 3) abas.push({ nome: 'Aplicações', linhas: a5, larguras: [8, 26, 15] });

  baixarBlob(gerarXlsx(abas), 'Rendimentos-Leo-' + hoje() + '.xlsx');
}

        <tbody>${linhas}<tr class="tot"><td colspan="3">TOTAL ${a}</td><td class="n">${brl2(totA)}</td></tr></tbody></table>`;
    }).filter(Boolean).join('');
    return blocos ? '<h2>Mês a mês</h2>' + blocos : '';
  })()}
  <div class="cab" style="margin-top:26px">Central do Léo — documento pessoal</div>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

/* ===================== PATRIMÔNIO ===================== */
function vPatrimonio(m){
  const r=rr('patrimonio');
  const bens=E.patrimonio;
  const valor=x=>+x.valor||0, devo=x=>+x.falta||0;
  const bruto=bens.reduce((s2,x)=>s2+valor(x),0);
  const divida=bens.reduce((s2,x)=>s2+devo(x),0);
  const liquido=bruto-divida;
  const novo=()=>{const x={id:uid(),tipo:CFG('tiposBem')[0],nome:'',onde:'',valor:0,falta:0,
    situacao:'Quitado',documento:'',obs:''};E.patrimonio.push(x);salvar();modalBem(x)};

  m.appendChild(cab('Patrimônio','O que é seu, quanto vale e quanto ainda deve. Clique para abrir e anexar escritura ou contrato.'));
  m.appendChild(painel('',acao('+ Novo bem',novo),'|'));

  m.appendChild(el(`<div class="grade">
    ${kpi('Patrimônio bruto',brl(bruto),bens.length+' bem(ns)','v')}
    ${kpi('Ainda devo',brl(divida),divida?'financiado ou a pagar':'tudo quitado',divida?'r':'v')}
    ${kpi('Patrimônio líquido',brl(liquido),'bruto menos dívida',liquido>=0?'v':'r')}</div>`));

  if(bens.some(x=>!valor(x))) m.appendChild(el(`<div class="aviso">💡 <b>${bens.filter(x=>!valor(x)).length} bem(ns) sem valor preenchido.</b>
    Sem isso o patrimônio líquido fica menor do que é de verdade — vale colocar um valor aproximado.</div>`));

  /* ---- lista clicável ---- */
  const cx=el('<div></div>');
  const rol=el('<div class="rolagem"></div>');
  const ord=[...bens].sort((a,b)=>valor(b)-valor(a));
  if(!ord.length) rol.innerHTML='<div class="vazio">Nenhum bem cadastrado ainda.</div>';
  else{
    const tb2=document.createElement('table');
    tb2.innerHTML='<thead><tr><th>Bem</th><th>Tipo</th><th>Onde</th><th style="text-align:right">Valor</th>'+
      '<th style="text-align:right">Devo</th><th style="text-align:right">Meu</th><th>Situação</th></tr></thead>';
    const tbo=document.createElement('tbody');
    ord.forEach(x=>{
      const meu=valor(x)-devo(x);
      const tr=document.createElement('tr');tr.style.cursor='pointer';
      if(devo(x)>0){tr.style.boxShadow='inset 3px 0 0 var(--areia)'}
      else if(valor(x)>0){tr.style.boxShadow='inset 3px 0 0 var(--verde)'}
      tr.innerHTML=`<td style="padding:10px"><b>${esc(x.nome||'(sem nome)')}</b></td>
        <td style="padding:10px;color:var(--suave)">${esc(x.tipo||'—')}</td>
        <td style="padding:10px;color:var(--suave);font-size:12.5px">${esc(x.onde||'—')}</td>
        <td style="padding:10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${valor(x)?brl(valor(x)):'—'}</td>
        <td style="padding:10px;text-align:right;font-variant-numeric:tabular-nums;color:${devo(x)?'var(--vermelho)':'var(--suave)'}">${devo(x)?brl(devo(x)):'—'}</td>
        <td style="padding:10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700">${valor(x)?brl(meu):'—'}</td>
        <td style="padding:10px">${chip(x.situacao||'Quitado')}</td>`;
      tr.onclick=()=>modalBem(x);
      tbo.appendChild(tr);
    });
    tb2.appendChild(tbo);
    const tf=document.createElement('tfoot');
    tf.innerHTML=`<tr class="tfim"><td colspan="3" style="padding:10px">TOTAL</td>
      <td style="text-align:right">${brl(bruto)}</td><td style="text-align:right">${brl(divida)}</td>
      <td style="text-align:right">${brl(liquido)}</td><td></td></tr>`;
    tb2.appendChild(tf); rol.appendChild(tb2);
  }
  cx.appendChild(rol);
  const pe=el('<div style="padding:0 17px 15px"></div>');
  const bt=el('<button class="mais">+ Novo bem</button>');bt.onclick=novo;pe.appendChild(bt);cx.appendChild(pe);
  m.appendChild(bloco('pt-lista','Meus bens','clique para abrir, anexar escritura e lançar o que falta pagar',cx));

  const porTipo={};bens.forEach(x=>porTipo[x.tipo||'Outro']=(porTipo[x.tipo||'Outro']||0)+valor(x));
  if(bruto>0) m.appendChild(bloco('pt-tipo','Onde está o patrimônio','',graficoEl(gRosca(
    Object.entries(porTipo).map(([r2,v])=>({r:r2,v})).filter(x=>x.v>0),{fmt:brl}))));
}

function modalBem(x){
  abrirModal(esc(x.nome||'Novo bem'),esc(x.tipo||''),(c,fechar)=>{
    const s1=el('<div class="secao"><h4>Dados</h4></div>');
    s1.appendChild(campos(x,[
      {k:'nome',t:'Bem',full:true,ph:'nome do bem'},
      {k:'tipo',t:'Tipo',tipo:'select',opcoes:CFG('tiposBem')},
      {k:'onde',t:'Onde fica',ph:'cidade / endereço'},
      {k:'valor',t:'Quanto vale hoje',tipo:'moeda'},
      {k:'falta',t:'Quanto ainda devo',tipo:'moeda'},
      {k:'situacao',t:'Situação',tipo:'select',opcoes:['Quitado','Financiado','Em pagamento','À venda','Vendido']},
      {k:'documento',t:'Documento / matrícula',ph:'nº da matrícula, cartório'},
      {k:'obs',t:'Observações',tipo:'textarea',full:true},
    ]));
    c.appendChild(s1);
    const meu=(+x.valor||0)-(+x.falta||0);
    if(+x.valor) c.appendChild(el(`<div style="padding:0 0 10px;font-size:12.5px;color:var(--suave)">
      Desse bem, <b>${brl(meu)}</b> é seu de fato${+x.falta?' — o resto ainda é dívida':''}.</div>`));
    const s2=el('<div class="secao"><h4>Escritura, contrato e comprovantes</h4></div>');
    s2.appendChild(areaArquivos('bem:'+x.id,'Escritura, matrícula, contrato, ITBI, boletos'));
    c.appendChild(s2);
    const s3=el('<div class="secao" style="display:flex;gap:9px"></div>');
    const del=el('<button class="btn ghost" style="color:var(--vermelho)">Apagar</button>');
    del.onclick=async()=>{if(!confirm('Apagar este bem e seus arquivos?'))return;
      for(const a of await arqPor('bem:'+x.id))await arqDel(a.id);
      E.patrimonio=E.patrimonio.filter(y=>y.id!==x.id);salvar();fechar()};
    s3.appendChild(del);s3.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s3.appendChild(ok);
    c.appendChild(s3);
  });
}

/* ===================== GASTOS ===================== */
/* ---- custo fixo: o que debita sozinho todo mês (cadastro, não lançamento) ---- */
const valorMensal=x=>x.ciclo==='Anual'?(+x.valor||0)/12:(+x.valor||0);
const ativos=l=>(l||[]).filter(x=>x.status!=='Cancelar'&&x.status!=='Cancelado');
// cada cadastro fixo cai numa classificação do mesmo dicionário dos lançamentos
const FIXOS=()=>[
  {lista:ativos(E.casa),     classe:'Casa',        nome:x=>x.item||'(sem nome)',      extra:x=>x.onde||''},
  {lista:ativos(E.assinaturas),classe:'Assinaturas',nome:x=>x.nome||'(sem nome)',     extra:x=>x.obs||''},
  {lista:ativos(E.seguros),  classe:'Seguros',     nome:x=>(x.tipo||'')+(x.item?' — '+x.item:''), extra:x=>x.seguradora||''},
  {lista:ativos(E.planos),   classe:'Saúde',       nome:x=>'Plano '+(x.operadora||'')+(x.quem?' ('+x.quem+')':''), extra:x=>x.plano||''},
];
const fixoMensal=()=>FIXOS().reduce((s,f)=>s+f.lista.reduce((a,x)=>a+valorMensal(x),0),0);

// detalhe de um item fixo (casa, assinatura, seguro, plano): observação + arquivos
function modalItemGasto(x, titulo, sub, ref, dica){
  abrirModal(esc(titulo||'Item'), esc(sub||''), (c,fechar)=>{
    const s1=el('<div class="secao"><h4>Observações</h4></div>');
    s1.appendChild(campos(x,[{k:'obs',t:'Anotações',tipo:'textarea',full:true,ph:'contrato, reajuste, quem atende…'}]));
    c.appendChild(s1);
    const s2=el('<div class="secao"><h4>Arquivos</h4></div>');
    s2.appendChild(areaArquivos(ref+':'+x.id, dica));
    c.appendChild(s2);
    const s3=el('<div class="secao" style="display:flex;gap:9px"></div>');
    s3.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s3.appendChild(ok);
    c.appendChild(s3);
  });
}

function vGastos(m){
  const r=rr('gastos');
  const meses=[...new Set(E.gastos.map(g=>g.mes))].filter(Boolean).sort();
  if(!filtro.gastosMes) filtro.gastosMes=mesAtual();
  const mes=filtro.gastosMes, todos=mes==='todos';
  const doMes=todos?E.gastos:E.gastos.filter(g=>g.mes===mes);
  const varTot=doMes.reduce((s,g)=>s+(+g.valor||0),0);
  const fixo=fixoMensal();
  // somando todos os meses, o fixo também se repete mês a mês
  const nMeses=todos?Math.max(meses.length,1):1;
  const fixoPer=fixo*nMeses;
  const tot=varTot+fixoPer;
  const rendMes=todos?E.rendimentos.reduce((s,x)=>s+(+x.valor||0),0)
    :E.rendimentos.filter(x=>(x.data||'').startsWith(mes)).reduce((s,x)=>s+(+x.valor||0),0);
  const sobra=rendMes-tot;
  const rot=mm=>mm.split('-').reverse().join('/');
  const novoLanc=()=>({mes:todos?mesAtual():mes,classe:CFG('catGasto')[0],oque:'',valor:0,pago:''});

  m.appendChild(cab('Gastos','Um lugar só para lançar. A classificação é que separa e mostra para onde vai o dinheiro.'));
  m.appendChild(painel('Mês',
    seletor(mes,[...meses.slice().reverse().map(mm=>[mm,rot(mm)]),
      ...(meses.includes(mesAtual())?[]:[[mesAtual(),rot(mesAtual())+' (atual)']]),['todos','Todos os meses']],
      v=>{filtro.gastosMes=v;r()}),
    acao('+ Novo lançamento',()=>{E.gastos.push({id:uid(),...novoLanc()});salvar();r()}),'|'));

  m.appendChild(el(`<div class="grade">
    ${kpi(todos?'Saída total':'Saída do mês',brl(tot),'variável + fixo','r')}
    ${kpi('Variável',brl(varTot),doMes.length+' lançamento(s)')}
    ${kpi('Fixo',brl2(fixo)+'/mês',FIXOS().reduce((s,f)=>s+f.lista.length,0)+' cadastros','a')}
    ${kpi('Ganho',brl(rendMes),'de Rendimentos','v')}
    ${kpi('Sobrou',brl(sobra),sobra>=0?'no azul':'no vermelho',sobra>=0?'v':'r')}</div>`));

  /* ================= PARA ONDE VAI O DINHEIRO (classificação) ================= */
  // as classes dos cadastros fixos entram sempre, mesmo que a config salva seja antiga —
  // senão o valor conta no total e some do detalhamento
  const classes=[...new Set([...CFG('catGasto'),...FIXOS().map(f=>f.classe),
    ...doMes.map(g=>g.classe||g.categoria)])].filter(Boolean);
  const grupos=classes.map(cl=>{
    const itens=[];
    doMes.filter(g=>(g.classe||g.categoria)===cl).forEach(g=>
      itens.push({nome:g.oque||g.obs||'(sem descrição)',v:+g.valor||0,fixo:false,extra:g.mes&&todos?rot(g.mes):''}));
    FIXOS().filter(f=>f.classe===cl).forEach(f=>f.lista.forEach(x=>
      itens.push({nome:f.nome(x),v:valorMensal(x)*nMeses,fixo:true,extra:f.extra(x)})));
    return {classe:cl,total:itens.reduce((s,i)=>s+i.v,0),itens:itens.sort((a,b)=>b.v-a.v)};
  }).filter(g=>g.total>0).sort((a,b)=>b.total-a.total);

  const lc=el('<div></div>');
  if(!grupos.length) lc.innerHTML='<div class="vazio">Sem gasto ainda neste período. Lance abaixo ou cadastre os fixos.</div>';
  else{
    lc.appendChild(el(`<div class="grafico">${gBarras(grupos.map(g=>({r:g.classe,v:g.total})),{fmt:brl,cor:'var(--vermelho)'})}</div>`));
    const tl=el('<div class="rolagem"></div>');
    const tg=document.createElement('table');
    tg.innerHTML='<thead><tr><th>#</th><th>Classificação</th><th>Tipo</th>'+
      '<th style="text-align:right">Valor</th><th style="text-align:right">% da saída</th></tr></thead>';
    const tbg=document.createElement('tbody');
    grupos.forEach((g,i)=>{
      const cor=PALETA[i%PALETA.length];
      const tre=document.createElement('tr');
      tre.style.background='var(--bg)';tre.style.boxShadow='inset 3px 0 0 '+cor;
      if(g.itens.length)tre.style.cursor='pointer';
      const soFixo=g.itens.every(x=>x.fixo), soVar=g.itens.every(x=>!x.fixo);
      tre.innerHTML=`<td style="padding:11px 10px;color:var(--suave);font-weight:600">${i+1}º</td>
        <td style="padding:11px 10px"><b style="font-size:14.5px">${esc(g.classe)}</b>
          <span class="setaG" style="color:var(--suave);font-size:11px;margin-left:6px">▾ ${g.itens.length} item(ns)</span>
          <div class="barra"><i style="width:${(g.total/(grupos[0].total||1)*100).toFixed(0)}%;background:${cor}"></i></div></td>
        <td style="padding:11px 10px">${soFixo?chip('Fixo'):soVar?chip('Variável'):chip('Misto')}</td>
        <td style="padding:11px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px">${brl(g.total)}</td>
        <td style="padding:11px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums;font-weight:600">${(g.total/tot*100).toFixed(1)}%</td>`;
      tbg.appendChild(tre);
      const filhas=[];
      g.itens.forEach(it=>{
        const tr=document.createElement('tr');
        tr.style.display='none';
        tr.innerHTML=`<td></td>
          <td style="padding:7px 10px 7px 30px;color:var(--tinta);font-size:13px">↳ ${esc(it.nome)}
            ${it.extra?`<span style="color:var(--suave);font-size:11.5px"> · ${esc(it.extra)}</span>`:''}
            <div class="barra" style="height:5px;max-width:210px"><i style="width:${(it.v/(g.total||1)*100).toFixed(0)}%;background:${cor};opacity:.55"></i></div></td>
          <td style="padding:7px 10px">${it.fixo?chip('Fixo'):chip('Variável')}</td>
          <td style="padding:7px 10px;text-align:right;font-variant-numeric:tabular-nums">${brl(it.v)}</td>
          <td style="padding:7px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums;font-size:12.5px">${(it.v/g.total*100).toFixed(0)}% da classe</td>`;
        tbg.appendChild(tr);filhas.push(tr);
      });
      tre.querySelector('.setaG').textContent='▸ '+g.itens.length+' item(ns)';
      if(filhas.length) tre.onclick=()=>{
        const fechado=filhas[0].style.display==='none';
        filhas.forEach(f=>f.style.display=fechado?'':'none');
        tre.querySelector('.setaG').textContent=(fechado?'▾ ':'▸ ')+g.itens.length+' item(ns)';
      };
    });
    tg.appendChild(tbg);
    const tf=document.createElement('tfoot');
    tf.innerHTML=`<tr class="tfim"><td colspan="3" style="padding:10px">TOTAL ${todos?'de todos os meses':rot(mes)}</td>
      <td style="text-align:right">${brl(tot)}</td><td style="text-align:right">100%</td></tr>`;
    tg.appendChild(tf);tl.appendChild(tg);lc.appendChild(tl);
  }
  m.appendChild(bloco('gt-classe','💸 Para onde vai o dinheiro','clique na classificação para abrir os itens — fixo e variável juntos',lc));

  /* ---- mês vazio e o anterior tem lançamento: oferece clonar ---- */
  if(!todos&&!doMes.length){
    const ant=(()=>{const d=new Date(mes+'-01T12:00');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)})();
    const doAnt=E.gastos.filter(g=>g.mes===ant);
    if(doAnt.length){
      const somaAnt=doAnt.reduce((s,g)=>s+(+g.valor||0),0);
      const av=el(`<div class="aviso" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="flex:1">↻ <b>${rot(mes)} está vazio.</b> ${rot(ant)} teve ${doAnt.length} lançamento(s), ${brl(somaAnt)}.
        Traga tudo e corrija só o que mudou.</span></div>`);
      const bt=el(`<button class="btn">↻ Repetir ${rot(ant)}</button>`);
      bt.onclick=()=>{doAnt.forEach(g=>E.gastos.push({...g,id:uid(),mes}));salvar();r()};
      av.appendChild(bt);m.appendChild(av);
    }
  }

  /* ================= LANÇAMENTOS: um lugar só ================= */
  m.appendChild(tabelaBloco('gt-lista','Lançamentos'+(todos?'':' de '+rot(mes)),
    'o que você gastou — o que repete todo mês fica nos cadastros abaixo',doMes,[
    {k:'mes',t:'Mês',tipo:'month',w:130},
    {k:'classe',t:'Classificação',tipo:'select',opcoes:classes},
    {k:'oque',t:'O que foi',ph:'ex.: mercado, restaurante'},
    {k:'valor',t:'Valor',tipo:'moeda',w:140},
    {k:'pago',t:'Pago com',tipo:'select',opcoes:['',...CFG('formasPagto')]},
  ],novoLanc,r,
    `<td colspan="3">Total variável</td><td style="text-align:right">${brl(varTot)}</td><td></td><td></td>`,E.gastos,
    g=>modalItemGasto(g,g.oque||'Lançamento',(g.classe||'')+' · '+brl(+g.valor||0),'gasto','Nota fiscal, recibo, comprovante')));

  /* ================= CADASTROS FIXOS ================= */
  m.appendChild(el(`<div style="padding:20px 4px 4px;font-size:12.5px;color:var(--suave);letter-spacing:.04em;text-transform:uppercase">
    Cadastros — o que repete sozinho todo mês (não precisa lançar de novo)</div>`));

  /* ---------- CASA ---------- */
  m.appendChild(tabelaBloco('gt-casa','🏠 Gastos da casa','condomínio, luz, água, internet, IPTU, quem trabalha na casa',E.casa,[
    {k:'item',t:'Conta',tipo:'select',opcoes:CFG('catCasa'),w:170},
    {k:'onde',t:'Imóvel',ph:'casa, apto, sítio'},
    {k:'valor',t:'Valor',tipo:'moeda',w:140},
    {k:'ciclo',t:'Cobrança',tipo:'select',opcoes:['Mensal','Anual']},
    {k:'dia',t:'Vence dia',tipo:'number',num:1,w:100},
    {k:'pago',t:'Pago com',tipo:'select',opcoes:['',...CFG('formasPagto')]},
    {k:'status',t:'Status',tipo:'select',opcoes:['Ativo','Cancelado']},
  ],()=>({item:CFG('catCasa')[0],onde:'',valor:0,ciclo:'Mensal',dia:'',pago:'',status:'Ativo'}),r,
    `<td colspan="2">Por mês</td><td style="text-align:right">${brl2(ativos(E.casa).reduce((s,x)=>s+valorMensal(x),0))}</td><td colspan="5"></td>`,E.casa,
    x=>modalItemGasto(x,x.item||'Conta da casa',(x.onde||'')+' · '+brl2(valorMensal(x))+'/mês','casa','Boleto, contrato, leitura do medidor')));

  /* ---------- ASSINATURAS ---------- */
  m.appendChild(tabelaBloco('gt-assin','🔄 Assinaturas','anual é dividido por 12 no custo mensal',E.assinaturas,[
    {k:'nome',t:'Serviço',ph:'ex.: Netflix'},{k:'valor',t:'Valor',tipo:'moeda',w:140},
    {k:'ciclo',t:'Cobrança',tipo:'select',opcoes:['Mensal','Anual']},{k:'dia',t:'Dia',tipo:'number',num:1,w:80},
    {k:'pago',t:'Pago com',tipo:'select',opcoes:['',...CFG('formasPagto')]},
    {k:'status',t:'Status',tipo:'select',opcoes:['Ativa','Cancelar']},
    {k:'obs',t:'Uso',ph:'uso muito?'},
  ],()=>({nome:'',valor:0,ciclo:'Mensal',dia:'',pago:'',status:'Ativa',obs:''}),r,
    `<td>Por mês</td><td style="text-align:right">${brl2(ativos(E.assinaturas).reduce((s,x)=>s+valorMensal(x),0))}</td><td colspan="6"></td>`,E.assinaturas,
    x=>modalItemGasto(x,x.nome||'Assinatura',brl2(valorMensal(x))+'/mês','assinatura','Comprovante, e-mail de cobrança')));

  /* ---------- SEGUROS ---------- */
  const venc=E.seguros.filter(s=>{const n=s.renova?Math.round((new Date(s.renova+'T12:00')-new Date(hoje()+'T12:00'))/864e5):null;
    return n!=null&&n<60&&s.status!=='Cancelado'});
  const vencidos=venc.filter(s=>s.renova<hoje()), aVencer=venc.filter(s=>s.renova>=hoje());
  if(vencidos.length) m.appendChild(el(`<div class="aviso" style="background:var(--vermelho-cl);border-color:var(--vermelho)">
    🛡️ <b>${vencidos.length} seguro(s) com a vigência VENCIDA:</b>
    ${vencidos.map(s=>esc(s.item||s.tipo||'seguro')+' — venceu em '+fmtDataAno(s.renova)).join('; ')}.

  DISC4.forEach(([nome, dica]) => {

  // o desgaste, dito em português
  const difs = DISC4.map(([n]) => ({ n, d: (+(C.discAdaptado[n] || 0)) - (+(C.disc[n] || 0)) }))
    .filter(x => Math.abs(x.d) >= 15).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  if (difs.length) c.appendChild(el(`<div class="aviso" style="margin:12px 0 0">⚖️ <b>Onde você está se forçando:</b>

    Manter isso por muito tempo cansa — vale ver se é o momento ou se virou rotina.</div>`));
  return c;
}

// barra de nota 0–100 que se preenche ao clicar/arrastar
function escalaNota(titulo, dica, valor, aoMudar) {
  const v = Math.max(0, Math.min(100, +valor || 0));
  const cor = v >= 70 ? 'var(--verde)' : v >= 40 ? 'var(--azul)' : v > 0 ? 'var(--areia)' : 'var(--linha)';
  const w = el(`<div style="padding:9px 0;border-bottom:1px solid var(--linha)">
    <div style="display:flex;align-items:baseline;gap:8px">
      <b style="font-size:13.5px;flex:1">${esc(titulo)}</b>
      <span style="font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:${cor}">${v || '—'}</span>
    </div>
    <div style="font-size:11.5px;color:var(--suave);margin:1px 0 6px">${esc(dica)}</div>
    <input type="range" min="0" max="100" step="5" value="${v}" style="width:100%;accent-color:${cor}">
  </div>`);
  const inp = w.querySelector('input');
  inp.addEventListener('input', () => {
    w.querySelector('span').textContent = inp.value;
    const c2 = +inp.value >= 70 ? 'var(--verde)' : +inp.value >= 40 ? 'var(--azul)' : +inp.value > 0 ? 'var(--areia)' : 'var(--linha)';
    w.querySelector('span').style.color = c2; inp.style.accentColor = c2;
  });
  inp.addEventListener('change', () => aoMudar(+inp.value));
  return w;
}

function blocoEscalas(titulo, lista, obj, chave, r) {
  const c = el('<div style="margin-bottom:18px"></div>');
  c.appendChild(el(`<h4 style="margin:0 0 4px">${titulo}</h4>`));
  obj[chave] = obj[chave] || {};
  lista.forEach(([nome, dica]) => c.appendChild(
    escalaNota(nome, dica, obj[chave][nome], v => { obj[chave][nome] = v; salvar(); r() })));
  // quem ficou mais alto explica o comportamento no dia a dia
  const ord = lista.map(([n]) => ({ n, v: +(obj[chave][n] || 0) })).filter(x => x.v).sort((a, b) => b.v - a.v);
  if (ord.length >= 2) c.appendChild(el(`<div style="font-size:12.5px;color:var(--suave);padding-top:9px">
    Predominante: <b style="color:var(--tinta)">${esc(ord[0].n)}</b> (${ord[0].v})${ord[1].v >= ord[0].v - 15
      ? ' com <b style="color:var(--tinta)">' + esc(ord[1].n) + '</b> (' + ord[1].v + ') logo atrás — é uma combinação, não um rótulo só.'
      : ', bem à frente do segundo.'}</div>`));
  return c;
}

function editorLista(chave,render){
  const c=el('<div class="corpo"></div>');
  const chips=el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"></div>');
  const lista=CFG(chave);
  lista.forEach((item,i)=>{
    const ch=el(`<span class="chip" style="background:var(--bg);color:var(--tinta);border:1px solid var(--linha);
      display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;font-weight:500;font-size:13px">
      <span class="tx"></span><button class="lixo" style="opacity:.5;padding:1px 4px">✕</button></span>`);
    ch.querySelector('.tx').textContent=item;
    ch.querySelector('.lixo').onclick=()=>{
      const usos=contarUso(chave,item);
      if(usos&&!confirm(`"${item}" está em uso em ${usos} registro(s). Apagar mesmo assim? Os registros continuam com o texto atual.`))return;
      E.config[chave].splice(i,1);salvar();render();
    };
    chips.appendChild(ch);
  });
  if(!lista.length) chips.appendChild(el('<span style="color:var(--suave);font-size:13px">Lista vazia.</span>'));
  c.appendChild(chips);
  const f=el(`<form style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="text" placeholder="adicionar…" style="flex:1;min-width:170px;border:1px solid var(--linha);
      background:var(--bg);color:inherit;font:inherit;padding:8px 11px;border-radius:9px">
    <button class="btn mini" type="submit">+ Adicionar</button></form>`);
  f.onsubmit=ev=>{ev.preventDefault();
    const v=f.querySelector('input').value.trim();
    if(!v)return;
    if(CFG(chave).some(x=>x.toLowerCase()===v.toLowerCase())){alert('Esse item já existe.');return}
    E.config[chave].push(v);salvar();render();
  };
  c.appendChild(f);
  return c;
}
// quantos registros usam determinado valor (evita apagar algo em uso sem avisar)
function contarUso(chave,valor){
  const conta=(lista,campo)=>lista.filter(x=>x[campo]===valor).length;
  switch(chave){
    case 'empresas': return conta(E.rendimentos,'empresa');
    case 'catGasto': return conta(E.gastos,'classe')+conta(E.gastos,'categoria');
    case 'catCasa': return conta(E.casa||[],'item');
    case 'catCusto': return E.viagens.reduce((s,v)=>s+conta(v.custos||[],'categoria'),0);
    case 'formasPagto': return E.assinaturas.filter(x=>x.pago===valor).length
      + (E.seguros||[]).filter(x=>x.pago===valor).length
      + E.viagens.reduce((s,v)=>s+conta(v.custos||[],'pago'),0);
    case 'tiposSeguro': return conta(E.seguros||[],'tipo');
    case 'transportes': return conta(E.viagens,'transporte');
    case 'statusViagem': return conta(E.viagens,'status');
    case 'tiposViagem': return conta(E.viagens,'tipo');
    case 'areasDemanda': return conta(E.demandas,'area');
    case 'tiposCompromisso': return conta(E.agenda,'tipo');
    case 'tiposDoc': return conta(E.documentos,'nome');
    case 'areasMeta': return conta(E.metas,'area');
    case 'tiposParaEles': return conta(E.paraEles,'tipo');
    case 'relacoes': return conta(E.pessoas,'relacao');
    default: return 0;
  }
}

    ${kpi('Listas',GRUPOS_CFG.length,'configuráveis')}
    ${kpi('Opções',GRUPOS_CFG.reduce((s,g)=>s+CFG(g.k).length,0),'no total')}
    ${kpi('Arquivos guardados',t.n,tamanho(t.b),'a')}
    ${kpi('Registros',['viagens','rendimentos','gastos','agenda','demandas','peso','exames','tratamentos','assinaturas','seguros','planos','casa','documentos','metas','pessoas','paraEles'].reduce((s,k)=>s+(E[k]||[]).length,0),'no painel')}</div>`));
  // perfil: a data de nascimento alimenta os rastreios de saúde
  const pf=el('<div class="corpo"></div>');
  pf.appendChild(campos(E.perfil,[{k:'nascimento',t:'Minha data de nascimento',tipo:'date'}],()=>r()));
  pf.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin-top:9px">
    É com ela que eu sei quais exames a sua idade pede${idadeLeo()?` — hoje você tem <b>${idadeLeo()} anos</b>`:''}.</p>`));
  m.appendChild(bloco('cf-perfil','👤 Meu perfil','usado nos rastreios de saúde',pf));

  m.appendChild(el(`<div class="aviso">✏️ Editar aqui muda as opções dos formulários em todo o painel.
    Se você apagar algo que já está em uso, eu aviso antes — os registros antigos continuam com o texto que têm.</div>`));

  GRUPOS_CFG.forEach(g=>m.appendChild(bloco('cf-'+g.k,g.ic+' '+g.t,g.d,editorLista(g.k,r))));

  // histórico de rendimentos — editável
  const H=E.rendHist;
  if(H.anos&&H.anos.length){
  const hc=el('<div class="corpo"></div>');
  const problemas=H.anos.map((a,i)=>{
    const soma=Object.values(H.empresas).reduce((s,v)=>s+(v[i]||0),0);
    return {a,i,soma,dif:H.totalAno[i]-soma};
  }).filter(x=>Math.abs(x.dif)>1);
  if(problemas.length) hc.appendChild(el(`<div class="aviso" style="margin-bottom:12px">⚠️
    <b>${problemas.length} ano(s) não fecham:</b> ${problemas.map(p=>p.a+' (falta '+brl(Math.abs(p.dif))+')').join(', ')}.
    Ajuste as células abaixo — o total do ano é recalculado sozinho.</div>`));
  const rol=el('<div class="rolagem"></div>');
  const tabH=document.createElement('table');
  tabH.innerHTML='<thead><tr><th>Empresa</th>'+H.anos.map(a=>`<th style="text-align:right">${a}</th>`).join('')+'<th style="text-align:right">Total</th></tr></thead>';
  const tb=document.createElement('tbody');
  Object.keys(H.empresas).forEach(nome=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td style="padding:8px 10px"><b>${esc(nome)}</b></td>`+
      H.anos.map((_,i)=>`<td class="num"><input type="number" step="0.01" data-emp="${esc(nome)}" data-i="${i}" value="${H.empresas[nome][i]||0}"></td>`).join('')+
      `<td style="padding:8px 10px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${brl(H.empresas[nome].reduce((a,b)=>a+b,0))}</td>`;
    tb.appendChild(tr);
  });
  tabH.appendChild(tb);
  const tf=document.createElement('tfoot');
  tf.innerHTML='<tr class="tfim"><td>Total do ano</td>'+H.anos.map((_,i)=>{
    const soma=Object.values(H.empresas).reduce((s,v)=>s+(v[i]||0),0);
    const ok=Math.abs(H.totalAno[i]-soma)<1;
    return `<td style="text-align:right;color:${ok?'var(--verde)':'var(--vermelho)'}">${brl(soma)}${ok?'':' ⚠'}</td>`;
  }).join('')+`<td style="text-align:right">${brl(Object.values(H.empresas).reduce((s,v)=>s+v.reduce((a,b)=>a+b,0),0))}</td></tr>`;
  tabH.appendChild(tf);
  tabH.addEventListener('change',ev=>{
    const a=ev.target; if(!a.dataset.emp) return;
    H.empresas[a.dataset.emp][+a.dataset.i]=+a.value||0;
    // o total do ano passa a ser a soma real das empresas
    H.totalAno=H.anos.map((_,i)=>Object.values(H.empresas).reduce((s,v)=>s+(v[i]||0),0));
    H.totalGeral=H.totalAno.reduce((s,v)=>s+v,0);
    H.mediaAnual=H.totalGeral/H.anos.length;
    salvar(); r();
  });
  rol.appendChild(tabH); hc.appendChild(rol);
  const bz=acao('↺ Recalcular totais pelas empresas',()=>{
    H.totalAno=H.anos.map((_,i)=>Object.values(H.empresas).reduce((s,v)=>s+(v[i]||0),0));
    H.totalGeral=H.totalAno.reduce((s,v)=>s+v,0);H.mediaAnual=H.totalGeral/H.anos.length;
    salvar();r();
  },'ghost');
  hc.appendChild(el('<div style="margin-top:11px"></div>')).appendChild(bz);
  m.appendChild(bloco('cf-rend','📊 Histórico de rendimentos','corrija aqui os valores por empresa e ano',hc));
  }

  // dados e backup
  const d=el(`<div class="corpo"></div>`);
  const linha=el('<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:11px"></div>');
  linha.appendChild(acao('⬇ Exportar backup (JSON)',exportar));
  linha.appendChild(acao('⬆ Restaurar backup',()=>pedirArquivo(restaurarBackup,'.json'),'ghost'));
  const zerar=acao('Apagar tudo e recomeçar',async()=>{
    if(!confirm('Isso apaga TODOS os dados e arquivos deste navegador. Tem certeza?'))return;
    if(!confirm('Última confirmação: não dá para desfazer. Apagar mesmo?'))return;
    const dd=await db();await new Promise(ok=>{const tx=dd.transaction('arq','readwrite');tx.objectStore('arq').clear();tx.oncomplete=ok});
    localStorage.removeItem(CHAVE);E=carregar();tela();alert('Tudo apagado.');
  },'ghost');
  zerar.style.color='var(--vermelho)';
  linha.appendChild(zerar);
  d.appendChild(linha);
  d.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);line-height:1.5">
    Os dados ficam neste navegador (localStorage) e os arquivos no IndexedDB. O backup em JSON leva os dados —
    <b>mas não os arquivos</b>, que são grandes demais. Guarde os originais importantes fora daqui também.</p>`));
  m.appendChild(bloco('cf-dados','💾 Dados e backup','exportar, restaurar ou zerar',d));

  // restaurar padrões
  const p=el('<div class="corpo"></div>');
  const bp=acao('↺ Voltar às listas padrão',()=>{
    if(!confirm('Isso devolve todas as listas de opções ao padrão. Seus lançamentos não são afetados. Continuar?'))return;
    E.config=structuredClone(SEED.config);salvar();r();
  },'ghost');
  p.appendChild(bp);
  m.appendChild(bloco('cf-padrao','↺ Restaurar padrões','só as listas de opções',p));
}

/* ---------------- backup ---------------- */
function baixar(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportar(){baixar(new Blob([JSON.stringify(E,null,1)],{type:'application/json'}),'central-leo-'+hoje()+'.json')}
function pedirArquivo(cb,accept){const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;
  i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}
async function restaurarBackup(f){
  try{const j=JSON.parse(await f.text());if(!j.viagens)throw new Error('não parece um backup daqui');
    localStorage.setItem(CHAVE,JSON.stringify(j));E=carregar();tela();alert('Backup restaurado.')}
  catch(e){alert('Não consegui ler: '+e.message)}
}

/* ---------- login, nuvem, sair e PDF ---------- */
const DEV=['localhost','127.0.0.1'].includes(location.hostname);
const T_CHAVE='cl_token';
const pegaToken=()=>localStorage.getItem(T_CHAVE)||sessionStorage.getItem(T_CHAVE)||'';
const temSessao=()=>DEV||!!pegaToken();
function sairApp(){
  if(!confirm('Sair deste aparelho? Seus dados continuam na nuvem.'))return;
  localStorage.removeItem(T_CHAVE);sessionStorage.removeItem(T_CHAVE);location.reload();
}
// Backend: Edge Function do Supabase (antes era a Netlify Function em
// /api/sync). O contrato e o MESMO -- POST para entrar, GET para ler, PUT para
// gravar. O nome leva prefixo porque o projeto e compartilhado com os sistemas
// da empresa: uma function chamada "sync" seria a do RH.
const API_SYNC='https://heveemylixartyijxewh.supabase.co/functions/v1/leo-sync';

async function apiSync(metodo,corpo){
  const r=await fetch(API_SYNC,{method:metodo,
    headers:{'content-type':'application/json',authorization:'Bearer '+pegaToken()},
    body:corpo?JSON.stringify(corpo):undefined});
  if(r.status===401){localStorage.removeItem(T_CHAVE);sessionStorage.removeItem(T_CHAVE);location.reload();throw new Error('sessão expirou')}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
let syncTimer=null;
function pintaSync(t){const x=document.getElementById('stSync');if(x)x.textContent='☁ '+t}
function agendaPush(){if(DEV||!pegaToken())return;clearTimeout(syncTimer);syncTimer=setTimeout(enviarNuvem,2500)}
async function enviarNuvem(){if(DEV)return;
  try{pintaSync('enviando…');await apiSync('PUT',{dados:E});pintaSync('sincronizado')}
  catch(e){pintaSync('erro ao enviar')}}
async function puxarNuvem(){if(DEV){pintaSync('modo local');return}
  try{pintaSync('baixando…');
    const r=await apiSync('GET');
    const remoto=r&&r.dados;
    if(remoto&&(remoto._mt||0)>(E._mt||0)){localStorage.setItem(CHAVE,JSON.stringify(remoto));E=carregar()}
    else if((E._mt||0)>((remoto&&remoto._mt)||0)){await apiSync('PUT',{dados:E})}
    pintaSync('sincronizado');
  }catch(e){pintaSync('sem conexão')}}
async function sincronizarAgora(){await puxarNuvem();tela()}
function salvarPDF(){
  document.querySelectorAll('.bloco.fechado').forEach(b=>b.classList.remove('fechado'));
  window.print();
}
function telaLogin(){
  document.querySelector('.app').style.display='none';
  const f=el(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
    <form class="bloco" style="max-width:360px;width:100%;padding:30px 26px;text-align:center">
      <svg viewBox="0 0 64 64" width="52" height="52" style="margin-bottom:10px"><g fill="#3B45E5">
        <rect x="4" y="4" width="13" height="56"/><rect x="23" y="4" width="37" height="13"/>
        <rect x="23" y="26" width="37" height="12"/><rect x="47" y="26" width="13" height="34"/>
        <rect x="30" y="47" width="17" height="13"/></g></svg>
      <h2 style="font-size:19px">LEONARDO</h2>
      <div style="letter-spacing:.22em;font-size:12px;color:var(--suave);margin-bottom:18px">GONÇALVES</div>
      <input type="password" placeholder="Senha" autocomplete="current-password" style="width:100%;border:1px solid var(--linha);background:var(--bg);color:inherit;font:inherit;padding:11px 13px;border-radius:10px;text-align:center">
      <label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--suave);margin:13px 0">
        <input type="checkbox" checked style="accent-color:var(--verde)"> Manter conectado neste aparelho</label>
      <button class="btn" style="width:100%">Entrar</button>
      <div class="erro" style="color:var(--vermelho);font-size:12.5px;margin-top:10px;min-height:16px"></div>
    </form></div>`);
  const senha=f.querySelector('input[type=password]'),manter=f.querySelector('input[type=checkbox]'),erroEl=f.querySelector('.erro');
  f.querySelector('form').onsubmit=async ev=>{
    ev.preventDefault();erroEl.textContent='';
    try{
      const r=await fetch(API_SYNC,{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({acao:'login',senha:senha.value})});
      if(r.status===401){erroEl.textContent='Senha incorreta.';return}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const {token}=await r.json();
      (manter.checked?localStorage:sessionStorage).setItem(T_CHAVE,token);
      f.remove();document.querySelector('.app').style.display='';
      menu();tela();puxarNuvem().then(()=>tela());
    }catch(e){erroEl.textContent='Não consegui falar com o servidor. Tente de novo.'}
  };
  document.body.appendChild(f);
  senha.focus();
}
if(temSessao()){menu();tela();puxarNuvem().then(()=>tela());}
else telaLogin();
</script>
