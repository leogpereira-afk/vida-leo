    const FUNDO=['var(--vermelho-cl)','var(--areia-cl)','var(--azul-cl)'];
    rc2.innerHTML=rd.slice(0,12).map(x=>`<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--linha)">
      <span style="font-size:16px">${x.ic}</span>
      <span style="flex:1;font-size:13.5px">${esc(x.txt)}</span>
      <span class="chip" style="background:${FUNDO[x.g]};color:${COR[x.g]}">${x.g===0?'atrasado':x.g===1?'atenção':'em breve'}</span>
      <button class="btn ghost mini" data-ir="${x.secao}">ver</button></div>`).join('')
      +(rd.length>12?`<div style="padding-top:9px;font-size:12.5px;color:var(--suave)">e mais ${rd.length-12} item(ns)…</div>`:'');
    rc2.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>irTela(b.dataset.ir));
  } else rc2.innerHTML='<div class="vazio">Nada pedindo atenção agora. 👏</div>';
  m.appendChild(bloco('ini-radar',`🔔 O que precisa de você${urgentes?' · '+urgentes+' atrasado(s)':''}`,'documentos, exames, prazos, viagens e datas da família',rc2));
  m.appendChild(el(`<div class="grade">
    ${kpi('Ganhos do mês',brl(rendMes),mesAtual().split('-').reverse().join('/'),'v')}
    ${kpi('Gastos do mês',brl(gastoMes),'lançados por alto','r')}
    ${kpi('Custo fixo',brl2(fixo)+'/mês',nFixo+' contas que debitam sozinhas','a')}
    ${kpi('Demandas abertas',abertas,abertas?'em andamento':'tudo em dia')}
    ${kpi('Peso atual',ult?ult.peso+' kg':'—',ult?fmtData(ult.data):'sem registro')}
    ${kpi('Dias viajando',vDias+' dias',E.viagens.length+' viagens no ano')}</div>`));

  // dash: entradas x saídas dos últimos 6 meses
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);ms.push(d.toISOString().slice(0,7))}
  m.appendChild(bloco('ini-dash','Ganhos x gastos','últimos 6 meses',graficoEl(gBarras(
    ms.map(mm=>({r:MESES[+mm.slice(5,7)-1],v:E.rendimentos.filter(x=>(x.data||'').startsWith(mm)).reduce((s,x)=>s+(+x.valor||0),0)
      -E.gastos.filter(g=>g.mes===mm).reduce((s,g)=>s+(+g.valor||0),0)})),{fmt:brl}))));

  const pv=el('<div class="corpo"></div>');
  pv.innerHTML=prox?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="font-size:34px">✈️</div><div style="flex:1;min-width:190px">
      <div style="font-family:Fraunces,serif;font-size:19px;font-weight:600">${esc(prox.evento)} · ${esc(prox.cidade)}</div>
      <div style="color:var(--suave);font-size:13px;margin-top:3px">${fmtData(prox.ida)} → ${fmtData(prox.volta)} ·
        ${diasEntre(prox.ida,prox.volta)} dia(s)${prox.transporte?' · '+esc(prox.transporte):''}</div></div>
      <div style="text-align:right">${chip(prox.status)}<div style="font-family:Fraunces,serif;font-size:17px;margin-top:6px">${brl(custoViagem(prox))}</div></div></div>
      <div style="margin-top:12px;font-size:12.5px;color:var(--suave)">Faltam <b>${Math.max(0,Math.round((new Date(prox.ida)-new Date(h))/864e5))} dias</b>.</div>`
    :'<div class="vazio">Nenhuma viagem futura marcada.</div>';
  m.appendChild(bloco('ini-viagem','Próxima viagem','',pv));

  const ag=E.agenda.filter(a=>a.data>=h).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,6);
  const ac=el('<div class="corpo"></div>');
  ac.innerHTML=ag.length?ag.map(a=>`<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--linha)">
      <b style="min-width:52px;font-variant-numeric:tabular-nums">${fmtData(a.data)}</b><span style="flex:1">${esc(a.titulo)}</span>
      <span style="color:var(--suave);font-size:12.5px">${esc(a.local||'')}</span></div>`).join('')
    :'<div class="vazio">Agenda livre.</div>';
  m.appendChild(bloco('ini-agenda','Próximos compromissos','',ac));
}

/* ===================== VIAGENS ===================== */
function vViagens(m) {
  const r = rr('viagens');
  const ativos = E.viagens.filter(v => v.status !== 'Cancelado' && +(v.ida || '').slice(0, 4) >= 2026
    && (filtro.viagensAno == null || filtro.viagensAno === 'todos' || (v.ida || '').startsWith(filtro.viagensAno)));
  const tot = ativos.reduce((s, v) => s + custoViagem(v), 0);
  const dias = ativos.reduce((s, v) => s + (+diasEntre(v.ida, v.volta) || 0), 0);
  const semHotel = E.viagens.filter(v => v.ida >= hoje() && v.status !== 'Cancelado' && !String(v.hotel || '').trim()).length;
  const futIntl = E.viagens.filter(v => v.ida >= hoje() && v.status !== 'Cancelado' && ehInternacional(v));
  const comProblema = futIntl.filter(v => !docsViagem(v).ok);
  const novaViagem = () => { const v = { id: uid(), ida: hoje(), volta: hoje(), evento: '', cidade: '', hotel: '', transporte: '', gastos: 0, status: 'Em Planejamento', obs: '', custos: [], passagens: [], hoteis: [], tickets: [], viajantes: [], tipo: 'Trabalho', planejar: false, roteiro: [], lugares: [], carro: {} }; E.viagens.push(v); salvar(); modalViagem(v) };

  m.appendChild(cab('Viagens', 'Verde = pronta para embarcar. Vermelha = ainda falta resolver. Clique para abrir.'));
  // o Gmail entra como PROPOSTA: acha as passagens e você decide o que grava
  {
    const bg=el('<button class="btn mini ghost">📧 Buscar passagens no Gmail</button>');
    bg.onclick=()=>buscarPassagensGmail(bg);
    const cxg=el('<div style="margin:0 0 14px"></div>');
    cxg.appendChild(bg);
    cxg.appendChild(el('<span style="font-size:12px;color:var(--suave);margin-left:10px">só leitura · nada é gravado sem você confirmar</span>'));
    m.appendChild(cxg);
  }
  // anos com viagem + o ano vigente sempre presente
  // o painel começa em 2026 — o que é mais antigo que isso não interessa mais
  const ANO_MIN = 2026;
  const anosV = [...new Set([...E.viagens.map(v => (v.ida || '').slice(0, 4)).filter(Boolean), String(anoHoje)])]
    .filter(a => +a >= ANO_MIN).sort().reverse();
  if (filtro.viagensAno == null) filtro.viagensAno = String(anoHoje);
  const anoV = filtro.viagensAno;
  const doAnoV = x => (+(x.ida || '').slice(0, 4) >= ANO_MIN) && (anoV === 'todos' || (x.ida || '').startsWith(anoV));
  const noAno = E.viagens.filter(doAnoV);
  const cont = st => noAno.filter(v => v.status === st).length;
  m.appendChild(painel('Ano',
    seletor(anoV, [...anosV.map(a => [a, a + ' (' + E.viagens.filter(v => (v.ida || '').startsWith(a)).length + ')']),
      ['todos', 'Todos os anos (' + E.viagens.filter(v => +(v.ida || '').slice(0, 4) >= ANO_MIN).length + ')']], v => { filtro.viagensAno = v; r() }),
    seletor(filtro.viagens, [['Todas', 'Todas (' + noAno.length + ')'],
      ...CFG('statusViagem').map(st => [st, st + ' (' + cont(st) + ')'])], v => { filtro.viagens = v; r() }),
    acao('+ Nova viagem', novaViagem), '|'));

  if (comProblema.length) m.appendChild(el(`<div class="aviso">🛂 <b>${comProblema.length} viagem(ns) internacional(is) com pendência de documento:</b>
    ${comProblema.map(v => esc(v.evento || v.cidade)).join(', ')}. Abra a viagem para ver o que falta.</div>`));
  if (semHotel) m.appendChild(el(`<div class="aviso">🏨 <b>${semHotel} viagem(ns) futura(s) sem hotel definido.</b> Reserve cedo — preço sobe perto da data.</div>`));

  /* ---- lista em linhas ---- */
  const cx = el('<div></div>');
  const rol = el('<div class="rolagem"></div>');
  const lista = [...noAno].filter(v => filtro.viagens === 'Todas' || v.status === filtro.viagens)
    .sort((a, b) => (a.ida || '').localeCompare(b.ida || ''));
  const tv = document.createElement('table');
  tv.innerHTML = `<thead><tr><th>Ida</th><th>Volta</th><th>Evento</th><th>Cidade</th><th>Quem vai</th><th>Hotel</th>
    <th>Transporte</th><th style="text-align:right">Dias</th><th style="text-align:right">Gastos</th>
    <th>O que falta</th><th>Status</th></tr></thead>`;
  const tb = document.createElement('tbody');
  lista.forEach(v => {
    const custo = custoViagem(v), dc = docsViagem(v), pronta = viagemOk(v);
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    // o que ainda falta nesta viagem
    const falta = [];
    if (!String(v.hotel || '').trim()) falta.push('hotel');
    if (!String(v.transporte || '').trim()) falta.push('transporte');
    if (dc.intl && !dc.ok) falta.push('documento');
    if (!['Confirmado', 'Realizado'].includes(v.status)) falta.push('confirmação');
    if (v.status === 'Cancelado') { tr.style.opacity = '.5' }
    else if (pronta) { tr.style.background = 'var(--verde-cl)'; tr.style.boxShadow = 'inset 3px 0 0 var(--verde)' }
    else { tr.style.background = 'var(--vermelho-cl)'; tr.style.boxShadow = 'inset 3px 0 0 var(--vermelho)' }
    const quem = (v.viajantes || []).length ? v.viajantes.join(', ') : '—';
    tr.innerHTML = `<td style="padding:9px 10px;white-space:nowrap;font-variant-numeric:tabular-nums">${fmtData(v.ida)}</td>
      <td style="padding:9px 10px;white-space:nowrap;font-variant-numeric:tabular-nums">${fmtData(v.volta)}</td>
      <td style="padding:9px 10px"><b>${esc(v.evento || '(sem nome)')}</b>${pronta ? ' <span style="color:var(--verde)">✓</span>' : ''}
        ${v.tipo && v.tipo !== 'Trabalho' ? `<span style="font-size:10.5px;color:var(--suave)"> · ${esc(v.tipo)}</span>` : ''}
        ${(v.roteiro || []).filter(x => String(x.oque || '').trim()).length ? `<span style="font-size:10.5px;color:var(--azul)"> · 🗓️ roteiro</span>` : ''}
        ${(v.custos || []).length ? `<span style="font-size:10.5px;color:var(--verde)"> · ${v.custos.length} custo(s)</span>` : ''}</td>
      <td style="padding:9px 10px">${esc(v.cidade || '—')}${dc.intl ? ' <span title="internacional">🌎</span>' : ''}</td>
      <td style="padding:9px 10px;font-size:12.5px;color:var(--suave);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(quem)}</td>
      <td style="padding:9px 10px;color:${String(v.hotel || '').trim() ? 'inherit' : 'var(--areia)'}">${esc(v.hotel || '—')}</td>
      <td style="padding:9px 10px">${esc(v.transporte || '—')}</td>
      <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums">${diasEntre(v.ida, v.volta) || '—'}</td>
      <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${custo ? brl(custo) : '—'}</td>
      <td style="padding:9px 10px;font-size:12px">${v.status === 'Cancelado' ? '<span style="color:var(--suave)">cancelada</span>'
        : !falta.length ? '<span class="chip" style="background:var(--verde-cl);color:var(--verde)">pronta</span>'
        : '<span style="color:var(--vermelho)">falta ' + esc(falta.join(', ')) + '</span>'}</td>
      <td style="padding:9px 10px">${chip(v.status)}</td>`;
    tr.onclick = () => modalViagem(v);
    tb.appendChild(tr);
  });
  tv.appendChild(tb);
  if (!lista.length) rol.innerHTML = '<div class="vazio">Nenhuma viagem com esse status.</div>';
  else {
    const tfv = document.createElement('tfoot');
    tfv.innerHTML = `<tr class="tfim"><td colspan="7" style="padding:10px">Total (sem canceladas)</td>
      <td style="text-align:right">${dias}</td><td style="text-align:right">${brl(tot)}</td><td colspan="2"></td></tr>`;
    tv.appendChild(tfv); rol.appendChild(tv);
  }
  cx.appendChild(rol);
  const pe = el('<div style="padding:0 17px 15px"></div>');
  const bt = el('<button class="mais">+ Nova viagem</button>'); bt.onclick = novaViagem;
  pe.appendChild(bt); cx.appendChild(pe);
  m.appendChild(bloco('vg-lista', 'Todas as viagens', 'em ordem de data — verde = pronta para embarcar', cx));

  m.appendChild(el(`<div class="grade">
    ${kpi('Gasto total', brl(tot), ativos.length + ' viagens', 'r')}
    ${kpi('Dias viajando', dias, 'fora de casa')}
    ${kpi('Custo médio/dia', dias ? brl(tot / dias) : '—', 'por dia')}
    ${kpi('Próximas', E.viagens.filter(v => v.ida >= hoje() && v.status !== 'Cancelado').length, semHotel ? semHotel + ' sem hotel' : 'hotéis ok', 'a')}
    ${kpi('Internacionais à frente', futIntl.length, comProblema.length ? comProblema.length + ' com pendência' : 'documentos ok', comProblema.length ? 'r' : 'v')}
    ${kpi('Prontas', E.viagens.filter(viagemOk).length, 'tudo conferido', 'v')}</div>`));

  const porCat = {}; ativos.forEach(v => (v.custos || []).forEach(c => porCat[c.categoria] = (porCat[c.categoria] || 0) + (+c.valor || 0)));
  const temCat = Object.values(porCat).some(v => v > 0);
  m.appendChild(bloco('vg-dash', 'Gasto por viagem', '', graficoEl(gBarras(
    ativos.filter(v => custoViagem(v) > 0).map(v => ({ r: v.evento.slice(0, 10), v: custoViagem(v) })), { fmt: brl }))));
  m.appendChild(bloco('vg-cat', 'Para onde vai o dinheiro', temCat ? 'somando os centros de custo' : 'abra uma viagem e lance os custos',
    graficoEl(temCat ? gRosca(CFG('catCusto').map(c => ({ r: c, v: porCat[c] || 0 }))) : `<div class="vazio">Ainda sem centro de custo lançado.</div>`)));
}

/* ---- Roteiro da viagem em PDF: para imprimir ou mandar para a família ---- */
function imprimirViagem(v) {
  const w = window.open('', '_blank');
  if (!w) { alert('Libere o pop-up para gerar o PDF.'); return }
  const dc = docsViagem(v);
  const custo = (v.custos || []).reduce((a, x) => a + (+x.valor || 0), 0);
  const quem = (v.viajantes || []).length ? v.viajantes.join(', ') : '—';
  const semana = d => d ? new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long' }) : '';

  const dias = (v.roteiro || []).slice().sort((a, b) => (a.data || '').localeCompare(b.data || ''))
    .map((x, i) => `<div class="dia">
      <div class="dcab"><b>Dia ${i + 1}</b> · ${fmtDataAno(x.data)} <span class="sem">${semana(x.data)}</span></div>
      ${x.local ? `<div><span class="rot">Onde</span> ${esc(x.local)}</div>` : ''}
      ${x.oque ? `<div><span class="rot">Programa</span> ${esc(x.oque)}</div>` : ''}
      ${x.comer ? `<div><span class="rot">Comer</span> ${esc(x.comer)}</div>` : ''}
      ${x.obs ? `<div><span class="rot">Nota</span> ${esc(x.obs)}</div>` : ''}
      ${!x.local && !x.oque && !x.comer ? '<div class="livre">— dia livre —</div>' : ''}
    </div>`).join('');

  const lug = (v.lugares || []).length ? `<h2>Lugares</h2><table>
    <thead><tr><th>Lugar</th><th>O que é</th><th class="n">Quanto</th><th>Situação</th><th>Observação</th></tr></thead><tbody>
    ${v.lugares.map(x => `<tr><td><b>${esc(x.nome || '')}</b></td><td>${esc(x.tipo || '')}</td>
      <td class="n">${+x.quanto ? brl(+x.quanto) : '—'}</td><td>${esc(x.situacao || '')}</td>
      <td>${esc(x.obs || '')}</td></tr>`).join('')}</tbody></table>` : '';

  const hosp = (v.hoteis || []).length ? `<h2>Hospedagem</h2><table>
    <thead><tr><th>Hotel</th><th>Reserva</th><th>Entrada</th><th>Saída</th><th class="n">Valor</th><th>Telefone</th></tr></thead><tbody>
    ${v.hoteis.map(h => `<tr><td><b>${esc(h.nome || '')}</b>${h.endereco ? '<br><span style="font-size:11px">' + esc(h.endereco) + '</span>' : ''}</td>
      <td>${esc(h.reserva || '—')}</td>
      <td>${h.entrada ? fmtDataAno(h.entrada) + (h.horaEnt ? ' ' + esc(h.horaEnt) : '') : '—'}</td>
      <td>${h.saida ? fmtDataAno(h.saida) + (h.horaSai ? ' ' + esc(h.horaSai) : '') : '—'}</td>
      <td class="n">${+h.valor ? brl(+h.valor) : '—'}</td>
      <td>${esc(h.telefone || '—')}</td></tr>`).join('')}</tbody></table>` : '';

  const passag = (v.passagens || []).length ? `<h2>Passagens</h2><table>
    <thead><tr><th>Trecho</th><th>Voo</th><th>Sai</th><th>Chega</th><th>Localizador</th></tr></thead><tbody>
    ${[...v.passagens].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')))
      .map(p => `<tr><td><b>${esc(p.sentido || '')}</b> ${esc(p.de || '')} → ${esc(p.para || '')}</td>
      <td>${esc([p.cia, p.voo].filter(Boolean).join(' ') || '—')}</td>
      <td>${p.data ? fmtDataAno(p.data) + (p.hora ? ' ' + esc(p.hora) : '') : '—'}</td>
      <td>${esc(p.chegada || '—')}</td>
      <td>${esc(p.localizador || '—')}</td></tr>`).join('')}</tbody></table>` : '';

  const ingr = (v.tickets || []).length ? `<h2>Ingressos</h2><table>
    <thead><tr><th>O quê</th><th>Quando</th><th>Onde</th><th class="n">Qtd</th><th class="n">Valor</th><th>Código</th></tr></thead><tbody>
    ${[...v.tickets].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')))
      .map(k => `<tr><td><b>${esc(k.nome || '')}</b>${k.tipo ? ' · ' + esc(k.tipo) : ''}</td>
      <td>${k.data ? fmtDataAno(k.data) + (k.hora ? ' ' + esc(k.hora) : '') : '—'}</td>
      <td>${esc(k.local || '—')}</td>
      <td class="n">${+k.quantos || '—'}</td>
      <td class="n">${+k.valor ? brl(+k.valor) : '—'}</td>
      <td>${esc(k.codigo || '—')}</td></tr>`).join('')}</tbody></table>` : '';

  const c = v.carro || {};
  const carro = (c.locadora || c.reserva || c.modelo) ? `<h2>Carro alugado</h2>
    <div class="l"><b>Locadora</b> ${esc(c.locadora || '—')}${c.reserva ? ' · reserva ' + esc(c.reserva) : ''}</div>
    <div class="l"><b>Veículo</b> ${esc(c.modelo || '—')}${+c.valor ? ' · ' + brl(+c.valor) : ''}</div>
    <div class="l"><b>Retirada</b> ${c.retirada ? fmtDataAno(c.retirada) : '—'} ${esc(c.localRet || '')}</div>
    <div class="l"><b>Devolução</b> ${c.devolucao ? fmtDataAno(c.devolucao) : '—'} ${esc(c.localDev || '')}</div>
    ${c.obs ? `<div class="l"><b>Notas</b> ${esc(c.obs)}</div>` : ''}` : '';

  const docs = dc.intl && dc.itens.length ? `<h2>Documentos</h2><table>
    <thead><tr><th>Pessoa</th><th>Documento</th><th>Situação</th></tr></thead><tbody>
    ${dc.itens.map(i => `<tr><td>${esc(i.nome)}</td><td>${esc(i.doc)}</td>
      <td style="color:${i.ruim ? '#b3261e' : i.aviso ? '#b26a00' : '#1b7a4b'}">${esc(i.sit)}</td></tr>`).join('')}</tbody></table>` : '';

  const gastos = (v.custos || []).length ? `<h2>Custos lançados</h2><table>
    <thead><tr><th>Categoria</th><th>O quê</th><th class="n">Valor</th></tr></thead><tbody>
    ${v.custos.map(x => `<tr><td>${esc(x.categoria || '')}</td><td>${esc(x.descricao || '')}</td>
      <td class="n">${brl(+x.valor || 0)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">TOTAL</td><td class="n">${brl(custo)}</td></tr></tbody></table>` : '';

  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(v.evento || 'Viagem')} — roteiro</title>
  <style>
    body{font:12.5px/1.55 -apple-system,Helvetica,sans-serif;padding:26px;color:#1a1a1a;max-width:820px}
    h1{font-size:22px;margin:0 0 2px}
    h2{font-size:13px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:#666;border-bottom:1px solid #e8e4dc;padding-bottom:4px}
    .cab{color:#777;margin-bottom:6px;font-size:12px}
    .resumo{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 4px;font-size:12.5px}
    .resumo div{min-width:150px}.resumo b{color:#666;font-weight:600;font-size:11px;display:block;text-transform:uppercase;letter-spacing:.04em}
    .dia{border-left:3px solid #cfc6b4;padding:8px 0 8px 12px;margin-bottom:10px;page-break-inside:avoid}
    .dcab{font-size:13px;margin-bottom:3px}.sem{color:#999;font-size:11.5px}
    .rot{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:inline-block;min-width:74px}
    .livre{color:#aaa;font-style:italic}
    table{border-collapse:collapse;width:100%;margin-bottom:6px}
    th,td{padding:6px 9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
    th{background:#f4f1ea;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#555}
    .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .tot td{border-top:2px solid #333;font-weight:700}
    .l{padding:4px 0;border-bottom:1px solid #f0ece4}.l b{display:inline-block;min-width:96px;color:#666}
    @media print{body{padding:0}h2{page-break-after:avoid}}
  </style>
  <h1>${esc(v.evento || 'Viagem')}</h1>
  <div class="cab">${esc(v.cidade || '')} · ${fmtDataAno(v.ida)} a ${fmtDataAno(v.volta)} ·
    ${diasEntre(v.ida, v.volta) || '?'} dia(s)${v.tipo ? ' · ' + esc(v.tipo) : ''}</div>
  <div class="resumo">
    <div><b>Quem vai</b>${esc(quem)}</div>
    <div><b>Hotel</b>${esc(v.hotel || '—')}</div>
    <div><b>Transporte</b>${esc(v.transporte || '—')}</div>
    <div><b>Orçamento</b>${+v.gastos ? brl(+v.gastos) : '—'}</div>
    ${custo ? `<div><b>Já gasto</b>${brl(custo)}</div>` : ''}
  </div>
  ${dias ? '<h2>Roteiro dia a dia</h2>' + dias : ''}
  ${lug}
  ${passag}
  ${hosp}
  ${carro}
  ${ingr}
  ${docs}
  ${gastos}
  ${v.obs ? `<h2>Observações</h2><div>${esc(v.obs)}</div>` : ''}
  <div class="cab" style="margin-top:24px">Central do Léo · gerado em ${new Date().toLocaleDateString('pt-BR')}</div>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function modalViagem(v){
  abrirModal(esc(v.evento||'Nova viagem'),`${esc(v.cidade||'')} · ${fmtDataLonga(v.ida)} → ${fmtDataLonga(v.volta)}`,(c,fechar)=>{
    const s1=el('<div class="secao"><h4>Dados da viagem</h4></div>');
    s1.appendChild(campos(v,[
      {k:'evento',t:'Evento'},{k:'cidade',t:'Cidade'},
      {k:'ida',t:'Ida',tipo:'date'},{k:'volta',t:'Volta',tipo:'date'},
      {k:'hotel',t:'Hotel',ph:'nome / reserva'},
      {k:'transporte',t:'Transporte',tipo:'select',opcoes:['',...CFG('transportes')]},
      {k:'status',t:'Status',tipo:'select',opcoes:CFG('statusViagem')},
      {k:'gastos',t:'Orçamento estimado (R$)',tipo:'number'},
      {k:'obs',t:'Observações',tipo:'textarea',full:true},
    ]));
    c.appendChild(s1);

    /* ---- PASSAGENS ----
       Cada trecho é uma linha: viagem de verdade tem conexão, e guardar só
       "ida" e "volta" obrigaria a escrever a escala na observação, que é onde
       a informação vai morrer. O que resolve no aeroporto é hora, portão de
       saída e localizador — o resto é enfeite. */
    const spass=el('<div class="secao"><h4>Passagens</h4></div>');
    spass.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin:-4px 0 10px">
      Hora, aeroporto e localizador. É o que você procura correndo no dia — e o que
      alimenta o aviso de "sai daqui a 3 horas" na Agenda.</p>`));
    const listaP=el('<div></div>');
    const pintaPassagens=()=>{
      listaP.innerHTML='';
      const ord=[...(v.passagens||[])].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
      ord.forEach(p=>{
        const li=blocoTravado({id:p.id,novo:()=>!p.de&&!p.para&&!p.hora,alvo:p,
          resumo:()=>`<b style="font-size:13.5px">${p.sentido==='Volta'?'🛬':p.sentido==='Conexão'?'🔁':'✈️'} ${esc(p.sentido||'Ida')}</b>
            ${p.de||p.para?`<span style="font-size:14px;font-weight:600;margin-left:7px">${esc(p.de||'?')} → ${esc(p.para||'?')}</span>`:''}
            ${p.data?`<span style="font-size:12.5px;color:var(--suave);margin-left:7px">${fmtDataAno(p.data)}${p.hora?' às '+esc(p.hora):''}</span>`:''}
            ${p.cia||p.voo?`<span style="font-size:12.5px;color:var(--suave);margin-left:7px">${esc([p.cia,p.voo].filter(Boolean).join(' '))}</span>`:''}
            ${p.localizador?`<span style="font-size:12px;color:var(--suave);margin-left:7px">· ${esc(p.localizador)}</span>`:''}`,
          aoApagar:()=>{ if(!confirm('Apagar este trecho?'))return;
            v.passagens=v.passagens.filter(x=>x.id!==p.id);_emEdicao.delete(p.id);salvar();pintaPassagens(); },
          campos:[
          {k:'sentido',t:'Trecho',tipo:'select',opcoes:['Ida','Conexão','Volta']},
          {k:'data',t:'Data',tipo:'date'},
          {k:'hora',t:'Hora de partida',tipo:'time'},
          {k:'de',t:'Sai de (aeroporto)',ph:'ex.: CNF · Confins'},
          {k:'para',t:'Chega em (aeroporto)',ph:'ex.: GRU · Guarulhos'},
          {k:'chegada',t:'Hora de chegada',tipo:'time'},
          {k:'cia',t:'Companhia',tipo:'sugestao',ph:'ex.: LATAM',
            opcoes:maisUsados((E.viagens||[]).flatMap(x=>x.passagens||[]),'cia')},
          {k:'voo',t:'Voo',ph:'ex.: LA3204'},
          {k:'localizador',t:'Localizador',ph:'código da reserva'},
          {k:'assento',t:'Assento',ph:'ex.: 12A',w:110},
        ]});
        listaP.appendChild(li);
      });
      if(!(v.passagens||[]).length) listaP.appendChild(el('<div class="vazio">Nenhuma passagem lançada.</div>'));
    };
    pintaPassagens();
    spass.appendChild(listaP);
    const bP=el('<button class="btn mini">+ Trecho</button>');
    bP.onclick=()=>{
      // o primeiro trecho nasce como Ida na data da ida; o segundo, como Volta
      const jaTem=(v.passagens||[]).length;
      v.passagens=[...(v.passagens||[]),{id:uid(),
        sentido:jaTem?'Volta':'Ida',data:jaTem?(v.volta||''):(v.ida||''),
        hora:'',de:'',para:'',chegada:'',cia:'',voo:'',localizador:'',assento:''}];
      salvar();pintaPassagens();
    };
    spass.appendChild(bP);
    c.appendChild(spass);

    /* ---- HOTEL E CARRO ----
       Ficava escondido atrás de "montar o roteiro": viagem de trabalho com
       carro alugado não tinha onde registrar. Agora é seção própria, sempre
       visível — reserva de hotel e locadora não são assunto de roteiro. */
    const shosp=el('<div class="secao"><h4>Reservas</h4></div>');
    const listaH=el('<div></div>');
    const resumoHoteis=()=>{v.hotel=(v.hoteis||[]).map(h=>h.nome).filter(Boolean).join(' · ')};
    const pintaHoteis=()=>{
      listaH.innerHTML='';
      (v.hoteis||[]).forEach(h=>{
        listaH.appendChild(blocoTravado({id:h.id,novo:()=>!String(h.nome||'').trim(),alvo:h,
          resumo:()=>{
            const l2=[
              h.entrada?fmtDataAno(h.entrada)+(h.horaEnt?' '+esc(h.horaEnt):'')+' → '+(h.saida?fmtDataAno(h.saida):'?')+(h.horaSai?' '+esc(h.horaSai):''):'',
              h.reserva?'reserva '+esc(h.reserva):'',
              +h.valor?brl(+h.valor):'',
              h.cafe?esc(h.cafe==='Incluso'?'café incluso':h.cafe.toLowerCase()):'',
              h.telefone?'☎ '+esc(h.telefone):'',
            ].filter(Boolean).join(' · ');
            return `<b style="font-size:13.5px">🏨 ${esc(h.nome||'(sem nome)')}</b>
              ${l2?`<div style="font-size:12.5px;color:var(--suave);margin-top:2px">${l2}</div>`:''}
              ${h.endereco?`<div style="font-size:12px;color:var(--suave);margin-top:1px">📍 ${esc(h.endereco)}</div>`:''}`;
          },
          aoMudar:resumoHoteis,
          aoApagar:()=>{ if(!confirm('Apagar esta hospedagem?'))return;
            v.hoteis=v.hoteis.filter(x=>x.id!==h.id);_emEdicao.delete(h.id);resumoHoteis();salvar();pintaHoteis(); },
          campos:[
            {k:'nome',t:'Hotel',ph:'nome do hotel ou do anfitrião',full:true},
            {k:'reserva',t:'Nº da reserva'},
            {k:'endereco',t:'Endereço',full:true,ph:'rua, bairro — o que você mostra ao taxista'},
            {k:'entrada',t:'Entrada',tipo:'date'},
            {k:'horaEnt',t:'Hora do check-in',tipo:'time'},
            {k:'saida',t:'Saída',tipo:'date'},
            {k:'horaSai',t:'Hora do check-out',tipo:'time'},
            {k:'valor',t:'Valor total',tipo:'moeda'},
            {k:'telefone',t:'Telefone'},
            {k:'cafe',t:'Café da manhã',tipo:'select',opcoes:['','Incluso','Não incluso','À parte']},
            {k:'obs',t:'Observações',tipo:'textarea',full:true,ph:'estacionamento, cancelamento até quando, quarto'},
          ]}));
      });
      // sem hospedagem, o botão logo abaixo já diz o que fazer — a linha de
      // "nenhuma" só ocupava espaço
    };
    pintaHoteis();
    shosp.appendChild(listaH);
    const bH=el('<button class="btn mini ghost">🏨 Hospedagem</button>');
    bH.onclick=()=>{
      v.hoteis=[...(v.hoteis||[]),{id:uid(),nome:'',reserva:'',endereco:'',
        entrada:v.ida||'',horaEnt:'',saida:v.volta||'',horaSai:'',valor:0,telefone:'',cafe:'',obs:''}];
      salvar();pintaHoteis();
    };
    /* o carro sai de dentro do roteiro e vem para cá */
    v.carro=v.carro||{};
    const caId='carro-'+v.id;
    shosp.appendChild(el('<div style="height:14px"></div>'));
    const temCarro=()=>String(v.carro.locadora||'').trim()||String(v.carro.reserva||'').trim();
    const caixaCarro=el('<div></div>');
    let _abrirCarro=false, _barraReservas=null;
    const pintaCarro=()=>{
      caixaCarro.innerHTML='';
      // sem carro na viagem, não fica formulário vazio ocupando a tela: o convite
      // vai para a barra junto dos outros. A maioria das viagens não aluga carro.
      if(!temCarro()&&!_abrirCarro){
        if(_barraReservas&&!_barraReservas.querySelector('.bCarro')){
          const b=el('<button class="btn mini ghost bCarro">🚗 Carro</button>');
          b.onclick=()=>{_abrirCarro=true;_emEdicao.add(caId);pintaCarro()};
          _barraReservas.appendChild(b);
        }
        return;
      }
      if(_barraReservas){const vb=_barraReservas.querySelector('.bCarro');if(vb)vb.remove()}
      caixaCarro.appendChild(blocoTravado({id:caId,novo:()=>_abrirCarro&&!temCarro(),alvo:v.carro,
        aoApagar:temCarro()||_abrirCarro?()=>{
          if(temCarro()&&!confirm('Apagar os dados do carro alugado?'))return;
          v.carro={};_abrirCarro=false;_emEdicao.delete(caId);salvar();pintaCarro();
        }:null,
        resumo:()=>{
          const l2=[
            v.carro.modelo?esc(v.carro.modelo):'',
            v.carro.reserva?'reserva '+esc(v.carro.reserva):'',
            +v.carro.valor?brl(+v.carro.valor):'',
          ].filter(Boolean).join(' · ');
          const l3=[
            v.carro.retirada?'retira '+fmtDataAno(v.carro.retirada)+(v.carro.horaRet?' '+esc(v.carro.horaRet):'')+(v.carro.localRet?' · '+esc(v.carro.localRet):''):'',
            v.carro.devolucao?'devolve '+fmtDataAno(v.carro.devolucao)+(v.carro.horaDev?' '+esc(v.carro.horaDev):'')+(v.carro.localDev?' · '+esc(v.carro.localDev):''):'',
          ].filter(Boolean).join('  →  ');
          return `<b style="font-size:13.5px">🚗 ${esc(v.carro.locadora||'Carro alugado')}</b>
            ${l2?`<div style="font-size:12.5px;color:var(--suave);margin-top:2px">${l2}</div>`:''}
            ${l3?`<div style="font-size:12px;color:var(--suave);margin-top:1px">${l3}</div>`:''}`;
        },
        campos:[
          {k:'locadora',t:'Locadora',ph:'ex.: Localiza, Hertz'},
          {k:'reserva',t:'Nº da reserva'},
          {k:'modelo',t:'Categoria / modelo',ph:'ex.: SUV 7 lugares'},
          {k:'valor',t:'Valor total',tipo:'moeda'},
          {k:'retirada',t:'Retirada',tipo:'date'},
          {k:'horaRet',t:'Hora da retirada',tipo:'time'},
          {k:'localRet',t:'Onde retira',ph:'aeroporto, loja'},
          {k:'devolucao',t:'Devolução',tipo:'date'},
          {k:'horaDev',t:'Hora da devolução',tipo:'time'},
          {k:'localDev',t:'Onde devolve',ph:'mesmo lugar?'},
          {k:'obs',t:'Observações',tipo:'textarea',full:true,ph:'seguro, cadeirinha das crianças, franquia, combustível'},
        ]}));
      // com criança pequena, cadeirinha é o que mais se esquece
      const criancas=(v.viajantes||[]).filter(nome=>{
        const p2=E.pessoas.find(y=>mesmaPessoa(y.nome,nome));
        return p2&&p2.nascimento&&idadeDe(p2.nascimento)<10;
      });
      if(criancas.length&&temCarro())
        caixaCarro.appendChild(el(`<div class="aviso" style="margin:10px 0 0">👶 <b>${criancas.length} criança(s) pequena(s) nesta viagem:</b>
          ${esc(criancas.join(', '))}. Confirme cadeirinha com a locadora — em viagem internacional quase sempre é item à parte.</div>`));
    };
    pintaCarro();
    shosp.appendChild(caixaCarro);

    /* ---- INGRESSOS ----
       Parque, show, museu, jogo. Vale o mesmo motivo do resto: o que decide no
       dia é hora, local e o código que o portão pede — e isso costuma acabar
       perdido no e-mail. */
    const listaT=el('<div></div>');
    const pintaTickets=()=>{
      listaT.innerHTML='';
      const ord=[...(v.tickets||[])].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
      ord.forEach(k=>{
        listaT.appendChild(blocoTravado({id:k.id,novo:()=>!String(k.nome||'').trim(),alvo:k,
          resumo:()=>{
            const l2=[
              k.data?fmtDataAno(k.data)+(k.hora?' às '+esc(k.hora):''):'',
              +k.quantos?k.quantos+(k.quantos>1?' ingressos':' ingresso'):'',
              +k.valor?brl(+k.valor):'',
              k.codigo?'cód. '+esc(k.codigo):'',
            ].filter(Boolean).join(' · ');
            return `<b style="font-size:13.5px">🎟️ ${esc(k.nome||'(sem nome)')}${k.tipo?` <span style="font-weight:400;color:var(--suave);font-size:12px">· ${esc(k.tipo)}</span>`:''}</b>
              ${l2?`<div style="font-size:12.5px;color:var(--suave);margin-top:2px">${l2}</div>`:''}
              ${k.local?`<div style="font-size:12px;color:var(--suave);margin-top:1px">📍 ${esc(k.local)}</div>`:''}`;
          },
          aoApagar:()=>{ if(!confirm('Apagar este ingresso?'))return;
            v.tickets=v.tickets.filter(x=>x.id!==k.id);_emEdicao.delete(k.id);salvar();pintaTickets(); },
          campos:[
            {k:'nome',t:'O que é',ph:'ex.: Disney — Magic Kingdom',full:true},
            {k:'tipo',t:'Tipo',tipo:'select',opcoes:CFG('tiposTicket')},
            {k:'data',t:'Dia',tipo:'date'},
            {k:'hora',t:'Hora',tipo:'time'},
            {k:'local',t:'Onde',full:true,ph:'endereço, portão, setor'},
            {k:'quantos',t:'Quantos',tipo:'number',num:1,w:110},
            {k:'valor',t:'Valor total',tipo:'moeda'},
            {k:'codigo',t:'Código / localizador',ph:'o que o portão pede'},
            {k:'obs',t:'Observações',tipo:'textarea',full:true,ph:'fila prioritária, precisa imprimir, até que horas entra'},
          ]}));
      });
    };
    pintaTickets();
    shosp.appendChild(listaT);

    /* os três botões, pequenos e juntos: é o que resta quando nada foi lançado */
    const bT=el('<button class="btn mini ghost">🎟️ Ingresso</button>');
    bT.onclick=()=>{
      v.tickets=[...(v.tickets||[]),{id:uid(),nome:'',tipo:CFG('tiposTicket')[0],
        data:v.ida||'',hora:'',local:'',quantos:(v.viajantes||[]).length||1,valor:0,codigo:'',obs:''}];
      salvar();pintaTickets();
    };
    const barra=el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"></div>');
    barra.appendChild(bH);barra.appendChild(bT);
    shosp.appendChild(barra);
    // o botão do carro entra na mesma barra quando não há carro lançado
    _barraReservas=barra;
    pintaCarro();
    c.appendChild(shosp);

    // ---- quem vai + internacional ----
    const sq=el('<div class="secao"><h4>Quem vai</h4></div>');
    const pintaQuem=()=>{
      const velho=sq.querySelector('.quem'); if(velho)velho.remove();
      const cx2=el('<div class="quem"></div>');
      const chips=el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px"></div>');
      const nomes=['Léo',...E.pessoas.map(p2=>p2.nome).filter(Boolean)];
      if(nomes.length<2) chips.appendChild(el('<span style="font-size:12.5px;color:var(--suave)">Cadastre esposa e filhos em <b>🧭 Guia de vida → Minha gente</b> para escolher aqui.</span>'));
      nomes.forEach(nome=>{
        const on=(v.viajantes||[]).includes(nome);
        const b=el(`<button type="button" class="chip" style="cursor:pointer;border:1px solid ${on?'var(--verde)':'var(--linha)'};
          background:${on?'var(--verde-cl)':'var(--bg)'};color:${on?'var(--verde)':'var(--suave)'};padding:6px 12px;font-size:13px">
          ${on?'✓ ':''}${esc(nome)}</button>`);
        b.onclick=()=>{
          v.viajantes=v.viajantes||[];
          const i=v.viajantes.indexOf(nome);
          if(i>=0)v.viajantes.splice(i,1); else v.viajantes.push(nome);
          salvar();pintaQuem();pintaDocs();
        };
        chips.appendChild(b);
      });
      cx2.appendChild(chips);
      const auto=v.internacional==null&&INTERNACIONAL.test((v.cidade||'')+' '+(v.pais||''));
      const li=el(`<label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer">
        <input type="checkbox" ${ehInternacional(v)?'checked':''} style="accent-color:var(--verde);width:16px;height:16px">
        🌎 Viagem internacional — conferir passaporte e visto
        ${auto?'<span style="font-size:11.5px;color:var(--suave)">(marcado pela cidade)</span>':''}</label>`);
      li.querySelector('input').onchange=e=>{v.internacional=e.target.checked;salvar();pintaQuem();pintaDocs()};
      cx2.appendChild(li);
      sq.appendChild(cx2);
    };
    pintaQuem(); c.appendChild(sq);

    // ---- documentação (só internacional) ----
    const sd=el('<div class="secao"><h4>Documentação da viagem</h4></div>');
    const pintaDocs=()=>{
      const velho=sd.querySelector('.docs'); if(velho)velho.remove();
      const cx3=el('<div class="docs"></div>');
      if(!ehInternacional(v)){
        cx3.innerHTML='<div style="font-size:12.5px;color:var(--suave)">Viagem nacional — sem exigência de passaporte/visto.</div>';
        sd.appendChild(cx3);sd.style.display='';return;
      }
      const d=docsViagem(v), atencao=d.itens.filter(i=>i.aviso).length;
      cx3.appendChild(el(`<div class="aviso" style="margin:0 0 10px;background:${d.ok?'var(--verde-cl)':'var(--vermelho-cl)'};
        border-color:${d.ok?'var(--verde)':'var(--vermelho)'}">
        ${d.ok?'✅ <b>Documentação em dia</b> até a data da volta'+(atencao?', mas há '+atencao+' ponto(s) para conferir.':' — passaporte com a folga de 6 meses.')
               :'⚠️ <b>Tem documento pendente</b> — resolva antes de fechar a viagem.'}</div>`));
      const cor=i=>i.ruim?'var(--vermelho)':i.aviso?'var(--ambar,#b26a00)':'var(--verde)';
      const tb2=el('<div class="rolagem"></div>');
      tb2.innerHTML=`<table><thead><tr><th>Pessoa</th><th>Documento</th><th>Situação</th></tr></thead><tbody>
        ${d.itens.map(i=>`<tr><td style="padding:8px 10px">${esc(i.nome)}</td>
          <td style="padding:8px 10px">${esc(i.doc)}</td>
          <td style="padding:8px 10px;color:${cor(i)};font-weight:${i.ruim?'600':'400'}">${esc(i.sit)}</td></tr>`).join('')}
      </tbody></table>`;
      cx3.appendChild(tb2);
      cx3.appendChild(el('<div style="font-size:12px;color:var(--suave);margin-top:9px">Cadastre e atualize em <b>🪪 Documentos</b> — o campo <i>De quem</i> precisa bater com o nome da pessoa.</div>'));
      sd.appendChild(cx3);
    };
    pintaDocs(); c.appendChild(sd);

    /* ================= PLANEJAMENTO (abre pelo tipo da viagem) ================= */
    const sp = el('<div class="secao"><h4>Tipo da viagem</h4></div>');
    const pintaPlano = () => {
      const velho = sp.querySelector('.plano'); if (velho) velho.remove();
      const cx4 = el('<div class="plano"></div>');

      // o seletor que decide se abre o planejamento
      const chips = el('<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px"></div>');
      CFG('tiposViagem').forEach(tp => {
        const on = (v.tipo || 'Trabalho') === tp;
        const b = el(`<button type="button" class="chip" style="cursor:pointer;border:1px solid ${on ? 'var(--verde)' : 'var(--linha)'};
          background:${on ? 'var(--verde-cl)' : 'var(--bg)'};color:${on ? 'var(--verde)' : 'var(--suave)'};padding:6px 12px;font-size:13px">
          ${on ? '✓ ' : ''}${esc(tp)}</button>`);
        b.onclick = () => { v.tipo = tp; if (tp !== 'Trabalho') v.planejar = true; salvar(); pintaPlano() };

      } else {

          if (ult && ult.data) d.setDate(d.getDate() + 1);
          v.roteiro.push({ id: uid(), data: d.toISOString().slice(0, 10), local: '', oque: '', comer: '', obs: '' });

        };

        rt.appendChild(el(`<div style="font-size:12.5px;color:var(--suave);margin-top:7px">

      }
      cx4.appendChild(rt);

      /* ---- lugares que queremos conhecer ---- */
      v.lugares = v.lugares || [];
      const lg = el('<div style="margin-top:20px"></div>');
      lg.appendChild(el('<h4 style="margin:0 0 8px">📍 Lugares que queremos ir</h4>'));
      const rol3 = el('<div class="rolagem"></div>');
      if (v.lugares.length) {
        rol3.appendChild(tabela(v.lugares, [
          { k: 'nome', t: 'Lugar', ph: 'ex.: Disney, museu, praia' },
          { k: 'tipo', t: 'O que é', tipo: 'select', opcoes: ['Passeio', 'Restaurante', 'Compras', 'Natureza', 'Criança', 'Outro'], w: 150 },
          { k: 'quanto', t: 'Quanto custa', tipo: 'moeda', w: 140 },
          { k: 'situacao', t: 'Situação', tipo: 'select', opcoes: ['Quero ir', 'Reservado', 'Fomos', 'Ficou pra próxima'], w: 165 },
          { k: 'obs', t: 'Observação', ph: 'horário, ingresso, dica' },
        ], () => { salvar(); }));
      } else rol3.innerHTML = '<div class="vazio">Nenhum lugar na lista ainda.</div>';
      lg.appendChild(rol3);
      const b3 = el('<button class="mais">+ Novo lugar</button>');
      b3.onclick = () => { v.lugares.push({ id: uid(), nome: '', tipo: 'Passeio', quanto: 0, situacao: 'Quero ir', obs: '' }); salvar(); pintaPlano() };
      lg.appendChild(b3);
      if (v.lugares.length) {

          Somando os passeios: <b>${brl(prev)}</b>${fomos ? ' · já foram a ' + fomos : ''}. Lance em <b>Centro de custo</b> quando pagar.</div>`));
      }

        ],()=>{salvar();pintaCustos()},`<td colspan="2">Total</td><td style="text-align:right">${brl2(total)}</td><td></td><td></td>`));
      } else rol.innerHTML='<div class="vazio">Sem custos lançados. Some alimentação, hotel, passagem…</div>';
      cc.appendChild(rol);
      // orçado x realizado: enquanto não há custos, vale o orçamento estimado

/* ===================== AGENDA ===================== */
/* A AGENDA COMO ECOSSISTEMA
   O compromisso digitado à mão é só uma das coisas que têm data nesta Central.
   Passaporte vence, viagem tem ida e volta, filho faz aniversário, ação do
   plano tem prazo, seguro renova. Tudo isso já estava guardado — só não estava
   junto, e por isso não avisava ninguém.

   Aqui eles são LIDOS de onde moram, nunca copiados: se a validade do documento
   mudar lá, muda aqui. O que vem de fora não se edita nesta tela — clicar leva
   para o lugar certo. Duas cópias do mesmo fato divergem em uma semana. */

const FONTES_AGENDA=[
  {k:'compromissos',rot:'Compromissos',ic:'📅',cor:'#1f2b4d'},
  {k:'documentos',  rot:'Documentos vencendo',ic:'🪪',cor:'#e8590c'},
  {k:'viagens',     rot:'Viagens',ic:'✈️',cor:'#1c7ed6'},
  {k:'aniversarios',rot:'Aniversários',ic:'🎂',cor:'#d6336c'},
  {k:'acoes',       rot:'Ações do plano',ic:'🎯',cor:'#2b8a3e'},
  {k:'oportunidades',rot:'Oportunidades',ic:'💡',cor:'#b8860b'},
  {k:'demandas',    rot:'Demandas',ic:'✅',cor:'#0ca678'},
  {k:'seguros',     rot:'Seguros renovando',ic:'🛡️',cor:'#c92a2a'},
];
const corFonte=k=>(FONTES_AGENDA.find(f=>f.k===k)||{}).cor||'var(--suave)';
// MESES é abreviado (cabe em gráfico); no calendário o mês vai por extenso
const MESES_LONGO=['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* A GRADE DO MÊS. A lista responde "o que vem agora"; a grade responde "como
   está o mês" — dá para ver a semana cheia e a semana vazia de um golpe de
   vista, que é o que faz decidir onde encaixar mais uma coisa. */
function gradeMes(eventos,r){
  const cx=el('<div class="corpo"></div>');
  const h=hoje();
  if(!filtro.agMes) filtro.agMes=h.slice(0,7);
  const [ay,am]=filtro.agMes.split('-').map(Number);

  /* Cabeçalho: ‹ [mês] [ano] › Hoje.
     As setas servem para andar de um em um; os seletores servem para pular.
     Só seta obrigaria a sete cliques para chegar em março do ano que vem. */
  const passo=d=>{const x=new Date(ay,am-1+d,1);filtro.agMes=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');r()};
  const irPara=(y,mo)=>{filtro.agMes=y+'-'+String(mo).padStart(2,'0');r()};
  // os anos oferecidos: os que têm alguma coisa marcada, mais uma folga para
  // frente e para trás — poder marcar o ano que vem sem depender de já ter algo
  const anosEv=[...new Set(eventos.map(e=>+e.data.slice(0,4)).filter(Boolean))];
  const anoH=+h.slice(0,4);
  const minA=Math.min(anoH-2,ay,...(anosEv.length?anosEv:[anoH]));
  const maxA=Math.max(anoH+3,ay,...(anosEv.length?anosEv:[anoH]));
  const anos=[];for(let y=minA;y<=maxA;y++)anos.push(y);

  const topo=el('<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap"></div>');
  const bAnt=el('<button class="btn ghost mini" title="mês anterior">‹</button>');
  bAnt.onclick=()=>passo(-1);
  topo.appendChild(bAnt);
  topo.appendChild(seletor(String(am),MESES_LONGO.map((nm,i)=>[String(i+1),nm]),v=>irPara(ay,+v)));
  topo.appendChild(seletor(String(ay),anos.map(y=>[String(y),String(y)]),v=>irPara(+v,am)));
  const bProx=el('<button class="btn ghost mini" title="próximo mês">›</button>');
  bProx.onclick=()=>passo(1);
  topo.appendChild(bProx);
  const bHoje=el('<button class="btn ghost mini">Hoje</button>');
  bHoje.onclick=()=>{filtro.agMes=hoje().slice(0,7);r()};
  topo.appendChild(bHoje);
  if(filtro.agMes!==h.slice(0,7))
    topo.appendChild(el('<span style="font-size:12px;color:var(--suave)">você não está no mês atual</span>'));
  cx.appendChild(topo);

  // a semana começa no domingo, como no calendário do RH
  const primeiro=new Date(ay,am-1,1);
  const inicio=new Date(primeiro); inicio.setDate(1-primeiro.getDay());
  /* Evento com "ate" entra em TODOS os dias do intervalo, marcado com onde
     começa e onde termina — é isso que permite desenhar a faixa contínua.
     As faixas vêm primeiro em cada dia para se alinharem de célula em célula. */
  const porDia={};
  const põe=(iso,e)=>{(porDia[iso]=porDia[iso]||[]).push(e)};
  eventos.forEach(e=>{
    if(!e.ate||e.ate<=e.data){põe(e.data,e);return}
    const d=new Date(e.data+'T12:00'), fim=new Date(e.ate+'T12:00');
    let guarda=0;
    while(d<=fim&&guarda++<400){
      const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      põe(iso,{...e,_faixa:true,_ini:iso===e.data,_fim:iso===e.ate,_dia:iso});
      d.setDate(d.getDate()+1);
    }
  });
  Object.values(porDia).forEach(l=>l.sort((a,b)=>(b._faixa?1:0)-(a._faixa?1:0)));

  const g=el(`<div style="border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;background:var(--card)">
    <div style="display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);border-bottom:1px solid var(--linha)">
      ${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div style="padding:9px 6px;text-align:center;font-size:11px;
        color:var(--suave);text-transform:uppercase;letter-spacing:.06em">${d}</div>`).join('')}
    </div>
    <div class="celulas" style="display:grid;grid-template-columns:repeat(7,1fr)"></div></div>`);
  const cel=g.querySelector('.celulas');

  for(let i=0;i<42;i++){
    const dt=new Date(inicio); dt.setDate(inicio.getDate()+i);
    const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const doMes=dt.getMonth()===am-1;
    const ehHoje=iso===h;
    if(i>=35&&!doMes&&!Object.keys(porDia).some(k=>k>=iso))break;   // 6ª linha só se precisar
    const doDia=(porDia[iso]||[]);
    const cl=el(`<div class="diaCel" style="min-height:96px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);
      padding:6px;display:flex;flex-direction:column;gap:3px;cursor:${doDia.length?'pointer':'default'};
      background:${ehHoje?'var(--bg)':'transparent'};opacity:${doMes?'1':'.45'}">
      <div style="font-size:12.5px;font-weight:${ehHoje?'700':'500'};color:${ehHoje?'var(--tinta)':'var(--suave)'};
        ${ehHoje?'background:var(--tinta);color:#fff;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center':''}">${dt.getDate()}</div>
    </div>`);
    doDia.slice(0,3).forEach(e=>{
      if(e._faixa){
        // as margens negativas anulam o respiro da célula: as faixas de dias
        // vizinhos se encostam e viram uma linha só ao longo da semana
        const dom=dt.getDay()===0;   // recomeço de linha: vale repetir o nome
        const cantos=(e._ini?'5px':'0')+' '+(e._fim?'5px':'0')+' '+(e._fim?'5px':'0')+' '+(e._ini?'5px':'0');
        // fim antes de domingo: dia que é as duas coisas tem que dizer que acaba ali
        const rot=e._ini?e.ic+' '+esc(e.titulo):e._fim?'volta':dom?'↪ '+esc(e.titulo):'&nbsp;';
        cl.appendChild(el(`<div title="${esc(e.titulo)} — ${fmtDataAno(e.data)} a ${fmtDataAno(e.ate)}"
          style="background:${corFonte(e.fonte)};color:#fff;border-radius:${cantos};margin-left:-6px;margin-right:-6px;
          padding:2px 6px;font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
          ${e._fim?'text-align:right;opacity:.9':''}">${rot}</div>`));
        return;
      }
      cl.appendChild(el(`<div title="${esc(e.titulo)}" style="background:${corFonte(e.fonte)};color:#fff;border-radius:5px;
        padding:2px 6px;font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.titulo)}</div>`));
    });
    if(doDia.length>3) cl.appendChild(el(`<div style="font-size:10.5px;color:var(--suave);padding-left:3px">+${doDia.length-3} mais</div>`));
    if(doDia.length) cl.onclick=()=>modalDia(iso,doDia);
    cel.appendChild(cl);
  }
  cx.appendChild(g);
  return cx;
}

// o dia aberto: aqui cabe o detalhe que não cabe na célula

        <span style="width:4px;align-self:stretch;border-radius:3px;background:${corFonte(e.fonte)};flex:none"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600">${e.ic} ${esc(e.titulo)}${e.hora?' <span style="font-weight:400;color:var(--suave)">· '+esc(e.hora)+'</span>':''}
            ${e._faixa?'<span style="font-weight:400;color:var(--suave);font-size:12px">· '+(e._ini?'dia da ida':e._fim?'dia da volta':'em viagem')+'</span>':''}</div>
          ${e.sub?`<div style="font-size:12px;color:var(--suave);margin-top:1px">${esc(e.sub)}</div>`:''}
          ${e.ate?`<div style="font-size:12px;color:var(--suave)">${fmtDataAno(e.data)} a ${fmtDataAno(e.ate)}</div>`:''}
          <div style="font-size:11px;color:var(--suave);opacity:.75;margin-top:3px">${esc((FONTES_AGENDA.find(f=>f.k===e.fonte)||{}).rot||'')}</div>
        </div>
        ${e.proprio||e.ir?'<span style="color:var(--suave)">›</span>':''}</div>`);
      if(e.proprio) li.onclick=()=>{fechar();abreBloco('ag-lista');rr('agenda')()};

      tipo:CFG('tiposCompromisso')[0],obs:''});salvar();fechar();abreBloco('ag-lista');rr('agenda')()};
    fim.appendChild(bNovo);fim.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Fechar</button>');ok.onclick=fechar;fim.appendChild(ok);
    c.appendChild(fim);
  });
}

// aniversário do ano corrente (e do próximo, se o deste ano já passou)
function proximoAniversario(nascISO){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(nascISO||'')))return '';
  const md=String(nascISO).slice(5);
  const h=hoje(), ano=+h.slice(0,4);
  const esteAno=ano+'-'+md;
  return esteAno>=h?esteAno:(ano+1)+'-'+md;
}

/* Junta tudo que tem data. Cada item: {data, hora, titulo, sub, fonte, ic, ir}
   O campo 'ir' é para onde o clique leva — o dono do dado. */
function eventosDoEcossistema(){
  const ev=[];
  const h=hoje();
  // devolve tudo: quem escolhe o que mostrar é a tela, e as contagens dos chips
  // precisam do número REAL de cada categoria, não do que sobrou de um filtro
  const on=()=>true;

  if(on('compromissos')) (E.agenda||[]).forEach(a=>{if(a.data)ev.push({
    data:a.data,hora:a.hora||'',titulo:a.titulo||'(sem título)',
    sub:[a.local,a.tipo].filter(Boolean).join(' · '),fonte:'compromissos',ic:'📅',proprio:true,ref:a});});

  if(on('documentos')) (E.documentos||[]).forEach(d=>{if(d.validade)ev.push({
    data:d.validade,hora:'',titulo:(d.nome||'Documento')+' vence',
    sub:'de '+(d.dono||'Léo')+(d.numero?' · '+d.numero:''),fonte:'documentos',ic:'🪪',ir:'documentos'});});

  // A viagem é um PERÍODO, não dois pontos soltos: sai um evento só, com começo
  // e fim, e o calendário pinta a faixa de ponta a ponta. Ver "ida dia 12" e
  // "volta dia 16" em cantos opostos do mês não mostra que você passa cinco
  // dias fora — e é justamente isso que decide se cabe mais alguma coisa ali.
  if(on('viagens')) (E.viagens||[]).forEach(v=>{
    const nome=[v.evento,v.cidade].filter(Boolean).join(' · ')||'Viagem';
    if(!v.ida&&!v.volta)return;
    const de=v.ida||v.volta, ate=v.volta||v.ida;
    const dias=Math.round((new Date(ate+'T12:00')-new Date(de+'T12:00'))/864e5)+1;
    // o voo da ida é o que dá a hora: é ele que decide a que horas você sai de casa
    const voos=[...(v.passagens||[])].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
    const ida1=voos.find(p=>p.sentido!=='Volta'&&(p.hora||p.de))||voos[0];
    const trecho=ida1&&(ida1.de||ida1.para)?ida1.de+' → '+ida1.para:'';
    ev.push({data:de,ate:ate>de?ate:'',hora:(ida1&&ida1.hora)||'',titulo:nome,
      sub:[trecho,ida1&&ida1.voo?ida1.cia+' '+ida1.voo:'',v.status,dias>1?dias+' dias fora':'']
        .filter(Boolean).join(' · '),
      fonte:'viagens',ic:'✈️',ir:'viagens'});
  });

  if(on('aniversarios')){
    const todos=[...(E.pessoas||[]).map(p=>({nome:p.nome,nasc:p.nascimento,rel:p.relacao})),
      ...(E.perfil&&E.perfil.nascimento?[{nome:'Você',nasc:E.perfil.nascimento,rel:''}]:[])];
    todos.forEach(p=>{
      const d=proximoAniversario(p.nasc);
      if(!d||!String(p.nome||'').trim())return;
      const idade=+d.slice(0,4)-+String(p.nasc).slice(0,4);
      ev.push({data:d,hora:'',titulo:p.nome,
        sub:'faz '+idade+' ano'+(idade===1?'':'s')+(p.rel?' · '+p.rel:''),fonte:'aniversarios',ic:'🎂',ir:'guia'});
    });
  }

  if(on('acoes')) Object.entries(E.estrategia||{}).forEach(([emp,est])=>{
    (est.objetivos||[]).forEach(o=>(o.acoes||[]).forEach(a=>{
      if(a.ate&&a.status!=='Feita')ev.push({data:a.ate,hora:'',titulo:a.oque||'Ação',
        sub:emp+' · '+(o.titulo||'')+(a.quem?' · '+a.quem:'')+(a.status==='Travada'?' · 🚧 travada':''),
        fonte:'acoes',ic:'🎯',ir:'estrategia'});
    }));
  });

  if(on('oportunidades')) (E.oportunidades||[]).forEach(o=>{
    if(o.ate&&o.estagio!=='Arquivada'&&String(o.proximoPasso||'').trim())
      ev.push({data:o.ate,hora:'',titulo:o.proximoPasso,sub:'💡 '+(o.titulo||''),
        fonte:'oportunidades',ic:'💡',ir:'oportunidades'});
  });

  if(on('demandas')) (E.demandas||[]).forEach(d=>{
    if(d.prazo&&d.status!=='Concluída')ev.push({data:d.prazo,hora:'',titulo:d.titulo||'Demanda',
      sub:[d.area,d.prioridade&&'prioridade '+d.prioridade,d.status].filter(Boolean).join(' · '),
      fonte:'demandas',ic:'✅',ir:'demandas'});
  });

  if(on('seguros')) (E.seguros||[]).forEach(g=>{
    if(g.renova&&g.status!=='Cancelado')ev.push({data:g.renova,hora:'',
      titulo:'Renovar '+(g.tipo||'seguro')+(g.item?' — '+g.item:''),
      sub:[g.seguradora,g.apolice&&'apólice '+g.apolice].filter(Boolean).join(' · '),
      fonte:'seguros',ic:'🛡️',ir:'gastos'});
  });

  return ev.sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')));
}

function exportarIcs(){
  const z=n=>String(n).padStart(2,'0');
  const dt=(d,h)=>d.replace(/-/g,'')+(h?'T'+h.replace(':','')+'00':'');
  const linhas=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Central do Leo//PT-BR','CALSCALE:GREGORIAN'];
  E.agenda.forEach(a=>{
    if(!a.data)return;
    linhas.push('BEGIN:VEVENT','UID:'+a.id+'@centralleo');
    if(a.hora){linhas.push('DTSTART:'+dt(a.data,a.hora));
      const [H,M]=a.hora.split(':').map(Number);linhas.push('DTEND:'+dt(a.data,z((H+1)%24)+':'+z(M)))}
    else{linhas.push('DTSTART;VALUE=DATE:'+dt(a.data));linhas.push('DTEND;VALUE=DATE:'+dt(a.data))}
    linhas.push('SUMMARY:'+(a.titulo||'Compromisso').replace(/\n/g,' '));
    if(a.local)linhas.push('LOCATION:'+a.local.replace(/\n/g,' '));
    if(a.obs)linhas.push('DESCRIPTION:'+a.obs.replace(/\n/g,'\\n'));
    linhas.push('END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  baixar(new Blob([linhas.join('\r\n')],{type:'text/calendar'}),'agenda-leo-'+hoje()+'.ics');
}
async function importarIcs(file){
  const txt=(await file.text()).replace(/\r\n[ \t]/g,'');  // desdobra linhas longas
  const evs=txt.split('BEGIN:VEVENT').slice(1);let novos=0;
  evs.forEach(b=>{
    const pega=t=>{const m=b.match(new RegExp('^'+t+'[^:]*:(.*)$','mi'));return m?m[1].trim():''};
    const ini=pega('DTSTART');if(!ini)return;
    const d=ini.slice(0,8),data=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
    const hora=ini.length>9?ini.slice(9,11)+':'+ini.slice(11,13):'';
    const uid2=pega('UID'),titulo=pega('SUMMARY')||'(sem título)';
    if(E.agenda.some(a=>a.gid&&a.gid===uid2))return;                 // já importado
    if(E.agenda.some(a=>a.data===data&&a.titulo===titulo))return;    // duplicado óbvio
    E.agenda.push({id:uid(),gid:uid2,data,hora,titulo,local:pega('LOCATION'),
      tipo:'Pessoal',obs:pega('DESCRIPTION').replace(/\\n/g,'\n')});novos++;
  });
  salvar();tela();
  alert(novos?`${novos} compromisso(s) importado(s).`:'Nada novo — tudo já estava aqui.');
}

// quanto tempo a demanda levou (ou já está levando) — o número que mostra o que empaca
function diasDemanda(d){
  if(!d.criada) return {txt:'—'};
  const fim=d.status==='Concluída'?(d.concluidoEm||hoje()):hoje();
  const n=Math.max(0,Math.round((new Date(fim+'T12:00')-new Date(d.criada+'T12:00'))/864e5));
  if(d.status==='Concluída') return {txt:n+'d',cor:'var(--verde)'};
  return {txt:n+'d',cor:n>60?'var(--vermelho)':n>30?'var(--areia)':''};
}

      const ok=el('<button class="btn">✓ Marcar como concluída</button>');
      ok.onclick=()=>{d.status='Concluída';d.concluidoEm=hoje();salvar();fechar()};
      s3.appendChild(ok);
    } else { const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s3.appendChild(ok) }
    c.appendChild(s3);
  });
}

// Marcadores com alvo de longevidade (não só "normal do laboratório").
// [nome, unidade, faixa do laboratório, alvo ótimo, ruimSe]
// [nome, unidade, faixa do laboratório, alvo ótimo, fora da faixa do lab, fora do alvo ótimo]
// o 6º item é o que faz o "Atenção" existir: dentro do laudo, mas ainda longe do alvo.
const MARCADORES = [
  ['ApoB', 'mg/dL', '< 100', '< 80', v => v >= 100, v => v >= 80],
  ['LDL', 'mg/dL', '< 130', '< 100', v => v >= 130, v => v >= 100],
  ['HDL', 'mg/dL', '> 40', '> 50', v => v < 40, v => v < 50],
  ['Triglicérides', 'mg/dL', '< 150', '< 100', v => v >= 150, v => v >= 100],
  ['Lp(a)', 'mg/dL', '< 50', '< 30 (1x na vida)', v => v >= 50, v => v >= 30],
  ['Glicemia jejum', 'mg/dL', '70 a 99', '< 90', v => v >= 100, v => v >= 90],
  ['HbA1c', '%', '< 5,7', '< 5,4', v => v >= 5.7, v => v >= 5.4],
  ['Insulina', 'µU/mL', '2 a 25', '< 8', v => v > 10, v => v >= 8],
  ['PCR ultrassensível', 'mg/L', '< 3', '< 1', v => v >= 3, v => v >= 1],
  ['Testosterona total', 'ng/dL', '250 a 950', '> 500', v => v < 350, v => v < 500],
  ['Vitamina D', 'ng/mL', '30 a 100', '40 a 60', v => v < 30, v => v < 40 || v > 60],
  ['TSH', 'µUI/mL', '0,4 a 4,0', '1,0 a 2,5', v => v > 4 || v < 0.4, v => v > 2.5 || v < 1],
  ['PSA', 'ng/mL', '< 4', '< 2,5', v => v >= 4, v => v >= 2.5],
  ['Creatinina', 'mg/dL', '0,7 a 1,3', 'até 1,1', v => v > 1.3, v => v > 1.1],
  ['Ácido úrico', 'mg/dL', '3,5 a 7,2', '< 6', v => v > 7.2, v => v >= 6],
  ['Ferritina', 'ng/mL', '30 a 400', '50 a 150', v => v > 400 || v < 30, v => v < 50 || v > 150],
];
// Rastreios recomendados por idade (homem). [nome, idadeInicio, cadaXMeses, porquê]
// [nome, idade que começa, a cada N meses, para quê, onde procurar se já foi feito]
// o 5º item evita o rastreio ficar "nunca feito" para sempre: 'marcadores' olha os exames
// de sangue equivalentes e 'vitais' olha a tabela de sinais vitais.
const RASTREIOS = [
  ['Check-up com clínico / sangue completo', 30, 12, 'base de tudo',
    { marcadores: ['ApoB', 'LDL', 'HDL', 'Triglicérides', 'Glicemia jejum', 'HbA1c', 'Creatinina', 'Hemograma'] }],
  ['Dentista (limpeza)', 18, 6, 'gengiva ruim aumenta risco no coração', {}],
  ['Dermatologista (pele)', 30, 12, 'câncer de pele pega cedo e cura', {}],
  ['Pressão arterial', 25, 6, 'hipertensão não dá sintoma', { vitais: 'sis' }],
  ['Oftalmologista', 30, 24, 'visão e pressão ocular', {}],
  ['Escore de cálcio coronariano', 40, 60, 'mostra placa no coração antes do infarto', {}],
  ['Teste ergométrico / esforço', 40, 24, 'como o coração responde no esforço', {}],
  ['PSA + urologista', 45, 12, 'próstata', { marcadores: ['PSA'] }],
  ['Colonoscopia', 45, 120, 'câncer de intestino é curável quando pego cedo', {}],
  ['Ultrassom de abdome', 40, 24, 'fígado, rins, vesícula', {}],
];
const idadeDe = n => {
  if (!n) return null;
  const d = new Date(n + 'T12:00'), h = new Date();
  let i = h.getFullYear() - d.getFullYear();
  if (h < new Date(h.getFullYear(), d.getMonth(), d.getDate())) i--;
  return i;
};
const idadeLeo = () => idadeDe((E.perfil || {}).nascimento);
// último exame de um marcador
const ultimoDe = (nome) => E.exames.filter(x => x.exame === nome && x.valor !== '' && x.valor != null)
  .sort((a, b) => (b.data || '').localeCompare(a.data || ''))[0];
// semáforo de um exame: 'ok' | 'atencao' | 'ruim' | ''
function semaforo(x) {
  const m = MARCADORES.find(y => y[0] === x.exame);
  const v = parseFloat(String(x.valor).replace(',', '.'));
  if (!m || isNaN(v)) return x.resultado === 'Alterado' ? 'ruim' : x.resultado === 'Atenção' ? 'atencao' : x.resultado === 'Normal' ? 'ok' : '';
  if (m[4](v)) return 'ruim';          // fora até do laudo do laboratório
  if (m[5] && m[5](v)) return 'atencao'; // o laudo diz normal, mas ainda não é o alvo
  return 'ok';
}
// "Alterado" = fora até do laudo, procurar médico. "Fora do alvo" = o laudo diz normal, mas dá para melhorar.
const CHIP_SEM = { ok: ['var(--verde-cl)', 'var(--verde)', 'No alvo'], atencao: ['var(--areia-cl)', 'var(--areia)', 'Fora do alvo'], ruim: ['var(--vermelho-cl)', 'var(--vermelho)', 'Alterado'] };

  /* ---- 1. exames: um por marcador, com a evolução dentro ---- */
  const cx = el('<div></div>');

  // agrupa as medições por marcador; a linha mostra a última e para onde está indo

// rastreios: cruza a idade com o histórico de exames
function rastreiosPendentes(todos) {
  const idade = idadeLeo();
  if (!idade) return [];
  const h = hoje();
  const out = [];
  RASTREIOS.forEach(([nome, idadeIni, cada, porque, fonte]) => {
    if (idade < idadeIni) return;
    const alvo = [nome, ...((fonte && fonte.marcadores) || [])].map(normaliza);
    // o exame cadastrado vale se for o próprio rastreio ou um marcador equivalente
    const datas = E.exames.filter(x => alvo.includes(normaliza(x.exame || ''))).map(x => x.data);
    // pressão arterial é medida em Sinais vitais, não em Exames
    if (fonte && fonte.vitais)
      (E.vitais || []).forEach(x => { if (String(x[fonte.vitais] ?? '').trim() !== '') datas.push(x.data) });
    const ultima = datas.filter(Boolean).sort().pop() || null;
    let situacao = 'Nunca feito', venceEm = null;
    if (ultima) {
      const prox = new Date(ultima + 'T12:00'); prox.setMonth(prox.getMonth() + cada);
      venceEm = Math.round((prox - new Date(h + 'T12:00')) / 864e5);
      situacao = venceEm < 0 ? 'Atrasado' : venceEm < 60 ? 'Chegando' : 'Em dia';
    }
    const item = { nome, cada, ultima, situacao, venceEm, porque };
    if (todos || situacao === 'Nunca feito' || situacao === 'Atrasado' || situacao === 'Chegando') out.push(item);
  });
  return todos ? out : out.sort((a, b) => (a.venceEm ?? -9999) - (b.venceEm ?? -9999));
}

/* ---- Onde os anexos moram ----
   Vale mostrar isso: até 23/08/2026 eles ficavam presos ao navegador deste
   aparelho, e nada avisava. Trocar de celular perdia tudo em silêncio. */
function blocoAnexos(t){
  const cx=el('<div class="corpo"></div>');
  if(DEV){cx.appendChild(el('<div class="aviso">Rodando local: os anexos ficam só neste navegador.</div>'));return cx}
  cx.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:0 0 11px">'+
    'Os anexos ficam num espaço <b>privado</b> no servidor — nenhum endereço deles abre sem '+
    'uma assinatura de 5 minutos que só este painel sabe pedir. Cabem 25 MB por arquivo. '+
    'Anexar sem internet funciona: o arquivo espera aqui e sobe sozinho no próximo acesso.</p>'));
  const linha=el('<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"></div>');
  if(t.fila){
    cx.appendChild(el('<div class="aviso">⏳ <b>'+t.fila+' anexo(s)</b> ainda estão só neste aparelho. '+
      'Enquanto não subirem, eles não aparecem em outro celular nem entram no backup.</div>'));
    const b=el('<button class="btn">⬆ Enviar agora</button>');
    b.onclick=async()=>{b.disabled=true;b.textContent='Enviando…';
      await arqSubirPendentes(true);arqEsquecerIndice();tela()};
    linha.appendChild(b);
  } else {
    /* NÃO DIZER "✓ Tudo no servidor". Esta tela só enxerga a fila DESTE aparelho.
       Um anexo que ficou preso no celular antigo continua preso, e aqui apareceria
       um visto verde afirmando o contrário -- exatamente o tipo de mentira que o
       resto deste painel evita. */
    linha.appendChild(el('<span style="font-size:12.5px;color:var(--verde)">✓ Nada preso <b>neste</b> aparelho.</span>'));
  }
  const c=el('<button class="btn ghost">⬇ Baixar tudo (.zip)</button>');
  c.onclick=()=>exportarArquivos();
  linha.appendChild(c);
  cx.appendChild(linha);
  cx.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:12px 0 0;line-height:1.5">'+
    '<b>Só dá para ver a fila do aparelho em que você está.</b> Se você já anexou alguma coisa '+
    'em outro celular ou navegador — e ainda mais se foi antes de 23/08, quando os anexos passaram '+
    'a subir —, abra o painel <b>naquele</b> aparelho uma vez, com internet, e volte aqui. '+
    'O que estiver parado sobe sozinho; se não subir, o botão aparece.</p>'));
  return cx;
}

/* ---- Cópias de segurança: o servidor guarda, aqui se traz de volta ----
   O botão ⬇ Backup depende de você lembrar. Isto não depende: o banco tira
   uma cópia por dia, só quando algo mudou, e guarda 90 dias. Restaurar passa
   pelo caminho normal de gravação — mesma trava de concorrência do resto. */
function blocoCopias(){
  const cx=el('<div class="corpo"></div>');
  if(DEV){cx.appendChild(el('<div class="aviso">Rodando local: as cópias só aparecem no site de verdade.</div>'));return cx}
  cx.appendChild(el('<div class="vazio">Carregando…</div>'));
  (async()=>{
    let d;
    try{ d=await apiSync('POST',{acao:'backups'}); }
    catch(e){ cx.innerHTML='';cx.appendChild(el('<div class="aviso">Não consegui ler as cópias: '+esc(e.message)+'</div>'));return }
    const lista=d.backups||[];
    cx.innerHTML='';
    cx.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:0 0 11px">'+
      'O servidor guarda uma cópia por dia, e só quando alguma coisa mudou — 90 dias de histórico. '+
      'Restaurar traz a cópia para este aparelho e a envia como uma gravação comum: '+
      '<b>nada é apagado no servidor sem passar pela conferência de sempre</b>.</p>'));
    if(!lista.length){cx.appendChild(el('<div class="vazio">Nenhuma cópia ainda — a primeira sai amanhã de manhã.</div>'));return}
    const rol=el('<div class="rolagem"></div>');
    const tb=document.createElement('table');
    tb.innerHTML='<thead><tr><th>Quando</th><th>Há quanto tempo</th><th></th></tr></thead>';
    const corpo=document.createElement('tbody');
    lista.forEach(b=>{
      const dt=new Date(b.em);
      const dias=Math.round((Date.now()-dt.getTime())/864e5);
      const tr=document.createElement('tr');
      tr.innerHTML='<td style="padding:9px 10px"><b>'+fmtDataAno(b.em.slice(0,10))+'</b>'+
        '<span style="color:var(--suave);font-size:12px"> '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+'</span></td>'+
        '<td style="padding:9px 10px;color:var(--suave)">'+(dias===0?'hoje':dias===1?'ontem':'há '+dias+' dias')+'</td>'+
        '<td style="padding:9px 10px;text-align:right"></td>';
      const bt=el('<button class="btn ghost mini">↩ Restaurar</button>');
      bt.onclick=async()=>{
        // Os ANEXOS não voltam no tempo: quem apagou uma ficha levou os arquivos
        // dela junto, e nenhuma cópia traz arquivo de volta. Dizer isso antes é o
        // mínimo -- senão a ficha reaparece vazia e parece que a cópia veio torta.
        if(!confirm('Trazer a cópia de '+fmtDataAno(b.em.slice(0,10))+'?\n\n'+
          'Tudo que você lançou DEPOIS dela sai de cena. O estado de agora fica guardado '+
          'em Configurações → Versão descartada, então dá para voltar atrás.\n\n'+
          'Atenção: os ARQUIVOS anexados ficam como estão hoje — eles não voltam no tempo. '+
          'Uma ficha que você apagou volta sem os anexos dela.'))return;
        bt.disabled=true;bt.textContent='Trazendo…';
        try{
          const r2=await apiSync('POST',{acao:'backupPegar',id:b.id});
          if(!r2||!r2.dados)throw new Error('cópia vazia');
          guardaDescartado();                    // o estado de agora fica de lado
          localStorage.setItem(CHAVE,JSON.stringify(r2.dados));
          E=carregar();
          salvar();                              // marca _mt e agenda o envio
          await enviarNuvem();                   // sobe pelo caminho normal (CAS)
          tela();                                // recarregar mataria o envio agendado
          alert('Cópia de '+fmtDataAno(b.em.slice(0,10))+' aplicada.');
        }catch(e){bt.disabled=false;bt.textContent='↩ Restaurar';alert('Não consegui restaurar: '+(e.message||e))}
      };
      tr.lastElementChild.appendChild(bt);
      corpo.appendChild(tr);
    });
    tb.appendChild(corpo);rol.appendChild(tb);cx.appendChild(rol);
  })();
  return cx;
}


/* ================================================================
   FORTEMAIS — obras: o que custou, quem aportou, por quanto saiu.

   O DESENHO EM UMA FRASE: a ficha da obra e os aportes são poucos e
   editados à mão (moram no estado, sobem com o resto); o livro-caixa é
   grande e só cresce (mora em leo_obra_custos, tabela própria).

   O QUE ISTO RESPONDE, que a planilha do ERP sozinha não responde:
   · quanto sobrou de cada obra, depois de imposto e comissão;
   · quanto custou o m² -- o único número que compara uma obra com outra;
   · quanto foi de MÃO DE OBRA de hidráulica (o ERP só separa MATERIAL
     hidráulico; a especialidade da mão de obra está escondida no nome do
     prestador -- "FULANO BOMBEIRO" é o bombeiro);
   · quanto do dinheiro é aporte de sócio e quanto saiu do bolso do dono;
   · o que está escondido dentro de "Insumo diversos", que sozinho é 44%.

   APORTE NÃO É VENDA. No export do ERP o aporte vem com Tipo="Receita",
   e somá-lo como receita inflaria o resultado da obra em centenas de milhares. Ele
   é DINHEIRO QUE ENTROU PARA BANCAR A OBRA, não dinheiro ganho.
   ================================================================ */


/* el() não serve para <tr>: innerHTML num <div> descarta linha órfã de tabela
   e devolve nulo. Linha nasce como linha. */
const elTr=h=>{const tr=document.createElement('tr');tr.innerHTML=h;return tr};
const elTfoot=h=>{const tf=document.createElement('tfoot');tf.innerHTML=h;return tf};

/* De que natureza é este centro de custo. Serve para o cruzamento
   "material × mão de obra" por especialidade. */
function naturezaCentro(c){
  const x=String(c||'').toLowerCase();
  if(x.includes('mão de obra')||x.includes('mao de obra'))return 'Mão de obra';
  if(x.startsWith('insumo')||x.includes('material'))return 'Material';
  if(x.includes('aluguel'))return 'Equipamento';
  if(x==='terreno')return 'Terreno';
  if(x.includes('imposto')||x.includes('document')||x.includes('cartório')||x.includes('cartorio'))return 'Documentação e taxas';
  if(x==='projeto')return 'Projeto';
  return 'Outros';
}
/* A especialidade de um lançamento: primeiro o que o dono marcou no
   FORNECEDOR (uma marcação vale para todos os lançamentos dele), depois o
   que dá para deduzir do centro. Deduzir é palpite, então só onde é óbvio. */
function especDoCentro(c){
  const x=String(c||'').toLowerCase();
  if(x.includes('hidr'))return 'Hidráulica';
  if(x.includes('elétr')||x.includes('eletr'))return 'Elétrica';
  if(x==='terreno')return 'Terreno';
  if(x==='projeto')return 'Projeto';
  if(x.includes('document')||x.includes('cartório')||x.includes('cartorio')||x.includes('imposto'))return 'Documentação';
  if(x.includes('administrativo')||x.includes('condomínio')||x.includes('condominio')||x==='copasa'||x==='cemig')return 'Administrativo';
  return '';
}
const especDe=l=>(E.obraFornecedores[(l.fornecedor||'').trim()]||'')||especDoCentro(l.centro);

/* TIR de fluxos datados (o "XIRR" da planilha), por bisseção.
   Negativo = dinheiro que saiu; positivo = que voltou. Devolve % ao ano,
   ou null quando não há resposta (tudo saiu e nada voltou, ou vice-versa). */
function tirAnual(fluxos){
  const fs=fluxos.filter(f=>f.v&&f.d).map(f=>({t:new Date(f.d+'T12:00').getTime(),v:f.v}));
  if(fs.length<2||!fs.some(f=>f.v<0)||!fs.some(f=>f.v>0))return null;
  const t0=Math.min(...fs.map(f=>f.t));
  // tudo no mesmo dia: não existe "ao ano" — a bisseção despencaria para −100%
  if(Math.max(...fs.map(f=>f.t))===t0)return null;
  const vp=r=>fs.reduce((s2,f)=>s2+f.v/Math.pow(1+r,(f.t-t0)/31557600000),0);
  let lo=-0.9999,hi=100;
  if(vp(lo)*vp(hi)>0)return null;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;(vp(lo)*vp(m)<=0)?hi=m:lo=m}
  return (lo+hi)/2*100;
}


/* O retorno dos aportes, calculado num lugar SÓ — a tela e o PDF leem daqui.
   A % DE CADA UM É DO DONO: se ele preencher o rateio (o.rateio, por pessoa),
   é essa % que divide o lucro. O capital × tempo continua na tabela como
   SUGESTÃO — é o que cada real carregou de obra — mas não manda mais.
   Aporte datado DEPOIS do fim do recebimento não carrega tempo nenhum
   (máx(0, …)) e, na TIR, entra no próprio fim — dinheiro que chegou depois
   da festa não multiplica. */
function retornoAportes(o,rr2){
  const cc=contasObra(o,rr2);
  const meus=E.obraAportes.filter(x=>x.obra===o.id);
  const fim=o.recebidoEm||o.vendaData||'';
  const tFim=fim?new Date(fim+'T12:00').getTime():Date.now();
  const porQuem={};
  meus.forEach(x=>{
    const q=(x.quem||'?').trim()||'?';
    const r6=porQuem[q]??={total:0,capTempo:0,fluxos:[],forasDoTempo:0};
    const v6=+x.valor||0;
    r6.total+=v6;
    const tA=x.data?new Date(x.data+'T12:00').getTime():tFim;
    const meses=Math.max(0,(tFim-tA)/2629800000);
    r6.capTempo+=v6*meses;
    if(x.data&&tA>tFim)r6.forasDoTempo++;
    r6.fluxos.push({d:(x.data&&tA<=tFim)?x.data:(fim||x.data||hoje()),v:-v6});
  });
  const somaCT=Object.values(porQuem).reduce((s2,x)=>s2+x.capTempo,0);
  const rateio=o.rateio&&typeof o.rateio==='object'?o.rateio:{};
  const somaManual=Object.entries(porQuem).reduce((s2,[q])=>s2+(+rateio[q]||0),0);
  const usaManual=somaManual>0;
  const vendida=cc.venda>0&&!!fim;
  const linhas=Object.entries(porQuem).sort((x,y)=>y[1].total-x[1].total).map(([q,r6])=>{
    const fatiaCT=somaCT?r6.capTempo/somaCT:0;
    const fatia=usaManual?(+rateio[q]||0)/100:fatiaCT;
    const parte=vendida?cc.lucro*fatia:0;
    const recebe=r6.total+parte;
    const tir=vendida?tirAnual([...r6.fluxos,{d:fim,v:recebe}]):null;
    // ROI: quanto o dinheiro rendeu no TOTAL, sem olhar o relógio.
    // A TIR olha o relógio; os dois juntos contam a história inteira.
    const roi=vendida&&r6.total?parte/r6.total*100:null;
    return {quem:q,total:r6.total,fatiaCT,fatia,parte,recebe,tir,roi,
      pctManual:rateio[q]===undefined?'':rateio[q],forasDoTempo:r6.forasDoTempo};
  });
  return {linhas,usaManual,somaManual,vendida,fim,lucro:cc.lucro};
}

/* ---- as contas de uma obra ----
   Uma função só, para os cartões e a ficha nunca discordarem. */
function contasObra(o,r){
  const custo=(r&&r.total)||0;
  const aporte=E.obraAportes.filter(x=>x.obra===o.id).reduce((s,x)=>s+(+x.valor||0),0);
  const venda=+o.vendaValor||0;
  /* Imposto e comissão são LANÇADOS, não calculados — decisão do dono
     ("manual tb não percentual"). Percentual bonito que ninguém confere vira
     número falso; o valor pago de verdade ele tem no comprovante. */
  const imposto=+o.impostoValor||0;
  const comissao=+o.comissaoValor||0;
  const outras=+o.outrasDeducoes||0;
  const liquido=venda-imposto-comissao-outras;
  const lucro=venda?liquido-custo:0;
  const margem=venda?lucro/venda*100:0;
  const area=+o.area||0;
  const meses=(r&&r.de&&r.ate)?Math.max(1,Math.round((new Date(r.ate)-new Date(r.de))/2629800000)):0;
  /* O custo/m² segue a SELEÇÃO do dono (obraM2Fora): ele escolhe se o
     terreno, os impostos, a documentação e a comissão entram ou não na conta.
     A escolha é global — o m² de uma obra só compara com o da outra se as
     duas somarem as mesmas coisas. "Comissão da venda" e "Imposto da venda"
     são grupos sintéticos: não são lançamentos, vêm da ficha da venda. */
  const fora=new Set(E.obraM2Fora||[]);
  let custoSel=0;
  if(r)for(const [k,v] of Object.entries(r.centros||{}))if(!fora.has(k))custoSel+=v.total;
  if(!fora.has('Comissão da venda'))custoSel+=comissao;
  if(!fora.has('Imposto da venda'))custoSel+=imposto;
  const custoTudo=custo+comissao+imposto;
  return {custo,aporte,venda,imposto,comissao,outras,liquido,lucro,margem,area,meses,custoSel,custoTudo,
    porM2:area?custoSel/area:0, porM2Tudo:area?custoTudo/area:0, vendaM2:area&&venda?venda/area:0,
    // quanto do custo NÃO veio de aporte de sócio: saiu do caixa do dono
    proprio:custo-aporte,
    // lucro por mês de obra: 20% em 8 meses vale mais que 30% em 3 anos
    porMes:meses?lucro/meses:0,
    retorno:aporte?lucro/aporte*100:0};
}

/* ---------------- a tela ---------------- */
async function vFortemais(m){

  const resumo=await fmResumo();

  }
  const R=resumo||{};
  const contas=E.obras.map(o=>({o,r:R[o.id]||null,c:contasObra(o,R[o.id])}));

  /* O ANO da obra é o ano em que o dinheiro TERMINOU de entrar — regra do dono
     ("vamos considerar o ano pela finalização do recebimento"). Enquanto o
     recebimento não acaba, a obra fica em "Em aberto". */
  const anoDe=o=>String(o.recebidoEm||o.vendaData||'').slice(0,4);
  const anos=[...new Set(contas.map(x=>anoDe(x.o)).filter(Boolean))].sort().reverse();
  const temAberta=contas.some(x=>!anoDe(x.o));
  if(!filtro.fmAno)filtro.fmAno='todas';

  const novaObra=()=>{const o={id:uid(),nome:'',empresa:'Fortemais',tipo:CFG('tiposObra')[0],

    E.obras.push(o);salvar();filtro.fmAberta=o.id;r()};

  m.appendChild(painel('Ano',
    seletor(filtro.fmAno,[['todas','Todas'],...(temAberta?[['aberto','Em aberto']]:[]),...anos.map(a2=>[a2,a2])],
      v=>{filtro.fmAno=v;r()}),

  const visiveis=contas.filter(x=>{
    const an=anoDe(x.o);
    if(filtro.fmAno==='todas')return true;
