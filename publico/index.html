    return an===filtro.fmAno;
  });

  const oc=el('<div class="corpo" style="padding-top:2px"></div>');
  if(!E.obras.length){
    oc.appendChild(el('<div class="vazio">Nenhuma obra ainda. Quando terminar uma, lance aqui — ou traga o export do ERP no bloco abaixo.</div>'));
  } else if(!visiveis.length){
    oc.appendChild(el('<div class="vazio">Nenhuma obra neste ano.</div>'));
  }
  visiveis.forEach(({o,c})=>{
    const aberta=filtro.fmAberta===o.id;
    const an=anoDe(o);
    const cont=el('<div style="border-bottom:1px solid var(--linha)"></div>');
    const linha=el(`<div style="display:flex;align-items:center;gap:10px;padding:12px 6px;cursor:pointer;flex-wrap:wrap">
      <b>${esc(o.nome||'Obra sem nome')}</b>
      ${an?`<span class="tag">${an}</span>`:'<span class="tag">em aberto</span>'}
      <span class="cresce"></span>
      <span style="font-size:11px;color:var(--suave)">custo</span>
      <span style="color:var(--vermelho);font-variant-numeric:tabular-nums;font-weight:600">${brl(c.custo)}</span>
      <span style="font-size:11px;color:var(--suave)">lucro</span>
      <span style="color:${c.venda?(c.lucro>=0?'var(--verde)':'var(--vermelho)'):'var(--suave)'};font-variant-numeric:tabular-nums;font-weight:600;min-width:104px;text-align:right">${c.venda?brl(c.lucro):'—'}</span>
      <span class="seta" style="transform:rotate(${aberta?0:-90}deg);transition:transform .15s">▼</span>
    </div>`);
    linha.onclick=()=>{filtro.fmAberta=aberta?null:o.id;r()};
    cont.appendChild(linha);
    if(aberta){
      const det=el('<div style="padding:2px 6px 18px"></div>');
      det.appendChild(el('<div class="vazio" style="padding:14px">Abrindo…</div>'));
      cont.appendChild(det);
      fichaObraEm(det,o,()=>{filtro.fmAberta=null;r()}).then(()=>{det.firstElementChild&&det.firstElementChild.classList&&det.firstElementChild.remove()});
    }
    oc.appendChild(cont);
  });
  if(visiveis.length){
    const totC=visiveis.reduce((s2,x)=>s2+x.c.custo,0);
    const vend=visiveis.filter(x=>x.c.venda>0);
    const totL=vend.reduce((s2,x)=>s2+x.c.lucro,0);
    oc.appendChild(el(`<div style="display:flex;gap:10px;justify-content:flex-end;padding:11px 6px 2px;font-size:12.5px;color:var(--suave)">
      ${visiveis.length} obra(s) · custo <b style="color:var(--vermelho)">${brl(totC)}</b>
      ${vend.length?` · lucro <b style="color:${totL>=0?'var(--verde)':'var(--vermelho)'}">${brl(totL)}</b>`:''}</div>`));
  }
  m.appendChild(bloco('fm-obras','🏗️ Obras','uma linha por obra — clique para expandir',oc));

  /* ---- comparar obras: é onde o dinheiro vaza ---- */
  if(contas.filter(x=>x.c.custo>0).length>1){
    const cp=el('<div class="corpo"></div>');
    cp.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:0 0 11px">Mesma conta, obras diferentes. É aqui que aparece o que saiu do lugar — se a hidráulica de uma foi 4% e a de outra 9%, tem motivo.</p>'));
    const comp=contas.filter(x=>x.c.custo>0);
    const rol=el('<div class="rolagem"></div>');
    const t=document.createElement('table');
    t.innerHTML='<thead><tr><th>Obra</th><th style="text-align:right">Custo</th><th style="text-align:right">R$/m² (grupos escolhidos)</th>'
      +'<th style="text-align:right">Venda</th><th style="text-align:right">Lucro</th><th style="text-align:right">Margem</th><th style="text-align:right">Meses</th></tr></thead>';
    const tb=document.createElement('tbody');
    comp.forEach(({o,c})=>{
      tb.appendChild(elTr(`<td style="padding:8px 10px">${esc(o.nome||'—')}</td>
        <td class="num" style="padding:8px 10px">${brl(c.custo)}</td>
        <td class="num" style="padding:8px 10px">${c.porM2?brl(c.porM2):'—'}</td>
        <td class="num" style="padding:8px 10px">${c.venda?brl(c.venda):'—'}</td>
        <td class="num" style="padding:8px 10px;color:${c.venda?(c.lucro>=0?'var(--verde)':'var(--vermelho)'):'inherit'}">${c.venda?brl(c.lucro):'—'}</td>
        <td class="num" style="padding:8px 10px">${c.venda?c.margem.toFixed(1)+'%':'—'}</td>
        <td class="num" style="padding:8px 10px">${c.meses||'—'}</td>`));
    });
    t.appendChild(tb);rol.appendChild(t);cp.appendChild(rol);
    // custo/m² lado a lado
    const comM2=comp.filter(x=>x.c.porM2>0);
    if(comM2.length>1) cp.appendChild(el(`<div style="margin-top:14px">
      <div style="font-size:12.5px;color:var(--suave);margin-bottom:6px">Custo por m²</div>
      ${gBarras(comM2.map(x=>({r:x.o.nome||'—',v:x.c.porM2})))}</div>`));
    m.appendChild(bloco('fm-comparar','📐 Comparar obras','o mesmo número, obra a obra',cp));
  }

  m.appendChild(bloco('fm-importar','📥 Trazer do ERP','o arquivo que você exporta, do jeito que ele sai',blocoImportarObra()));
}


/* ---------------- a ficha de uma obra ---------------- */
/* A ficha desenha DENTRO da linha expandida — o dono pediu lista enxuta,
   não modal: "na obra essa ser só uma linha que quando eu abrir ela expandir". */
async function fichaObraEm(c,o,fechar){
    // depois de lançar ou apagar um custo, a ficha se redesenha com dados frescos
    const recarregar=()=>{fmEsquecer();c.innerHTML='<div class="vazio">Atualizando…</div>';fichaObraEm(c,o,fechar)};
    let planoAberto=null;      // qual plano de contas está expandido (sobrevive ao repintar)
    let corrigindo=null;       // id do lançamento em correção
    const R=(await fmResumo())||{};
    const rr2=R[o.id]||null;
    const cx=contasObra(o,rr2);
    const custos=rr2?await fmCustos(o.id):[];

    const pinta=()=>{c.innerHTML='';montar()};
    /* Os subtítulos da ficha abrem e fecham no toque. O estado mora em
       E.colapso — o mesmo lugar dos blocos das telas — e vale para TODAS as
       obras: quem fecha "Fornecedores" numa, quer fechada nas outras. */
    const secR=(titulo)=>{
      const id='obf-'+titulo.toLowerCase().replace(/[^a-z0-9à-ÿ]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
      const fechada=!!E.colapso[id];
      const sc=el('<div class="secao'+(fechada?' fechada':'')+'"></div>');
      const h=el(`<h4 style="cursor:pointer;user-select:none"><span class="seta" style="display:inline-block;font-size:10px;margin-right:6px;transform:rotate(${fechada?-90:0}deg);transition:transform .15s">▼</span>${titulo}</h4>`);
      h.onclick=()=>{E.colapso[id]=!E.colapso[id];salvar();pinta()};
      sc.appendChild(h);
      return sc;
    };
    const montar=()=>{
    const cc=contasObra(o,(_fmResumo||{})[o.id]||rr2);

    /* --- o resultado, sempre à vista --- */
    c.appendChild(el(`<div class="grade" style="gap:8px;margin-bottom:4px">
      ${kpi('Custo',brl(cc.custo),cc.area?brl(cc.porM2)+'/m² nos grupos escolhidos':'')}
      ${kpi('Aportes',brl(cc.aporte),cc.proprio>0?brl(cc.proprio)+' do seu bolso':'','a')}
      ${kpi('Venda líquida',cc.venda?brl(cc.liquido):'—',cc.venda?'venda '+brl(cc.venda)+' − imposto '+brl(cc.imposto)+' − comissão '+brl(cc.comissao):'')}
      ${kpi('Lucro',cc.venda?brl(cc.lucro):'—',cc.venda?cc.margem.toFixed(1)+'%'+(cc.aporte?' · '+cc.retorno.toFixed(0)+'% sobre o aporte':''):'ainda não vendida',cc.venda?(cc.lucro>=0?'p':'v'):'')}
    </div>`));

    /* --- a ficha --- */
    const s1=secR('Ficha');
    s1.appendChild(campos(o,[
      {k:'nome',t:'Nome da obra',ph:'ex.: Casa Vila Segura 27'},
      {k:'tipo',t:'Tipo',tipo:'select',opcoes:CFG('tiposObra')},
      {k:'status',t:'Status',tipo:'select',opcoes:CFG('statusObra')},
      {k:'empresa',t:'Por qual empresa correu',tipo:'select',opcoes:[...new Set(['Fortemais',...E.empresasPJ.map(x=>x.nome).filter(Boolean)])]},
      {k:'endereco',t:'Endereço',full:true},
      {k:'area',t:'Área construída (m²)',tipo:'number'},
      {k:'areaTerreno',t:'Área do terreno (m²)',tipo:'number'},
      {k:'inicio',t:'Início',tipo:'date'},
      {k:'fim',t:'Fim (ou previsão)',tipo:'date'},
      {k:'obs',t:'Anotações',tipo:'textarea',full:true},
    ],()=>{salvar()}));
    c.appendChild(s1);

    /* --- centro de custo --- */
    const s2=secR('Para onde foi o dinheiro');
    if(!rr2){
      s2.appendChild(el('<div class="vazio">Nenhum custo lançado. Traga o export do ERP na tela principal, bloco 📥.</div>'));
    } else {
      /* Cada plano de contas ABRE: clicar mostra quem está lá dentro,
         lançamento a lançamento, e o ✎ corrige na hora — inclusive mudando o
         lançamento de plano, que é a correção mais comum ("isso não era
         Insumo diversos, era Elétrica"). A correção grava por cima da mesma
         linha no servidor; reimportar o MESMO arquivo do ERP a desfaz, porque
         a chave é a do ERP — o certo é corrigir também lá quando der. */
      s2.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:0 0 9px">Clique num plano para ver quem está dentro — e corrigir o que estiver no lugar errado.</p>'));
      const cents=Object.entries(rr2.centros).sort((x,y)=>y[1].total-x[1].total);
      const rol=el('<div class="rolagem"></div>');
      const t=document.createElement('table');
      t.innerHTML='<thead><tr><th>Plano de contas</th><th style="text-align:right">Valor</th><th style="text-align:right">%</th><th style="text-align:right">Lanç.</th></tr></thead>';
      const tb=document.createElement('tbody');
      cents.forEach(([k,v])=>{
        const aberto=planoAberto===k;
        const tr=elTr(`<td style="padding:8px 10px"><span class="seta" style="display:inline-block;transform:rotate(${aberto?0:-90}deg);font-size:10px;margin-right:5px">▼</span><b>${esc(k)}</b></td>
          <td class="num" style="padding:8px 10px">${brl(v.total)}</td>
          <td class="num" style="padding:8px 10px;color:var(--suave)">${(v.total/rr2.total*100).toFixed(1)}%</td>
          <td class="num" style="padding:8px 10px;color:var(--suave)">${v.n}</td>`);
        tr.style.cursor='pointer';
        tr.onclick=()=>{planoAberto=aberto?null:k;corrigindo=null;pinta()};
        tb.appendChild(tr);
        if(aberto){
          const dentro=custos.filter(l=>((l.centro||'').trim()||'(sem centro)')===k)
            .slice().sort((x,y)=>(y.data||'').localeCompare(x.data||''));
          const cel=elTr('<td colspan="4" style="padding:0 0 12px"></td>');
          const caixa=el('<div style="max-height:340px;overflow-y:auto;border:1px solid var(--linha);border-radius:8px;margin:0 6px"></div>');
          dentro.forEach(l=>{
            if(corrigindo===l.id){
              /* editor da linha: escreve num RASCUNHO, não no registro — quem
                 grava é o servidor; cancelar não pode deixar sujeira local */
              const ras={data:l.data||'',nome:l.nome||'',centro:(l.centro||'').trim()||CFG('centrosObra')[0],
                fornecedor:l.fornecedor||'',valor:+l.valor||0};
              const ed=el('<div style="padding:10px 12px;border-bottom:1px solid var(--linha);background:color-mix(in srgb,var(--verde) 5%,transparent)"></div>');
              ed.appendChild(campos(ras,[
                {k:'data',t:'Data',tipo:'date'},
                {k:'valor',t:'Valor',tipo:'moeda'},
                {k:'nome',t:'O que foi'},
                {k:'centro',t:'Plano de contas',tipo:'select',
                  opcoes:[...new Set([ras.centro,...CFG('centrosObra')])]},
                {k:'fornecedor',t:'Fornecedor'},
              ],()=>{}));
              const lin2=el('<div style="display:flex;gap:8px;margin-top:9px"></div>');
              const bs=el('<button class="btn mini">Salvar correção</button>');
              bs.onclick=async()=>{
                bs.disabled=true;bs.textContent='Gravando…';
                try{
                  const d4=await apiSync('POST',{acao:'obraCustosGravar',linhas:[{
                    id:l.id,obra:l.obra||o.id,data:ras.data,nome:ras.nome,centro:ras.centro,
                    fornecedor:ras.fornecedor,valor:+ras.valor,forma:l.forma||'',conta:l.conta||'',
                    valor_original:l.valor_original===undefined?null:l.valor_original,
                    origem:l.origem||'correção'}]});
                  if(!d4||!d4.ok)throw new Error((d4&&d4.erro)||'falha ao gravar');
                  planoAberto=ras.centro;corrigindo=null;recarregar();
                }catch(e){bs.disabled=false;bs.textContent='Salvar correção';alert('Não gravou: '+(e.message||e))}
              };
              const bc=el('<button class="btn ghost mini">Cancelar</button>');
              bc.onclick=()=>{corrigindo=null;pinta()};
              lin2.appendChild(bs);lin2.appendChild(bc);ed.appendChild(lin2);
              caixa.appendChild(ed);
              return;
            }
            const li2=el(`<div style="display:flex;gap:9px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--linha);font-size:12.5px">
              <span style="color:var(--suave);white-space:nowrap">${l.data?fmtData(l.data):'—'}</span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.nome||'—')}</span>
              <span style="color:var(--suave);max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.fornecedor||'')}</span>
              <span class="num" style="color:var(--vermelho);font-variant-numeric:tabular-nums;white-space:nowrap">${brl(l.valor)}</span>
            </div>`);
            const be=el('<button class="btn ghost mini" title="Corrigir este lançamento">✎</button>');
            be.onclick=()=>{corrigindo=l.id;pinta()};
            li2.appendChild(be);
            caixa.appendChild(li2);
          });
          cel.firstElementChild.appendChild(caixa);
          tb.appendChild(cel);
        }
      });
      t.appendChild(tb);
      t.appendChild(elTfoot(`<tr class="tfim"><td>Total</td><td class="num">${brl(rr2.total)}</td><td></td><td class="num">${rr2.n}</td></tr>`));
      rol.appendChild(t);s2.appendChild(rol);
      s2.appendChild(el(`<div style="margin-top:12px">${gRosca(cents.slice(0,8).map(([k,v])=>({r:k,v:v.total})))}</div>`));
    }
    c.appendChild(s2);

    /* --- custo por m²: o dono escolhe o que entra ---
       "quanto custou o m² DA CONSTRUÇÃO" e "quanto custou o m² com tudo" são
       perguntas diferentes e as duas são legítimas. Cada grupo é um botão:
       aceso entra na conta, apagado sai. A escolha vale para TODAS as obras
       (obraM2Fora é global) — senão uma obra somaria terreno e a outra não,
       e a comparação viraria mentira. */
    if(rr2&&(+o.area>0||true)){
      const s2m=secR('Custo por m² — escolha o que entra');
      const grupos=Object.entries(rr2.centros).sort((x,y)=>y[1].total-x[1].total)
        .map(([k,v])=>({k,v:v.total}));
      const cc2=contasObra(o,rr2);
      if(cc2.comissao)grupos.push({k:'Comissão da venda',v:cc2.comissao});
      if(cc2.imposto)grupos.push({k:'Imposto da venda',v:cc2.imposto});
      const chips=el('<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px"></div>');
      grupos.forEach(g=>{
        const foraAgora=(E.obraM2Fora||[]).includes(g.k);
        const b2=el(`<button class="chip" style="cursor:pointer;border:1px solid ${foraAgora?'var(--linha)':'var(--verde)'};
          background:${foraAgora?'transparent':'color-mix(in srgb,var(--verde) 12%,transparent)'};
          color:${foraAgora?'var(--suave)':'inherit'};${foraAgora?'text-decoration:line-through;':''}"
          title="${foraAgora?'clique para voltar a somar':'clique para tirar da conta'}">${esc(g.k)} · ${brl(g.v)}</button>`);
        b2.onclick=()=>{
          if(!Array.isArray(E.obraM2Fora))E.obraM2Fora=[];
          const i2=E.obraM2Fora.indexOf(g.k);
          if(i2>=0)E.obraM2Fora.splice(i2,1);else E.obraM2Fora.push(g.k);
          salvar();pinta();
        };
        chips.appendChild(b2);
      });
      s2m.appendChild(chips);
      if(+o.area>0){
        const nForaComValor=grupos.filter(g=>(E.obraM2Fora||[]).includes(g.k)).length;
        s2m.appendChild(el(`<div class="grade" style="gap:8px">
          ${kpi('m² nos grupos escolhidos',brl(cc2.porM2),brl(cc2.custoSel)+' ÷ '+cc2.area+' m²')}
          ${nForaComValor?kpi('m² somando tudo',brl(cc2.porM2Tudo),brl(cc2.custoTudo)+' com o que você tirou','a'):''}
        </div>`));
        if(!nForaComValor)s2m.appendChild(el('<p style="font-size:12.5px;color:var(--suave);margin:6px 0 0">Tudo está entrando na conta. Toque num grupo para tirá-lo — terreno e comissão são os que mais distorcem a comparação entre obras.</p>'));
      } else {
        s2m.appendChild(el('<div class="aviso">Preencha a <b>área construída (m²)</b> na Ficha lá em cima — sem ela não há divisão.</div>'));
      }
      c.appendChild(s2m);
    }

    /* --- lançar despesa à mão ---
       Nem tudo vem do ERP: a diária paga em dinheiro, a taxa do cartório, o
       frete avulso. O lançamento manual grava NA MESMA tabela dos importados
       (id próprio, origem "manual") — uma fonte só de verdade, e o reimporte
       do arquivo não mexe nele porque a chave é outra. */
    const s2b=secR('Lançar despesa');
    const nvo={data:hoje(),nome:'',centro:CFG('centrosObra')[0],fornecedor:'',valor:0};
    s2b.appendChild(campos(nvo,[
      {k:'data',t:'Data',tipo:'date'},
      {k:'valor',t:'Valor',tipo:'moeda'},
      {k:'nome',t:'O que foi',ph:'ex.: diária pedreiro, taxa cartório'},
      {k:'centro',t:'Centro de custo',tipo:'select',opcoes:CFG('centrosObra')},
      {k:'fornecedor',t:'Fornecedor / quem recebeu',tipo:'sugestao',
        opcoes:rr2?Object.keys(rr2.fornecedores).filter(x=>x!=='(sem fornecedor)').sort():[]},
    ],()=>{}));
    const bl=el('<button class="btn" style="margin-top:11px">Lançar despesa</button>');
    bl.onclick=async()=>{
      // o clique tira o foco do campo de valor antes do handler: o blur já gravou
      if(!(+nvo.valor)){alert('Sem valor não há lançamento.');return}
      if(!String(nvo.nome).trim()){alert('Diga o que foi — sem isso a linha não conta história.');return}
      bl.disabled=true;bl.textContent='Lançando…';
      try{
        const d2=await apiSync('POST',{acao:'obraCustosGravar',linhas:[{
          id:uid(),obra:o.id,data:nvo.data,nome:String(nvo.nome).trim(),
          centro:nvo.centro,fornecedor:String(nvo.fornecedor).trim(),
          valor:+nvo.valor,forma:'',conta:'',valor_original:+nvo.valor,origem:'manual'}]});
        if(!d2||!d2.ok)throw new Error((d2&&d2.erro)||'falha ao gravar');
        recarregar();
      }catch(e){bl.disabled=false;bl.textContent='Lançar despesa';
        alert('Não consegui lançar: '+(e.message||e)+'\nNada foi gravado — tente de novo com internet.')}
    };
    s2b.appendChild(bl);
    c.appendChild(s2b);

    /* --- últimos lançamentos: conferir e poder apagar --- */
    if(custos.length){
      const s2c=secR('Últimos lançamentos');
      const ults=custos.slice(-12).reverse();
      const rolU=el('<div class="rolagem"></div>');
      const tU=document.createElement('table');
      tU.innerHTML='<thead><tr><th>Data</th><th>O que</th><th>Centro</th><th>Quem</th><th style="text-align:right">Valor</th><th style="width:34px"></th></tr></thead>';
      const tbU=document.createElement('tbody');
      ults.forEach(l=>{
        const tr=elTr(`<td style="padding:8px 10px;white-space:nowrap">${l.data?fmtDataAno(l.data):'—'}</td>
          <td style="padding:8px 10px">${esc(l.nome||'—')}${l.origem==='manual'?' <span class="tag" style="font-size:10px">manual</span>':''}</td>
          <td style="padding:8px 10px;color:var(--suave)">${esc(l.centro||'—')}</td>
          <td style="padding:8px 10px;color:var(--suave)">${esc(l.fornecedor||'—')}</td>
          <td class="num" style="padding:8px 10px;color:var(--vermelho)">${brl(l.valor)}</td>
          <td style="padding:8px 10px"></td>`);
      const bx=el('<button class="lixo" title="Apagar">✕</button>');
        bx.onclick=async()=>{
          const doErP=l.origem&&l.origem!=='manual';
          if(!confirm('Apagar "'+(l.nome||'lançamento')+'" ('+brl(l.valor)+')?'+
            (doErP?'\n\nEle veio do arquivo do ERP: se você importar o mesmo arquivo de novo, ele VOLTA.':'')))return;
          bx.disabled=true;
          try{
            const d3=await apiSync('POST',{acao:'obraCustosApagar',ids:[l.id]});
            if(!d3||!d3.ok)throw new Error((d3&&d3.erro)||'falha ao apagar');
            recarregar();
          }catch(e){bx.disabled=false;alert('Não consegui apagar: '+(e.message||e))}
        };
        tr.lastElementChild.appendChild(bx);
        tbU.appendChild(tr);
      });
      tU.appendChild(tbU);rolU.appendChild(tU);s2c.appendChild(rolU);
      if(custos.length>12)s2c.appendChild(el('<p style="font-size:12px;color:var(--suave);margin-top:7px">Mostrando os 12 mais recentes de '+custos.length+'. O total lá de cima soma TODOS.</p>'));
      c.appendChild(s2c);
    }

    /* --- especialidades: o cruzamento que o ERP não faz --- */
    if(custos.length){
      const s3=secR('Por especialidade — material × mão de obra');
      const esp={};
      let semDono=0,semDonoV=0;
      custos.forEach(l=>{
        const e2=especDe(l);
        const nat=naturezaCentro(l.centro);
        if(!e2){if(nat==='Mão de obra'||nat==='Material'){semDono++;semDonoV+=(+l.valor||0)}return}

/* ---------------- trazer do ERP ----------------
   O arquivo "Resultados_....xlsx" que o ERP exporta é um zip com XML dentro.
   O do ERP vem SEM compressão (o lerZip daqui já abre); se o Léo abrir no
   Excel e salvar, vira comprimido (deflate) e com strings compartilhadas --
   os dois caminhos estão cobertos: deflate via DecompressionStream, que é
   do próprio navegador. Nenhuma biblioteca externa. */
async function lerZipAuto(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let fim=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-65558;i--)
    if(dv.getUint32(i,true)===0x06054b50){fim=i;break}
  if(fim<0)throw new Error('não parece um arquivo .xlsx');
  const n=dv.getUint16(fim+10,true);let off=dv.getUint32(fim+16,true);
  const out={};
  for(let e=0;e<n;e++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const metodo=dv.getUint16(off+10,true);
    const tamComp=dv.getUint32(off+20,true);
    const nomeLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),comLen=dv.getUint16(off+32,true);
    const local=dv.getUint32(off+42,true);
    const nome=new TextDecoder().decode(u8.subarray(off+46,off+46+nomeLen));
    const ln=dv.getUint16(local+26,true),le=dv.getUint16(local+28,true);
    const ini=local+30+ln+le;
    const bruto=u8.subarray(ini,ini+tamComp);
    if(metodo===0)out[nome]=bruto;
    else if(metodo===8){
      const ds=new DecompressionStream('deflate-raw');
      const r=new Response(new Blob([bruto]).stream().pipeThrough(ds));
      out[nome]=new Uint8Array(await r.arrayBuffer());
    }
    off+=46+nomeLen+extraLen+comLen;
  }
  return out;
}
function linhasDoXlsx(zip){
  const dec=b=>new TextDecoder().decode(b);
  // strings compartilhadas (Excel salva assim; o export do ERP não usa)
  const comp=[];
  if(zip['xl/sharedStrings.xml'])
    for(const m of dec(zip['xl/sharedStrings.xml']).matchAll(/<si>([\s\S]*?)<\/si>/g))
      comp.push([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));
  const folha=Object.keys(zip).find(k=>/^xl\/worksheets\/sheet1\.xml$/.test(k))||Object.keys(zip).find(k=>/^xl\/worksheets\/.*\.xml$/.test(k));
  if(!folha)throw new Error('planilha sem aba');
  const des=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  const linhas=[];
  for(const mr of dec(zip[folha]).matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){
    const cels={};
    for(const mc of mr[1].matchAll(/<c r="([A-Z]+)\d+"([^>]*)>([\s\S]*?)<\/c>/g)){
      const col=mc[1],attrs=mc[2],corpo=mc[3];
      let v='';
      const t=(attrs.match(/t="(\w+)"/)||[])[1]||'';
      if(t==='inlineStr'){v=[...corpo.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')}
      else{const mv=corpo.match(/<v>([\s\S]*?)<\/v>/);v=mv?mv[1]:''}
      if(t==='s')v=comp[+v]??'';
      cels[col]=des(v);
    }
    linhas.push(cels);
  }
  return linhas;
}
const colLetra=i=>{let s2='';i++;while(i>0){s2=String.fromCharCode(65+(i-1)%26)+s2;i=Math.floor((i-1)/26)}return s2};
/* data do ERP vem "23/02/2022"; salvo pelo Excel pode virar número de série */
function dataPlan(v){
  const t=String(v||'').trim();
  let m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(m)return m[3]+'-'+m[2]+'-'+m[1];
  m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0].slice(0,10);
  const n=+t; if(n>25569&&n<73050)return new Date(Math.round((n-25569)*86400000)).toISOString().slice(0,10);
  return '';
}

function blocoImportarObra(){
  const cx=el('<div class="corpo"></div>');
  cx.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin:0 0 11px">
    Solte aqui o <b>Resultados_....xlsx</b> exportado do ERP, do jeito que ele sai. Eu leio as colunas
    dele (Projeto, Centro de custo, Fornecedor, Valor parcela…), crio a obra que ainda não existir,
    separo os <b>aportes</b> das despesas e gravo tudo no servidor. Trazer o mesmo arquivo duas vezes
    <b>não duplica</b> — cada parcela tem uma identidade e é atualizada, não repetida.</p>`));
  const solta=el('<div class="solta">📥 Clique ou arraste o arquivo do ERP aqui</div>');
  const inp=el('<input type="file" accept=".xlsx" hidden>');
  const st=el('<div style="font-size:12.5px;color:var(--suave);margin-top:9px"></div>');
  const receber=async f=>{
    solta.classList.add('ocupado');st.textContent='Lendo o arquivo…';
    try{
      const zip=await lerZipAuto(new Uint8Array(await f.arrayBuffer()));
      const linhas=linhasDoXlsx(zip);
      if(linhas.length<2)throw new Error('planilha vazia');
      // o cabeçalho diz onde cada coisa está — a ORDEM das colunas pode mudar, o NOME não
      const cab={};Object.entries(linhas[0]).forEach(([c,v])=>cab[String(v).trim()]=c);
      const need=['ID Parcela','Tipo','Valor parcela'];
      for(const k of need)if(!cab[k])throw new Error('não achei a coluna "'+k+'" — este arquivo é o export de Resultados?');
      const g=c=>cab[c]||null;
      const pega=(l,c)=>{const k=g(c);return k?String(l[k]??'').trim():''};
      const num=v=>{const x=+String(v).replace(',','.');return isNaN(x)?0:x};

      /* O SINAL IMPORTA. No export do ERP, despesa vem NEGATIVA; um estorno
         (devolução) vem POSITIVO. Math.abs transformaria a devolução em custo
         -- erro de duas vezes o valor, calado. A convenção do arquivo é
         descoberta pela MAIORIA dos sinais das despesas, porque uma planilha
         feita à mão costuma vir com custo positivo. */
      let negs=0,poss=0;
      for(const l of linhas.slice(1)){
        if(pega(l,'Tipo')!=='Despesa')continue;
        const v0=num(pega(l,'Valor parcela'));
        if(v0<0)negs++;else if(v0>0)poss++;
      }
      const despesaEhNegativa=negs>=poss;
      // uma obra por valor distinto de "Projeto"
      const porProjeto={};
      for(const l of linhas.slice(1)){
        if(!pega(l,'ID Parcela'))continue;
        const proj=pega(l,'Projeto')||'(sem projeto)';
        (porProjeto[proj]??=[]).push(l);
      }
      const nomes=Object.keys(porProjeto);
      st.textContent='';
      let criadas=0,custosTot=0,aportesTot=0,receitas=[];
      for(const proj of nomes){
        const ls=porProjeto[proj];
        // casa com a obra existente pelo nome; senão cria
        const nomeLimpo=proj.replace(/^obra\s+/i,'').trim();
        let o=E.obras.find(x=>(x.nome||'').toLowerCase()===nomeLimpo.toLowerCase()||(x.nome||'').toLowerCase()===proj.toLowerCase());
        if(!o){o={id:uid(),nome:nomeLimpo||proj,empresa:pega(ls[0],'Empresa')||'Fortemais',
          tipo:CFG('tiposObra')[0],status:'Em obra',endereco:'',area:0,areaTerreno:0,
          inicio:'',fim:'',vendaValor:0,vendaData:'',recebidoEm:'',comprador:'',impostoValor:0,
          comissaoValor:0,outrasDeducoes:0,obs:''};
          E.obras.push(o);criadas++}
        const lote=[];
        for(const l of ls){
          const id=pega(l,'ID Parcela');
          const tipo=pega(l,'Tipo');
          const centro=pega(l,'Centro de custo')||pega(l,'Categoria financeira');
          const ehAporte=/aporte/i.test(centro)||/aporte/i.test(pega(l,'Categoria financeira'));
          const valor=num(pega(l,'Valor parcela'));
          if(ehAporte){
            /* APORTE NÃO É CUSTO NEM VENDA: vira linha de aporte na ficha.
               A identidade do ERP fica guardada para reimportar sem duplicar. */
            if(!E.obraAportes.some(x=>x.erp===id)){
              E.obraAportes.push({id:uid(),erp:id,obra:o.id,data:dataPlan(pega(l,'Data de competência')),
                quem:pega(l,'Cliente')||pega(l,'Nome').replace(/^aporte\s*/i,''),valor:Math.abs(valor),obs:'do ERP'});
              aportesTot++;
            }
            continue;
          }
          if(tipo==='Receita'){receitas.push({obra:o.nome,nome:pega(l,'Nome'),valor});continue}
          // custo positivo; estorno vira NEGATIVO e abate a soma, como deve
          const custo=despesaEhNegativa?-valor:valor;
          lote.push({id,obra:o.id,data:dataPlan(pega(l,'Data de competência')),
            nome:pega(l,'Nome'),centro,fornecedor:pega(l,'Fornecedor'),
            valor:custo,forma:pega(l,'Forma de pagamento parcela'),
            conta:pega(l,'Conta bancária'),valor_original:valor,origem:f.name});
          // centro novo entra na lista editável, nunca é descartado calado
          if(centro&&!CFG('centrosObra').includes(centro)){
            if(!E.config.centrosObra)E.config.centrosObra=[...SEED.config.centrosObra];
            E.config.centrosObra.push(centro);
          }
        }
        st.textContent='Gravando '+o.nome+' ('+lote.length+' lançamentos)…';
        for(let i=0;i<lote.length;i+=1000){
          const d2=await apiSync('POST',{acao:'obraCustosGravar',linhas:lote.slice(i,i+1000)});
          if(!d2||!d2.ok)throw new Error((d2&&d2.erro)||'falha ao gravar');
        }
        custosTot+=lote.length;
      }
      salvar();fmEsquecer();
      st.textContent='';
      alert('Pronto.\n\n'+
        '· '+custosTot+' lançamentos de custo gravados no servidor\n'+
        '· '+aportesTot+' aportes levados para a ficha\n'+
        (criadas?'· '+criadas+' obra(s) criada(s): confira área (m²) e status na ficha\n':'')+
        (receitas.length?'\n⚠️ '+receitas.length+' RECEITAS que não são aporte vieram no arquivo (ex.: "'+receitas[0].nome+'"). Receita de venda não entra no custo: lance a venda na ficha da obra.':''));
      tela();
    }catch(e){st.textContent='';alert('Não consegui importar: '+(e.message||e))}
    finally{solta.classList.remove('ocupado')}
  };
  solta.onclick=()=>inp.click();
  inp.onchange=()=>{if(inp.files[0])receber(inp.files[0]);inp.value=''};
  solta.addEventListener('dragover',e=>{e.preventDefault();solta.classList.add('sobre')});
  solta.addEventListener('dragleave',()=>solta.classList.remove('sobre'));
  solta.addEventListener('drop',e=>{e.preventDefault();solta.classList.remove('sobre');if(e.dataTransfer.files[0])receber(e.dataTransfer.files[0])});
  cx.appendChild(solta);cx.appendChild(inp);cx.appendChild(st);
  return cx;
}

function buscarEmTudo(q){
  const alvo=normaliza(q);
  if(alvo.length<2)return [];
  const partes=alvo.split(' ').filter(Boolean);
  const achados=[];
  FONTES_BUSCA.forEach(f=>{
    (E[f.col]||[]).forEach(x=>{
      // o RÓTULO entra na busca: digitar "apólice", "seguro" ou "documento"
      // é o jeito natural de procurar por categoria, e sem isto não achava —
      // "apolice" é o nome do campo, o valor é um número que ninguém decora
      const texto=normaliza([f.rot,...f.campos.map(k=>x[k]??'')].join(' '));
      // todas as palavras precisam aparecer: "seguro carro" não traz todo seguro
      if(!partes.every(p=>texto.includes(p)))return;
      achados.push({f,x,tit:f.tit(x)||'(sem nome)',sub:f.sub(x)||''});
    });
  });
  // passagem, hotel e ingresso moram DENTRO da viagem — sem isto, procurar por
  // um localizador não acha nada, que é justamente quando se procura
  (E.viagens||[]).forEach(v=>{
    const nome=[v.evento,v.cidade].filter(Boolean).join(' · ')||'viagem';
    const itens=[
      ...(v.passagens||[]).map(p=>({rot:'Passagem',ic:'🎫',
        txt:[p.de,p.para,p.cia,p.voo,p.localizador,p.sentido].join(' '),
        tit:[p.de,p.para].filter(Boolean).join(' → ')||'trecho',
        sub:[nome,p.data?fmtDataAno(p.data):'',p.localizador].filter(Boolean).join(' · ')})),
      ...(v.hoteis||[]).map(h=>({rot:'Hospedagem',ic:'🏨',
        txt:[h.nome,h.reserva,h.endereco,h.telefone].join(' '),
        tit:h.nome||'hotel',
        sub:[nome,h.reserva&&'reserva '+h.reserva].filter(Boolean).join(' · ')})),
      ...(v.tickets||[]).map(k=>({rot:'Ingresso',ic:'🎟️',
        txt:[k.nome,k.tipo,k.local,k.codigo].join(' '),
        tit:k.nome||'ingresso',
        sub:[nome,k.data?fmtDataAno(k.data):'',k.codigo].filter(Boolean).join(' · ')})),
    ];
    itens.forEach(it=>{
      if(!partes.every(p=>normaliza(it.rot+' '+it.txt).includes(p)))return;
      achados.push({f:{tela:'viagens',ic:it.ic,rot:it.rot},x:v,tit:it.tit,sub:it.sub});
    });
  });
  return achados.slice(0,60);
}

/* ===================== PASSAGENS PELO GMAIL =====================
   Lê os e-mails de companhia aérea e PROPÕE viagens — nunca grava sozinho.

   Por que propor e não gravar: e-mail de passagem varia demais entre
   companhias, e remarcação gera e-mail novo com o mesmo localizador. Um
   importador que grava sozinho cria viagem duplicada e troca horário errado —
   e você descobre no aeroporto. A tela de confirmação é o que impede isso.

   O ID do cliente aparece aqui em texto puro DE PROPÓSITO: no OAuth de
   navegador ele é público (vai no código-fonte de qualquer site com login
   Google). Quem autoriza é a sua conta, não ele. A chave secreta do cliente
   NÃO é usada neste fluxo e não deve estar em lugar nenhum daqui.

   O escopo é só-leitura: este código não consegue enviar nem apagar e-mail.
   O token de acesso fica só em memória — token de uma hora não merece disco. */

/* Reserva confirmada fica TRAVADA. O que está aqui veio de e-mail ou foi
   digitado com o comprovante na mão; um clique errado num campo de hora
   estraga a informação que você vai procurar correndo no aeroporto.
   O "editando" mora fora do registro de propósito: é estado de tela, não
   dado — não deve ir para a nuvem nem voltar travado em outro aparelho. */
const _emEdicao=new Set();

function blocoTravado({id,resumo,campos:defs,alvo,aoMudar,aoApagar,novo}){
  const cx=el(`<div style="border:1px solid var(--linha);border-radius:var(--r);padding:11px 13px;margin-bottom:9px;background:var(--card)"></div>`);
  // "novo" é AVALIADO a cada desenho, não capturado uma vez: um bloco criado
  // vazio deixa de ser novo assim que você preenche, e aí "Pronto" trava de
  // verdade. Congelado, ele ficava aberto para sempre.
  const ehNovo=()=>typeof novo==='function'?!!novo():!!novo;
  const pinta=()=>{
    cx.innerHTML='';
    const editando=_emEdicao.has(id)||ehNovo();
    const topo=el(`<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;${editando?'margin-bottom:8px':''}">
      <div style="flex:1;min-width:0">${resumo()}</div></div>`);
    const bEd=el(`<button class="btn ghost mini">${editando?'✓ Pronto':'✎ Editar'}</button>`);
    bEd.onclick=()=>{editando?_emEdicao.delete(id):_emEdicao.add(id);pinta()};
    topo.appendChild(bEd);
    if(aoApagar){
      const bX=el('<button class="btn ghost mini" style="color:var(--vermelho)">✕</button>');
      bX.onclick=aoApagar;topo.appendChild(bX);
    }
    cx.appendChild(topo);
    if(editando) cx.appendChild(campos(alvo,defs,()=>{salvar();if(aoMudar)aoMudar();pintaResumoSo()}));
  };
  // ao digitar, só o resumo se redesenha — repintar tudo tiraria o foco do campo
  const pintaResumoSo=()=>{const d=cx.firstElementChild&&cx.firstElementChild.firstElementChild;
    if(d)d.innerHTML=resumo()};
  pinta();
  return cx;
}

const GMAIL_CLIENT_ID='41350662840-21p2a062djc5du99idb12akjv2lq5gnj.apps.googleusercontent.com';
const GMAIL_ESCOPO='https://www.googleapis.com/auth/gmail.readonly';
let _gmailToken='';

// A busca não varre a caixa: procura marcas de passagem e remetentes de
// companhia, no último ano. Caixa inteira seria lento e indiscreto.
const CONSULTA_GMAIL=

function carregarGis(){
  return new Promise((ok,erro)=>{
    if(window.google&&window.google.accounts&&google.accounts.oauth2)return ok();
    const sc=document.createElement('script');
    sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.defer=true;
    sc.onload=()=>ok();
    sc.onerror=()=>erro(new Error('Não consegui carregar o login do Google — sem internet?'));
    document.head.appendChild(sc);
  });
}

async function pedirTokenGmail(forcar){
  await carregarGis();
  return new Promise((ok,erro)=>{
    const tc=google.accounts.oauth2.initTokenClient({
      client_id:GMAIL_CLIENT_ID, scope:GMAIL_ESCOPO,
      callback:resp=>{
        if(resp.error)return erro(new Error(resp.error_description||resp.error));
        _gmailToken=resp.access_token; ok(resp.access_token);
      },
      error_callback:e=>erro(new Error(e&&e.type==='popup_closed'
        ? 'Você fechou a janela do Google antes de autorizar.'
        : 'O Google não autorizou. Confira se o seu e-mail está como usuário de teste no projeto.')),
    });
    tc.requestAccessToken({prompt:forcar?'consent':''});
  });
}

async function gmailApi(caminho){
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+caminho,
    {headers:{authorization:'Bearer '+_gmailToken}});
  if(r.status===401){_gmailToken='';throw Object.assign(new Error('A autorização do Google venceu — clique de novo para renovar.'),{status:401})}
  if(r.status===403)throw new Error('O Google recusou o acesso. Confira se a API do Gmail está ativada e se você está como usuário de teste.');
  if(!r.ok)throw new Error('O Gmail respondeu '+r.status+'.');
  return r.json();
}

// base64url do Gmail, com acento preservado
const deB64=x=>{try{
  const b=String(x||'').replace(/-/g,'+').replace(/_/g,'/');
  return new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
}catch(e){return ''}};

function corpoDoEmail(payload){
  let txt='',html='';
  const anda=(p,nivel)=>{
    if(!p||nivel>12)return;
    const d=p.body&&p.body.data;
    if(d&&p.mimeType==='text/plain')txt+=deB64(d)+'\n';
    if(d&&p.mimeType==='text/html')html+=deB64(d)+'\n';
    (p.parts||[]).forEach(x=>anda(x,nivel+1));
  };
  anda(payload,0);
  return {txt,html};
}

/* A leitura EXATA: várias companhias mandam os dados do voo estruturados
   dentro do e-mail (é o que faz o Google Agenda criar o voo sozinho). Quando
   isso existe, não há adivinhação nenhuma. */
function voosEstruturados(html){
  const out=[];
  const re=/<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi;
  let m,voltas=0;
  while((m=re.exec(html))&&voltas++<40){
    let d; try{d=JSON.parse(m[1].trim())}catch(e){continue}
    const fila=Array.isArray(d)?d.slice():[d];
    let guarda=0;
    while(fila.length&&guarda++<200){
      const x=fila.shift();
      if(!x||typeof x!=='object')continue;
      if(Array.isArray(x['@graph']))fila.push(...x['@graph']);
      if(Array.isArray(x.subReservation))fila.push(...x.subReservation);
      const tipo=String(x['@type']||'');
      if(tipo.includes('FlightReservation')&&x.reservationFor){
        const fs2=Array.isArray(x.reservationFor)?x.reservationFor:[x.reservationFor];
        fs2.forEach(f=>{
          if(!f||typeof f!=='object')return;
          out.push({
            localizador:String(x.reservationNumber||''),
            voo:String(f.flightNumber||''),
            cia:String((f.airline&&(f.airline.name||f.airline.iataCode))||''),
            de:String((f.departureAirport&&(f.departureAirport.iataCode||f.departureAirport.name))||''),
            para:String((f.arrivalAirport&&(f.arrivalAirport.iataCode||f.arrivalAirport.name))||''),
            partida:String(f.departureTime||''),
            chegada:String(f.arrivalTime||''),
            exato:true,
          });
        });
      }
    }
  }
  return out;
}

/* A leitura por PADRÃO, quando não vem estruturado. Acerta menos — por isso
   sai marcada como "conferir", e a tela mostra isso. */
function voosPorPadrao(txt){
  const out=[];
  const loc=(txt.match(/(?:localizador|c[óo]digo da reserva|c[óo]digo de reserva|PNR)[^A-Z0-9]{0,12}([A-Z0-9]{5,7})\b/i)||[])[1]||'';
  const re=/\b([A-Z]{2})\s?(\d{3,4})\b[\s\S]{0,180}?\b([A-Z]{3})\b[\s\S]{0,60}?\b([A-Z]{3})\b/g;
  let m,guarda=0;
  while((m=re.exec(txt))&&guarda++<12){
    if(m[3]===m[4])continue;
    const perto=txt.slice(m.index,m.index+300);
    const hora=(perto.match(/\b([0-2]\d:[0-5]\d)\b/)||[])[1]||'';
    const data=(perto.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/)||null);
    out.push({localizador:loc,voo:m[1]+m[2],cia:'',de:m[3],para:m[4],
      partida:data?(data[3]+'-'+data[2]+'-'+data[1]+(hora?'T'+hora:'')):'',
      chegada:'',exato:false});
  }
  return out;
}

const soData=x=>String(x||'').slice(0,10);
const soHora=x=>{const m=String(x||'').match(/T(\d{2}:\d{2})/);return m?m[1]:''};

/* Agrupa os trechos achados em VIAGENS: mesmo localizador = mesma viagem.
   Sem localizador, agrupa por proximidade de data (até 30 dias). */
function agruparEmViagens(trechos){
  const grupos=[];
  trechos.forEach(v=>{
    if(!soData(v.partida))return;
    let g=v.localizador
      ? grupos.find(x=>x.localizador&&x.localizador===v.localizador)
      : grupos.find(x=>!x.localizador&&Math.abs(new Date(soData(v.partida))-new Date(x.ida))<30*864e5);
    if(!g){g={localizador:v.localizador||'',trechos:[],ida:soData(v.partida),volta:soData(v.partida)};grupos.push(g)}
    // trecho repetido (o mesmo voo em dois e-mails) entra uma vez só
    if(g.trechos.some(x=>x.voo===v.voo&&soData(x.partida)===soData(v.partida)))return;
    g.trechos.push(v);
    if(soData(v.partida)<g.ida)g.ida=soData(v.partida);
    const fim=soData(v.chegada)||soData(v.partida);
    if(fim>g.volta)g.volta=fim;
  });
  grupos.forEach(g=>{
    g.trechos.sort((a,b)=>String(a.partida).localeCompare(String(b.partida)));
    /* O DESTINO não é o primeiro pouso — esse costuma ser a conexão.
       Ida com escala (CNF→GRU→CAN): o destino é o último pouso.
       Ida e volta (…→CAN→…→CNF): o destino é onde você FICOU, ou seja, o pouso
       com o maior intervalo até o voo seguinte. */
    const n2=g.trechos.length, pri=g.trechos[0], ult=g.trechos[n2-1];
    g.iDest=0;
    if(!n2) g.destino='';
    else if(n2===1||!ult.para||!pri.de||ult.para!==pri.de){g.destino=ult.para||'';g.iDest=n2-1}
    else{
      let melhor=0,maior=-1;
      for(let i=0;i<n2-1;i++){
        const fim=new Date(g.trechos[i].chegada||g.trechos[i].partida);
        const prox=new Date(g.trechos[i+1].partida);
        const gap=prox-fim;
        if(gap>maior){maior=gap;melhor=i}
      }
      g.destino=g.trechos[melhor].para||'';g.iDest=melhor;
    }
    g.exato=g.trechos.every(x=>x.exato);
    // já existe viagem com esse localizador? então é atualização, não viagem nova
    g.jaExiste=g.localizador
      ? (E.viagens||[]).find(v2=>(v2.passagens||[]).some(p=>p.localizador&&p.localizador===g.localizador))
      : null;
  });
  return grupos.sort((a,b)=>a.ida.localeCompare(b.ida));
}

async function buscarPassagensGmail(botao){
  const rot=botao?botao.textContent:'';
  const diz=x=>{if(botao){botao.disabled=true;botao.textContent=x}};
  try{
    diz('Conectando…');
    if(!_gmailToken)await pedirTokenGmail(true);
    diz('Procurando…');
    const lista=await gmailApi('messages?maxResults=30&q='+encodeURIComponent(CONSULTA_GMAIL));
    const ids=(lista.messages||[]).map(x=>x.id);
    if(!ids.length){alert('Não achei e-mail de passagem no último ano.');return}
    const trechos=[];
    for(let i=0;i<ids.length;i++){
      diz('Lendo '+(i+1)+' de '+ids.length+'…');
      let msg; try{ msg=await gmailApi('messages/'+ids[i]+'?format=full') }catch(e){continue}
      const {txt,html}=corpoDoEmail(msg.payload);
      const exatos=voosEstruturados(html);
      (exatos.length?exatos:voosPorPadrao(txt||html.replace(/<[^>]+>/g,' '))).forEach(v=>trechos.push(v));
    }
    const grupos=agruparEmViagens(trechos);
    if(!grupos.length){
      alert('Li '+ids.length+' e-mail(s) e não consegui extrair voo de nenhum.\n\n'+
        'Isso acontece quando a companhia manda só imagem ou PDF. Nesses casos, o anexo .ics do e-mail resolve: Agenda → Importar .ics.');
      return;
    }
    modalPassagensGmail(grupos);
  }catch(e){
    alert(e.message||'Não consegui buscar agora.');
  }finally{
    if(botao){botao.disabled=false;botao.textContent=rot}
  }
}

/* ===================== GESTÃO ESTRATÉGICA =====================
   Três camadas, na ordem em que uma sustenta a outra:

   1. QUEM SOMOS   — missão, visão e valores. Serve para decidir quando não há
                     regra: é o que sobra quando o manual não cobre o caso.
   2. PARA ONDE    — objetivos, e ao lado de cada um as AÇÕES. Objetivo sem ação
                     é desejo; ação sem objetivo é agitação.
   3. COM QUEM     — o campo tático. NÃO é organograma: organograma responde
                     "quem manda em quem", e essa não é a pergunta de quem está
                     montando um time. As perguntas aqui são: que frentes eu
                     tenho, quem está em cada uma, quem é insubstituível, e onde
                     está o buraco. As peças se movem entre as frentes até a
                     formação fazer sentido. */

const ZONAS_PADRAO=[
  {id:'z1',nome:'Frente de ataque',dica:'quem traz cliente e receita'},
  {id:'z2',nome:'Entrega',dica:'quem faz o que foi vendido'},
  {id:'z3',nome:'Retaguarda',dica:'financeiro, compras, administrativo'},
  {id:'z4',nome:'Reserva',dica:'quem pode entrar, quem está em formação'},
];

const empAtivas=()=>(E.empresasPJ||[]).filter(x=>x.status!=='Baixada'&&String(x.nome||'').trim());
function estrDe(nome){
  if(!E.estrategia[nome]) E.estrategia[nome]={missao:'',visao:'',valores:[],objetivos:[],
    zonas:structuredClone(ZONAS_PADRAO),pecas:[]};
  const e=E.estrategia[nome];
  if(!Array.isArray(e.valores))e.valores=[];
  if(!Array.isArray(e.objetivos))e.objetivos=[];
  if(!Array.isArray(e.zonas)||!e.zonas.length)e.zonas=structuredClone(ZONAS_PADRAO);
  if(!Array.isArray(e.pecas))e.pecas=[];
  e.objetivos.forEach(o=>{if(!Array.isArray(o.acoes))o.acoes=[]});
  return e;
}

      const pct=(o.acoes||[]).length?Math.round(feitas/o.acoes.length*100):0;
      const cx2=el(`<div style="border:1px solid var(--linha);border-radius:var(--r);margin-bottom:12px;background:var(--card);overflow:hidden">
        <div style="display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.4fr);gap:0;align-items:stretch" class="objGrade">
          <div style="padding:14px 15px;border-right:1px solid var(--linha)" class="objEsq">

            ${o.porque?`<div style="font-size:12.5px;color:var(--suave);margin-top:5px">${esc(o.porque)}</div>`:''}
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--suave)">
              ${o.indicador?`<span>📏 ${esc(o.indicador)}</span>`:''}
              ${o.ate?`<span>🗓 até ${fmtDataAno(o.ate)}${o.ate<hoje()?' <b style="color:var(--vermelho)">(passou)</b>':''}</span>`:''}
            </div>
            <div class="barra" style="margin-top:10px"><i style="width:${pct}%;background:${pct===100?'var(--verde)':'var(--areia)'}"></i></div>
            <div style="font-size:11.5px;color:var(--suave);margin-top:4px">${feitas} de ${(o.acoes||[]).length} ação(ões) feita(s)</div>
            <div style="display:flex;gap:6px;margin-top:10px"><button class="btn ghost mini bEd">✎ editar</button>
              <button class="btn ghost mini bDelO" style="color:var(--vermelho)">🗑</button></div>
          </div>
          <div style="padding:14px 15px" class="objDir">
            <div style="font-size:11px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Ações</div>
            <div class="acoes"></div>
          </div>
        </div></div>`);
      const box=cx2.querySelector('.acoes');
      const pintaAcoes=()=>{
        box.innerHTML='';
        (o.acoes||[]).forEach((a,ia)=>{
          const li=el(`<div style="display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--linha)">
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;${a.status==='Feita'?'text-decoration:line-through;color:var(--suave)':''}">${esc(a.oque||'—')}</div>
              <div style="font-size:11.5px;color:var(--suave);margin-top:2px">
                ${a.quem?esc(a.quem):'<b style="color:var(--vermelho)">sem responsável</b>'}${a.ate?' · até '+fmtDataAno(a.ate):''}
                ${a.ate&&a.ate<hoje()&&a.status!=='Feita'?' <b style="color:var(--vermelho)">(atrasada)</b>':''}
                ${a.status==='Travada'&&a.travaPor?' · 🚧 '+esc(a.travaPor):''}</div>
            </div>
            <select class="selSt" style="font-size:11.5px;padding:3px 5px">${STATUS_ACAO.map(x=>`<option${x===(a.status||'A fazer')?' selected':''}>${x}</option>`).join('')}</select>
            <button class="btn ghost mini bDelA" style="color:var(--vermelho)">✕</button></div>`);
          li.querySelector('.selSt').onchange=ev=>{

            salvar();

            // cima, e contador errado é pior que contador nenhum. O abreBloco
            // traz a rolagem de volta para cá.

/* O CAMPO. Mover é em dois toques (pegar / soltar) de propósito: arrastar não
   funciona no celular, e metade das vezes que você vai olhar isso é no celular. */
function campoTatico(est,r){
  const cx=el('<div class="corpo"></div>');
  const grade=el('<div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))"></div>');

  const pinta=()=>{
    grade.innerHTML='';
    (est.zonas||[]).forEach(z=>{
      const dentro=(est.pecas||[]).filter(p=>p.zona===z.id);
      const zEl=el(`<div class="zonaT" style="border:1px solid var(--linha);border-radius:var(--r);background:var(--card);display:flex;flex-direction:column;min-height:150px">
        <div style="padding:11px 13px;border-bottom:1px solid var(--linha);background:var(--bg);border-radius:var(--r) var(--r) 0 0">
          <div style="display:flex;align-items:center;gap:6px">
            <b style="font-size:14px;flex:1">${esc(z.nome)}</b>
            <span style="font-size:11.5px;color:var(--suave)">${dentro.length}</span>
            <button class="btn ghost mini bZed" title="renomear ou apagar a frente">⋯</button>
          </div>
          ${z.dica?`<div style="font-size:11.5px;color:var(--suave);margin-top:2px">${esc(z.dica)}</div>`:''}
        </div>
        <div class="dentro" style="padding:10px 11px;display:flex;flex-direction:column;gap:8px;flex:1"></div>
      </div>`);
      const box=zEl.querySelector('.dentro');
      dentro.forEach(p=>{
        const naMao=_pecaNaMao===p.id;
        const pe=el(`<div class="pecaT" style="border:1px solid ${naMao?'var(--tinta)':'var(--linha)'};border-radius:10px;padding:9px 11px;cursor:pointer;background:${naMao?'var(--bg)':'transparent'};box-shadow:${naMao?'0 0 0 2px var(--tinta)':'none'}">
          <div style="display:flex;align-items:center;gap:7px">
            ${avatar(p.nome||'?',26)}
            <div style="flex:1;min-width:0">
              <b style="font-size:13.5px">${esc(p.nome||'(sem nome)')}</b>
              <div style="font-size:11.5px;color:var(--suave)">${esc(p.funcao||'sem função definida')}</div>
            </div>
            ${p.chave?'<span title="peça-chave" style="font-size:14px">⭐</span>':''}
          </div>
          ${p.chave?`<div style="font-size:11px;margin-top:6px;color:${String(p.substituto||'').trim()?'var(--suave)':'var(--vermelho)'}">
            ${String(p.substituto||'').trim()?'cobertura: '+esc(p.substituto):'⚠ ninguém cobre'}</div>`:''}
        </div>`);
        pe.onclick=ev=>{ev.stopPropagation();
          if(_pecaNaMao===p.id){_pecaNaMao=null;pinta();return}
          if(_pecaNaMao){_pecaNaMao=null;pinta();return}
          _pecaNaMao=p.id;pinta();
        };
        pe.ondblclick=ev=>{ev.stopPropagation();_pecaNaMao=null;modalPeca(est,p,()=>{salvar();pinta()})};
        box.appendChild(pe);
      });
      if(!dentro.length) box.appendChild(el('<div class="vazio" style="padding:14px 4px;font-size:12px">Ninguém nesta frente.</div>'));
      // soltar aqui
      zEl.onclick=()=>{
        if(!_pecaNaMao)return;
        const p=(est.pecas||[]).find(x=>x.id===_pecaNaMao);
        if(p&&p.zona!==z.id){p.zona=z.id;salvar()}
        _pecaNaMao=null;pinta();
      };
      zEl.querySelector('.bZed').onclick=ev=>{ev.stopPropagation();
        const nome=prompt('Nome da frente:',z.nome);
        if(nome==null)return;
        if(!String(nome).trim()){
          const dentro2=(est.pecas||[]).filter(x=>x.zona===z.id);
          if(dentro2.length){alert('Tire as '+dentro2.length+' peça(s) daqui antes de apagar a frente.');return}
          if(!confirm('Apagar a frente "'+z.nome+'"?'))return;
          est.zonas=est.zonas.filter(x=>x.id!==z.id);salvar();pinta();return;
        }
        z.nome=String(nome).trim();
        const dica=prompt('Uma linha explicando o que é essa frente:',z.dica||'');
        if(dica!=null)z.dica=String(dica).trim();
        salvar();pinta();
      };
      grade.appendChild(zEl);
    });
    // frente nova
    const add=el(`<button style="border:1px dashed var(--linha);border-radius:var(--r);background:none;color:var(--suave);
      min-height:150px;cursor:pointer;font:500 13px Inter">+ Nova frente</button>`);
    add.onclick=()=>{const nome=prompt('Nome da frente nova:','');
      if(nome==null||!String(nome).trim())return;
      const dica=prompt('Uma linha explicando o que é essa frente:','')||'';
      est.zonas=[...(est.zonas||[]),{id:uid(),nome:String(nome).trim(),dica:String(dica).trim()}];
      salvar();pinta()};
    grade.appendChild(add);
  };
  pinta();

  cx.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin:0 0 11px">
    Clique numa peça para <b>pegar</b> e depois na frente para <b>soltar</b>. Clique duplo abre a ficha dela.
    ⭐ marca quem é peça-chave — e a ficha pergunta <b>quem cobre</b>, que é a pergunta que ninguém faz antes de precisar.</p>`));
  cx.appendChild(grade);
  const bp=el('<button class="mais">+ Nova peça</button>');
  bp.onclick=()=>{
    const p={id:uid(),nome:'',funcao:'',zona:(est.zonas[0]||{}).id,chave:false,substituto:'',obs:''};
    est.pecas.push(p);salvar();modalPeca(est,p,()=>{salvar();pinta()},true);
  };
  cx.appendChild(bp);
  return cx;
}

      est.pecas=est.pecas.filter(x=>x.id!==p.id);salvar();fechar()};
    s4.appendChild(del);s4.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s4.appendChild(ok);

    aoSalvar&&aoSalvar();

/* ===================== OPORTUNIDADES =====================
   Um lugar para o que você AINDA não decidiu fazer. O trabalho aqui não é
   guardar ideia — é decidir. Toda ideia guardada cobra atenção; a tela existe
   para dizer quais merecem a sua e quais já podem descansar.

   A NOTA não é um oráculo: são seis perguntas que você responde de 0 a 5 e que
   o sistema pesa sempre do mesmo jeito. O valor de ter isso escrito é comparar
   coisas diferentes com a MESMA régua — e não decidir pelo que apareceu por
   último ou pelo que estava mais empolgante naquele dia. */

const ESTAGIOS=['Semente','Estudando','Decidindo','Tocando','Arquivada'];
const CORES_ESTAGIO={Semente:'a',Estudando:'',Decidindo:'a',Tocando:'v',Arquivada:'r'};
// peso de cada pergunta na nota. Ganho e ânimo puxam para cima; esforço, custo
// e risco puxam para baixo. Encaixe (o quanto usa o que você já tem) entra
// positivo porque é o que faz uma ideia sua ser melhor na sua mão que na de outro.
const CRITERIOS=[
  {k:'ganho',  t:'O quanto pode render',  dica:'0 = trocado, 5 = muda o jogo',        peso: 2.0},
  {k:'animo',  t:'O quanto me anima',     dica:'0 = obrigação, 5 = acordo pensando nisso', peso: 1.5},
  {k:'encaixe',t:'Encaixa no que já tenho',dica:'0 = do zero, 5 = uso o que já sei e tenho', peso: 1.5},
  {k:'esforco',t:'Quanto do meu tempo',   dica:'0 = quase nada, 5 = vira meu dia',    peso:-1.5},
  {k:'custo',  t:'Quanto custa entrar',   dica:'0 = de graça, 5 = pesado no caixa',   peso:-1.0},
  {k:'risco',  t:'Risco se der errado',   dica:'0 = perco o tempo, 5 = machuca',      peso:-1.5},
];
const MAXNOTA=CRITERIOS.filter(c=>c.peso>0).reduce((a,c)=>a+c.peso*5,0);

// 0 a 100. Os negativos entram como desconto sobre o total possível.
function notaOport(o){
  const bruto=CRITERIOS.reduce((a,c)=>a+((+o[c.k]||0)*c.peso),0);
  return Math.max(0,Math.min(100,Math.round(bruto/MAXNOTA*100)));
}
const respondida=o=>CRITERIOS.some(c=>o[c.k]!=null&&o[c.k]!=='');
const diasParado=o=>o.mexido?Math.round((new Date(hoje()+'T12:00')-new Date(String(o.mexido).slice(0,10)+'T12:00'))/864e5):null;
// esfriou: parada há mais de 45 dias sem estar arquivada nem tocando
const esfriou=o=>o.estagio!=='Arquivada'&&o.estagio!=='Tocando'&&(diasParado(o)??0)>45;
const marcarMexido=o=>{o.mexido=hoje()};

function vOportunidades(m){
  const r=rr('oportunidades');
  const L=E.oportunidades||[];
  if(filtro.oportEstagio==null) filtro.oportEstagio='Ativas';
  if(filtro.oportTipo==null) filtro.oportTipo='Todos';

  const novo=()=>{const o={id:uid(),titulo:'',tipo:CFG('tipoOportunidade')[0],estagio:'Semente',
    porque:'',proximoPasso:'',ate:'',links:[],obs:'',mexido:hoje(),criada:hoje()};
    E.oportunidades.push(o);salvar();modalOport(o,true)};

  m.appendChild(cab('Oportunidades','O que você ainda não decidiu fazer — e a régua para decidir.'));

  const tipos=[...new Set([...CFG('tipoOportunidade'),...L.map(o=>o.tipo)])].filter(Boolean);
  m.appendChild(painel('Ver',
    seletor(filtro.oportEstagio,[['Ativas','Ativas ('+L.filter(o=>o.estagio!=='Arquivada').length+')'],
      ...ESTAGIOS.map(e=>[e,e+' ('+L.filter(o=>o.estagio===e).length+')']),['Todas','Todas ('+L.length+')']],
      v=>{filtro.oportEstagio=v;r()}),
    seletor(filtro.oportTipo,[['Todos','Todos os tipos'],...tipos.map(x=>[x,x])],
      v=>{filtro.oportTipo=v;r()}),
    acao('+ Nova oportunidade',novo),'|'));

  const ativas=L.filter(o=>o.estagio!=='Arquivada');
  const tocando=L.filter(o=>o.estagio==='Tocando');
  const frias=L.filter(esfriou);
  const semPasso=ativas.filter(o=>!String(o.proximoPasso||'').trim());
  const atrasadas=ativas.filter(o=>o.ate&&o.ate<hoje());
  const melhor=[...ativas].filter(respondida).sort((a,b)=>notaOport(b)-notaOport(a))[0];

  m.appendChild(ligaKpis(el(`<div class="grade">
    ${kpi('Na mesa',ativas.length,ativas.length?'ideias vivas':'nada em aberto',null,'lista')}
    ${kpi('Tocando',tocando.length,tocando.length?'já saíram do papel':'nenhuma em andamento',tocando.length?'v':'')}
    ${kpi('Melhor nota',melhor?notaOport(melhor):'—',melhor?esc(melhor.titulo||'sem título'):'responda a régua de alguma','a','ranking')}
    ${kpi('Sem próximo passo',semPasso.length,semPasso.length?'ideia sem passo não anda':'todas com passo',semPasso.length?'r':'v','lista')}
    ${kpi('Esfriando',frias.length,frias.length?'paradas há mais de 45 dias':'nenhuma largada','a','lista')}</div>`),{
    lista:()=>{abreBloco('op-lista');r()},
    ranking:()=>{abreBloco('op-rank');r()},
  }));

  if(atrasadas.length) m.appendChild(el(`<div class="aviso" style="background:var(--vermelho-cl);border-color:var(--vermelho)">
    ⏰ <b>${atrasadas.length} ${atrasadas.length===1?'oportunidade passou':'oportunidades passaram'} da data do próximo passo:</b>
    ${atrasadas.map(o=>esc(o.titulo||'sem título')+' ('+fmtDataAno(o.ate)+')').join('; ')}.
    Ou faça, ou remarque, ou arquive — data vencida que fica parada só ensina a ignorar data.</div>`));

  if(frias.length) m.appendChild(el(`<div class="aviso">🥶 <b>${frias.length} ${frias.length===1?'ideia está':'ideias estão'} esfriando</b> —
    sem nenhum toque há mais de 45 dias: ${frias.map(o=>esc(o.titulo||'sem título')).join(', ')}.
    Ideia parada não é neutra: ela ocupa espaço na cabeça. Vale arquivar o que já não te interessa.</div>`));

  /* ---- o que merece o seu tempo agora ---- */
  const rank=[...ativas].filter(respondida).sort((a,b)=>notaOport(b)-notaOport(a));
  const rk=el('<div></div>');
  if(!rank.length) rk.innerHTML='<div class="vazio">Nenhuma oportunidade avaliada ainda. Abra uma e responda as seis perguntas — leva um minuto e serve para comparar tudo com a mesma régua.</div>';
  else{
    rk.appendChild(el(`<div class="grafico">${gBarras(rank.slice(0,8).map(o=>({r:o.titulo||'sem título',v:notaOport(o)})),{fmt:v=>v,cor:'var(--verde)'})}</div>`));
    const rol=el('<div class="rolagem"></div>');
    const tb=document.createElement('table');
    tb.innerHTML='<thead><tr><th>#</th><th>Oportunidade</th><th>Tipo</th><th>Estágio</th>'+
      '<th style="text-align:right">Nota</th><th>O que puxa para cima / para baixo</th></tr></thead>';
    const corpo=document.createElement('tbody');
    rank.forEach((o,i)=>{
      const nota=notaOport(o);
      const fortes=CRITERIOS.filter(c=>c.peso>0&&(+o[c.k]||0)>=4).map(c=>c.t.toLowerCase());
      const fracos=CRITERIOS.filter(c=>c.peso<0&&(+o[c.k]||0)>=4).map(c=>c.t.toLowerCase());
      const tr=document.createElement('tr');tr.style.cursor='pointer';
      tr.innerHTML=`<td style="padding:9px 10px;color:var(--suave);font-weight:600">${i+1}º</td>
        <td style="padding:9px 10px"><b>${esc(o.titulo||'sem título')}</b>
          ${o.porque?`<div style="font-size:11.5px;color:var(--suave);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.porque)}</div>`:''}</td>
        <td style="padding:9px 10px;color:var(--suave)">${esc(o.tipo||'—')}</td>
        <td style="padding:9px 10px">${chip(o.estagio==='Tocando'?'Realizado':o.estagio==='Decidindo'?'Confirmado':'Em Planejamento')}
          <span style="font-size:11.5px;color:var(--suave);margin-left:4px">${esc(o.estagio)}</span></td>
        <td style="padding:9px 10px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:${nota>=60?'var(--verde)':nota>=35?'var(--areia)':'var(--vermelho)'}">${nota}</td>
        <td style="padding:9px 10px;font-size:12px;color:var(--suave)">${fortes.length?'↑ '+esc(fortes.join(', ')):''}${fortes.length&&fracos.length?' · ':''}${fracos.length?'↓ '+esc(fracos.join(', ')):''}${!fortes.length&&!fracos.length?'nada se destaca':''}</td>`;
      tr.onclick=()=>modalOport(o);
      corpo.appendChild(tr);
    });
    tb.appendChild(corpo);rol.appendChild(tb);rk.appendChild(rol);
    rk.appendChild(el(`<div style="padding:11px 17px 4px;font-size:12.5px;color:var(--suave)">
      A nota pesa seis respostas suas: ganho, ânimo e encaixe puxam para cima; tempo, custo e risco puxam para baixo.
      Ela não decide nada — serve para as ideias serem comparadas pela mesma régua, e não pela ordem em que apareceram.</div>`));
  }
  m.appendChild(bloco('op-rank','🎯 O que merece seu tempo agora','ordenado pela régua — clique para abrir',rk));

  /* ---- a lista ---- */
  const vis=L.filter(o=>(filtro.oportEstagio==='Todas'||
      (filtro.oportEstagio==='Ativas'?o.estagio!=='Arquivada':o.estagio===filtro.oportEstagio))
    &&(filtro.oportTipo==='Todos'||o.tipo===filtro.oportTipo))
    .sort((a,b)=>(notaOport(b)-notaOport(a))||String(b.mexido||'').localeCompare(String(a.mexido||'')));
  const cx=el('<div class="corpo"></div>');
  const grid=el('<div class="cartoes"></div>');
  vis.forEach(o=>{
    const nota=respondida(o)?notaOport(o):null;
    const dias=diasParado(o);
    const c=el(`<button class="cartao" style="text-align:left">
      <div class="tit">${esc(o.titulo||'(sem título)')}</div>
      <div class="sub">${esc(o.tipo||'—')}${o.porque?' · '+esc(String(o.porque).slice(0,60)):''}</div>
      <div class="pe">${chip(o.estagio==='Tocando'?'Realizado':o.estagio==='Arquivada'?'Cancelado':o.estagio==='Decidindo'?'Confirmado':'Em Planejamento')}
        <span style="font-size:11.5px;color:var(--suave)">${esc(o.estagio)}</span>
        ${nota!=null?`<b style="margin-left:auto;font-size:14px;color:${nota>=60?'var(--verde)':nota>=35?'var(--areia)':'var(--vermelho)'}">${nota}</b>`:'<span style="margin-left:auto;font-size:11.5px;color:var(--suave)">sem nota</span>'}</div>
      ${o.proximoPasso?`<div style="font-size:12px;color:var(--suave);margin-top:7px;border-top:1px solid var(--linha);padding-top:7px">
        ▶ ${esc(o.proximoPasso)}${o.ate?' · até '+fmtDataAno(o.ate):''}${o.ate&&o.ate<hoje()?' <b style="color:var(--vermelho)">(passou)</b>':''}</div>`
        :'<div style="font-size:12px;color:var(--vermelho);margin-top:7px;border-top:1px solid var(--linha);padding-top:7px">sem próximo passo</div>'}
      ${(o.links||[]).length?`<div style="font-size:11.5px;color:var(--suave);margin-top:5px">🔗 ${(o.links||[]).length} link(s)</div>`:''}
      ${esfriou(o)?`<div style="font-size:11.5px;color:var(--areia);margin-top:5px">🥶 parada há ${dias} dias</div>`:''}
    </button>`);
    c.onclick=()=>modalOport(o);
    grid.appendChild(c);
  });
  if(!vis.length) grid.innerHTML='<div class="vazio">Nada por aqui neste recorte.</div>';
  cx.appendChild(grid);
  const bt=el('<button class="mais">+ Nova oportunidade</button>');bt.onclick=novo;cx.appendChild(bt);
  m.appendChild(bloco('op-lista','Todas as oportunidades','clique para abrir, avaliar e anexar',cx));

  /* ---- onde a cabeça está ---- */
  if(L.length){
    const porTipo={},porEst={};
    L.forEach(o=>{porTipo[o.tipo||'—']=(porTipo[o.tipo||'—']||0)+1;porEst[o.estagio]=(porEst[o.estagio]||0)+1});
    const gx=el('<div></div>');
    gx.appendChild(el(`<div class="grafico">${gRosca(Object.entries(porEst).map(([r2,v])=>({r:r2,v})),{fmt:v=>v})}</div>`));
    gx.appendChild(el(`<div class="grafico">${gBarras(Object.entries(porTipo).map(([r2,v])=>({r:r2,v})).sort((a,b)=>b.v-a.v),{fmt:v=>v})}</div>`));
    m.appendChild(bloco('op-dash','Onde a sua cabeça está','por estágio e por tipo',gx));
  }
}

function modalOport(o,novoReg){
  const vazia=()=>!String(o.titulo||'').trim()&&!String(o.porque||'').trim()&&!(o.links||[]).length;
  abrirModal(esc(o.titulo||'Nova oportunidade'),
    (o.tipo?esc(o.tipo):'')+(respondida(o)?' · nota '+notaOport(o):''),(c,fechar)=>{

    const s1=el('<div class="secao"><h4>A ideia</h4></div>');
    s1.appendChild(campos(o,[
      {k:'titulo',t:'O que é',ph:'ex.: comprar sala comercial no centro',full:true},
      {k:'tipo',t:'Tipo',tipo:'select',opcoes:CFG('tipoOportunidade')},
      {k:'estagio',t:'Estágio',tipo:'select',opcoes:ESTAGIOS},
      {k:'porque',t:'Por que isso me interessa',tipo:'textarea',full:true,
        ph:'o que te chamou a atenção — daqui a seis meses você não vai lembrar'},
    ],()=>{marcarMexido(o);salvar()}));
    c.appendChild(s1);

    /* ---- a régua ---- */
    const s2=el('<div class="secao"><h4>A régua — responda de 0 a 5</h4></div>');
    s2.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin:-4px 0 10px">
      Serve para comparar coisas diferentes com a mesma medida. Responda rápido, no chute honesto:
      demorar aqui é sinal de que a ideia ainda não está madura o suficiente para decidir.</p>`));
    const notaEl=el('<div style="font-family:Fraunces,serif;font-size:30px;font-weight:600;margin-bottom:10px"></div>');
    const pintaNota=()=>{
      const v=notaOport(o);
      notaEl.textContent=respondida(o)?v:'—';
      notaEl.style.color=!respondida(o)?'var(--suave)':v>=60?'var(--verde)':v>=35?'var(--areia)':'var(--vermelho)';
      notaEl.innerHTML=notaEl.textContent+(respondida(o)?'<span style="font-size:13px;color:var(--suave);font-family:inherit;font-weight:400"> de 100</span>':'');
    };
    CRITERIOS.forEach(cr=>{
      const linha=el(`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--linha);flex-wrap:wrap">
        <div style="flex:1;min-width:170px">
          <div style="font-size:13.5px;font-weight:600">${cr.t} <span style="font-weight:400;font-size:11px;color:${cr.peso>0?'var(--verde)':'var(--vermelho)'}">${cr.peso>0?'↑ ajuda':'↓ atrapalha'}</span></div>
          <div style="font-size:11.5px;color:var(--suave)">${cr.dica}</div>
        </div>
        <div class="notas" style="display:flex;gap:5px"></div>
      </div>`);
      const box=linha.querySelector('.notas');
      [0,1,2,3,4,5].forEach(v=>{
        const b=el(`<button class="btn mini ${(+o[cr.k]||0)===v&&o[cr.k]!=null&&o[cr.k]!==''?'':'ghost'}" style="min-width:30px">${v}</button>`);
        b.onclick=()=>{
          o[cr.k]=v;marcarMexido(o);salvar();
          [...box.children].forEach((x,i)=>x.className='btn mini '+(i===v?'':'ghost'));
          pintaNota();
        };
        box.appendChild(b);
      });
      s2.appendChild(linha);
    });
    pintaNota();
    s2.insertBefore(notaEl,s2.children[1]);
    c.appendChild(s2);

    /* ---- o passo ---- */
    const s3=el('<div class="secao"><h4>O próximo passo</h4></div>');
    s3.appendChild(el(`<p style="font-size:12.5px;color:var(--suave);margin:-4px 0 8px">
      Uma coisa só, pequena, que faz a ideia andar. Sem isso ela não é oportunidade, é lembrança.</p>`));
    s3.appendChild(campos(o,[
      {k:'proximoPasso',t:'O que fazer',ph:'ex.: ligar para o corretor e pedir a planta',full:true},
      {k:'ate',t:'Até quando',tipo:'date'},
    ],()=>{marcarMexido(o);salvar()}));
    const bAgenda=el('<button class="btn ghost mini">📅 Levar para a Agenda</button>');
    bAgenda.onclick=()=>{
      const p=String(o.proximoPasso||'').trim();
      if(!p){alert('Escreva o próximo passo antes.');return}
      // mesmo formato dos outros compromissos: data, hora, titulo, local, tipo, obs
      E.agenda.push({id:uid(),data:o.ate||hoje(),hora:'',titulo:p+' — '+(o.titulo||'oportunidade'),
        local:'',tipo:CFG('tiposCompromisso')[0],obs:'veio das Oportunidades'});
      marcarMexido(o);salvar();
      alert('Está na Agenda.');
    };
    s3.appendChild(bAgenda);
    c.appendChild(s3);

    /* ---- links ---- */
    const s4=el('<div class="secao"><h4>Links</h4></div>');
    const lista=el('<div></div>');
    const pintaLinks=()=>{
      lista.innerHTML='';
      (o.links||[]).forEach((lk,i)=>{
        const li=el(`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--linha)">
          <a href="${esc(lk.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0;color:inherit;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            <b>${esc(lk.titulo||lk.url)}</b><div style="font-size:11px;color:var(--suave);overflow:hidden;text-overflow:ellipsis">${esc(lk.url)}</div></a>
          <button class="btn ghost mini" style="color:var(--vermelho)">✕</button></div>`);
        li.querySelector('button').onclick=()=>{o.links.splice(i,1);marcarMexido(o);salvar();pintaLinks()};
        lista.appendChild(li);
      });
      if(!(o.links||[]).length) lista.innerHTML='<div class="vazio">Nenhum link ainda.</div>';
    };
    pintaLinks();
    s4.appendChild(lista);
    const novoLink={titulo:'',url:''};
    s4.appendChild(campos(novoLink,[
      {k:'titulo',t:'Nome do link',ph:'ex.: anúncio do imóvel'},
      {k:'url',t:'Endereço',ph:'https://…'},
    ]));
    const bLink=el('<button class="btn mini">+ Guardar link</button>');
    bLink.onclick=()=>{
      let u=String(novoLink.url||'').trim();
      if(!u){alert('Cole o endereço.');return}
      if(!/^https?:\/\//i.test(u)) u='https://'+u;   // colar sem o http é o normal
      o.links=[...(o.links||[]),{titulo:String(novoLink.titulo||'').trim(),url:u}];
      marcarMexido(o);salvar();pintaLinks();
      novoLink.titulo='';novoLink.url='';
      s4.querySelectorAll('input').forEach(i=>i.value='');
    };
    s4.appendChild(bLink);
    c.appendChild(s4);

    /* ---- arquivos ---- */
    const s5=el('<div class="secao"><h4>Arquivos</h4></div>');
    s5.appendChild(areaArquivos('oportunidade:'+o.id,'proposta, planta, print, planilha — o que ajudar a decidir'));
    c.appendChild(s5);

    /* ---- anotações e decisão ---- */
    const s6=el('<div class="secao"><h4>Anotações</h4></div>');
    s6.appendChild(campos(o,[
      {k:'obs',t:'O que fui descobrindo',tipo:'textarea',full:true,
        ph:'conversas, números, quem indicou, o que te fez mudar de ideia'},
    ],()=>{marcarMexido(o);salvar()}));
    c.appendChild(s6);

    const s7=el('<div class="secao" style="display:flex;gap:9px;flex-wrap:wrap"></div>');
    if(o.estagio!=='Arquivada'){
      const bArq=el('<button class="btn ghost">📥 Arquivar</button>');
      bArq.onclick=()=>{
        const p=prompt('Arquivando "'+(o.titulo||'sem título')+'". Por que não vai adiante?\n(fica registrado — é o que impede a mesma ideia de voltar daqui a um ano)');
        if(p==null)return;
        o.estagio='Arquivada';o.porqueNao=p;marcarMexido(o);salvar();fechar();
      };
      s7.appendChild(bArq);
    } else {
      const bVolta=el('<button class="btn ghost">↩ Tirar do arquivo</button>');
      bVolta.onclick=()=>{o.estagio='Semente';marcarMexido(o);salvar();fechar()};
      s7.appendChild(bVolta);
      if(o.porqueNao) c.insertBefore(el(`<div class="aviso">📥 <b>Arquivada.</b> Motivo registrado: ${esc(o.porqueNao)}</div>`),c.firstChild);
    }
    const del=el('<button class="btn ghost" style="color:var(--vermelho)">Apagar</button>');
    del.onclick=async()=>{
      if(!confirm('Apagar esta oportunidade e seus arquivos? Arquivar guarda o motivo; apagar não deixa rastro.'))return;
      if(!await apagarAnexosDe('oportunidade:'+o.id))return;
      E.oportunidades=E.oportunidades.filter(x=>x.id!==o.id);salvar();fechar();
    };
    s7.appendChild(del);
    s7.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s7.appendChild(ok);
    c.appendChild(s7);
  },()=>{
    // registro em branco criado por engano não fica sujando a lista
    // o próprio abrirModal redesenha a tela ao fechar
    if(novoReg&&vazia()){E.oportunidades=E.oportunidades.filter(x=>x.id!==o.id);salvar()}
  });
}

/* ===================== ACESSOS DOS SISTEMAS ===================== */
// Os sistemas que a Central administra de verdade falam com a mesma função
// (equipe-auth). Painel e RH têm mecanismo próprio e por enquanto entram só
// como atalho — dizer que administro o que não administro seria pior que a
// falta da tela.
const API_EQUIPE='https://heveemylixartyijxewh.supabase.co/functions/v1/equipe-auth';
const SISTEMAS_ACESSO=[
  {k:'brief',   nome:'Brief de Medição', ic:'📋', url:'https://impresilk.com.br/brief',
   sub:'vendedores e designers em campo'},
  {k:'pcp',     nome:'PCP / Instalação', ic:'🔧', url:'https://impresilk.com.br/pcp',
   sub:'gestão; a montagem entra pelo nome, sem senha'},
  {k:'compras', nome:'Compras',          ic:'🛒', url:'https://leogpereira-afk.github.io/impresilk-compras/',
   sub:'quem pede, cota e recebe material'},
  {k:'pops',    nome:'Pops & Fabricação', ic:'📘', url:'https://impresilk.com.br/pops',
   sub:'POPs por setor e jornadas de fabricação'},
  // O DRE é uma PORTA: uma senha só, sem quadro de gente. Por isso não pede
  // nome — o login dele é sempre "equipe", e digitar outra coisa criaria uma
  // conta que o app nunca vai procurar.
  {k:'dre',     nome:'DRE Caixa',        ic:'💰', url:'https://impresilk.com.br/dre',
   sub:'uma senha só, para quem alimenta o sistema', porta:'equipe', papelPorta:'equipe'},
  // Estes dois têm login PRÓPRIO e mais antigo — não se entra por aqui. Mas o
  // acesso de cada um se administra daqui, que era o pedido: um lugar só.
  {k:'painel',  nome:'Painel de Gestão', ic:'📊', url:'https://impresilk.com.br/painel',
   sub:'contas-atrasadas, fluxo, produtos, orçamentos', semDesativar:true, nota:'Quem é criado aqui enxerga tudo. Para liberar só alguns módulos, ajuste dentro do Painel, na tela Acessos.'},
  {k:'rh',      nome:'RH (Pessoas)',     ic:'👥', url:'https://impresilk.com.br/rh',
   sub:'ADMIN_RH, gestores e colaboradores', semDesativar:true, nota:'O acesso se liga à ficha da pessoa: ela precisa já existir como colaborador no RH.'},
];
const SO_ATALHO=[];

/* A equipe-auth nao aceita mais a sessao longa deste app como cracha de
   administracao: ela recusa qualquer cracha que nasca para durar mais de 12h.
   Entao, antes de administrar, a sessao longa e trocada por um cracha curto.
   Guardado em memoria enquanto vale -- some quando a aba fecha. */
let _crachaAdmin=null, _crachaAdminAte=0;
async function crachaAdmin(){
  if(_crachaAdmin && Date.now() < _crachaAdminAte - 60000) return _crachaAdmin;
  const r=await fetch(API_SYNC,{method:'POST',
    headers:{'content-type':'application/json',authorization:'Bearer '+pegaToken()},
    body:JSON.stringify({acao:'crachaAdmin'})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.token) throw new Error(d.erro||'Entre de novo para administrar acessos.');
  _crachaAdmin=d.token; _crachaAdminAte=Number(String(d.token).split('.')[0])||0;
  return _crachaAdmin;
}

async function apiEquipe(acao,corpo){
  const r=await fetch(API_EQUIPE,{method:'POST',
    headers:{'content-type':'application/json',authorization:'Bearer '+(await crachaAdmin())},
    body:JSON.stringify({acao,...corpo})});
  let d={};try{d=await r.json()}catch(_){}
  if(!r.ok)throw Object.assign(new Error(d.erro||('HTTP '+r.status)),{status:r.status,erro:d.erro});
  return d;
}

// senha temporária legível: quem recebe vai digitar isso no celular, na obra
function senhaTemporaria(){
  const s1=['sol','lua','rio','mar','céu','pão','flor','vento','pedra','folha'];
  const s2=['azul','verde','claro','forte','novo','leve','alto','certo'];
  const p=a=>a[Math.floor(Math.random()*a.length)];
  return p(s1)+'-'+p(s2)+'-'+String(Math.floor(Math.random()*900)+100);
}

function telaAcessos(){
  const cx=el('<div class="corpo"></div>');
  // mesma porta de teste da puxarNuvem: local não fala com o servidor, a não
  // ser que alguém esteja justamente testando esta tela
  if(DEV&&!window.__testeAcessos){cx.appendChild(el('<div class="aviso">Rodando local: os acessos só aparecem no site de verdade, com sessão.</div>'));return cx}

  SISTEMAS_ACESSO.forEach(sis=>{
    const aberto=!!(filtro.acessosAbertos&&filtro.acessosAbertos[sis.k]);
    const linha=el(`<div style="border:1px solid var(--linha);border-radius:var(--r);margin-bottom:10px;overflow:hidden;background:var(--card)">
      <button class="cabSis" style="width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--bg);border:none;font:inherit;color:inherit;text-align:left;cursor:pointer">
        <span class="seta" style="color:var(--suave);font-size:12px;width:12px">${aberto?'▾':'▸'}</span>
        <span style="font-size:18px">${sis.ic}</span>
        <b style="font-size:14.5px">${esc(sis.nome)}</b>
        <span style="font-size:12px;color:var(--suave)">${esc(sis.sub)}</span>
        <span class="conta" style="margin-left:auto;font-size:12px;color:var(--suave)"></span>
      </button>
      <div class="corpoSis" style="padding:${aberto?'13px 15px':'0'};display:${aberto?'block':'none'}"></div>
    </div>`);
    const corpo=linha.querySelector('.corpoSis');
    let carregado=false;

    const carregar=async()=>{
      corpo.innerHTML='<div class="vazio">Carregando…</div>';
      let d;
      try{ d=await apiEquipe('listarContas',{sistema:sis.k}); }
      catch(e){
        corpo.innerHTML='';
        corpo.appendChild(el(`<div class="aviso" style="background:var(--vermelho-cl);border-color:var(--vermelho)">
          Não consegui ler os acessos do ${esc(sis.nome)}: ${esc(e.erro||e.message)}</div>`));
        corpo.appendChild(abrirSistema(sis));
        return;
      }
      carregado=true;
      const contas=d.contas||[], papeis=d.papeis||[];
      linha.querySelector('.conta').textContent=contas.length+(contas.length===1?' acesso':' acessos');

      t2.innerHTML='<thead><tr><th>Quem</th><th>Papel</th><th>Situação</th><th></th></tr></thead>';
