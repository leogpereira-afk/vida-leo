      contas.forEach(c=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td style="padding:9px 10px"><b>${esc(c.nome||c.usuario)}</b>

          <td style="padding:9px 10px">${esc(c.papel)}</td>
          <td style="padding:9px 10px">${sis.semDesativar?chip('Realizado'):(c.ativo===false?chip('Cancelado'):c.trocarSenha?chip('Em Planejamento'):chip('Realizado'))}
            <span style="font-size:11.5px;color:var(--suave);margin-left:4px">${sis.semDesativar?'com acesso':(c.ativo===false?'desativado':c.trocarSenha?'senha temporária':'ativo')}</span></td>
          <td style="padding:9px 10px;text-align:right;white-space:nowrap"></td>`;
        const acoes=tr.lastElementChild;

          prompt('Senha temporária de '+(c.nome||c.usuario)+' — copie e mande para ela:',nova);
          carregar();
        };
        acoes.appendChild(bSenha);
        // Painel e RH não têm "desativado": ou a conta existe, ou não existe.
        if(!sis.semDesativar){
          const bAtivo=el('<button class="btn mini ghost">'+(c.ativo===false?'✓ reativar':'⊘ desativar')+'</button>');
          bAtivo.style.marginLeft='6px';
          bAtivo.onclick=async()=>{
            try{ await apiEquipe('salvarConta',{sistema:sis.k,usuario:c.usuario,nome:c.nome,papel:c.papel,ativo:c.ativo===false}); }
            catch(e){ alert(e.erro||'Não consegui mudar.'); return; }
            carregar();
          };
          acoes.appendChild(bAtivo);
        }
        const bDel=el('<button class="btn mini ghost" style="color:var(--vermelho);margin-left:6px">🗑</button>');
        bDel.onclick=async()=>{
          if(!confirm('Tirar o acesso de '+(c.nome||c.usuario)+' em '+sis.nome+'? O trabalho dele continua onde está.'))return;
          try{ await apiEquipe('removerConta',{sistema:sis.k,usuario:c.usuario}); }
          catch(e){ alert(e.erro||'Não consegui remover.'); return; }
          carregar();
        };

        tb.appendChild(tr);

      t2.appendChild(tb); tab.appendChild(t2); corpo.appendChild(tab);

      if(sis.nota) form.appendChild(el('<div style="font-size:12.5px;color:var(--suave);margin-bottom:9px">'+esc(sis.nota)+'</div>'));
      if(sis.porta){
        // porta: define ou troca A senha, sem inventar nome de usuário — o app
        // do DRE sempre entra como "equipe", então qualquer outro nome criaria
        // uma conta que ele nunca vai procurar

        const bP=el('<button class="mais">'+(jaTem?'🔑 Trocar a senha de entrada':'🔑 Definir a senha de entrada')+'</button>');
        bP.onclick=async()=>{
          const senha=prompt('Senha de entrada do '+sis.nome+' (mínimo 6). Todo mundo que alimenta o sistema usa esta:');
          if(senha==null)return;

          try{ await apiEquipe('salvarConta',{sistema:sis.k,usuario:sis.porta,nome:'Equipe',
            papel:sis.papelPorta,senha,ativo:true,temporaria:false}); }
          catch(e){ alert(e.erro||'Não consegui definir.'); return; }
          alert('Pronto. Quem for entrar no '+sis.nome+' usa essa senha.');
          carregar();
        };
        form.appendChild(bP);
        corpo.appendChild(form);
        corpo.appendChild(abrirSistema(sis));
        return;
      }
      const nova={nome:'',papel:papeis[0]||''};
      form.appendChild(campos(nova,[
        {k:'nome',t:'Nome de quem vai entrar',ph:'ex.: Maria'},

          '\n\nEla troca na primeira entrada.'))return;
        try{ await apiEquipe('salvarConta',{sistema:sis.k,usuario:nome,nome,papel:nova.papel,senha,ativo:true}); }
        catch(e){ alert(e.erro||'Não consegui criar.'); return; }
        prompt('Acesso criado. Mande isto para '+nome+':','Sistema: '+sis.nome+'  ·  Usuário: '+nome+'  ·  Senha: '+senha);
        nova.nome='';salvar();carregar();

      form.appendChild(bNovo);

      corpo.appendChild(abrirSistema(sis));
    };

    linha.querySelector('.cabSis').onclick=()=>{
      const abrindo=corpo.style.display==='none';
      if(!filtro.acessosAbertos)filtro.acessosAbertos={};
      filtro.acessosAbertos[sis.k]=abrindo;

      corpo.style.padding=abrindo?'13px 15px':'0';
      linha.querySelector('.seta').textContent=abrindo?'▾':'▸';
      if(abrindo&&!carregado)carregar();
    };
    if(aberto)carregar();
    cx.appendChild(linha);
  });

  // os que ainda têm porta própria (hoje: nenhum)
  const outros=el('<div style="margin-top:14px"></div>');
  if(SO_ATALHO.length) outros.appendChild(el('<div style="font-size:12.5px;color:var(--suave);margin-bottom:8px">Estes têm login próprio — o acesso se mexe dentro deles:</div>'));
  SO_ATALHO.forEach(o=>{
    const a=el(`<a href="${o.url}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--linha);border-radius:var(--r);margin-bottom:8px;text-decoration:none;color:inherit;background:var(--card)">
      <span style="font-size:17px">${o.ic}</span><b style="font-size:14px">${esc(o.nome)}</b>
      <span style="font-size:12px;color:var(--suave)">${esc(o.onde)}</span>

    outros.appendChild(a);
  });
  cx.appendChild(outros);
  cx.appendChild(blocoHistorico());
  return cx;
}

/* ---- HISTÓRICO DE ACESSOS (todos os sistemas, um lugar só) ----
   O log sempre foi gravado, mas não havia por onde ler: 13 linhas escritas e
   invisíveis. Aqui a Central mostra tudo -- quem entrou, quem tentou e errou,
   quem trocou senha, quem criou ou removeu acesso. */
const ACOES_HIST={
  'entrou':        {t:'entrou',              ic:'✅', cor:'var(--ok, #17a673)'},
  'login-falhou':  {t:'errou a senha',       ic:'⚠️', cor:'var(--alerta, #b97a08)'},
  'login-barrado': {t:'barrado (desativado)',ic:'⛔', cor:'var(--perigo, #d43d51)'},
  'trocou-senha':  {t:'trocou a senha',      ic:'🔑', cor:'var(--suave)'},
  'criou':         {t:'acesso criado',       ic:'➕', cor:'var(--suave)'},
  'editou':        {t:'acesso editado',      ic:'✏️', cor:'var(--suave)'},
  'salvou':        {t:'acesso salvo',        ic:'💾', cor:'var(--suave)'},
  'removeu':       {t:'acesso removido',     ic:'🗑️', cor:'var(--perigo, #d43d51)'},
  'importou':      {t:'contas importadas',   ic:'📥', cor:'var(--suave)'},
};
function quandoRelativo(iso){
  const d=new Date(iso); if(isNaN(d))return '';
  const min=Math.round((Date.now()-d.getTime())/60000);
  if(min<1)return 'agora';
  if(min<60)return min+' min atrás';
  const h=Math.round(min/60);
  if(h<24)return h+'h atrás';
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function blocoHistorico(){
  const cx=el('<div style="margin-top:22px"></div>');
  cx.appendChild(el('<div style="font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);margin-bottom:4px">Histórico de acessos</div>'));
  cx.appendChild(el('<div style="font-size:12.5px;color:var(--suave);margin-bottom:10px">Todos os sistemas. Quem entrou, quem errou a senha, quem trocou, quem mexeu em acesso.</div>'));
  const filtros=el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"></div>');
  const lista=el('<div></div>');
  let so='';   // '' = tudo
  const botoes=[['','tudo'],['entrou','entradas'],['login-falhou','erros de senha'],['trocou-senha','trocas de senha']];
  const pintarFiltros=()=>{
    filtros.innerHTML='';
    botoes.forEach(([k,rot])=>{
      const b=el('<button style="border:1px solid var(--linha);background:'+(so===k?'var(--txt)':'var(--card)')+
        ';color:'+(so===k?'var(--card)':'inherit')+';border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer">'+rot+'</button>');
      b.onclick=()=>{so=k;pintarFiltros();carregarHist()};
      filtros.appendChild(b);
    });
  };
  async function carregarHist(){
    lista.innerHTML='<div style="font-size:13px;color:var(--suave);padding:8px 0">carregando…</div>';
    let d;
    try{ d=await apiEquipe('historico',{sistema:'*',limite:200,...(so?{acao:so}:{})}); }
    catch(e){ lista.innerHTML='<div class="aviso">'+esc(e.erro||'não consegui carregar o histórico')+'</div>'; return; }
    const linhas=d.linhas||[];
    if(!linhas.length){ lista.innerHTML='<div style="font-size:13px;color:var(--suave);padding:8px 0">nada registrado ainda.</div>'; return; }
    // nome do sistema pelo registro que a própria Central já tem
    const nomeSis={};SISTEMAS_ACESSO.forEach(x=>nomeSis[x.k]=x.nome);
    lista.innerHTML='';
    linhas.forEach(l=>{
      const a=ACOES_HIST[l.acao]||{t:l.acao,ic:'•',cor:'var(--suave)'};
      // "por" só interessa quando foi OUTRA pessoa que mexeu na conta
      const porOutro=l.por&&l.por!=='-'&&!String(l.por).endsWith(':'+l.usuario);
      lista.appendChild(el('<div style="display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--linha)">'+
        '<span style="font-size:14px">'+a.ic+'</span>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13.5px"><b>'+esc(l.usuario||'—')+'</b> '+esc(a.t)+
            ' <span style="color:var(--suave)">· '+esc(nomeSis[l.sistema]||l.sistema)+'</span></div>'+
          (l.detalhe||porOutro?'<div style="font-size:12px;color:var(--suave)">'+
            esc([l.detalhe,porOutro?'por '+String(l.por).replace(/^[^:]*:/,''):''].filter(Boolean).join(' · '))+'</div>':'')+
        '</div>'+
        '<span style="font-size:12px;color:var(--suave);white-space:nowrap">'+esc(quandoRelativo(l.em))+'</span>'+
      '</div>'));
    });
  }
  pintarFiltros();
  cx.appendChild(filtros);
  cx.appendChild(lista);
  carregarHist();
  return cx;
}

function abrirSistema(sis){
  return el(`<div style="padding-top:10px"><a href="${sis.url}" target="_blank" rel="noopener"
    style="font-size:12.5px;color:var(--suave);text-decoration:none">↗ abrir o ${esc(sis.nome)}</a></div>`);

/* ===================== RENDIMENTOS ===================== */
/* O painel nasceu lendo os totais congelados da planilha (rendHist). Depois que
   os 186 lançamentos entraram e passaram a fechar ano a ano, isso virou uma
   armadilha: lançar algo novo não mexia no número do topo. Aqui montamos um
   histórico VIVO — em cada ANO que tem lançamento, quem manda é a soma dos
   lançamentos; anos sem lançamento seguem com o valor da planilha. A planilha
   original continua acessível em _raw, que é o que a Conferência compara. */
let _hvCache=null,_hvMt=-2;
function histVivo(){
  const R=E.rendHist||{};
  if(_hvMt===E._mt&&_hvCache) return _hvCache;
  const L=E.rendimentos||[];
  const anosLanc=[...new Set(L.map(x=>+String(x.data||'').slice(0,4)).filter(Boolean))];
  const temL={};anosLanc.forEach(a=>temL[a]=true);
  const anos=[...new Set([...(R.anos||[]),...anosLanc])].filter(Boolean).sort((a,b)=>a-b);
  const iR=a=>(R.anos||[]).indexOf(a);
  const somaAno=a=>L.filter(x=>String(x.data||'').startsWith(a)).reduce((s2,x)=>s2+(+x.valor||0),0);
  const totalAno=anos.map(a=>temL[a]?somaAno(a):(iR(a)>=0?(R.totalAno[iR(a)]||0):0));
  const nomes=[...new Set([...Object.keys(R.empresas||{}),...L.map(x=>x.empresa)])].filter(Boolean);
  const empresas={};
  nomes.forEach(nm=>{empresas[nm]=anos.map(a=>temL[a]
    ? L.filter(x=>String(x.data||'').startsWith(a)&&x.empresa===nm).reduce((s2,x)=>s2+(+x.valor||0),0)
    : (iR(a)>=0?(((R.empresas||{})[nm]||[])[iR(a)]||0):0))});
  const totalGeral=totalAno.reduce((s2,v)=>s2+v,0);
  const parciais=R.parciais||R.incompletos||[];
  const completos=anos.filter(a=>!parciais.includes(a));
  _hvCache={...R,anos,totalAno,empresas,totalGeral,parciais,
    mediaAnual:completos.length?anos.reduce((s2,a,i)=>s2+(parciais.includes(a)?0:totalAno[i]),0)/completos.length:0,
    _raw:R};
  _hvMt=E._mt;
  return _hvCache;
}

function vRendimentos(m){
  const r=rr('rendimentos');const H=histVivo();
  if(!H.anos||!H.anos.length){
    m.appendChild(cab('Rendimentos','Quanto você ganha — por mês, por empresa e no acumulado.'));
    m.appendChild(el(`<div class="aviso">☁ Seus dados ainda não chegaram neste aparelho — clique em <b>Sincronizar</b> no menu lateral.</div>`));
    return;
  }
  const parciais=H.parciais||H.incompletos||[];
  // o ano acompanha o calendário sozinho; o seletor permite olhar outro ano ou somar todos
  if(filtro.rendAno==null) filtro.rendAno=anoHoje;
  const todos=filtro.rendAno==='todos';
  const ano=todos?anoHoje:+filtro.rendAno;
  const iAno=H.anos.indexOf(ano);
  // anos do histórico + anos com lançamento + o ano vigente, sempre
  const anosR=[...new Set([...H.anos,...E.rendimentos.map(x=>+(x.data||'').slice(0,4)).filter(Boolean),anoHoje])]
    .filter(Boolean).sort((a,b)=>a-b);
  // inclui tambem as empresas que so existem no historico da planilha (sem lancamento no ano),
  // senao clicar nelas no ranking nao seleciona nada
  const empresasR=[...new Set([...E.rendimentos.filter(x=>(x.data||'').startsWith(ano)).map(x=>x.empresa),
    ...Object.keys(H.empresas||{})].filter(Boolean))].sort();
  const empSel=filtro.rendEmp||'Todas';
  const doAnoTudo=E.rendimentos.filter(x=>(x.data||'').startsWith(ano));
  const doAno=empSel==='Todas'?doAnoTudo:doAnoTudo.filter(x=>x.empresa===empSel);
  const totLanc=doAno.reduce((s,x)=>s+(+x.valor||0),0);
  const porMes=MESES.map((_,i)=>doAno.filter(x=>+((x.data||'').slice(5,7))===i+1).reduce((s,x)=>s+(+x.valor||0),0));
  const mesN=new Date().getMonth();

  m.appendChild(cab('Rendimentos','De onde vem o seu dinheiro — e o que mais deu lucro.'));
  m.appendChild(painel('Ano',
    seletor(filtro.rendAno,[...anosR.map(a=>[a,String(a)]),['todos','Todos os anos']],
      v=>{filtro.rendAno=(v==='todos'?'todos':+v);filtro.rendEmp='Todas';filtro.rendAnoSel=-1;r()}),
    seletor(empSel,[['Todas','Todas as empresas ('+doAnoTudo.length+')'],
      ...empresasR.map(e=>[e,e+' ('+doAnoTudo.filter(x=>x.empresa===e).length+')'])],
      v=>{filtro.rendEmp=v;r()}),
    seletor(filtro.rendVisao,[['Anual','Visão anual'],['Mensal','Visão mensal']],
      v=>{filtro.rendVisao=v;r()}),
    acao('⬇ Excel',baixarRendimentosExcel,'ghost'),
    acao('🖨 PDF',baixarRendimentosPDF,'ghost'),'|'));

  // na visão mensal, os agregados do ano saem de cena; o mês a mês assume
  const vAnual = filtro.rendVisao !== 'Mensal';
  const mA = { appendChild: x => { if (vAnual) m.appendChild(x) } };

  /* ---- números do recorte escolhido ---- */
  const totalSel=todos?H.totalGeral:(H.totalAno[iAno]||0);
  // Os meses que contam para a média são os que têm lançamento — antes isso era
  // um "6" cravado (a planilha ia até junho), e julho não entrava na conta.
  // Sem lançamento nenhum no ano, cai no calendário e na marcação da planilha.
  const mesesLanc=[...new Set(doAnoTudo.map(x=>+String(x.data||'').slice(5,7)).filter(Boolean))];
  const ehParcial=!todos&&(mesesLanc.length?mesesLanc.length<12:parciais.includes(ano));
  const mesesDecorridos=mesesLanc.length||(ano===anoHoje?mesN+1:12);
  // fontes: empresa (sempre) e negócio (quando há detalhe)
  const fontesEmp=Object.entries(H.empresas)
    .map(([n,v])=>({r:n,v:todos?v.reduce((a,b)=>a+b,0):(v[iAno]||0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const maior=fontesEmp[0];
  const conc=maior&&totalSel?maior.v/totalSel*100:0;
  // crescimento contra o ano anterior (só faz sentido em ano específico)
  const cresc=(!todos&&iAno>0&&H.totalAno[iAno-1])?((H.totalAno[iAno]/H.totalAno[iAno-1])-1)*100:null;
  // Quanto da queda contra o ano passado é de empresa que deixou de existir.
  // Sem isso o painel diz "-40%" e parece que o negócio encolheu, quando na
  // verdade uma fonte foi vendida — susto que não corresponde a nada.
  const saíram=(!todos&&iAno>0)?Object.entries(H.empresas||{})
    .filter(([nm,v])=>encerrada(nm)&&(v[iAno-1]||0)>0&&!(v[iAno]||0))
    .map(([nm,v])=>({nome:nm,valor:v[iAno-1]||0})):[];
  const totalSaiu=saíram.reduce((a,x)=>a+x.valor,0);

  const anoIni=H.anos[0],anoFim=H.anos[H.anos.length-1];
  m.appendChild(ligaKpis(el(`<div class="grade">
    ${kpi(todos?('Total '+anoIni+'–'+anoFim):'Ganho em '+ano,brl(totalSel),
      (todos?'tudo somado':(ehParcial?'ano parcial':'no ano inteiro'))+' · ver mês a mês','v','mes')}
    ${kpi('Média por mês',brl(totalSel/(todos?H.anos.length*12:mesesDecorridos)),
      (todos?('nos '+H.anos.length+' anos'):mesesDecorridos+' meses')+' · ver mês a mês',null,'mes')}
    ${kpi('Maior fonte',maior?avatar(maior.r,22)+esc(maior.r):'—',maior?brl(maior.v)+' · '+conc.toFixed(0)+'% do total':'','a',maior?'fonte':null)}
    ${(()=>{const ls=todos?E.rendimentos:doAnoTudo;
      const ult=[...ls].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(y=>y.data).pop();
      return kpi('Lançamentos',ls.length,ult?'último em '+fmtDataAno(ult):'nenhum ainda',null,'lanc')})()}
    ${cresc==null?kpi('Média anual',brl(H.mediaAnual),'anos completos','','evol')
      :kpi('Contra '+(ano-1),(cresc>=0?'+':'')+cresc.toFixed(0)+'%',
        brl(Math.abs(H.totalAno[iAno]-H.totalAno[iAno-1]))+(cresc>=0?' a mais':' a menos')
          +(totalSaiu?' · '+brl(totalSaiu)+' era de empresa encerrada':''),cresc>=0?'v':'r','evol')}</div>`),{
    // dinheiro do período -> o mês a mês, que é onde o número se destrincha
    mes:()=>{if(todos)filtro.rendAno=anoFim;filtro.rendVisao='Mensal';abreBloco('rd-mes');r()},
    // maior fonte -> filtra por ela e desce até os lançamentos dela

  tg.appendChild(tbg);

  an.innerHTML=`<div class="lista-sug">${notas.join('')}</div>`;

  /* ---- conferência: o lançado bate com o histórico? — com o dedo no que destoa ---- */
  const cfx=el('<div></div>');
  {

        return `<tr data-cfano="${a2}" style="cursor:pointer"><td style="padding:9px 10px"><b>${a2}</b></td>

    } else {
      const HR=H._raw||H;

      corpo=nomesC.map(nm=>{
        const ls=doAnoTudo.filter(y=>y.empresa===nm);

        return `<tr data-cfemp="${esc(nm)}" style="cursor:pointer"><td style="padding:9px 10px;white-space:nowrap">${avatar(nm,20)}<b>${esc(nm)}</b></td>
          <td style="${cel};color:var(--suave)">${ls.length}</td>

      <th style="text-align:right">Somam</th><th style="text-align:right">Histórico</th><th style="text-align:right">Diferença</th></tr></thead><tbody>${corpo}</tbody></table>`;
    cfx.appendChild(rolC);
    const nd=dupRendSet().size;
    const semD=E.rendimentos.filter(y=>/lançado em 31\/12/i.test(y.obs||'')).length;

    cfx.appendChild(el(`<div style="padding:10px 17px 14px;font-size:12.5px;color:var(--suave)">

    /* A planilha de origem é um retrato de quando os dados foram importados.

       deixa de servir para avisar do erro de verdade.

       Este botão diz "os lançamentos estão certos": ele reescreve o retrato a

    const difs=(()=>{
      const HR2=H._raw||H;
      const anosT=[...new Set([...(HR2.anos||[]),...E.rendimentos.map(y=>+String(y.data||'').slice(0,4))])]
        .filter(Boolean).sort((a,b)=>a-b);

        return {ano:a2,soma,hist:i2>=0?(HR2.totalAno[i2]||0):0};

    })();

        <div class="det"></div></div>`);
      det.querySelector('button').onclick=()=>{filtro.rendAnoSel=-1;pintaEvo()};
      const somaEmp=emp.reduce((s,x)=>s+x.v,0), difA=totA-somaEmp;
      // cada empresa mostra QUANTOS lançamentos tem no ano; clicar expande, e cada um abre para corrigir
      const lanDe=nome=>E.rendimentos.filter(y=>String(y.data||'').startsWith(anoS)&&y.empresa===nome)
        .sort((a,b)=>(a.data||'').localeCompare(b.data||''));
      det.querySelector('.det').innerHTML=(emp.length
        ? `<table><thead><tr><th>Empresa</th><th>Lançamentos</th><th style="text-align:right">Valor</th><th style="text-align:right">% do ano</th><th></th></tr></thead><tbody>
            ${emp.map((x,j)=>{const corE=marcaDe(x.r).cor,lan=lanDe(x.r);
              return `<tr data-empx="${esc(x.r)}" data-nlan="${lan.length}" style="cursor:pointer"><td style="padding:9px 10px">${avatar(x.r,24)}<b>${esc(x.r)}</b>
                <div class="barra"><i style="width:${(x.v/emp[0].v*100).toFixed(0)}%;background:${corE}"></i></div></td>
              <td style="padding:9px 10px"><span class="chip nchip" style="background:var(--bg);border:1px solid var(--linha);color:var(--suave)">${lan.length?`▸ ${lan.length} lançamento(s)`:'nenhum lançado'}</span></td>
              <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${brl(x.v)}</td>
              <td style="padding:9px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${(x.v/totA*100).toFixed(0)}%</td>
              <td style="padding:9px 10px;text-align:right"><button class="btn ghost mini" data-filtrar="${esc(x.r)}">abrir ›</button></td></tr>`
              +lan.map(y=>`<tr data-lan="${esc(y.id)}" class="lanoc" style="display:none;cursor:pointer">
                <td style="padding:6px 10px 6px 40px;font-size:12.5px;white-space:nowrap">↳ ${fmtDataAno(y.data)}${y.tipo?` <span style="color:var(--suave)">· ${esc(y.tipo)}</span>`:''}${flagsLan(y)}</td>
                <td style="padding:6px 10px;color:var(--suave);font-size:12px">${esc(y.instituicao||'')}</td>
                <td style="padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums">${brl(+y.valor||0)}</td>
                <td style="padding:6px 10px;text-align:right;color:var(--suave);font-size:11.5px" colspan="2">✎ corrigir</td></tr>`).join('')
              +(lan.length?`<tr data-addlan="${esc(x.r)}" class="lanoc" style="display:none;cursor:pointer">
                <td colspan="5" style="padding:5px 10px 10px 40px;font-size:12px;color:var(--verde)">+ lançamento de ${esc(x.r)} em ${anoS}</td></tr>`:'')}).join('')}
            <tr class="tfim"><td colspan="2">Soma das empresas</td><td style="text-align:right">${brl(somaEmp)}</td>
              <td style="text-align:right">${(somaEmp/totA*100).toFixed(0)}%</td><td></td></tr>
          </tbody></table>`
        : '<div class="vazio">Nenhuma empresa registrada neste ano.</div>')
        // guarda de honestidade: se a planilha não fecha, mostra a diferença em vez de esconder
        + (Math.abs(difA)>1 ? `<div class="aviso" style="margin:12px 0 0">⚠️ <b>Não confere com o total do ano.</b>
            As empresas somam ${brl(somaEmp)}, mas o total de ${anoS} é ${brl(totA)} —
            faltam <b>${brl(Math.abs(difA))}</b>. Isso vem da planilha de origem, que mistura lançamentos com blocos de
            resumo. Corrija os valores em <b>⚙️ Configurações → Histórico de rendimentos</b>.</div>` : '');
      /* ---- resumo mensal do ano escolhido ---- */
      const doAnoS = E.rendimentos.filter(x => (x.data || '').startsWith(anoS));
      const porMesS = MESES.map((_, k) => doAnoS.filter(x => +((x.data || '').slice(5, 7)) === k + 1)
        .reduce((a, x) => a + (+x.valor || 0), 0));
      const lancAno = porMesS.reduce((a, v) => a + v, 0);
      const cxMes = el('<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--linha)"></div>');
      cxMes.appendChild(el('<div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);margin-bottom:8px">Resumo mensal de ' + anoS + '</div>'));
      if (!lancAno) {
        cxMes.appendChild(el(`<div style="font-size:12.5px;color:var(--suave)">
          ${anoS} veio da planilha só com o total do ano — o mês a mês aparece a partir do que você lança no app.</div>`));
      } else {
        const maiorM = Math.max(...porMesS, 1);
        const rolMS = el('<div class="rolagem"></div>');
        rolMS.innerHTML = '<table><thead><tr><th>Mês</th><th style="text-align:right">Lanç.</th>'
          + '<th style="text-align:right">Total</th><th style="text-align:right">% do ano</th><th>Peso</th></tr></thead><tbody>'
          + MESES.map((nm, k) => {
            const doM = doAnoS.filter(x => +((x.data || '').slice(5, 7)) === k + 1);
            if (!doM.length) return '';
            const v = porMesS[k];
            return `<tr data-mes="${k}" style="cursor:pointer"><td style="padding:9px 10px"><b>${nm}</b></td>
              <td style="padding:9px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${doM.length}</td>
              <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${brl(v)}</td>
              <td style="padding:9px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${(v / lancAno * 100).toFixed(0)}%</td>
              <td style="padding:9px 10px"><div class="barra"><i style="width:${(v / maiorM * 100).toFixed(0)}%;background:var(--verde)"></i></div></td></tr>`;
          }).join('')
          + `<tr class="tfim"><td colspan="2">Lançado em ${anoS}</td>
             <td style="text-align:right">${brl(lancAno)}</td><td colspan="2"></td></tr></tbody></table>`;
        cxMes.appendChild(rolMS);
        // clicar num mês abre a visão mensal daquele ano
        rolMS.querySelectorAll('[data-mes]').forEach(tr => tr.onclick = () => {
          filtro.rendAno = anoS; filtro.rendVisao = 'Mensal'; filtro.rendEmp = 'Todas'; r();
        });
        if (Math.abs(lancAno - totA) > 1) cxMes.appendChild(el(`<div style="font-size:12px;color:var(--suave);margin-top:8px">
          Os lançamentos somam ${brl(lancAno)}; o total do ano na planilha é ${brl(totA)}.
          A diferença é o que veio do histórico sem detalhe por mês.</div>`));
      }
      det.appendChild(cxMes);

      // linha da empresa expande os lançamentos; ✎ abre para corrigir; "abrir ›" filtra o ano nela
      det.querySelectorAll('[data-empx]').forEach(tr=>{
        const fx=[];let nx=tr.nextElementSibling;
        while(nx&&nx.classList.contains('lanoc')){fx.push(nx);nx=nx.nextElementSibling}
        tr.onclick=()=>{if(!fx.length)return;
          const fech=fx[0].style.display==='none';
          fx.forEach(f=>f.style.display=fech?'':'none');
          const ch=tr.querySelector('.nchip');
          if(ch)ch.textContent=(fech?'▾ ':'▸ ')+tr.dataset.nlan+' lançamento(s)';};
      });
      det.querySelectorAll('[data-lan]').forEach(tr=>tr.onclick=ev=>{ev.stopPropagation();
        const y=E.rendimentos.find(q=>q.id===tr.dataset.lan);if(y)modalRendimento(y)});
      det.querySelectorAll('[data-addlan]').forEach(tr=>tr.onclick=ev=>{ev.stopPropagation();
        const y={id:uid(),data:(+anoS===anoHoje?hoje():anoS+'-12-31'),empresa:tr.dataset.addlan,instituicao:'',tipo:'',valor:0,obs:''};
        E.rendimentos.push(y);salvar();modalRendimento(y,true)});
      det.querySelectorAll('[data-filtrar]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();
        filtro.rendAno=+anoS;filtro.rendEmp=b.dataset.filtrar;filtro.rendAnoSel=-1;r()});
      gEl.appendChild(det);
    }
    gEl.querySelectorAll('[data-bar]').forEach(g=>g.onclick=()=>{
      const k=+g.dataset.bar; filtro.rendAnoSel=(filtro.rendAnoSel===k?-1:k); pintaEvo();
    });
  };
  pintaEvo();
  mA.appendChild(bloco('rd-dash','Evolução anual','clique num ano para abrir as empresas e o resumo mensal — e clique numa empresa ou num mês para ir até os lançamentos',gEl));
  // ---- acumulado geral: quanto você já somou até cada ano ----
  const acum=H.anos.map((_,i)=>H.totalAno.slice(0,i+1).reduce((s,v)=>s+v,0));
  const ac=el('<div></div>');
  ac.appendChild(el(`<div class="grafico">${gLinha(H.anos.map((a,i)=>({r:a,v:acum[i]})),{fmt:brl})}</div>`));
  const tac=el('<div class="rolagem"></div>');
  tac.innerHTML=`<table><thead><tr><th>Ano</th><th style="text-align:right">Do ano</th>
      <th style="text-align:right">Acumulado até o ano</th><th style="text-align:right">Cresceu</th></tr></thead><tbody>
    ${H.anos.map((a,i)=>{
      const cr=i? (H.totalAno[i]/H.totalAno[i-1]-1)*100 : null;
      const parcial=(H.parciais||[]).includes(a);
      return `<tr data-ano="${a}" style="cursor:pointer"><td style="padding:9px 10px"><b>${a}</b>${parcial?' <span style="font-size:11px;color:var(--areia)">parcial</span>':''}</td>
        <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums">${brl(H.totalAno[i])}</td>
        <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${brl(acum[i])}</td>
        <td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;color:${cr==null?'var(--suave)':cr>=0?'var(--verde)':'var(--vermelho)'}">
          ${cr==null?'—':(cr>=0?'+':'')+cr.toFixed(0)+'%'}</td></tr>`}).join('')}
  </tbody></table>`;
  ac.appendChild(tac);
  tac.querySelectorAll('[data-ano]').forEach(tr => tr.onclick = () => {
    filtro.rendAno = +tr.dataset.ano; filtro.rendEmp = 'Todas'; filtro.rendAnoSel = -1; r();
  });
  mA.appendChild(bloco('rd-acum','Acumulado geral','clique num ano para abrir só ele',ac));

  mA.appendChild(bloco('rd-emp','Participação por empresa','no acumulado',graficoEl(gRosca(
    Object.entries(H.empresas).map(([nm,v])=>({r:nm,v:v.reduce((a,b)=>a+b,0),cor:marcaDe(nm).cor}))))));

  // ---- aplicações por instituição ----
  // junta o que veio da planilha antiga com o que ele lança hoje — senão o campo
  // "Instituição" do lançamento não aparece em lugar nenhum
  const API=structuredClone(H.aplicPorInst||{});
  E.rendimentos.filter(x=>x.instituicao&&(+x.valor||0)>0).forEach(x=>{
    const a=(x.data||'').slice(0,4); if(!a) return;
    API[a]=API[a]||{};
    API[a][x.instituicao]=(API[a][x.instituicao]||0)+(+x.valor||0);
  });
  const anosApi=Object.keys(API).sort();
  if(anosApi.length){
    const ai=el('<div></div>');
    const totApl=H.anos.map((a,i)=>H.empresas['Aplicação']?.[i]||0).reduce((s,v)=>s+v,0);
    const detalhado=anosApi.reduce((s,a)=>s+Object.values(API[a]).reduce((x,y)=>x+y,0),0);
    ai.appendChild(el(`<div class="corpo" style="padding-bottom:0"><p style="font-size:12.5px;color:var(--suave)">
      Detalhe por instituição em ${anosApi.join(', ')} — ${brl(detalhado)} no total${
        totApl>0&&detalhado<=totApl?`, de ${brl(totApl)} em aplicações`:''}.
      Para um lançamento novo entrar aqui, preencha a <b>Instituição</b> na tabela abaixo.</p></div>`));
    anosApi.forEach(a=>{
      const d=Object.entries(API[a]).map(([r2,v])=>({r:r2,v})).sort((x,y)=>y.v-x.v);
      ai.appendChild(el(`<div class="grafico"><div style="font-size:12px;color:var(--suave);margin-bottom:8px">${a}</div>${gRosca(d)}</div>`));
    });
    mA.appendChild(bloco('rd-aplic','Aplicações por instituição','rendimento de cada conta',ai));
  }

  const linhas=Object.entries(H.empresas).map(([nome,vals])=>({nome,vals,tot:vals.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.tot-a.tot);
  const maiorTot=linhas[0].tot;
  const th=el('<div class="rolagem"></div>');
  th.innerHTML=`<table><thead><tr><th>Empresa</th>${H.anos.map(a=>`<th style="text-align:right">${a}</th>`).join('')}<th style="text-align:right">Total</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr data-hemp="${esc(l.nome)}" style="cursor:pointer"><td style="padding:9px 10px;white-space:nowrap">${avatar(l.nome,22)}<b>${esc(l.nome)}</b><div class="barra"><i style="width:${(l.tot/maiorTot*100).toFixed(0)}%;background:${marcaDe(l.nome).cor}"></i></div></td>
      ${l.vals.map(v=>`<td style="padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums;color:${v?'inherit':'var(--suave)'}">${v?brl(v):'—'}</td>`).join('')}
      <td style="padding:9px 10px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">${brl(l.tot)}</td></tr>`).join('')}
    </tbody><tfoot><tr class="tfim"><td>Total</td>${H.totalAno.map(v=>`<td style="text-align:right">${brl(v)}</td>`).join('')}<td style="text-align:right">${brl(H.totalGeral)}</td></tr></tfoot></table>`;
  th.querySelectorAll('[data-hemp]').forEach(tr => tr.onclick = () => {
    const nome = tr.dataset.hemp, vals = (H.empresas || {})[nome] || [];
    // cai no ano em que essa empresa mais rendeu — clicar e ir parar num ano vazio nao ajuda
    let melhor = -1, mv = 0;
    vals.forEach((v, i) => { if (v > mv) { mv = v; melhor = i } });
    if (melhor >= 0) filtro.rendAno = H.anos[melhor];
    filtro.rendEmp = nome; filtro.rendAnoSel = -1; r();
  });
  mA.appendChild(bloco('rd-hist','Por empresa, ano a ano','clique numa empresa para filtrar por ela',th));

  /* ---- MENSAL: cada mês abre os lançamentos daquele mês ---- */
  const tmc = el('<div></div>');
  const mesesComAlgo = porMes.filter(v => v).length;
  if (!mesesComAlgo) {
    tmc.innerHTML = `<div class="vazio">Nenhum lançamento em ${ano}. Os anos anteriores vieram da planilha só com o total do ano —
      o mês a mês existe a partir do que você lança aqui.</div>`;
  } else {
    const rolM = el('<div class="rolagem"></div>');
    const tM = document.createElement('table');
    tM.innerHTML = '<thead><tr><th>Mês</th><th style="text-align:right">Lançamentos</th>' +
      '<th style="text-align:right">Total</th><th style="text-align:right">% do ano</th><th>Peso no ano</th></tr></thead>';
    const tbM = document.createElement('tbody');
    const totAnoLanc = porMes.reduce((s, v) => s + v, 0);
    const maiorMes = Math.max(...porMes, 1);
    MESES.forEach((nomeMes, i) => {
      const doMes = doAno.filter(x => +((x.data || '').slice(5, 7)) === i + 1)
        .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
      const tot = porMes[i];
      if (!doMes.length && !tot) return;
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.style.background = 'var(--bg)';
      if (i === mesN && ano === anoHoje) tr.style.boxShadow = 'inset 3px 0 0 var(--verde)';
      tr.innerHTML = `<td style="padding:11px 10px"><b style="font-size:14px">${nomeMes}</b>
          <span class="setaM" style="color:var(--suave);font-size:11px;margin-left:6px">▸ ${doMes.length} lançamento(s)</span></td>
        <td style="padding:11px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${doMes.length || '—'}</td>
        <td style="padding:11px 10px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px">${tot ? brl(tot) : '—'}</td>
        <td style="padding:11px 10px;text-align:right;color:var(--suave);font-variant-numeric:tabular-nums">${totAnoLanc ? (tot / totAnoLanc * 100).toFixed(1) + '%' : '—'}</td>
        <td style="padding:11px 10px"><div class="barra"><i style="width:${(tot / maiorMes * 100).toFixed(0)}%;background:var(--verde)"></i></div></td>`;
      tbM.appendChild(tr);
      // os lançamentos do mês, escondidos até clicar
      const filhas = [];
      doMes.forEach(x => {
        const trf = document.createElement('tr');
        trf.style.display = 'none'; trf.style.cursor = 'pointer';
        trf.innerHTML = `<td style="padding:7px 10px 7px 30px;font-size:13px;white-space:nowrap">↳ ${fmtDataAno(x.data)}
            <span style="margin-left:8px">${avatar(x.empresa||'—',18)}</span><b>${esc(x.empresa || '—')}</b>
            ${x.tipo ? `<span style="color:var(--suave)"> · ${esc(x.tipo)}</span>` : ''}${flagsLan(x)}</td>
          <td style="padding:7px 10px;color:var(--suave);font-size:12.5px">${esc(x.instituicao || '')}</td>
          <td style="padding:7px 10px;text-align:right;font-variant-numeric:tabular-nums">${brl(+x.valor || 0)}</td>
          <td style="padding:7px 10px;text-align:right;color:var(--suave);font-size:12.5px;font-variant-numeric:tabular-nums">${tot ? ((+x.valor || 0) / tot * 100).toFixed(0) + '% do mês' : ''}</td>
          <td style="padding:7px 10px;color:var(--suave);font-size:12.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.obs || '')}</td>`;
        trf.onclick = ev => { ev.stopPropagation(); modalRendimento(x) };
        tbM.appendChild(trf); filhas.push(trf);
      });
      if (filhas.length) tr.onclick = () => {
        const fechado = filhas[0].style.display === 'none';
        filhas.forEach(f => f.style.display = fechado ? '' : 'none');
        tr.querySelector('.setaM').textContent = (fechado ? '▾ ' : '▸ ') + filhas.length + ' lançamento(s)';
      };
    });
    tM.appendChild(tbM);
    const tfM = document.createElement('tfoot');
    tfM.innerHTML = `<tr class="tfim"><td colspan="2" style="padding:10px">TOTAL LANÇADO EM ${ano}</td>
      <td style="text-align:right">${brl(totAnoLanc)}</td><td colspan="2"></td></tr>`;
    tM.appendChild(tfM); rolM.appendChild(tM); tmc.appendChild(rolM);
    tmc.appendChild(el(`<div class="grafico">${gBarras(MESES.map((nm, i) => ({ r: nm, v: porMes[i] })), { fmt: brl })}</div>`));
    const media = totAnoLanc / (porMes.filter(v => v).length || 1);
    const melhor = porMes.indexOf(Math.max(...porMes));
    tmc.appendChild(el(`<div style="padding:11px 17px 4px;font-size:12.5px;color:var(--suave)">
      Média dos meses com lançamento: <b style="color:var(--tinta)">${brl(media)}</b>.
      Melhor mês: <b style="color:var(--tinta)">${MESES[melhor]}</b> (${brl(porMes[melhor])}).</div>`));
  }
  if (!vAnual) m.appendChild(bloco('rd-mes', 'Mês a mês de ' + ano, 'clique no mês para ver os lançamentos daquele mês', tmc));


  /* ---- lançamentos: linha clicável, abre o detalhe ---- */
  const novoRend=()=>{const x={id:uid(),data:hoje(),empresa:(empSel!=='Todas'&&!encerrada(empSel)?empSel:empresasParaLancar()[0]||'Outro'),
    instituicao:'',tipo:'',valor:0,obs:''};E.rendimentos.push(x);salvar();modalRendimento(x,true)};
  const lc2=el('<div></div>');
  const rol2=el('<div class="rolagem"></div>');
  const ordR=[...doAno].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!ordR.length) rol2.innerHTML='<div class="vazio">Nenhum lançamento'+(empSel==='Todas'?' em '+ano:' de '+esc(empSel)+' em '+ano)+'.</div>';
  else{
    const t2=document.createElement('table');
    t2.innerHTML='<thead><tr><th>Data</th><th>Empresa</th><th>Instituição</th><th>Tipo</th>'+
      '<th style="text-align:right">Valor</th><th style="text-align:right">% do mês</th>'+
      '<th style="text-align:right">% do ano</th><th>Observação</th></tr></thead>';
    const tb2=document.createElement('tbody');
    // Agrupado por mês: os 2 meses mais recentes já vêm abertos e o resto fica
    // recolhido — o ano inteiro de uma vez virava uma parede de linhas.
    const chavesMes=[...new Set(ordR.map(x=>String(x.data||'').slice(0,7)).filter(k=>/^\d{4}-\d{2}$/.test(k)))].sort().reverse();
    const semDataR=ordR.filter(x=>!/^\d{4}-\d{2}/.test(String(x.data||'')));
    const gruposMes=[...chavesMes.map(k=>({k,itens:ordR.filter(x=>String(x.data||'').startsWith(k))})),
      ...(semDataR.length?[{k:'',itens:semDataR}]:[])];
    gruposMes.forEach((g,gi)=>{
      const aberto=gi<2;   // "últimos 2 meses" = os dois meses mais recentes com lançamento
      const somaG=g.itens.reduce((a,x)=>a+(+x.valor||0),0);
      const rotG=g.k?MESES[+g.k.slice(5,7)-1]+' de '+g.k.slice(0,4):'Sem data';
      const trg=document.createElement('tr');
      trg.style.cursor='pointer'; trg.style.background='var(--bg)';
      trg.innerHTML=`<td colspan="4" style="padding:10px"><b style="font-size:14px">${rotG}</b>
          <span class="setaM" style="color:var(--suave);font-weight:400;font-size:11.5px;margin-left:7px">${aberto?'▾':'▸'} ${g.itens.length} lançamento(s)</span></td>

function modalRendimento(x,novo){
  const vazio=()=>!(+x.valor)&&!String(x.tipo||'').trim()&&!String(x.obs||'').trim()&&!String(x.instituicao||'').trim();
  abrirModal((x.empresa?avatar(x.empresa,26):'')+esc(x.empresa||'Novo lançamento'),(x.tipo?esc(x.tipo)+' · ':'')+brl(+x.valor||0),(c,fechar)=>{
    const s1=el('<div class="secao"><h4>Dados</h4></div>');
    s1.appendChild(campos(x,[
      {k:'data',t:'Data',tipo:'date'},
      {k:'empresa',t:'Empresa / de onde veio',tipo:'select',opcoes:empresasParaLancar(x.empresa)},
      {k:'tipo',t:'Tipo',tipo:'sugestao',ph:'ex.: Pró-labore, Lucro, CDB',
        opcoes:maisUsados(E.rendimentos,'tipo')},
      {k:'instituicao',t:'Instituição',tipo:'sugestao',ph:'banco ou corretora',
        opcoes:maisUsados(E.rendimentos,'instituicao',CFG('instituicoes')),
        // instituição nova digitada aqui entra na lista de opções para sempre
        aoGravar:v=>{const q=String(v||'').trim();
          if(q&&!CFG('instituicoes').some(o=>normaliza(o)===normaliza(q))){
            E.config.instituicoes=[...CFG('instituicoes'),q].sort((a,b)=>a.localeCompare(b));}}},
      {k:'valor',t:'Valor',tipo:'moeda'},
      {k:'obs',t:'Observação',tipo:'textarea',full:true},
    ]));
    c.appendChild(el('<div style="padding:0 0 4px;font-size:12.5px;color:var(--suave)">A instituição só é usada quando a empresa é <b>Aplicação</b> — é o que monta o gráfico por banco.</div>'));
    c.appendChild(s1);
    const s2=el('<div class="secao"><h4>Comprovante</h4></div>');
    s2.appendChild(areaArquivos('rendimento:'+x.id,'Recibo, extrato, contrato, nota'));
    c.appendChild(s2);
    const s3=el('<div class="secao" style="display:flex;gap:9px"></div>');
    const del=el('<button class="btn ghost" style="color:var(--vermelho)">Apagar</button>');
    del.onclick=async()=>{if(!confirm('Apagar este lançamento e seus arquivos?'))return;
      if(!await apagarAnexosDe('rendimento:'+x.id))return;
      E.rendimentos=E.rendimentos.filter(y=>y.id!==x.id);salvar();fechar()};
    s3.appendChild(del);
    // pró-labore e rendimento repetem: um clique cria o do mês seguinte já preenchido
    const dup=el('<button class="btn ghost">↻ Mês seguinte</button>');
    dup.onclick=()=>{const c2={...x,id:uid(),data:mesSeguinte(x.data||hoje()),obs:''};
      E.rendimentos.push(c2);salvar();fechar();modalRendimento(c2,true)};
    s3.appendChild(dup);s3.appendChild(el('<span class="cresce"></span>'));
    const ok=el('<button class="btn">Pronto</button>');ok.onclick=fechar;s3.appendChild(ok);
    c.appendChild(s3);
  },()=>{
    // criado agora e fechado em branco (sem valor, texto ou anexo): some sozinho
    if(!novo||!vazio())return;
    arqPor('rendimento:'+x.id).then(fs2=>{
      if(fs2.length)return;
      const antes=E.rendimentos.length;
      E.rendimentos=E.rendimentos.filter(q=>q.id!==x.id);
      if(E.rendimentos.length!==antes){salvar();if(atual==='rendimentos')tela()}
    });
  });
}

/* ============================================================
   Excel de verdade (.xlsx) sem biblioteca nenhuma.
   Um .xlsx é um ZIP com XMLs dentro. Como os arquivos são pequenos,
   gravamos sem compressão (método "store"), que dispensa deflate.
   ============================================================ */
const TAB_CRC = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0 }
  return t;
})();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TAB_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0 };

function zipStore(arquivos) {
  const enc = new TextEncoder();
  const partes = [], central = [];
  let desloc = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  arquivos.forEach(({ nome, texto, bytes }) => {
    const dados = bytes || enc.encode(texto), nomeB = enc.encode(nome), crc = crc32(dados);
    const cab = [...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nomeB.length), ...u16(0)];
    partes.push(new Uint8Array(cab), nomeB, dados);
    central.push([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(crc), ...u32(dados.length), ...u32(dados.length), ...u16(nomeB.length),
      ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(desloc)], nomeB);
    desloc += cab.length + nomeB.length + dados.length;
  });
  const cd = [];
  for (let i = 0; i < central.length; i += 2) { cd.push(new Uint8Array(central[i]), central[i + 1]) }
  const tamCD = cd.reduce((s, p) => s + p.length, 0);
  const fim = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(arquivos.length), ...u16(arquivos.length), ...u32(tamCD), ...u32(desloc), ...u16(0)]);
  return new Blob([...partes, ...cd, fim], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));

/* abas = [{nome, linhas:[[cel,...],...]}]  — célula: número, string, ou {v, s} com estilo
   estilos: 1 = negrito, 2 = R$, 3 = negrito + R$, 4 = data, 5 = título */
function gerarXlsx(abas) {
  const col = i => { let s = '', n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = ((n - r) / 26) | 0 } return s };
  const folhas = abas.map((ab, iA) => {
    const linhas = ab.linhas.map((ln, iL) => {
      const cels = ln.map((c, iC) => {
        if (c == null || c === '') return '';
        const est = (typeof c === 'object' && c.s) ? ` s="${c.s}"` : '';
        const v = (typeof c === 'object') ? c.v : c;
        const ref = col(iC) + (iL + 1);
        if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${est}><v>${v}</v></c>`;
        return `<c r="${ref}"${est} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${iL + 1}">${cels}</row>`;
    }).join('');
    const larg = (ab.larguras || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
    return {
      nome: `xl/worksheets/sheet${iA + 1}.xml`,
      texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${larg ? `<cols>${larg}</cols>` : ''}<sheetData>${linhas}</sheetData></worksheet>`
    };
  });

  const estilos = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;R$&quot;\\ #,##0.00"/></numFmts>
<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEFEAE0"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="164" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/>
<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  const arquivos = [
    {
      nome: '[Content_Types].xml', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${abas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`
    },
    {
      nome: '_rels/.rels', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`
    },
    {
      nome: 'xl/workbook.xml', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${abas.map((a, i) => `<sheet name="${xmlEsc(a.nome).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`
    },
    {
      nome: 'xl/_rels/workbook.xml.rels', texto: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${abas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`
    },
    { nome: 'xl/styles.xml', texto: estilos },
    ...folhas,
  ];
  return zipStore(arquivos);
}

function baixarBlob(blob, nome) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove() }, 1500);
}

/* ---- Rendimentos: baixar em Excel (.xlsx) e em PDF ---- */
function dadosRendimentos() {
  const H = histVivo(), anos = H.anos || [];
  const emp = Object.entries(H.empresas || {})
    .map(([nome, vals]) => ({ nome, vals, tot: vals.reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.tot - a.tot);
  const totalGeral = (H.totalAno || []).reduce((a, b) => a + b, 0);
  return { H, anos, emp, totalGeral };
}

function baixarRendimentosExcel() {
  const { H, anos, emp, totalGeral } = dadosRendimentos();
  const HR = H._raw || H;
  const N = 1, M = 2, NM = 3;   // estilos: negrito, moeda, negrito+moeda

  /* 1. Resumo por ano */
  const a1 = [
    [{ v: 'Rendimentos — resumo por ano', s: 5 }],
    [],
    [{ v: 'Ano', s: N }, { v: 'Total do ano', s: N }, { v: 'Variação', s: N }, { v: 'Acumulado', s: N }],
  ];
  let acum = 0;
  anos.forEach((a, i) => {
    const v = H.totalAno[i] || 0, ant = i ? H.totalAno[i - 1] || 0 : 0;
    acum += v;
    a1.push([a, { v, s: M }, i && ant ? { v: (v - ant) / ant, s: 6 } : '', { v: acum, s: M }]);
  });
  a1.push([{ v: 'TOTAL', s: N }, { v: totalGeral, s: NM }, '', '']);
  a1.push([]);
  a1.push(['Média por ano', { v: anos.length ? totalGeral / anos.length : 0, s: M }]);

  /* 2. Por empresa */
  const a2 = [
    [{ v: 'Rendimentos por empresa', s: 5 }], [],
    [{ v: 'Empresa', s: N }, ...anos.map(a => ({ v: a, s: N })), { v: 'Total', s: N }, { v: '% do total', s: N }],
  ];
  emp.forEach(e => a2.push([e.nome, ...e.vals.map(v => ({ v, s: M })), { v: e.tot, s: NM },
    { v: totalGeral ? e.tot / totalGeral : 0, s: 6 }]));
  a2.push([{ v: 'TOTAL', s: N }, ...anos.map((_, i) => ({ v: H.totalAno[i] || 0, s: NM })),
    { v: totalGeral, s: NM }, { v: 1, s: 6 }]);

  /* 3. Detalhe por negócio */
  const a3 = [[{ v: 'Detalhe por negócio', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Empresa', s: N }, { v: 'De onde veio', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }]];
  Object.entries(H.detalhe || {}).sort().forEach(([ano, empresas]) => {
    Object.entries(empresas).forEach(([nomeEmp, itens]) => {
      (itens || []).forEach(([nome, val, tipo]) =>
        a3.push([+ano, nomeEmp, nome, tipo === 'p' ? 'Pontual' : 'Recorrente', { v: val, s: M }]));
    });
  });

  /* 4. Lançamentos */
  const a4 = [[{ v: 'Lançamentos', s: 5 }], [],
    [{ v: 'Data', s: N }, { v: 'Empresa', s: N }, { v: 'Instituição', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }, { v: 'Observação', s: N }]];
  [...E.rendimentos].sort((a, b) => (a.data || '').localeCompare(b.data || ''))
    .forEach(x => a4.push([fmtDataAno(x.data), x.empresa || '', x.instituicao || '', x.tipo || '', { v: +x.valor || 0, s: M }, x.obs || '']));
  if (E.rendimentos.length)
    a4.push([{ v: 'TOTAL', s: N }, '', '', '', { v: E.rendimentos.reduce((s, x) => s + (+x.valor || 0), 0), s: NM }, '']);

  /* 4b. Mês a mês — total do mês e, embaixo, os lançamentos daquele mês */
  const anosLanc = [...new Set(E.rendimentos.map(x => (x.data || '').slice(0, 4)).filter(Boolean))].sort();
  const aMes = [[{ v: 'Mês a mês', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Mês', s: N }, { v: 'Data', s: N }, { v: 'Empresa', s: N },
     { v: 'Instituição', s: N }, { v: 'Tipo', s: N }, { v: 'Valor', s: N }]];
  anosLanc.forEach(a => {
    MESES.forEach((nomeMes, i) => {
      const doMes = E.rendimentos
        .filter(x => (x.data || '').startsWith(a) && +((x.data || '').slice(5, 7)) === i + 1)
        .sort((p, q) => (p.data || '').localeCompare(q.data || ''));
      if (!doMes.length) return;
      const tot = doMes.reduce((acc, x) => acc + (+x.valor || 0), 0);
      aMes.push([{ v: +a, s: N }, { v: nomeMes, s: N }, '', '', '', { v: 'total do mês', s: N }, { v: tot, s: NM }]);
      doMes.forEach(x => aMes.push(['', '', fmtDataAno(x.data), x.empresa || '', x.instituicao || '',
        x.tipo || '', { v: +x.valor || 0, s: M }]));
    });
  });

  /* 4c. Conferência — o lançado bate com o histórico? */
  const aConf=[[{v:'Conferência — lançado x histórico',s:5}],[],
    [{v:'Ano',s:N},{v:'Empresa',s:N},{v:'Lançamentos',s:N},{v:'Somam',s:N},{v:'Histórico',s:N},{v:'Diferença',s:N}]];
  const anosCf=[...new Set([...(HR.anos||[]).map(String),...E.rendimentos.map(x=>String(x.data||'').slice(0,4))])]
    .filter(a2=>/^\d{4}$/.test(a2)).sort();
  anosCf.forEach(a2=>{
    const i2=(HR.anos||[]).indexOf(+a2);
    const nomesC=[...new Set([...Object.keys(HR.empresas||{}),
      ...E.rendimentos.filter(x=>String(x.data||'').startsWith(a2)).map(x=>x.empresa)])].filter(Boolean);
    nomesC.forEach(nm=>{
      const ls=E.rendimentos.filter(x=>String(x.data||'').startsWith(a2)&&x.empresa===nm);
      const soma=+ls.reduce((s2,x)=>s2+(+x.valor||0),0).toFixed(2);
      const hist=+((i2>=0?(((HR.empresas||{})[nm]||[])[i2]||0):0)).toFixed(2);
      if(!ls.length&&!hist) return;
      const dif=+(soma-hist).toFixed(2);
      aConf.push([+a2,nm,ls.length,{v:soma,s:M},{v:hist,s:M},
        Math.abs(dif)>0.01?{v:dif,s:NM}:{v:0,s:M}]);
    });
  });

  /* 5. Aplicações por instituição */
  const a5 = [[{ v: 'Aplicações por instituição', s: 5 }], [],
    [{ v: 'Ano', s: N }, { v: 'Instituição', s: N }, { v: 'Rendimento', s: N }]];
  Object.entries(H.aplicPorInst || {}).sort().forEach(([ano, insts]) =>
    Object.entries(insts).sort((a, b) => b[1] - a[1]).forEach(([i, v]) => a5.push([+ano, i, { v, s: M }])));

  const abas = [
    { nome: 'Resumo por ano', linhas: a1, larguras: [10, 16, 12, 16] },
    { nome: 'Por empresa', linhas: a2, larguras: [20, ...anos.map(() => 14), 16, 11] },
    { nome: 'Detalhe por negócio', linhas: a3, larguras: [8, 18, 34, 13, 15] },
    { nome: 'Lançamentos', linhas: a4, larguras: [12, 18, 18, 18, 14, 30] },
  ];
  if (aMes.length > 3) abas.splice(3, 0, { nome: 'Mês a mês', linhas: aMes, larguras: [8, 12, 12, 18, 18, 16, 15] });
  if (aConf.length > 3) abas.push({ nome: 'Conferência', linhas: aConf, larguras: [8, 18, 12, 15, 15, 15] });
  if (a5.length > 3) abas.push({ nome: 'Aplicações', linhas: a5, larguras: [8, 26, 15] });

  baixarBlob(gerarXlsx(abas), 'Rendimentos-Leo-' + hoje() + '.xlsx');
}

  </style>

/* ---- custo fixo: o que debita sozinho todo mês (cadastro, não lançamento) ---- */
const valorMensal=x=>x.ciclo==='Anual'?(+x.valor||0)/12:(+x.valor||0);
const ativos=l=>(l||[]).filter(x=>x.status!=='Cancelar'&&x.status!=='Cancelado');
// cada cadastro fixo cai numa classificação do mesmo dicionário dos lançamentos
const FIXOS=()=>[
  {lista:ativos(E.casa),     classe:'Casa',        nome:x=>x.item||'(sem nome)',      extra:x=>x.onde||''},
  {lista:ativos(E.assinaturas),classe:'Assinaturas',nome:x=>x.nome||'(sem nome)',     extra:x=>x.obs||''},
  {lista:ativos(E.seguros),  classe:'Seguros',     nome:x=>(x.tipo||'')+(x.item?' — '+x.item:''), extra:x=>x.seguradora||''},
  {lista:ativos(E.planos),   classe:'Saúde',       nome:x=>'Plano '+(x.operadora||'')+(x.quem?' ('+x.quem+')':''), extra:x=>x.plano||''},
];
const fixoMensal=()=>FIXOS().reduce((s,f)=>s+f.lista.reduce((a,x)=>a+valorMensal(x),0),0);

// detalhe de um item fixo (casa, assinatura, seguro, plano): observação + arquivos

function vGastos(m){
  const r=rr('gastos');
  const meses=[...new Set(E.gastos.map(g=>g.mes))].filter(Boolean).sort();
  if(!filtro.gastosMes) filtro.gastosMes=mesAtual();
  const mes=filtro.gastosMes, todos=mes==='todos';
  const doMes=todos?E.gastos:E.gastos.filter(g=>g.mes===mes);
  const varTot=doMes.reduce((s,g)=>s+(+g.valor||0),0);
  const fixo=fixoMensal();
  // somando todos os meses, o fixo também se repete mês a mês
  const nMeses=todos?Math.max(meses.length,1):1;
  const fixoPer=fixo*nMeses;
  const tot=varTot+fixoPer;
  const rendMes=todos?E.rendimentos.reduce((s,x)=>s+(+x.valor||0),0)
    :E.rendimentos.filter(x=>(x.data||'').startsWith(mes)).reduce((s,x)=>s+(+x.valor||0),0);
  const sobra=rendMes-tot;
  const rot=mm=>mm.split('-').reverse().join('/');
  const novoLanc=()=>({mes:todos?mesAtual():mes,classe:CFG('catGasto')[0],oque:'',valor:0,pago:''});

  m.appendChild(cab('Gastos','Um lugar só para lançar. A classificação é que separa e mostra para onde vai o dinheiro.'));
  m.appendChild(painel('Mês',
    seletor(mes,[...meses.slice().reverse().map(mm=>[mm,rot(mm)]),
      ...(meses.includes(mesAtual())?[]:[[mesAtual(),rot(mesAtual())+' (atual)']]),['todos','Todos os meses']],
      v=>{filtro.gastosMes=v;r()}),
    acao('+ Novo lançamento',()=>{E.gastos.push({id:uid(),...novoLanc()});salvar();r()}),'|'));

  m.appendChild(ligaKpis(el(`<div class="grade">
    ${kpi(todos?'Saída total':'Saída do mês',brl(tot),'variável + fixo · ver para onde vai','r','classe')}
    ${kpi('Variável',brl(varTot),doMes.length+' lançamento(s)',null,'lanc')}
    ${kpi('Fixo',brl2(fixo)+'/mês',FIXOS().reduce((s,f)=>s+f.lista.length,0)+' cadastros','a','fixo')}
    ${kpi('Ganho',brl(rendMes),'de Rendimentos','v','rend')}
    ${kpi('Sobrou',brl(sobra),sobra>=0?'no azul':'no vermelho',sobra>=0?'v':'r','classe')}</div>`),{
    classe:()=>{abreBloco('gt-classe');r()},
    lanc:()=>{abreBloco('gt-lista');r()},
    fixo:()=>{abreBloco('gt-casa');r()},
    // o "Ganho" vem da outra tela: leva para lá já no recorte certo
    rend:()=>{filtro.rendAno=todos?anoHoje:+mes.slice(0,4);filtro.rendVisao=todos?'Anual':'Mensal';
      filtro.rendEmp='Todas';abreBloco(todos?'rd-dash':'rd-mes');irTela('rendimentos')},
  }));

  /* ================= PARA ONDE VAI O DINHEIRO (classificação) ================= */
  // as classes dos cadastros fixos entram sempre, mesmo que a config salva seja antiga —
  // senão o valor conta no total e some do detalhamento
  const classes=[...new Set([...CFG('catGasto'),...FIXOS().map(f=>f.classe),
    ...doMes.map(g=>g.classe||g.categoria)])].filter(Boolean);
  const grupos=classes.map(cl=>{
    const itens=[];
    doMes.filter(g=>(g.classe||g.categoria)===cl).forEach(g=>
      itens.push({nome:g.oque||g.obs||'(sem descrição)',v:+g.valor||0,fixo:false,extra:g.mes&&todos?rot(g.mes):''}));
    FIXOS().filter(f=>f.classe===cl).forEach(f=>f.lista.forEach(x=>
      itens.push({nome:f.nome(x),v:valorMensal(x)*nMeses,fixo:true,extra:f.extra(x)})));
    return {classe:cl,total:itens.reduce((s,i)=>s+i.v,0),itens:itens.sort((a,b)=>b.v-a.v)};
  }).filter(g=>g.total>0).sort((a,b)=>b.total-a.total);

  // serie mensal de uma classificacao: o variavel varia mes a mes, o fixo se repete igual
  const mesesTodos=[...new Set(E.gastos.map(g=>g.mes).filter(Boolean))].sort();
  const serieClasse=cl=>{
    const fixoCl=FIXOS().filter(f=>f.classe===cl)
      .reduce((a,f)=>a+f.lista.reduce((b,x)=>b+valorMensal(x),0),0);
    return mesesTodos.map(mm=>({
      mes:mm,
      variavel:E.gastos.filter(g=>g.mes===mm&&(g.classe||g.categoria)===cl)
        .reduce((a,g)=>a+(+g.valor||0),0),
      fixo:fixoCl,
    })).map(x=>({...x,total:x.variavel+x.fixo}));
  };

  const lc=el('<div></div>');
  if(!grupos.length) lc.innerHTML='<div class="vazio">Sem gasto ainda neste período. Lance abaixo ou cadastre os fixos.</div>';
  else{
    lc.appendChild(el(`<div class="grafico">${gBarras(grupos.map(g=>({r:g.classe,v:g.total})),{fmt:brl,cor:'var(--vermelho)'})}</div>`));
    const tl=el('<div class="rolagem"></div>');
    const tg=document.createElement('table');
    tg.innerHTML='<thead><tr><th>#</th><th>Classificação</th><th>Tipo</th>'+
      '<th style="text-align:right">Valor</th><th style="text-align:right">% da saída</th></tr></thead>';
    const tbg=document.createElement('tbody');
    grupos.forEach((g,i)=>{
      const cor=PALETA[i%PALETA.length];
      const tre=document.createElement('tr');
      tre.style.background='var(--bg)';tre.style.boxShadow='inset 3px 0 0 '+cor;
      if(g.itens.length)tre.style.cursor='pointer';
      const soFixo=g.itens.every(x=>x.fixo), soVar=g.itens.every(x=>!x.fixo);
      tre.innerHTML=`<td style="padding:11px 10px;color:var(--suave);font-weight:600">${i+1}º</td>
        <td style="padding:11px 10px"><b style="font-size:14.5px">${esc(g.classe)}</b>
          <span class="setaG" style="color:var(--suave);font-size:11px;margin-left:6px">▾ ${g.itens.length} item(ns)</span>

    x=>modalItemGasto(x,x.nome||'Assinatura',brl2(valorMensal(x))+'/mês','assinatura','Comprovante, e-mail de cobrança')));

  /* ---------- SEGUROS ---------- */
  const venc=E.seguros.filter(s=>{const n=s.renova?Math.round((new Date(s.renova+'T12:00')-new Date(hoje()+'T12:00'))/864e5):null;
    return n!=null&&n<60&&s.status!=='Cancelado'});
  const vencidos=venc.filter(s=>s.renova<hoje()), aVencer=venc.filter(s=>s.renova>=hoje());
  if(vencidos.length) m.appendChild(el(`<div class="aviso" style="background:var(--vermelho-cl);border-color:var(--vermelho)">
    🛡️ <b>${vencidos.length} seguro(s) com a vigência VENCIDA:</b>
    ${vencidos.map(s=>esc(s.item||s.tipo||'seguro')+' — venceu em '+fmtDataAno(s.renova)).join('; ')}.

  if(aVencer.length) m.appendChild(el(`<div class="aviso">🛡️ <b>${aVencer.length} seguro(s) renovando em breve:</b>
    ${aVencer.map(s=>esc(s.item||s.tipo||'seguro')+' ('+fmtDataAno(s.renova)+')').join(', ')}. Cote antes — renovação automática costuma vir mais cara.</div>`));
  m.appendChild(tabelaBloco('gt-seg','🛡️ Seguros','apólice, vigência e quanto pesa por mês',E.seguros,[
    {k:'tipo',t:'Tipo',tipo:'select',opcoes:CFG('tiposSeguro'),w:150},
    {k:'item',t:'O que cobre',ph:'ex.: o carro, a casa, minha vida'},
    {k:'seguradora',t:'Seguradora',ph:'ex.: Porto'},
    {k:'apolice',t:'Apólice',ph:'nº'},
    {k:'capital',t:'Quanto paga',tipo:'moeda',w:150},
    {k:'beneficiarios',t:'Quem recebe',ph:'ex.: esposa 50%, filhos 50%'},
    {k:'telefone',t:'Telefone do sinistro',ph:'0800'},
    {k:'valor',t:'Custo',tipo:'moeda',w:140},
    {k:'ciclo',t:'Cobrança',tipo:'select',opcoes:['Mensal','Anual']},
    {k:'renova',t:'Renova em',tipo:'date',w:150},
    {k:'status',t:'Status',tipo:'select',opcoes:['Ativo','Cancelado']},

  /* ---- o que o seguro protege (não o que ele custa) ---- */

  const capital=vidas.reduce((s,x)=>s+(+x.capital||0),0);
  const semBenef=vidas.filter(s=>!String(s.beneficiarios||'').trim());
  if(vidas.length||capital>0){
    const meses=fixo>0?Math.floor(capital/fixo):0;

      ${kpi('Se algo acontecer',capital?brl(capital):'—',vidas.length+' apólice(s) de vida',capital?'v':'r')}
      ${kpi('Dá para a família',meses?meses+' meses':'—','de custo fixo sem mexer em nada',meses>=24?'v':meses>=12?'a':'r')}</div>`));

/* ===================== DOCUMENTOS ===================== */
function vDocumentos(m){
  const r=rr('documentos');
  const h=hoje();
  const st=d=>{if(!d.validade)return '—';const dd=Math.round((new Date(d.validade)-new Date(h))/864e5);
    return dd<0?'Vencido':dd<180?'Vencendo':'Em dia'};
  const alerta=E.documentos.filter(d=>['Vencido','Vencendo'].includes(st(d))).length;
  m.appendChild(cab('Documentos e validades','Clique num documento para anexar o arquivo digitalizado.'));
  const novoDoc=()=>{const d={id:uid(),nome:'',dono:'Léo',numero:'',validade:'',onde:'',obs:''};E.documentos.push(d);salvar();modalDoc(d)};
  // a lista vem de Minha gente, não só de quem já tem documento — assim dá para ver quem está sem nada
  const donos=[...new Set(['Léo',...E.pessoas.map(p=>p.nome).filter(Boolean),...E.documentos.map(d=>d.dono||'Léo')])];
  const nDe=q=>E.documentos.filter(x=>mesmaPessoa(x.dono||'Léo',q)).length;
  // a minha linha abre sozinha; as outras ficam recolhidas até serem clicadas
  if(filtro.docAbertos==null) filtro.docAbertos={'Léo':true};
  const semNada=donos.filter(d=>!nDe(d)).length;
  m.appendChild(painel('Documentos',
    acao('+ Novo documento',novoDoc),
    acao('▾ Abrir todos',()=>{donos.forEach(d=>filtro.docAbertos[d]=true);r()},'ghost'),
    acao('▸ Recolher',()=>{filtro.docAbertos={};r()},'ghost'),'|'));
  m.appendChild(el(`<div class="grade">
    ${kpi('Documentos',E.documentos.length,donos.length+' pessoa(s)')}
    ${kpi('Precisam de atenção',alerta,alerta?'vencidos ou perto':'nada vencendo',alerta?'r':'v')}
    ${kpi('Sem documento nenhum',semNada,semNada?'pessoas sem nada cadastrado':'todo mundo tem algo',semNada?'a':'v')}</div>`));
  if(!E.documentos.length) m.appendChild(el(`<div class="aviso">🪪 Sugestão de ordem: <b>passaporte, visto americano, visto chinês, CNH,
    registro de arma (CR/CRAF), CRLV dos veículos, certidões de nascimento e casamento</b> e apólices de seguro.
    Anexe o PDF ou a foto — resolve quando você precisa e não está em casa.</div>`));
  const cx=el('<div class="corpo"></div>');
  // Ordem: quem tem problema aparece primeiro; eu venho sempre na frente,
  // porque é a minha linha que eu abro todo dia.
  const pessoas=donos.map(dono=>{
    const meus=E.documentos.filter(d=>mesmaPessoa(d.dono||'Léo',dono))
      .sort((a,b)=>(a.validade||'9').localeCompare(b.validade||'9'));
    const vencidos=meus.filter(d=>st(d)==='Vencido').length;
    const vencendo=meus.filter(d=>st(d)==='Vencendo').length;
    const proximo=meus.map(d=>d.validade).filter(Boolean).sort()[0]||'';
    return {dono,meus,vencidos,vencendo,proximo};
  }).sort((a,b)=>(mesmaPessoa(b.dono,'Léo')-mesmaPessoa(a.dono,'Léo'))
    ||(b.vencidos-a.vencidos)||(b.vencendo-a.vencendo)||a.dono.localeCompare(b.dono));

  pessoas.forEach(p=>{
    const aberto=!!filtro.docAbertos[p.dono];
    const sit=p.vencidos?chip('Vencido')+(p.vencidos>1?`<b style="font-size:11.5px">×${p.vencidos}</b>`:'')
      :p.vencendo?chip('Vencendo')+(p.vencendo>1?`<b style="font-size:11.5px">×${p.vencendo}</b>`:'')
      :p.meus.length?chip('Em dia'):'';
    const linha=el(`<div style="border:1px solid var(--linha);border-radius:var(--r);margin-bottom:10px;overflow:hidden;background:var(--card)">
      <button class="cabPessoa" style="width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--bg);border:none;border-bottom:1px solid transparent;font:inherit;color:inherit;text-align:left;cursor:pointer">
        <span class="seta" style="color:var(--suave);font-size:12px;width:12px">${aberto?'▾':'▸'}</span>
        ${avatar(p.dono,30)}
        <b style="font-size:14.5px">${esc(p.dono)}</b>
        <span style="font-size:12px;color:var(--suave)">${p.meus.length?p.meus.length+' documento(s)':'nenhum documento'}${p.proximo?' · próximo vence em '+fmtDataAno(p.proximo):''}</span>
        <span style="margin-left:auto;display:flex;align-items:center;gap:6px">${sit}</span>
      </button>
      <div class="corpoPessoa" style="padding:${aberto?'13px 15px':'0'};display:${aberto?'block':'none'}"></div>
    </div>`);
    const corpo=linha.querySelector('.corpoPessoa');
    const grid=el('<div class="cartoes"></div>');
    p.meus.forEach(d=>{
      const c=el(`<button class="cartao"><div class="tit">${esc(d.nome||'(sem nome)')}</div>
        <div class="sub">${d.numero?esc(d.numero):'sem número'}${d.onde?' · '+esc(d.onde):''}</div>
        <div class="pe">${chip(st(d))}${d.validade?`<span style="font-size:11.5px;color:var(--suave)">até ${fmtDataAno(d.validade)}</span>`:'<span style="font-size:11.5px;color:var(--suave)">sem validade</span>'}</div></button>`);
      c.onclick=()=>modalDoc(d);grid.appendChild(c);
    });
    if(!p.meus.length) grid.innerHTML=`<div class="vazio">Nada cadastrado para ${esc(p.dono)} ainda.</div>`;
    corpo.appendChild(grid);
    const btP=el(`<button class="mais">+ Novo documento de ${esc(p.dono)}</button>`);
    btP.onclick=()=>{const d={id:uid(),nome:'',dono:p.dono,numero:'',validade:'',onde:'',obs:''};
      E.documentos.push(d);salvar();modalDoc(d)};
    corpo.appendChild(btP);
    linha.querySelector('.cabPessoa').onclick=()=>{
      const abrindo=corpo.style.display==='none';
      filtro.docAbertos[p.dono]=abrindo;
      corpo.style.display=abrindo?'block':'none';
      corpo.style.padding=abrindo?'13px 15px':'0';
      linha.querySelector('.seta').textContent=abrindo?'▾':'▸';
    };
    cx.appendChild(linha);
  });
  const bt=el('<button class="mais">+ Novo documento</button>');
  bt.onclick=novoDoc;
  cx.appendChild(bt);

  DISC4.forEach(([nome, dica]) => {

      </div>
      <div style="font-size:11.5px;color:var(--suave);margin:1px 0 6px">${esc(dica)}</div>
      <div style="position:relative;height:16px">
        <div style="position:absolute;inset:0;background:var(--linha);border-radius:8px"></div>

        <div style="position:absolute;left:0;bottom:0;height:7px;width:${ad}%;background:var(--azul);border-radius:8px"></div>

    <span style="display:inline-block;width:10px;height:7px;background:var(--azul);border-radius:4px"></span> adaptado</div>`));
  // o desgaste, dito em português
  const difs = DISC4.map(([n]) => ({ n, d: (+(C.discAdaptado[n] || 0)) - (+(C.disc[n] || 0)) }))
    .filter(x => Math.abs(x.d) >= 15).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  if (difs.length) c.appendChild(el(`<div class="aviso" style="margin:12px 0 0">⚖️ <b>Onde você está se forçando:</b>

    Manter isso por muito tempo cansa — vale ver se é o momento ou se virou rotina.</div>`));
  return c;
}

// barra de nota 0–100 que se preenche ao clicar/arrastar
function escalaNota(titulo, dica, valor, aoMudar) {
  const v = Math.max(0, Math.min(100, +valor || 0));
  const cor = v >= 70 ? 'var(--verde)' : v >= 40 ? 'var(--azul)' : v > 0 ? 'var(--areia)' : 'var(--linha)';
  const w = el(`<div style="padding:9px 0;border-bottom:1px solid var(--linha)">
    <div style="display:flex;align-items:baseline;gap:8px">
      <b style="font-size:13.5px;flex:1">${esc(titulo)}</b>
      <span style="font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:${cor}">${v || '—'}</span>
    </div>
    <div style="font-size:11.5px;color:var(--suave);margin:1px 0 6px">${esc(dica)}</div>
    <input type="range" min="0" max="100" step="5" value="${v}" style="width:100%;accent-color:${cor}">
  </div>`);
  const inp = w.querySelector('input');
  inp.addEventListener('input', () => {
    w.querySelector('span').textContent = inp.value;
    const c2 = +inp.value >= 70 ? 'var(--verde)' : +inp.value >= 40 ? 'var(--azul)' : +inp.value > 0 ? 'var(--areia)' : 'var(--linha)';
    w.querySelector('span').style.color = c2; inp.style.accentColor = c2;
  });
  inp.addEventListener('change', () => aoMudar(+inp.value));
  return w;
}

function blocoEscalas(titulo, lista, obj, chave, r) {
  const c = el('<div style="margin-bottom:18px"></div>');
  c.appendChild(el(`<h4 style="margin:0 0 4px">${titulo}</h4>`));
  obj[chave] = obj[chave] || {};
  lista.forEach(([nome, dica]) => c.appendChild(
    escalaNota(nome, dica, obj[chave][nome], v => { obj[chave][nome] = v; salvar(); r() })));
  // quem ficou mais alto explica o comportamento no dia a dia
  const ord = lista.map(([n]) => ({ n, v: +(obj[chave][n] || 0) })).filter(x => x.v).sort((a, b) => b.v - a.v);
  if (ord.length >= 2) c.appendChild(el(`<div style="font-size:12.5px;color:var(--suave);padding-top:9px">
    Predominante: <b style="color:var(--tinta)">${esc(ord[0].n)}</b> (${ord[0].v})${ord[1].v >= ord[0].v - 15
      ? ' com <b style="color:var(--tinta)">' + esc(ord[1].n) + '</b> (' + ord[1].v + ') logo atrás — é uma combinação, não um rótulo só.'
      : ', bem à frente do segundo.'}</div>`));
  return c;
}
