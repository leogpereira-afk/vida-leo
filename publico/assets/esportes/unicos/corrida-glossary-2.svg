<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Pace</title><desc id="desc">Um percurso entre início e marca de um quilômetro aparece com um cronômetro de cinco minutos, ilustrando a unidade minutos por quilômetro.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Pace</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Pace responde: quanto tempo para percorrer cada quilômetro?</text><rect x="100" y="275" width="1400" height="420" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M230 530 C430 330 1140 330 1370 530" stroke="#B8D8BD" stroke-width="70" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M230 530 C430 330 1140 330 1370 530" stroke="#28735B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 18"/><circle cx="230" cy="530" r="45" fill="#28735B" stroke="none" stroke-width="3"/><circle cx="1370" cy="530" r="45" fill="#28735B" stroke="none" stroke-width="3"/><text x="230" y="632" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">INÍCIO</text><text x="1370" y="632" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">1 km</text><rect x="623" y="298" width="354" height="230" rx="35" fill="#20352D" stroke="none" stroke-width="2"/><text x="800" y="399" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" text-anchor="middle">5:00</text><text x="800" y="462" fill="#B8D8BD" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" text-anchor="middle">min/km</text><text x="800" y="746" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Menor tempo por km = maior velocidade</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Exemplo ilustrativo · não define seu ritmo de treino</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>