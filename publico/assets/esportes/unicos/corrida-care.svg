<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Carga e recuperação</title><desc id="desc">Uma balança conceitual coloca trabalho acumulado de todas as modalidades de um lado e sono, resposta e recuperação do outro. Não representa proporção numérica ou prescrição individual.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / CUIDADOS NA PRÁTICA</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start">Carga e recuperação</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A corrida faz parte de uma rotina com outras exigências.</text><path d="M710 670 L800 540 L890 670 Z" stroke="#28735B" stroke-width="5" fill="#E1EBDF" stroke-linecap="round" stroke-linejoin="round" /><line x1="380" y1="470" x2="1220" y2="470" stroke="#20352D" stroke-width="16" stroke-linecap="round" /><circle cx="800" cy="470" r="22" fill="#28735B" stroke="none" stroke-width="3"/><line x1="400" y1="470" x2="280" y2="620" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><line x1="400" y1="470" x2="520" y2="620" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M250 620 Q400 715 550 620" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1200" y1="470" x2="1080" y2="620" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><line x1="1200" y1="470" x2="1320" y2="620" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M1050 620 Q1200 715 1350 620" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="315" y="565" width="48" height="55" rx="7" fill="#28735B" stroke="none" stroke-width="2"/><rect x="380" y="528" width="48" height="92" rx="7" fill="#B8D8BD" stroke="none" stroke-width="2"/><rect x="445" y="491" width="48" height="129" rx="7" fill="#E7C78E" stroke="none" stroke-width="2"/><circle cx="1160" cy="562" r="42" fill="#28735B" stroke="none" stroke-width="3"/><circle cx="1180" cy="548" r="37" fill="#F5F2E9" stroke="none" stroke-width="3"/><rect x="1230" y="510" width="55" height="99" rx="8" fill="#FFFFFF" stroke="#C9D2C6" stroke-width="3"/><line x1="1242" y1="535" x2="1272" y2="535" stroke="#28735B" stroke-width="4" stroke-linecap="round" /><line x1="1242" y1="556" x2="1272" y2="556" stroke="#28735B" stroke-width="4" stroke-linecap="round" /><text x="400" y="331" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">TRABALHO ACUMULADO</text><text x="400" y="380" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">corrida + força + HYROX + MTB</text><text x="400" y="421" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">intensidade e duração</text><text x="1200" y="331" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">RESPOSTA E RECUPERAÇÃO</text><text x="1200" y="380" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">sono e sensação entre sessões</text><text x="1200" y="421" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">regularidade com margem</text><text x="800" y="757" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Não concentre de uma vez o trabalho que deixou de fazer.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Orientação geral · ajuste ao seu contexto e procure apoio quando necessário</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>