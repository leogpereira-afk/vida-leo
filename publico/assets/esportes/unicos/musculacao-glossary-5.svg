<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Falha técnica</title><desc id="desc">Duas trajetórias contrastam um movimento controlado e repetível com uma sequência que perde controle. A segunda termina em orientação para interromper e ajustar, sem exigir falha em toda série.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Falha técnica</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">É o limite do padrão combinado, não apenas o momento de cansaço.</text><rect x="105" y="270" width="645" height="450" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="800" y="270" width="695" height="450" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="427" y="327" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">PADRÃO MANTIDO</text><text x="1147" y="327" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">PADRÃO SE PERDE</text><path d="M235 570 C275 550 275 420 330 395 S415 495 465 455 S545 415 615 415" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="615" cy="415" r="15" fill="#28735B" stroke="none" stroke-width="3"/><path d="M905 570 C955 545 955 420 1005 395 S1085 495 1135 455 L1200 525 L1255 350 L1320 535 L1390 405" stroke="#B7742D" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="427" y="650" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">trajetória controlada</text><text x="427" y="688" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">e repetível</text><text x="1147" y="650" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">compensação crescente:</text><text x="1147" y="688" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">interromper e ajustar</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>