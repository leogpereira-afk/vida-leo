<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Doubles, Relay e Adaptive</title><desc id="desc">Três painéis distinguem a dupla, o revezamento e o formato adaptado. Ícones de pessoas em conjunto, sequência e um símbolo de ajuste indicam organizações diferentes sem detalhar regras não verificadas.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Doubles, Relay e Adaptive</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Cada formato tem organização e regulamento próprios.</text><rect x="95" y="275" width="445" height="455" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="317" y="335" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">DOUBLES</text><g transform="translate(260 460) scale(0.78)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(375 460) scale(0.78)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="240" y1="572" x2="395" y2="572" stroke="#28735B" stroke-width="6" stroke-linecap="round" /><text x="317" y="640" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="middle">dupla</text><rect x="580" y="275" width="445" height="455" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="802" y="335" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">RELAY</text><g transform="translate(695 455) scale(0.55)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(765 455) scale(0.55)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(835 455) scale(0.55)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(905 455) scale(0.55)"><circle cx="0" cy="-75" r="22" fill="#20352D" stroke="none" stroke-width="3"/><path d="M0 -43 L0 35 M-43 -5 L0 -30 L43 -5 M0 35 L-35 95 M0 35 L35 95" stroke="#20352D" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="690" y1="572" x2="920" y2="572" stroke="#28735B" stroke-width="6" stroke-linecap="round" /><path d="M 906 562 L 920 572 L 906 582" fill="none" stroke="#28735B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 920 572)"/><text x="802" y="640" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="middle">revezamento</text><rect x="1065" y="275" width="445" height="455" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1287" y="335" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">ADAPTIVE</text><circle cx="1287" cy="468" r="110" fill="#E1EBDF" stroke="none" stroke-width="3"/><path d="M1220 468 L1262 510 L1355 416" stroke="#28735B" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1287" y="620" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">requisitos e</text><text x="1287" y="660" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">adaptações próprios</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>