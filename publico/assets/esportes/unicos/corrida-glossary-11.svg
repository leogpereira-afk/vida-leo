<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Velocidade × pace</title><desc id="desc">Duas placas ligadas por setas mostram a equivalência matemática entre seis minutos por quilômetro e dez quilômetros por hora.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Velocidade × pace</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Duas maneiras inversas de expressar a mesma velocidade.</text><rect x="110" y="275" width="580" height="440" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="400" y="339" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">TEMPO POR DISTÂNCIA</text><text x="400" y="480" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="99" font-weight="700" text-anchor="middle">6:00</text><text x="400" y="550" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500" text-anchor="middle">min/km</text><rect x="910" y="275" width="580" height="440" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1200" y="339" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">DISTÂNCIA POR TEMPO</text><text x="1200" y="480" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="99" font-weight="700" text-anchor="middle">10</text><text x="1200" y="550" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="500" text-anchor="middle">km/h</text><line x1="730" y1="430" x2="870" y2="430" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 856 420 L 870 430 L 856 440" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 870 430)"/><line x1="870" y1="530" x2="730" y2="530" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 716 520 L 730 530 L 716 540" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 730 530)"/><text x="800" y="770" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle">km/h = 60 ÷ pace em minutos por quilômetro</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Exemplo ilustrativo de conversão · não define intensidade adequada</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>