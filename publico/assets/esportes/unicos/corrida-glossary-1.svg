<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lactato e limiar</title><desc id="desc">Uma curva conceitual de lactato aumenta com o esforço e uma linha marca uma transição individual. Um ciclo lateral mostra que lactato também pode fornecer energia.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Lactato e limiar</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Uma transição na resposta ao esforço; lactato também é combustível.</text><line x1="150" y1="670" x2="1100" y2="670" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 1086 660 L 1100 670 L 1086 680" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1100 670)"/><line x1="150" y1="670" x2="150" y2="300" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 136 290 L 150 300 L 136 310" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 150 300)"/><text x="1100" y="720" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="end">Esforço</text><text x="150" y="274" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Lactato no sangue</text><path d="M165 630 C370 628 590 605 700 565 S880 450 1050 300" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="735" y1="300" x2="735" y2="670" stroke="#B7742D" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10"/><rect x="530" y="705" width="420" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="740" y="738" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">transição individual</text><rect x="1190" y="285" width="310" height="440" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1345" cy="415" r="70" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="1345" y="427" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">LACTATO</text><path d="M1273 520 Q1345 570 1417 520" stroke="#B7742D" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1417" y1="520" x2="1417" y2="490" stroke="#B7742D" stroke-width="6" stroke-linecap="round" /><path d="M 1403 480 L 1417 490 L 1403 500" fill="none" stroke="#B7742D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 1417 490)"/><text x="1345" y="613" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">também pode</text><text x="1345" y="656" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">fornecer energia</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Curva ilustrativa · sem concentração ou limiar pessoal</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>