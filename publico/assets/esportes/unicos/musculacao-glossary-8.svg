<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Progressão</title><desc id="desc">Quatro degraus mostram controle, repetições, séries e carga como possibilidades de progressão. A legenda esclarece que não existe sequência obrigatória.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Progressão</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Progredir pode significar melhorar o controle ou ampliar uma demanda.</text><path d="M150 650 L470 650 L470 535 L800 535 L800 420 L1130 420 L1130 305 L1460 305" stroke="#28735B" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="305" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">CONTROLE</text><text x="635" y="495" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">REPETIÇÕES</text><text x="965" y="380" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">SÉRIES</text><text x="1295" y="265" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">CARGA</text><circle cx="305" cy="700" r="10" fill="#B7742D" stroke="none" stroke-width="3"/><circle cx="635" cy="700" r="10" fill="#B7742D" stroke="none" stroke-width="3"/><circle cx="965" cy="700" r="10" fill="#B7742D" stroke="none" stroke-width="3"/><circle cx="1295" cy="700" r="10" fill="#B7742D" stroke="none" stroke-width="3"/><text x="800" y="756" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">São possibilidades de ajuste; a sequência não é obrigatória.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>