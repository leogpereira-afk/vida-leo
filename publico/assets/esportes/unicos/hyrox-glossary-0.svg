<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Roxzone</title><desc id="desc">Planta esquemática de arena com circuito externo de corrida, área de estação e Roxzone destacada. Setas indicam entrada e retorno; não representa uma arena específica.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Roxzone</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Área de conexão entre corrida e estações; o tempo continua contando.</text><rect x="115" y="265" width="1370" height="480" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="160" y="310" width="1280" height="390" rx="110" fill="none" stroke="#C9D2C6" stroke-width="48"/><path d="M220 595 L220 430 Q220 365 310 365 L650 365" stroke="#28735B" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="650" y1="365" x2="730" y2="365" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 716 355 L 730 365 L 716 375" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 730 365)"/><rect x="810" y="355" width="510" height="195" rx="25" fill="#28735B" stroke="none" stroke-width="2"/><text x="1065" y="435" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="middle">ESTAÇÃO</text><rect x="870" y="474" width="390" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1065" y="507" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">entrada → trabalho</text><rect x="580" y="560" width="600" height="108" rx="22" fill="#E7C78E" stroke="none" stroke-width="2"/><text x="880" y="625" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">ROXZONE / TRANSIÇÃO</text><line x1="1000" y1="550" x2="1000" y2="588" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 986 578 L 1000 588 L 986 598" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 1000 588)"/><line x1="580" y1="615" x2="360" y2="615" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 346 605 L 360 615 L 346 625" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 360 615)"/><text x="390" y="450" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="middle">corrida</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Arena ilustrativa · consulte o mapa e o briefing da etapa</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>