<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Prepare a bicicleta e a rota</title><desc id="desc">Uma bicicleta com chamadas para freios, comandos, pneus e rodas aparece ao lado de clima e rota pontilhada com retorno e comunicação, formando uma checagem visual antes do pedal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / CUIDADOS NA PRÁTICA</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start">Prepare a bicicleta e a rota</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Condições do equipamento e do percurso fazem parte do pedal.</text><rect x="100" y="275" width="860" height="450" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><g transform="translate(530 510) scale(1.65)"><circle cx="-120" cy="38" r="68" fill="none" stroke="#20352D" stroke-width="7"/><circle cx="120" cy="38" r="68" fill="none" stroke="#20352D" stroke-width="7"/><path d="M-120 38 L-55 -66 L20 38 L-120 38 M-55 -66 L86 -66 L20 38 M86 -66 L120 38 M86 -66 L75 -100 L111 -108 M-55 -66 L-66 -96 M-90 -96 L-38 -96" stroke="#20352D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20" cy="38" r="12" fill="#20352D" stroke="none" stroke-width="3"/></g><rect x="140" y="305" width="280" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="280" y="338" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">freios e comandos</text><line x1="420" y1="340" x2="680" y2="350" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><rect x="180" y="650" width="250" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="305" y="683" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">pneus e rodas</text><line x1="305" y1="650" x2="330" y2="575" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><rect x="1005" y="275" width="490" height="450" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><circle cx="1090" cy="355" r="34" fill="#B7742D" stroke="none" stroke-width="3"/><path d="M1140 354 Q1160 311 1195 343 Q1240 329 1250 370 L1140 370 Z" stroke="#52665C" stroke-width="3" fill="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" /><text x="1335" y="367" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" text-anchor="middle">clima</text><path d="M1090 600 Q1230 500 1130 463 T1400 455" stroke="#28735B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="13 10"/><circle cx="1090" cy="600" r="15" fill="#28735B" stroke="none" stroke-width="3"/><circle cx="1400" cy="455" r="15" fill="#28735B" stroke="none" stroke-width="3"/><rect x="1045" y="644" width="410" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1250" y="677" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">rota + retorno + comunicação</text><text x="800" y="775" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">Se o trecho exceder sua habilidade, reconhecer a pé é uma opção.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Orientação geral · ajuste ao seu contexto e procure apoio quando necessário</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>