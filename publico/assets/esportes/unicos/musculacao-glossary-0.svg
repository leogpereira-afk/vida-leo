<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Série e repetição</title><desc id="desc">À esquerda, uma seta circular mostra ida e volta de um halter. À direita, cinco ciclos ilustrativos são agrupados por uma chave como uma série.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Série e repetição</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Um ciclo completo forma uma repetição; várias repetições formam uma série.</text><rect x="95" y="255" width="465" height="470" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="327" y="307" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">UMA REPETIÇÃO</text><path d="M212 447 A115 115 0 1 1 435 447" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="435" y1="447" x2="418" y2="489" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 404 479 L 418 489 L 404 499" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(112.03622694014545 418 489)"/><path d="M418 489 A115 115 0 0 1 212 447" stroke="#B8D8BD" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(325 431) scale(0.5)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><text x="325" y="627" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" text-anchor="middle">ida + volta</text><text x="325" y="674" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">ciclo do movimento</text><rect x="600" y="255" width="900" height="470" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1050" y="307" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">UMA SÉRIE</text><circle cx="720" cy="440" r="49" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="720" y="452" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">1</text><circle cx="880" cy="440" r="49" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="880" y="452" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">2</text><circle cx="1040" cy="440" r="49" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="1040" y="452" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">3</text><circle cx="1200" cy="440" r="49" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="1200" y="452" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">4</text><circle cx="1360" cy="440" r="49" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="1360" y="452" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">5</text><path d="M690 520 L690 550 L1390 550 L1390 520" stroke="#28735B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1040" y="604" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" text-anchor="middle">conjunto de ciclos</text><rect x="820" y="644" width="440" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1040" y="677" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">depois, uma pausa</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Exemplo ilustrativo de contagem · não é uma prescrição</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>