<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Linha / trajetória</title><desc id="desc">Uma trajetória verde contorna um obstáculo com entrada e saída visíveis, enquanto uma linha pontilhada ilustra que o caminho mais curto nem sempre é a escolha adequada.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Linha / trajetória</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Leia entrada, passagem e saída antes de escolher o caminho.</text><rect x="105" y="270" width="1390" height="475" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M190 650 C450 650 475 360 780 380 S1150 680 1400 390" stroke="#C9D2C6" stroke-width="145" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 650 C500 650 440 315 790 350 S1170 620 1400 390" stroke="#28735B" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1335" y1="460" x2="1400" y2="390" stroke="#28735B" stroke-width="7" stroke-linecap="round" /><path d="M 1386 380 L 1400 390 L 1386 400" fill="none" stroke="#28735B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-47.12109639666145 1400 390)"/><path d="M190 650 L770 440 L1400 390" stroke="#B7742D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 14"/><path d="M670 460 L740 380 L830 405 L860 490 Z" stroke="#52665C" stroke-width="4" fill="#C9D2C6" stroke-linecap="round" stroke-linejoin="round" /><rect x="142" y="306" width="300" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="292" y="339" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">olhar à frente</text><rect x="1015" y="665" width="400" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1215" y="698" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">espaço para corrigir</text><text x="830" y="585" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">obstáculo</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>