<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Trail / enduro / downhill</title><desc id="desc">Três perfis de terreno distinguem trilhas variadas, trechos cronometrados do enduro e descida do downhill, evitando tratá-los como sinônimos.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Trail / enduro / downhill</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Terreno, competição e proteção mudam conforme a modalidade.</text><rect x="120" y="280" width="370" height="420" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="615" y="280" width="370" height="420" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="1110" y="280" width="370" height="420" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="305" y="340" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">TRAIL</text><path d="M155 560 L210 490 L265 530 L315 425 L370 470 L455 390" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="305" y="654" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">trilhas variadas</text><text x="800" y="340" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">ENDURO</text><path d="M650 555 L735 420 L790 480 L840 390 L960 570" stroke="#B8D8BD" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M735 420 L790 480 M840 390 L960 570" stroke="#28735B" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="654" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">trechos cronometrados</text><text x="1295" y="340" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">DOWNHILL</text><path d="M1145 400 L1230 425 L1280 500 L1330 475 L1445 570" stroke="#28735B" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1390" y1="530" x2="1445" y2="570" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 1431 560 L 1445 570 L 1431 580" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(36.02737338510361 1445 570)"/><text x="1295" y="654" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">foco na descida</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>