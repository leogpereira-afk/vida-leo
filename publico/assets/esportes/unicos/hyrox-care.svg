<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preserve a técnica sob fadiga</title><desc id="desc">Um trenó esquemático é cercado por quatro verificações: carga controlável, piso e espaço livres, padrão repetível e pausas planejadas. A orientação é reorganizar o movimento quando o controle se perde.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / CUIDADOS NA PRÁTICA</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start">Preserve a técnica sob fadiga</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Ritmo, carga e ambiente devem permitir movimentos controlados.</text><rect x="100" y="270" width="1400" height="455" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M525 585 L1090 585 M565 580 L565 390 M1005 580 L1005 390 M640 580 L640 450 M930 580 L930 450" stroke="#20352D" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="680" y="530" width="230" height="50" rx="12" fill="#28735B" stroke="none" stroke-width="2"/><rect x="710" y="492" width="170" height="38" rx="8" fill="#B8D8BD" stroke="none" stroke-width="2"/><rect x="735" y="465" width="120" height="27" rx="7" fill="#28735B" stroke="none" stroke-width="2"/><line x1="435" y1="630" x2="1170" y2="630" stroke="#C9D2C6" stroke-width="5" stroke-linecap="round" /><rect x="150" y="325" width="390" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="345" y="358" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">carga que você controla</text><line x1="490" y1="373" x2="610" y2="475" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><rect x="1030" y="325" width="390" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1225" y="358" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">piso e espaço livres</text><line x1="1100" y1="373" x2="1070" y2="585" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><rect x="160" y="650" width="420" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="370" y="683" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">padrão repetível</text><rect x="1000" y="650" width="420" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1210" y="683" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">pausas planejadas</text><text x="800" y="772" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Ao perder controle: reduza o esforço e reorganize a execução.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Orientação geral · ajuste ao seu contexto e procure apoio quando necessário</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>