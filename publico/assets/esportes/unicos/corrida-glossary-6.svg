<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PSE / RPE</title><desc id="desc">Um indicador semicircular vai de leve a exigente e se conecta a um balão com a pergunta Como foi?, representando percepção subjetiva de esforço sem fixar uma escala individual.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">PSE / RPE</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A sensação de dificuldade ajuda a interpretar a sessão.</text><path d="M280 590 A340 340 0 0 1 960 590" stroke="#C9D2C6" stroke-width="55" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M280 590 A340 340 0 0 1 620 250" stroke="#B8D8BD" stroke-width="55" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M620 250 A340 340 0 0 1 960 590" stroke="#28735B" stroke-width="55" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="620" y1="590" x2="790" y2="390" stroke="#20352D" stroke-width="12" stroke-linecap="round" /><circle cx="620" cy="590" r="25" fill="#20352D" stroke="none" stroke-width="3"/><text x="250" y="682" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="start">leve</text><text x="970" y="682" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="end">exigente</text><rect x="1080" y="290" width="420" height="390" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1290" y="365" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" text-anchor="middle">PERCEPÇÃO</text><text x="1290" y="410" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" text-anchor="middle">DO ESFORÇO</text><path d="M1170 470 Q1290 420 1410 470 L1410 560 L1300 560 L1255 603 L1255 560 L1170 560 Z" stroke="#20352D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1290" y="522" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle">Como foi?</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>