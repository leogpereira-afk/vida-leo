<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RIR</title><desc id="desc">Seis círculos preenchidos representam repetições concluídas e dois círculos vazados representam repetições ainda estimadas como possíveis, ilustrando RIR dois.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">RIR</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Repetições em reserva são uma estimativa, não uma medição exata.</text><text x="245" y="306" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">CONCLUÍDAS</text><text x="1190" y="306" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">EM RESERVA</text><circle cx="205" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="205" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">1</text><circle cx="375" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="375" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">2</text><circle cx="545" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="545" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">3</text><circle cx="715" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="715" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">4</text><circle cx="885" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="885" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">5</text><circle cx="1055" cy="443" r="58" fill="#28735B" stroke="none" stroke-width="5"/><text x="1055" y="455" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">6</text><circle cx="1225" cy="443" r="58" fill="none" stroke="#B7742D" stroke-width="5"/><text x="1225" y="455" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">7</text><circle cx="1395" cy="443" r="58" fill="none" stroke="#B7742D" stroke-width="5"/><text x="1395" y="455" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">8</text><path d="M148 534 L148 565 L1110 565 L1110 534" stroke="#28735B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1167 534 L1167 565 L1450 565 L1450 534" stroke="#B7742D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="630" y="630" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="600" text-anchor="middle">6 repetições feitas</text><text x="1308" y="630" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle">RIR 2</text><text x="1308" y="685" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">ainda seriam possíveis</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Exemplo ilustrativo · a reserva depende da execução e da percepção</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>