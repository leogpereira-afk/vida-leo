<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Pace nas máquinas</title><desc id="desc">Um monitor de máquina mostra dois minutos e trinta por quinhentos metros. A conversão à direita mostra cerca de cinco minutos para mil metros no mesmo ritmo, sem confundir a unidade com corrida.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Pace nas máquinas</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">O monitor usa tempo equivalente por 500 metros.</text><rect x="100" y="275" width="650" height="450" rx="40" fill="#20352D" stroke="none" stroke-width="2"/><rect x="145" y="320" width="560" height="360" rx="25" fill="#F5F2E9" stroke="none" stroke-width="2"/><text x="425" y="398" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">PACE</text><text x="425" y="500" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" text-anchor="middle">2:30</text><text x="425" y="563" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="500" text-anchor="middle">/ 500 m</text><line x1="785" y1="495" x2="915" y2="495" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 901 485 L 915 495 L 901 505" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 915 495)"/><rect x="950" y="305" width="535" height="190" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1217" y="367" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle">1.000 m</text><text x="1217" y="435" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" text-anchor="middle">≈ 5:00</text><text x="1217" y="591" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">se o ritmo for mantido</text><text x="1217" y="636" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">sem considerar a largada</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Exemplo ilustrativo de cálculo · não é ritmo recomendado</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>