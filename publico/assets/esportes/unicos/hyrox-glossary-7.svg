<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Treino combinado</title><desc id="desc">Uma sequência alterna ícones de corrida e implemento em quatro etapas, conectadas por setas. A composição destaca planejar volume, esforço e pausas sem reproduzir obrigatoriamente a prova inteira.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Treino combinado</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Alternar tarefas permite praticar coordenação e transições.</text><circle cx="210" cy="450" r="95" fill="#28735B" stroke="none" stroke-width="3"/><g transform="translate(210 457) scale(0.68)"><circle cx="20" cy="-80" r="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="605" cy="450" r="95" fill="#E1EBDF" stroke="none" stroke-width="3"/><g transform="translate(605 450) scale(0.47)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><circle cx="1000" cy="450" r="95" fill="#28735B" stroke="none" stroke-width="3"/><g transform="translate(1000 457) scale(0.68)"><circle cx="20" cy="-80" r="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="1395" cy="450" r="95" fill="#E1EBDF" stroke="none" stroke-width="3"/><g transform="translate(1395 450) scale(0.47)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><line x1="310" y1="450" x2="490" y2="450" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 476 440 L 490 450 L 476 460" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 490 450)"/><line x1="705" y1="450" x2="885" y2="450" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 871 440 L 885 450 L 871 460" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 885 450)"/><line x1="1100" y1="450" x2="1280" y2="450" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 1266 440 L 1280 450 L 1266 460" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1280 450)"/><text x="210" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">corrida</text><text x="605" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">estação</text><text x="1000" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">corrida</text><text x="1395" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">estação</text><rect x="430" y="295" width="740" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="800" y="328" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">volume + esforço + pausas planejados</text><text x="800" y="746" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">Uma sessão combinada não precisa reproduzir a prova inteira.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>