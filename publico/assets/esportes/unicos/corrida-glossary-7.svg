<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Volume</title><desc id="desc">Cinco barras de alturas diferentes mostram quantidade de treino por sessão. O desenho destaca tempo ou distância e lembra que o total não explica a exigência sozinho.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Volume</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Quanto treino foi realizado? Observe quantidade e distribuição.</text><line x1="180" y1="655" x2="1420" y2="655" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 1406 645 L 1420 655 L 1406 665" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1420 655)"/><line x1="180" y1="655" x2="180" y2="315" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 166 305 L 180 315 L 166 325" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 180 315)"/><text x="1420" y="705" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="end">Sessões</text><text x="180" y="289" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Quantidade de treino</text><rect x="255" y="465" width="140" height="190" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><text x="325" y="714" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">A</text><rect x="480" y="345" width="140" height="310" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><text x="550" y="714" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">B</text><rect x="705" y="435" width="140" height="220" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><text x="775" y="714" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">C</text><rect x="930" y="295" width="140" height="360" rx="12" fill="#28735B" stroke="none" stroke-width="2"/><text x="1000" y="714" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">D</text><rect x="1155" y="395" width="140" height="260" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><text x="1225" y="714" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">E</text><rect x="865" y="255" width="550" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1140" y="288" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">tempo ou distância por sessão</text><text x="800" y="772" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle">O total não explica sozinho a exigência.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Dados ilustrativos · não representam uma semana recomendada</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>