<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Carga e volume</title><desc id="desc">Uma barra representa carga externa; uma grade de três colunas e quatro blocos representa séries e repetições como dimensões de volume.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Carga e volume</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Peso externo e quantidade de trabalho descrevem partes diferentes da sessão.</text><rect x="100" y="270" width="570" height="465" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="385" y="332" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" text-anchor="middle">CARGA</text><g transform="translate(385 478) scale(1.25)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><text x="385" y="672" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">peso externo<