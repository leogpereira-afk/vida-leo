<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cadência</title><desc id="desc">Pegadas alternadas dos pés direito e esquerdo são agrupadas sobre uma linha de tempo. A fórmula visual mostra passos divididos pelo tempo observado, sem fixar uma cadência ideal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Cadência</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Conte os contatos dos dois pés ao longo do tempo.</text><line x1="150" y1="592" x2="1450" y2="592" stroke="#C9D2C6" stroke-width="4" stroke-linecap="round" /><g transform="translate(220 405) rotate(-15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#28735B" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#28735B" stroke="none" stroke-width="3"/></g><g transform="translate(380 480) rotate(15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#B8D8BD" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#B8D8BD" stroke="none" stroke-width="3"/></g><g transform="translate(540 405) rotate(-15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#28735B" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#28735B" stroke="none" stroke-width="3"/></g><g transform="translate(700 480) rotate(15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#B8D8BD" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#B8D8BD" stroke="none" stroke-width="3"/></g><g transform="translate(860 405) rotate(-15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#28735B" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#28735B" stroke="none" stroke-width="3"/></g><g transform="translate(1020 480) rotate(15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#B8D8BD" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#B8D8BD" stroke="none" stroke-width="3"/></g><g transform="translate(1180 405) rotate(-15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#28735B" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#28735B" stroke="none" stroke-width="3"/></g><g transform="translate(1340 480) rotate(15)"><rect x="-24" y="-68" width="48" height="115" rx="24" fill="#B8D8BD" stroke="none" stroke-width="2"/><circle cx="0" cy="67" r="19" fill="#B8D8BD" stroke="none" stroke-width="3"/></g><path d="M160 650 L160 682 L1430 682 L1430 650" stroke="#28735B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="747" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" text-anchor="middle">passos ÷ tempo observado</text><rect x="150" y="275" width="600" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="450" y="308" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">direito + esquerdo entram na contagem</text><rect x="1005" y="275" width="440" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1225" y="308" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">sem número ideal universal</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>