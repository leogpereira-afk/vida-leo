<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Recuperação</title><desc id="desc">Um ciclo liga estímulo e recuperação. No centro, sono, alimentação e gestão da carga mostram fatores a considerar, sem prometer um tempo fixo de recuperação.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Recuperação</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Pausas e dias leves participam da organização do treinamento.</text><path d="M360 345 C530 190 1080 190 1250 345" stroke="#28735B" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1250" y1="345" x2="1288" y2="405" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 1274 395 L 1288 405 L 1274 415" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(57.652556500557964 1288 405)"/><path d="M1288 550 C1100 730 550 750 360 590" stroke="#28735B" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="360" y1="590" x2="314" y2="536" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 300 526 L 314 536 L 300 546" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-130.42607874009914 314 536)"/><rect x="105" y="360" width="410" height="200" rx="22" fill="#28735B" stroke="none" stroke-width="2"/><text x="310" y="473" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" text-anchor="middle">ESTÍMULO</text><rect x="1090" y="360" width="410" height="200" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1295" y="473" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">RECUPERAÇÃO</text><circle cx="800" cy="460" r="145" fill="#FFFFFF" stroke="none" stroke-width="3"/><text x="800" y="430" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">sono</text><text x="800" y="475" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">alimentação</text><text x="800" y="520" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">gestão da carga</text><text x="800" y="765" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">Um dia sem corrida pode continuar exigente em outro esporte.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>