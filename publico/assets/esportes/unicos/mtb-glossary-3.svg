<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SAG</title><desc id="desc">Dois garfos de suspensão esquemáticos mostram a posição sem carga e a compressão sob o ciclista. Uma medida vertical identifica o SAG sem fixar percentual.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">SAG</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A suspensão cede sob o ciclista; o ajuste é específico do conjunto.</text><rect x="120" y="280" width="600" height="435" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="840" y="280" width="640" height="435" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="420" y="340" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">SEM CARGA DO CICLISTA</text><text x="1160" y="340" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">COM O CICLISTA</text><rect x="340" y="390" width="37" height="250" rx="12" fill="#C9D2C6" stroke="none" stroke-width="2"/><rect x="332" y="520" width="53" height="135" rx="12" fill="#20352D" stroke="none" stroke-width="2"/><rect x="500" y="390" width="37" height="250" rx="12" fill="#C9D2C6" stroke="none" stroke-width="2"/><rect x="492" y="520" width="53" height="135" rx="12" fill="#20352D" stroke="none" stroke-width="2"/><line x1="350" y1="390" x2="510" y2="390" stroke="#20352D" stroke-width="18" stroke-linecap="round" /><rect x="1080" y="450" width="37" height="190" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><rect x="1072" y="520" width="53" height="135" rx="12" fill="#20352D" stroke="none" stroke-width="2"/><rect x="1240" y="450" width="37" height="190" rx="12" fill="#B8D8BD" stroke="none" stroke-width="2"/><rect x="1232" y="520" width="53" height="135" rx="12" fill="#20352D" stroke="none" stroke-width="2"/><line x1="1090" y1="450" x2="1250" y2="450" stroke="#20352D" stroke-width="18" stroke-linecap="round" /><line x1="1000" y1="390" x2="1360" y2="390" stroke="#52665C" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/><line x1="1320" y1="390" x2="1320" y2="450" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><text x="1370" y="435" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">SAG</text><text x="800" y="775" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">Sem percentual universal: consulte o manual do modelo.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>