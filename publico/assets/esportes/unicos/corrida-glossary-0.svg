<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">VO₂máx</title><desc id="desc">Oxigênio conecta-se simbolicamente ao transporte e uso pelo corpo e a um relógio com gráfico. A legenda distingue a capacidade fisiológica da estimativa fornecida pelo dispositivo.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">VO₂máx</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Captação e uso de oxigênio; no relógio, uma estimativa.</text><rect x="100" y="270" width="420" height="450" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="310" cy="430" r="110" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="310" y="461" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" text-anchor="middle">O₂</text><text x="310" y="620" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600" text-anchor="middle">captar</text><line x1="550" y1="440" x2="660" y2="440" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 646 430 L 660 440 L 646 450" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 660 440)"/><rect x="690" y="270" width="370" height="450" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><path d="M800 380 C730 320 730 475 875 555 C1020 475 1020 320 950 380 C915 345 840 345 800 380" stroke="#28735B" stroke-width="6" fill="#28735B" stroke-linecap="round" stroke-linejoin="round" /><text x="875" y="620" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">transportar e usar</text><line x1="1090" y1="440" x2="1200" y2="440" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 1186 430 L 1200 440 L 1186 450" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1200 440)"/><rect x="1240" y="310" width="230" height="330" rx="45" fill="#20352D" stroke="none" stroke-width="2"/><rect x="1267" y="370" width="176" height="210" rx="24" fill="#F5F2E9" stroke="none" stroke-width="2"/><text x="1355" y="427" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="middle">VO₂</text><path d="M1290 510 L1320 485 L1350 490 L1380 450 L1420 462" stroke="#28735B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1355" y="682" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">estimativa</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>