<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Tubeless</title><desc id="desc">Corte técnico de um conjunto tubeless identifica pneu, selante, aro com vedação e válvula, sem mostrar uma câmara de ar.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Tubeless</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Pneu, aro, válvula e vedação precisam ser compatíveis.</text><path d="M380 650 L380 420 C380 190 870 190 870 420 L870 650" stroke="#20352D" stroke-width="45" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 650 L410 420 C410 240 840 240 840 420 L840 650" stroke="#B8D8BD" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M380 650 Q625 740 870 650 L820 600 Q625 675 430 600 Z" stroke="#20352D" stroke-width="6" fill="#C9D2C6" stroke-linecap="round" stroke-linejoin="round" /><path d="M435 600 Q625 658 815 600" stroke="#28735B" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 555 Q625 610 785 555 L790 594 Q625 650 465 594 Z" stroke="#28735B" stroke-width="2" fill="#B8D8BD" stroke-linecap="round" stroke-linejoin="round" /><line x1="625" y1="640" x2="625" y2="760" stroke="#B7742D" stroke-width="16" stroke-linecap="round" /><line x1="850" y1="355" x2="1090" y2="355" stroke="#52665C" stroke-width="3" stroke-linecap="round" /><text x="1120" y="367" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="start">pneu</text><line x1="790" y1="560" x2="1090" y2="480" stroke="#52665C" stroke-width="3" stroke-linecap="round" /><text x="1120" y="492" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="start">selante</text><line x1="825" y1="640" x2="1090" y2="600" stroke="#52665C" stroke-width="3" stroke-linecap="round" /><text x="1120" y="612" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="start">aro + vedação</text><text x="700" y="759" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="start">válvula</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>