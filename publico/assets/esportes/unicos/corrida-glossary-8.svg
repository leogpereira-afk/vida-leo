<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Intensidade</title><desc id="desc">Um corredor e uma seta representam ritmo e potência externos; um coração representa percepção e frequência cardíaca internas. As duas dimensões são apresentadas lado a lado.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Intensidade</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Produção externa e resposta interna se complementam.</text><rect x="100" y="275" width="620" height="450" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="410" y="332" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">O QUE VOCÊ PRODUZ</text><g transform="translate(300 482) scale(1.3)"><circle cx="20" cy="-80" r="20" fill="#28735B" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#28735B" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="420" y1="470" x2="625" y2="470" stroke="#28735B" stroke-width="9" stroke-linecap="round" /><path d="M 611 460 L 625 470 L 611 480" fill="none" stroke="#28735B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 625 470)"/><text x="410" y="658" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" text-anchor="middle">ritmo · potência</text><rect x="790" y="275" width="710" height="450" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1145" y="332" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">COMO O CORPO RESPONDE</text><path d="M1048 429 C1000 375 970 475 1145 560 C1320 475 1290 375 1242 429 C1205 395 1085 395 1048 429" stroke="#28735B" stroke-width="5" fill="#28735B" stroke-linecap="round" stroke-linejoin="round" /><text x="1145" y="658" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">percepção · frequência cardíaca</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>