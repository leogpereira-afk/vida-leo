<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Open e Pro</title><desc id="desc">Open e Pro aparecem como duas colunas com implementos sem quilogramas e a mesma sequência ao centro. O desenho orienta conferir a tabela da divisão sem presumir carga pessoal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Open e Pro</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Divisões individuais compartilham o formato e diferem nas cargas.</text><rect x="110" y="280" width="620" height="430" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="870" y="280" width="620" height="430" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="420" y="351" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="middle">OPEN</text><text x="1180" y="351" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="middle">PRO</text><g transform="translate(420 493) scale(1.1)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><g transform="translate(1180 493) scale(1.1)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><circle cx="317" cy="493" r="76" fill="none" stroke="#B7742D" stroke-width="5"/><circle cx="1283" cy="493" r="76" fill="none" stroke="#B7742D" stroke-width="5"/><text x="420" y="654" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">conferir tabela da divisão</text><text x="1180" y="654" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">conferir tabela da divisão</text><rect x="640" y="420" width="320" height="48" rx="24" fill="#F5F2E9" stroke="none" stroke-width="2"/><text x="800" y="453" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">mesma sequência</text><text x="800" y="770" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle">Carga de competição não é carga automática de aprendizagem.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>