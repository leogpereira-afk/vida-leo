<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Dropper</title><desc id="desc">Duas vistas do tubo de selim mostram o canote estendido e retraído, conectadas por setas de acionamento. A altura da pedalada é diferenciada do espaço para movimentar o corpo.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Dropper</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">O canote retrátil altera a altura do selim durante o percurso.</text><rect x="100" y="280" width="1400" height="440" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><line x1="390" y1="600" x2="310" y2="415" stroke="#20352D" stroke-width="20" stroke-linecap="round" /><line x1="310" y1="415" x2="265" y2="310" stroke="#28735B" stroke-width="18" stroke-linecap="round" /><path d="M198 300 Q250 278 335 308" stroke="#20352D" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="310" y1="415" x2="470" y2="340" stroke="#C9D2C6" stroke-width="16" stroke-linecap="round" /><text x="385" y="674" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">alto para pedalar</text><line x1="1165" y1="600" x2="1085" y2="415" stroke="#20352D" stroke-width="20" stroke-linecap="round" /><line x1="1085" y1="415" x2="1060" y2="360" stroke="#28735B" stroke-width="18" stroke-linecap="round" /><path d="M990 350 Q1045 328 1130 358" stroke="#20352D" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1085" y1="415" x2="1245" y2="340" stroke="#C9D2C6" stroke-width="16" stroke-linecap="round" /><text x="1145" y="674" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">baixo para liberar espaço</text><line x1="690" y1="425" x2="890" y2="425" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 876 415 L 890 425 L 876 435" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 890 425)"/><line x1="890" y1="515" x2="690" y2="515" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 676 505 L 690 515 L 676 525" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 690 515)"/><text x="790" y="613" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" text-anchor="middle">comando do canote</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>