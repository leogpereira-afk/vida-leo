<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">No-rep</title><desc id="desc">Dois estados da contagem: um visto confirma repetição válida; um X indica ajustar e repetir quando o padrão não foi atendido. Não apresenta uma amplitude universal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">No-rep</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A repetição só entra na contagem quando atende ao padrão.</text><rect x="100" y="275" width="650" height="440" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="425" y="341" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">PADRÃO ATENDIDO</text><circle cx="425" cy="477" r="90" fill="#E1EBDF" stroke="none" stroke-width="3"/><path d="M370 475 L410 518 L490 424" stroke="#28735B" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="235" y="621" width="380" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="425" y="654" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">entra na contagem</text><rect x="820" y="275" width="680" height="440" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1160" y="341" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">PADRÃO NÃO ATENDIDO</text><circle cx="1160" cy="477" r="90" fill="#FFFFFF" stroke="none" stroke-width="3"/><line x1="1118" y1="435" x2="1202" y2="519" stroke="#B7742D" stroke-width="13" stroke-linecap="round" /><line x1="1202" y1="435" x2="1118" y2="519" stroke="#B7742D" stroke-width="13" stroke-linecap="round" /><rect x="950" y="621" width="420" height="48" rx="24" fill="#E7C78E" stroke="none" stroke-width="2"/><text x="1160" y="654" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">ajustar e repetir</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>