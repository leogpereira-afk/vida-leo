<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Descanso entre séries</title><desc id="desc">Uma série à esquerda conecta-se a um relógio sem duração marcada e depois à próxima série, mostrando a pausa como parte da organização do treino.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Descanso entre séries</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A pausa faz parte do treino e prepara a próxima tentativa.</text><rect x="110" y="355" width="300" height="210" rx="22" fill="#28735B" stroke="none" stroke-width="2"/><text x="260" y="475" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle">SÉRIE</text><line x1="440" y1="460" x2="568" y2="460" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 554 450 L 568 460 L 554 470" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 568 460)"/><circle cx="790" cy="460" r="152" fill="#E1EBDF" stroke="none" stroke-width="3"/><circle cx="790" cy="460" r="112" fill="none" stroke="#28735B" stroke-width="7"/><line x1="790" y1="460" x2="790" y2="387" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><line x1="790" y1="460" x2="853" y2="488" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><text x="790" y="670" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle">recuperar capacidade</text><line x1="1012" y1="460" x2="1140" y2="460" stroke="#28735B" stroke-width="8" stroke-linecap="round" /><path d="M 1126 450 L 1140 460 L 1126 470" fill="none" stroke="#28735B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1140 460)"/><rect x="1170" y="355" width="300" height="210" rx="22" fill="#28735B" stroke="none" stroke-width="2"/><text x="1320" y="449" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="middle">PRÓXIMA</text><text x="1320" y="497" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="middle">SÉRIE</text><text x="800" y="300" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">DESCANSO AJUSTADO AO OBJETIVO</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>