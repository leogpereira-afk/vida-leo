<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cadência de pedalada</title><desc id="desc">Pedivela e pedais são envolvidos por uma seta circular. Uma placa define uma volta completa e a unidade rotações por minuto sem recomendar uma cadência.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Cadência de pedalada</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Conte as voltas do pedivela por minuto.</text><circle cx="475" cy="495" r="165" fill="#E1EBDF" stroke="none" stroke-width="3"/><circle cx="475" cy="495" r="108" fill="none" stroke="#28735B" stroke-width="9"/><circle cx="475" cy="495" r="19" fill="#20352D" stroke="none" stroke-width="3"/><line x1="475" y1="495" x2="590" y2="415" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><line x1="565" y1="415" x2="630" y2="415" stroke="#20352D" stroke-width="15" stroke-linecap="round" /><line x1="475" y1="495" x2="360" y2="575" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><line x1="325" y1="575" x2="390" y2="575" stroke="#20352D" stroke-width="15" stroke-linecap="round" /><path d="M325 325 A230 230 0 0 1 685 430" stroke="#B7742D" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="685" y1="430" x2="693" y2="470" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><path d="M 679 460 L 693 470 L 679 480" fill="none" stroke="#B7742D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(78.69006752597979 693 470)"/><rect x="850" y="325" width="620" height="345" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1160" y="427" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" text-anchor="middle">1 VOLTA</text><text x="1160" y="492" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">ciclo completo do pedivela</text><line x1="930" y1="536" x2="1390" y2="536" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="1160" y="603" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle">RPM = voltas por minuto</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>