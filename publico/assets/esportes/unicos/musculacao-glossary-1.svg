<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Amplitude</title><desc id="desc">Diagrama de um cotovelo fixo e duas posições do antebraço. Um arco destaca o percurso do movimento, acompanhado de uma nota sobre amplitude controlada.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Amplitude</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">O arco deve combinar movimento, controle e capacidade.</text><circle cx="500" cy="510" r="210" fill="#E1EBDF" stroke="none" stroke-width="3"/><circle cx="500" cy="510" r="20" fill="#28735B" stroke="none" stroke-width="3"/><line x1="500" y1="510" x2="500" y2="290" stroke="#20352D" stroke-width="25" stroke-linecap="round" /><line x1="500" y1="510" x2="708" y2="585" stroke="#C9D2C6" stroke-width="24" stroke-linecap="round" /><line x1="500" y1="510" x2="638" y2="335" stroke="#28735B" stroke-width="24" stroke-linecap="round" /><path d="M680 575 A190 190 0 0 0 624 356" stroke="#B7742D" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="638" cy="335" r="22" fill="#28735B" stroke="none" stroke-width="3"/><circle cx="708" cy="585" r="22" fill="#C9D2C6" stroke="none" stroke-width="3"/><text x="500" y="745" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">Exemplo: movimento do cotovelo</text><line x1="762" y1="407" x2="900" y2="407" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><text x="935" y="392" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" text-anchor="start">AMPLITUDE</text><text x="935" y="436" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" text-anchor="start">é o percurso realizado</text><rect x="935" y="490" width="515" height="196" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="970" y="536" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">Observe o arco que consegue</text><text x="970" y="584" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">executar sem compensações.</text><text x="970" y="632" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">Maior nem sempre é melhor.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>