<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Relação de marchas</title><desc id="desc">Coroa e pinhões de tamanhos diferentes são ligados por uma corrente. O pinhão traseiro maior é destacado como relação mais leve em um sistema comum.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Relação de marchas</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A combinação coroa–pinhão modifica o avanço por pedalada.</text><rect x="105" y="270" width="1390" height="465" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="440" cy="470" r="128" fill="#E1EBDF" stroke="#28735B" stroke-width="12"/><circle cx="440" cy="470" r="88" fill="none" stroke="#28735B" stroke-width="5"/><circle cx="1125" cy="470" r="80" fill="#B8D8BD" stroke="#28735B" stroke-width="9"/><circle cx="1125" cy="470" r="125" fill="none" stroke="#B7742D" stroke-width="6"/><path d="M440 342 L1125 390 A80 80 0 0 1 1125 550 L440 598 A128 128 0 0 1 440 342" stroke="#20352D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="440" y="665" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">COROA</text><text x="1125" y="665" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" text-anchor="middle">PINHÕES</text><line x1="1250" y1="470" x2="1390" y2="470" stroke="#B7742D" stroke-width="6" stroke-linecap="round" /><path d="M 1376 460 L 1390 470 L 1376 480" fill="none" stroke="#B7742D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1390 470)"/><text x="800" y="445" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">mesma pedalada</text><text x="800" y="488" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">relação diferente</text><text x="800" y="784" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Em um sistema comum, pinhão traseiro maior oferece relação mais leve.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>