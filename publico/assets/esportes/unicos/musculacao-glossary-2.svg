<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Concêntrico / excêntrico</title><desc id="desc">Três fibras musculares esquemáticas mostram encurtamento, alongamento sob tensão e sustentação isométrica. Setas convergem, divergem ou são substituídas por limites fixos.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Concêntrico / excêntrico</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">O comportamento muscular muda ao longo do exercício.</text><rect x="160" y="270" width="350" height="445" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="640" y="270" width="350" height="445" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="1120" y="270" width="350" height="445" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="335" y="324" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">CONCÊNTRICO</text><rect x="235" y="410" width="200" height="100" rx="50" fill="#28735B" stroke="none" stroke-width="2"/><line x1="210" y1="460" x2="248" y2="460" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 234 450 L 248 460 L 234 470" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 248 460)"/><line x1="460" y1="460" x2="422" y2="460" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 408 450 L 422 460 L 408 470" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 422 460)"/><text x="335" y="594" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">encurta</text><text x="335" y="644" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">sob tensão</text><text x="815" y="324" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">EXCÊNTRICO</text><rect x="685" y="429" width="260" height="62" rx="31" fill="#B8D8BD" stroke="none" stroke-width="2"/><line x1="735" y1="460" x2="677" y2="460" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 663 450 L 677 460 L 663 470" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 677 460)"/><line x1="895" y1="460" x2="953" y2="460" stroke="#B7742D" stroke-width="8" stroke-linecap="round" /><path d="M 939 450 L 953 460 L 939 470" fill="none" stroke="#B7742D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 953 460)"/><text x="815" y="594" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">alonga</text><text x="815" y="644" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">sob tensão</text><text x="1295" y="324" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">ISOMÉTRICO</text><rect x="1195" y="410" width="200" height="100" rx="50" fill="#28735B" stroke="none" stroke-width="2"/><line x1="1170" y1="395" x2="1170" y2="525" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><line x1="1420" y1="395" x2="1420" y2="525" stroke="#B7742D" stroke-width="7" stroke-linecap="round" /><text x="1295" y="594" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">sustenta</text><text x="1295" y="644" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="middle">uma posição</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>