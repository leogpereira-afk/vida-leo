<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Origem do esporte</title><desc id="desc">Uma linha histórica conecta Hamburgo em 2017 a São Paulo em 2025, com corrida e exercício no centro. A legenda diferencia origem histórica de calendário atual.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Origem do esporte</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Um formato que reúne corrida e condicionamento funcional.</text><line x1="240" y1="480" x2="1370" y2="480" stroke="#28735B" stroke-width="10" stroke-linecap="round" /><circle cx="320" cy="480" r="24" fill="#28735B" stroke="none" stroke-width="3"/><circle cx="1280" cy="480" r="24" fill="#28735B" stroke="none" stroke-width="3"/><text x="320" y="355" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" text-anchor="middle">2017</text><text x="320" y="411" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Hamburgo</text><text x="1280" y="355" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" text-anchor="middle">2025</text><text x="1280" y="411" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle">São Paulo</text><text x="320" y="600" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">origem do</text><text x="320" y="642" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">formato HYROX</text><text x="1280" y="600" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">primeira etapa</text><text x="1280" y="642" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">sul-americana</text><g transform="translate(720 479) scale(0.8)"><circle cx="20" cy="-80" r="20" fill="#28735B" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#28735B" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(870 470) scale(0.44)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><rect x="500" y="710" width="600" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="800" y="743" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">história ≠ calendário atual</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Histórico das fontes oficiais · consulte regras e calendário vigentes</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>