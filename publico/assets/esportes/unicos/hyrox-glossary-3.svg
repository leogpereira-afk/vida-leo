<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Split e transição</title><desc id="desc">Uma linha de blocos mostra corrida, transição, estação e corrida seguinte. A chave sob toda a sequência reforça avaliar a distribuição de esforço além de um parcial isolado.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Split e transição</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Split é tempo parcial; transição liga tarefas.</text><rect x="100" y="300" width="440" height="265" rx="22" fill="#28735B" stroke="none" stroke-width="2"/><g transform="translate(320 440) scale(1)"><circle cx="20" cy="-80" r="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="320" y="641" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">CORRIDA</text><rect x="565" y="300" width="190" height="265" rx="22" fill="#E7C78E" stroke="none" stroke-width="2"/><path d="M605 430 L650 385 L650 475 L708 430" stroke="#B7742D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="660" y="641" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">TRANSIÇÃO</text><rect x="780" y="300" width="390" height="265" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><g transform="translate(975 430) scale(0.85)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><text x="975" y="641" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">ESTAÇÃO</text><rect x="1195" y="300" width="300" height="265" rx="22" fill="#28735B" stroke="none" stroke-width="2"/><g transform="translate(1345 440) scale(0.85)"><circle cx="20" cy="-80" r="20" fill="#FFFFFF" stroke="none" stroke-width="3"/><path d="M10 -48 L-12 6 L28 33 L5 82 M-12 6 L-54 42 L-84 34 M4 -36 L47 -16 L72 -42 M4 -36 L-34 -43 L-58 -15" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1345" y="641" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">CORRIDA</text><path d="M100 687 L100 720 L1495 720 L1495 687" stroke="#28735B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="772" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="middle">Avalie a sequência, além do melhor tempo isolado.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>