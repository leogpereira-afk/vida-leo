360" width="460" height="220" rx="18" fill="#F5F2E9" stroke="none" stroke-width="2"/><text x="1150" y="425" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle">DRAG FACTOR</text><path d="M965 505 C1060 450 1195 540 1330 470" stroke="#28735B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1150" y="721" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="600" text-anchor="middle">medida do monitor</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>