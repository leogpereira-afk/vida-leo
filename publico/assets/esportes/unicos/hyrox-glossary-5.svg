<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Damper e drag factor</title><desc id="desc">Um volante com pás e alavanca mostra a passagem de ar. Ao lado, um monitor identifica drag factor como medida calculada, sem sugerir um valor de regulagem ideal.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">HYROX / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Damper e drag factor</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">A alavanca regula ar; o monitor calcula o drag factor.</text><circle cx="430" cy="470" r="180" fill="#FFFFFF" stroke="#20352D" stroke-width="13"/><circle cx="430" cy="470" r="125" fill="none" stroke="#C9D2C6" stroke-width="4"/><g transform="rotate(0 430 470)"><path d="M430 470 Q470 365 525 390 Q520 455 430 470" stroke="#28735B" stroke-width="3" fill="#B8D8BD" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(45 430 470)"><path d="M430 470 Q470 365 525 390 Q520 455 430 470" stroke="#28735B" stroke-width="3" fill="#B8D8BD" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(90 430 470)"><path d="M430 470 Q470 365 525 390 Q520 455 430 470" stroke="#28735B" stroke-width="3" fill="#B8D8BD" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="rotate(135 430 470)"><path d="M430 470 Q470 365 525 390 Q520 455 430 470" stroke="#28735B" stroke-width="3" fill="#B8D8BD" stroke-linecap="round" stroke-linejoin="round" /></g><g transfor