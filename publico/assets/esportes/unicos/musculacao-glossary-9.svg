<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Dor muscular tardia</title><desc id="desc">Uma curva conceitual de desconforto após esforço pouco habitual sobe e volta a cair, sem escala de dias. Um sinal de diferente destaca que mais dor não significa treino melhor.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Dor muscular tardia</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Desconforto após esforço novo não é uma nota de eficácia.</text><line x1="150" y1="675" x2="1130" y2="675" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 1116 665 L 1130 675 L 1116 685" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1130 675)"/><line x1="150" y1="675" x2="150" y2="325" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 136 315 L 150 325 L 136 335" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 150 325)"/><text x="1130" y="725" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="end">Após a sessão</text><text x="150" y="299" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Desconforto percebido</text><path d="M165 648 C300 650 330 480 470 430 S650 465 750 540 S960 635 1090 640" stroke="#28735B" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="205" y="706" width="260" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="335" y="739" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">esforço pouco habitual</text><rect x="1190" y="300" width="310" height="380" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><circle cx="1345" cy="395" r="55" fill="#E1EBDF" stroke="none" stroke-width="3"/><text x="1345" y="414" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" text-anchor="middle">≠</text><text x="1345" y="510" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">mais dor</text><text x="1345" y="555" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">não significa</text><text x="1345" y="600" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" text-anchor="middle">melhor treino</text><text x="1050" y="335" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="end">Sem escala temporal</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · dor articular ou persistente pede avaliação</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>