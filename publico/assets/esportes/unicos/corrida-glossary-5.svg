<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">VFC / HRV</title><desc id="desc">Traçado cardíaco esquemático com dois intervalos de comprimentos diferentes entre picos. Mostra o conceito de variabilidade sem representar um exame ou diagnóstico.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">VFC / HRV</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Variação no intervalo entre batimentos, além da frequência média.</text><rect x="105" y="280" width="1390" height="410" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><path d="M155 510 L245 510 L270 480 L293 550 L320 365 L348 570 L377 510 L555 510 L580 480 L603 550 L630 365 L658 570 L687 510 L920 510 L945 480 L968 550 L995 365 L1023 570 L1052 510 L1410 510" stroke="#28735B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M320 330 L320 298 L630 298 L630 330" stroke="#B7742D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M630 330 L630 298 L995 298 L995 330" stroke="#B7742D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="475" y="263" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">intervalo A</text><text x="812" y="263" fill="#B7742D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">intervalo B</text><text x="800" y="753" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle">Compare tendências; um valor isolado não decide o treino.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Traçado conceitual · não é eletrocardiograma clínico</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>