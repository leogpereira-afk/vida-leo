<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Zonas cardíacas</title><desc id="desc">Cinco faixas coloridas organizam intensidade de maneira conceitual, sem batimentos por minuto. O esquema destaca que limites dependem de método, medição e contexto.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">CORRIDA / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Zonas cardíacas</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Faixas dependem do método utilizado e da resposta individual.</text><rect x="110" y="300" width="1380" height="340" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="155" y="385" width="250" height="130" rx="10" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="280" y="465" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">faixa 1</text><rect x="415" y="385" width="250" height="130" rx="10" fill="#B8D8BD" stroke="none" stroke-width="2"/><text x="540" y="465" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">faixa 2</text><rect x="675" y="385" width="250" height="130" rx="10" fill="#8BB998" stroke="none" stroke-width="2"/><text x="800" y="465" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">faixa 3</text><rect x="935" y="385" width="250" height="130" rx="10" fill="#579D7B" stroke="none" stroke-width="2"/><text x="1060" y="465" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">faixa 4</text><rect x="1195" y="385" width="250" height="130" rx="10" fill="#28735B" stroke="none" stroke-width="2"/><text x="1320" y="465" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">faixa 5</text><line x1="190" y1="574" x2="1400" y2="574" stroke="#52665C" stroke-width="4" stroke-linecap="round" /><path d="M 1386 564 L 1400 574 L 1386 584" fill="none" stroke="#52665C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0 1400 574)"/><text x="800" y="705" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" text-anchor="middle">método + medição + contexto</text><text x="800" y="759" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="middle">Os limites não são iguais em todos os aplicativos.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Faixas ilustrativas · não calibram zonas cardíacas pessoais</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>