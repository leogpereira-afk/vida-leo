<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Carga, amplitude e recuperação</title><desc id="desc">Três círculos conectados mostram uma barra para carga, um arco articular para amplitude e um relógio sem duração para recuperação. O conjunto enfatiza preservar o controle sem estabelecer peso, arco ou descanso universais.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / CUIDADOS NA PRÁTICA</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" text-anchor="start">Carga, amplitude e recuperação</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">O progresso precisa preservar o controle do movimento.</text><circle cx="520" cy="455" r="170" fill="#E1EBDF" stroke="none" stroke-width="3"/><circle cx="1080" cy="455" r="170" fill="#E1EBDF" stroke="none" stroke-width="3"/><circle cx="800" cy="625" r="140" fill="#FFFFFF" stroke="none" stroke-width="3"/><g transform="translate(520 445) scale(0.65)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><text x="520" y="335" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">CARGA</text><path d="M990 475 L1080 445 L1080 355" stroke="#28735B" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1010 485 A85 85 0 0 0 1080 365" stroke="#B7742D" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1080" y="335" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="middle">AMPLITUDE</text><circle cx="800" cy="602" r="55" fill="none" stroke="#28735B" stroke-width="5"/><line x1="800" y1="602" x2="800" y2="565" stroke="#28735B" stroke-width="5" stroke-linecap="round" /><line x1="800" y1="602" x2="835" y2="615" stroke="#28735B" stroke-width="5" stroke-linecap="round" /><text x="800" y="705" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">RECUPERAÇÃO</text><path d="M650 420 Q800 305 950 420 M995 545 Q960 610 925 625 M675 625 Q620 590 605 555" stroke="#52665C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="774" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">Ajuste a exigência quando o padrão combinado não se mantém.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Orientação geral · ajuste ao seu contexto e procure apoio quando necessário</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>