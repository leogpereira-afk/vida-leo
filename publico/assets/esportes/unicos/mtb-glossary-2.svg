<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Singletrack</title><desc id="desc">Vista esquemática de uma trilha sinuosa estreita com duas bicicletas separadas. A lateral destaca espaço para desacelerar, visibilidade e respeito a outros usuários.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MOUNTAIN BIKE / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">Singletrack</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Espaço estreito exige distância, leitura e margem para reagir.</text><path d="M520 700 C790 600 310 470 690 330" stroke="#B8D8BD" stroke-width="145" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M520 700 C790 600 310 470 690 330" stroke="#F5F2E9" stroke-width="85" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M520 700 C790 600 310 470 690 330" stroke="#28735B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 15"/><g transform="translate(555 537) scale(0.45)"><circle cx="-120" cy="38" r="68" fill="none" stroke="#20352D" stroke-width="7"/><circle cx="120" cy="38" r="68" fill="none" stroke="#20352D" stroke-width="7"/><path d="M-120 38 L-55 -66 L20 38 L-120 38 M-55 -66 L86 -66 L20 38 M86 -66 L120 38 M86 -66 L75 -100 L111 -108 M-55 -66 L-66 -96 M-90 -96 L-38 -96" stroke="#20352D" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20" cy="38" r="12" fill="#20352D" stroke="none" stroke-width="3"/></g><g transform="translate(600 370) scale(0.35)"><circle cx="-120" cy="38" r="68" fill="none" stroke="#52665C" stroke-width="7"/><circle cx="120" cy="38" r="68" fill="none" stroke="#52665C" stroke-width="7"/><path d="M-120 38 L-55 -66 L20 38 L-120 38 M-55 -66 L86 -66 L20 38 M86 -66 L120 38 M86 -66 L75 -100 L111 -108 M-55 -66 L-66 -96 M-90 -96 L-38 -96" stroke="#52665C" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="20" cy="38" r="12" fill="#52665C" stroke="none" stroke-width="3"/></g><line x1="760" y1="470" x2="980" y2="470" stroke="#28735B" stroke-width="3" stroke-linecap="round" /><rect x="1005" y="330" width="475" height="310" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="1045" y="390" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">uma passagem por vez</text><text x="1045" y="448" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">espaço para desacelerar</text><text x="1045" y="506" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">atenção à visibilidade</text><text x="1045" y="564" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="500" text-anchor="start">respeito a outros usuários</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>