<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">1RM</title><desc id="desc">Uma barra com anilhas aparece ao lado do numeral um. A composição define uma repetição máxima de um exercício e esclarece que testar o máximo não é necessário para iniciar.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F5F2E9" stroke="none" stroke-width="2"/><rect x="64" y="58" width="8" height="108" rx="4" fill="#28735B" stroke="none" stroke-width="2"/><text x="96" y="88" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">MUSCULAÇÃO / ENTENDA O TERMO</text><text x="96" y="151" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="start">1RM</text><text x="96" y="201" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" text-anchor="start">Uma repetição máxima pertence a um exercício específico.</text><rect x="100" y="270" width="635" height="445" rx="22" fill="#FFFFFF" stroke="none" stroke-width="2"/><g transform="translate(415 452) scale(1.55)"><line x1="-150" y1="0" x2="150" y2="0" stroke="#20352D" stroke-width="17" stroke-linecap="round" /><rect x="-135" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="-104" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="75" y="-75" width="30" height="150" rx="6" fill="#20352D" stroke="none" stroke-width="2"/><rect x="110" y="-55" width="25" height="110" rx="6" fill="#20352D" stroke="none" stroke-width="2"/></g><rect x="245" y="628" width="340" height="48" rx="24" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="415" y="661" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" text-anchor="middle">1 ciclo completo</text><rect x="785" y="270" width="715" height="445" rx="22" fill="#E1EBDF" stroke="none" stroke-width="2"/><text x="1142" y="388" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="115" font-weight="700" text-anchor="middle">1</text><text x="1142" y="443" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" text-anchor="middle">repetição</text><line x1="880" y1="478" x2="1400" y2="478" stroke="#C9D2C6" stroke-width="3" stroke-linecap="round" /><text x="850" y="520" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="start">Maior carga concluída</text><text x="850" y="565" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="start">com o padrão definido.</text><text x="850" y="610" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="start">Não é necessário testar o máximo</text><text x="850" y="655" fill="#20352D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" text-anchor="start">para começar a treinar.</text><line x1="80" y1="807" x2="1520" y2="807" stroke="#C9D2C6" stroke-width="2" stroke-linecap="round" /><text x="80" y="852" fill="#52665C" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" text-anchor="start">Esquema conceitual · não é uma meta individual</text><text x="1520" y="852" fill="#28735B" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">SAÚDE · ESPORTES</text></svg>