name: Deploy (GitHub Pages)

# Publica a Central do Leo no GitHub Pages. O backend e o Supabase (Edge
# Function leo-sync), chamado direto pelo navegador.
#
# O site inteiro e a pasta publico/ (um index.html unico). Nada de build.
#
# O reposit"rio e publico porque o Pages exige isso neste plano -- mas os DADOS
# ficam no Supabase, atras de senha, e nunca no repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Sem "enablement": o token do Actions publica no Pages mas nao pode
      # CRIA-lo. O site e habilitado uma vez pela API.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
